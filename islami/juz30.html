ِ اِذَا اتَّسَقَۙ ","لَتَرْكَبُنَّ طَبَقًا عَنْ طَبَقٍۗ ","فَمَا لَهُمْ لَا يُؤْمِنُوْنَۙ ","وَاِذَا قُرِئَ عَلَيْهِمُ الْقُرْاٰنُ لَا يَسْجُدُوْنَ ۗ ۩ ","بَلِ الَّذِيْنَ كَفَرُوْا يُكَذِّبُوْنَۖ ","وَاللّٰهُ اَعْلَمُ بِمَا يُوْعُوْنَۖ ","فَبَشِّرْهُمْ بِعَذَابٍ اَلِيْمٍۙ ","اِلَّا الَّذِيْنَ اٰمَنُوْا وَعَمِلُوا الصّٰلِحٰتِ لَهُمْ اَجْرٌ غَيْرُ مَمْنُوْنٍ ࣖ "],"id":["Apabila langit terbelah,","dan patuh kepada Tuhannya, dan sudah semestinya patuh, ","dan apabila bumi diratakan, ","dan memuntahkan apa yang ada di dalamnya dan menjadi kosong,","dan patuh kepada Tuhannya, dan sudah semestinya patuh.","Wahai manusia! Sesungguhnya kamu telah bekerja keras menuju Tuhanmu, maka kamu akan menemui-Nya.","Maka adapun orang yang catatannya diberikan dari sebelah kanannya, ","maka dia akan diperiksa dengan pemeriksaan yang mudah, ","dan dia akan kembali kepada keluarganya (yang sama-sama beriman) dengan gembira.","Dan adapun orang yang catatannya diberikan dari sebelah belakang, ","maka dia akan berteriak, “Celakalah aku!” ","Dan dia akan masuk ke dalam api yang menyala-nyala (neraka).","Sungguh, dia dahulu (di dunia) bergembira di kalangan keluarganya (yang sama-sama kafir). ","Sesungguhnya dia mengira bahwa dia tidak akan kembali (kepada Tuhannya). ","Tidak demikian, sesungguhnya Tuhannya selalu melihatnya. ","Maka Aku bersumpah demi cahaya merah pada waktu senja, ","demi malam dan apa yang diselubunginya,","demi bulan apabila jadi purnama,","sungguh, akan kamu jalani tingkat demi tingkat (dalam kehidupan).","Maka mengapa mereka tidak mau beriman?","Dan apabila Al-Qur'an dibacakan kepada mereka, mereka tidak (mau) bersujud,","bahkan orang-orang kafir itu mendustakan(nya).","Dan Allah lebih mengetahui apa yang mereka sembunyikan (dalam hati mereka).","Maka sampaikanlah kepada mereka (ancaman) azab yang pedih,","kecuali orang-orang yang beriman dan mengerjakan kebajikan, mereka akan mendapat pahala yang tidak putus-putusnya."],"en":["When the sky has split [open]","And has responded to its Lord and was obligated [to do so]","And when the earth has been extended","And has cast out that within it and relinquished [it]","And has responded to its Lord and was obligated [to do so]","O mankind, indeed you are laboring toward your Lord with [great] exertion and will meet it","Then as for he who is given his record in his right hand","He will be judged with an easy account","And return to his people in happiness","But as for he who is given his record behind his back","He will cry out for destruction","And [enter to] burn in a Blaze","Indeed, he had [once] been among his people in happiness","Indeed, he had thought he would never return [to Allah]","But yes! Indeed, his Lord was ever of him, Seeing","So I swear by the twilight glow","And [by] the night and what it envelops","And [by] the moon when it becomes full","[That] you will surely experience state after state","So what is [the matter] with them [that] they do not believe","And when the Qur'an is recited to them, they do not prostrate [to Allah]","But those who have disbelieved deny","And Allah is most knowing of what they keep within themselves","So give them tidings of a painful punishment","Except for those who believe and do righteous deeds. For them is a reward uninterrupted"],"tl":["Itha alssamao inshaqqat","Waathinat lirabbiha wahuqqat","Waitha alardu muddat","Waalqat ma feeha watakhallat","Waathinat lirabbiha wahuqqat","Ya ayyuha alinsanu innaka kadihun ila rabbika kadhan famulaqeehi","Faama man ootiya kitabahu biyameenihi","Fasawfa yuhasabu hisaban yaseeran","Wayanqalibu ila ahlihi masrooran","Waamma man ootiya kitabahu waraa thahrihi","Fasawfa yadAAoo thubooran","Wayasla saAAeeran","Innahu kana fee ahlihi masrooran","Innahu thanna an lan yahoora","Bala inna rabbahu kana bihi baseeran","Fala oqsimu bialshshafaqi","Waallayli wama wasaqa","Waalqamari itha ittasaqa","Latarkabunna tabaqan AAan tabaqin","Fama lahum la yuminoona","Waitha quria AAalayhimu alquranu la yasjudoona","Bali allatheena kafaroo yukaththiboona","WaAllahu aAAlamu bima yooAAoona","Fabashshirhum biAAathabin aleemin","Illa allatheena amanoo waAAamiloo alssalihati lahum ajrun ghayru mamnoonin"]},"85":{"n":85,"name":"البروج","latin":"Al-Buruj","ayat":22,"en_name":"The Mansions of the Stars","type":"meccan","ar":["وَالسَّمَاۤءِ ذَاتِ الْبُرُوْجِۙ ","وَالْيَوْمِ الْمَوْعُوْدِۙ ","وَشَاهِدٍ وَّمَشْهُوْدٍۗ ","قُتِلَ اَصْحٰبُ الْاُخْدُوْدِۙ ","النَّارِ ذَاتِ الْوَقُوْدِۙ ","اِذْ هُمْ عَلَيْهَا قُعُوْدٌۙ ","وَّهُمْ عَلٰى مَا يَفْعَلُوْنَ بِالْمُؤْمِنِيْنَ شُهُوْدٌ  ۗ ","وَمَا نَقَمُوْا مِنْهُمْ اِلَّآ اَنْ يُّؤْمِنُوْا بِاللّٰهِ الْعَزِيْزِ الْحَمِيْدِۙ ","الَّذِيْ لَهٗ مُلْكُ السَّمٰوٰتِ وَالْاَرْضِ ۗوَاللّٰهُ عَلٰى كُلِّ شَيْءٍ شَهِيْدٌ  ۗ ","اِنَّ الَّذِيْنَ فَتَنُوا الْمُؤْمِنِيْنَ وَالْمُؤْمِنٰتِ ثُمَّ لَمْ يَتُوْبُوْا فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ الْحَرِيْقِۗ ","اِنَّ الَّذِيْنَ اٰمَنُوْا وَعَمِلُوا الصّٰلِحٰتِ لَهُمْ جَنّٰتٌ تَجْرِيْ مِنْ تَحْتِهَا الْاَنْهٰرُ ەۗ ذٰلِكَ الْفَوْزُ الْكَبِيْرُۗ","اِنَّ بَطْشَ رَبِّكَ لَشَدِيْدٌ ۗ ","اِنَّهٗ هُوَ يُبْدِئُ وَيُعِيْدُۚ ","وَهُوَ الْغَفُوْرُ الْوَدُوْدُۙ ","ذُو الْعَرْشِ الْمَجِيْدُۙ ","فَعَّالٌ لِّمَا يُرِيْدُۗ ","هَلْ اَتٰىكَ حَدِيْثُ الْجُنُوْدِۙ ","فِرْعَوْنَ وَثَمُوْدَۗ ","بَلِ الَّذِيْنَ كَفَرُوْا فِيْ تَكْذِيْبٍۙ ","وَّاللّٰهُ مِنْ وَّرَاۤىِٕهِمْ مُّحِيْطٌۚ ","بَلْ هُوَ قُرْاٰنٌ مَّجِيْدٌۙ ","فِيْ لَوْحٍ مَّحْفُوْظٍ ࣖ "],"id":["Demi langit yang mempunyai gugusan bintang,","dan demi hari yang dijanjikan.","Demi yang menyaksikan dan yang disaksikan.","Binasalah orang-orang yang membuat parit (yaitu para pembesar Najran di Yaman),","yang berapi (yang mempunyai) kayu bakar,","ketika mereka duduk di sekitarnya, ","sedang mereka menyaksikan apa yang mereka perbuat terhadap orang-orang mukmin.","Dan mereka menyiksa orang-orang mukmin itu hanya karena (orang-orang mukmin itu) beriman kepada Allah Yang Mahaperkasa, Maha Terpuji,","yang memiliki kerajaan langit dan bumi. Dan Allah Maha Menyaksikan segala sesuatu.","Sungguh, orang-orang yang mendatangkan cobaan (bencana, membunuh, menyiksa) kepada orang-orang mukmin laki-laki dan perempuan lalu mereka tidak bertobat, maka mereka akan mendapat azab Jahanam dan mereka akan mendapat azab (neraka) yang membakar.","Sungguh, orang-orang yang beriman dan mengerjakan kebajikan, mereka akan mendapat surga yang mengalir di bawahnya sungai-sungai, itulah kemenangan yang agung.","Sungguh, azab Tuhanmu sangat keras.","Sungguh, Dialah yang memulai pen-ciptaan (makhluk) dan yang menghidupkannya (kembali).","Dan Dialah Yang Maha Pengampun, Maha Pengasih,","yang memiliki ‘Arsy, lagi Mahamulia, ","Mahakuasa berbuat apa yang Dia kehendaki. ","Sudahkah sampai kepadamu berita tentang bala tentara (penentang),","(yaitu) Fir‘aun dan Samud?","Memang orang-orang kafir (selalu) mendustakan,","padahal Allah mengepung dari belakang mereka (sehingga tidak dapat lolos).","Bahkan (yang didustakan itu) ialah Al-Qur'an yang mulia,","yang (tersimpan) dalam (tempat) yang terjaga (Lauh Mahfuzh)."],"en":["By the sky containing great stars","And [by] the promised Day","And [by] the witness and what is witnessed","Cursed were the companions of the trench","[Containing] the fire full of fuel","When they were sitting near it","And they, to what they were doing against the believers, were witnesses","And they resented them not except because they believed in Allah, the Exalted in Might, the Praiseworthy","To whom belongs the dominion of the heavens and the earth. And Allah, over all things, is Witness","Indeed, those who have tortured the believing men and believing women and then have not repented will have the punishment of Hell, and they will have the punishment of the Burning Fire","Indeed, those who have believed and done righteous deeds will have gardens beneath which rivers flow. That is the great attainment","Indeed, the vengeance of your Lord is severe","Indeed, it is He who originates [creation] and repeats","And He is the Forgiving, the Affectionate","Honorable Owner of the Throne","Effecter of what He intends","Has there reached you the story of the soldiers","[Those of] Pharaoh and Thamud","But they who disbelieve are in [persistent] denial","While Allah encompasses them from behind","But this is an honored Qur'an","[Inscribed] in a Preserved Slate"],"tl":["Waalssamai thati alburooji","Waalyawmi almawAAoodi","Washahidin wamashhoodin","Qutila ashabu alukhdoodi","Alnnari thati alwaqoodi","Ith hum AAalayha quAAoodun","Wahum AAala ma yafAAaloona bialmumineena shuhoodun","Wama naqamoo minhum illa an yuminoo biAllahi alAAazeezi alhameedi","Allathee lahu mulku alssamawati waalardi waAllahu AAala kulli shayin shaheedun","Inna allatheena fatanoo almumineena waalmuminati thumma lam yatooboo falahum AAathabu jahannama walahum AAathabu alhareeqi","Inna allatheena amanoo waAAamiloo alssalihati lahum jannatun tajree min tahtiha alanharu thalika alfawzu alkabeeru","Inna batsha rabbika lashadeedun","Innahu huwa yubdio wayuAAeedu","Wahuwa alghafooru alwadoodu","Thoo alAAarshi almajeedi","FaAAAAalun lima yureedu","Hal ataka hadeethu aljunoodi","FirAAawna wathamooda","Bali allatheena kafaroo fee taktheebin","WaAllahu min waraihim muheetun","Bal huwa quranun majeedun","Fee lawhin mahfoothin"]},"86":{"n":86,"name":"الطارق","latin":"At-Tariq","ayat":17,"en_name":"The Nightcommer","type":"meccan","ar":["وَالسَّمَاۤءِ وَالطَّارِقِۙ ","وَمَآ اَدْرٰىكَ مَا الطَّارِقُۙ ","النَّجْمُ الثَّاقِبُۙ ","اِنْ كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌۗ ","فَلْيَنْظُرِ الْاِنْسَانُ مِمَّ خُلِقَ ","خُلِقَ مِنْ مَّاۤءٍ دَافِقٍۙ ","يَّخْرُجُ مِنْۢ بَيْنِ الصُّلْبِ وَالتَّرَاۤىِٕبِۗ ","اِنَّهٗ عَلٰى رَجْعِهٖ لَقَادِرٌۗ ","يَوْمَ تُبْلَى السَّرَاۤىِٕرُۙ ","فَمَا لَهٗ مِنْ قُوَّةٍ وَّلَا نَاصِرٍۗ ","وَالسَّمَاۤءِ ذَاتِ الرَّجْعِۙ ","وَالْاَرْضِ ذَاتِ الصَّدْعِۙ ","اِنَّهٗ لَقَوْلٌ فَصْلٌۙ ","وَّمَا هُوَ بِالْهَزْلِۗ ","اِنَّهُمْ يَكِيْدُوْنَ كَيْدًاۙ ","وَّاَكِيْدُ كَيْدًاۖ ","فَمَهِّلِ الْكٰفِرِيْنَ اَمْهِلْهُمْ رُوَيْدًا ࣖ "],"id":["Demi langit dan yang datang pada malam hari.","Dan tahukah kamu apakah yang datang pada malam hari itu?","(yaitu) bintang yang bersinar tajam,","setiap orang pasti ada penjaganya.","Maka hendaklah manusia memperhatikan dari apa dia diciptakan.","Dia diciptakan dari air (mani) yang terpancar,","yang keluar dari antara tulang punggung (sulbi) dan tulang dada.","Sungguh, Allah benar-benar kuasa untuk mengembalikannya (hidup setelah mati).","Pada hari ditampakkan segala rahasia,","maka manusia tidak lagi mempunyai suatu kekuatan dan tidak (pula) ada penolong.","Demi langit yang mengandung hujan,","dan bumi yang mempunyai tumbuh-tumbuhan,","sungguh, (Al-Qur'an) itu benar-benar firman pemisah (antara yang hak dan yang batil),","dan (Al-Qur'an) itu bukanlah sendagurauan.","Sungguh, mereka (orang kafir) merencanakan tipu daya yang jahat.","Dan Aku pun membuat rencana (tipu daya) yang jitu.","Karena itu berilah penangguhan kepada orang-orang kafir itu. Berilah mereka itu kesempatan untuk sementara waktu."],"en":["By the sky and the night comer","And what can make you know what is the night comer","It is the piercing star","There is no soul but that it has over it a protector","So let man observe from what he was created","He was created from a fluid, ejected","Emerging from between the backbone and the ribs","Indeed, Allah, to return him [to life], is Able","The Day when secrets will be put on trial","Then man will have no power or any helper","By the sky which returns [rain]","And [by] the earth which cracks open","Indeed, the Qur'an is a decisive statement","And it is not amusement","Indeed, they are planning a plan","But I am planning a plan","So allow time for the disbelievers. Leave them awhile"],"tl":["Waalssamai waalttariqi","Wama adraka ma alttariqu","Alnnajmu alththaqibu","In kullu nafsin lamma AAalayha hafithun","Falyanthuri alinsanu mimma khuliqa","Khuliqa min main dafiqin","Yakhruju min bayni alssulbi waalttaraibi","Innahu AAala rajAAihi laqadirun","Yawma tubla alssarairu","Fama lahu min quwwatin wala nasirin","Waalssamai thati alrrajAAi","Waalardi thati alssadAAi","Innahu laqawlun faslun","Wama huwa bialhazli","Innahum yakeedoona kaydan","Waakeedu kaydan","Famahhili alkafireena amhilhum ruwaydan"]},"87":{"n":87,"name":"الاعلى","latin":"Al-A'la","ayat":19,"en_name":"The Most High","type":"meccan","ar":["سَبِّحِ اسْمَ رَبِّكَ الْاَعْلَىۙ ","الَّذِيْ خَلَقَ فَسَوّٰىۖ ","وَالَّذِيْ قَدَّرَ فَهَدٰىۖ ","وَالَّذِيْٓ اَخْرَجَ الْمَرْعٰىۖ ","فَجَعَلَهٗ غُثَاۤءً اَحْوٰىۖ ","سَنُقْرِئُكَ فَلَا تَنْسٰىٓ  ۖ ","اِلَّا مَا شَاۤءَ اللّٰهُ ۗاِنَّهٗ يَعْلَمُ الْجَهْرَ وَمَا يَخْفٰىۗ ","وَنُيَسِّرُكَ لِلْيُسْرٰىۖ ","فَذَكِّرْ اِنْ نَّفَعَتِ الذِّكْرٰىۗ ","سَيَذَّكَّرُ مَنْ يَّخْشٰىۙ ","وَيَتَجَنَّبُهَا الْاَشْقَىۙ ","الَّذِيْ يَصْلَى النَّارَ الْكُبْرٰىۚ ","ثُمَّ لَا يَمُوْتُ فِيْهَا وَلَا يَحْيٰىۗ ","قَدْ اَفْلَحَ مَنْ تَزَكّٰىۙ ","وَذَكَرَ اسْمَ رَبِّهٖ فَصَلّٰىۗ ","بَلْ تُؤْثِرُوْنَ الْحَيٰوةَ الدُّنْيَاۖ ","وَالْاٰخِرَةُ خَيْرٌ وَّاَبْقٰىۗ ","اِنَّ هٰذَا لَفِى الصُّحُفِ الْاُوْلٰىۙ ","صُحُفِ اِبْرٰهِيْمَ وَمُوْسٰى ࣖ "],"id":["Sucikanlah nama Tuhanmu Yang Mahatinggi,","Yang menciptakan, lalu menyempurnakan (ciptaan-Nya).","Yang menentukan kadar (masing-masing) dan memberi petunjuk,","dan Yang menumbuhkan rerumputan,","lalu dijadikan-Nya (rumput-rumput) itu kering kehitam-hitaman.","Kami akan membacakan (Al-Qur'an) kepadamu (Muhammad) sehingga engkau tidak akan lupa,","kecuali jika Allah menghendaki. Sungguh, Dia mengetahui yang terang dan yang tersembunyi.","Dan Kami akan memudahkan bagimu ke jalan kemudahan (mencapai kebahagiaan dunia dan akhirat),","oleh sebab itu berikanlah peringatan, karena peringatan itu bermanfaat,","orang yang takut (kepada Allah) akan mendapat pelajaran,","dan orang-orang yang celaka (kafir) akan menjauhinya,","(yaitu) orang yang akan memasuki api yang besar (neraka),","selanjutnya dia di sana tidak mati dan tidak (pula) hidup.","Sungguh beruntung orang yang menyucikan diri (dengan beriman),","dan mengingat nama Tuhannya, lalu dia salat.","Sedangkan kamu (orang-orang kafir) memilih kehidupan dunia,","padahal kehidupan akhirat itu lebih baik dan lebih kekal.","Sesungguhnya ini terdapat dalam kitab-kitab yang dahulu,","(yaitu) kitab-kitab Ibrahim dan Musa. "],"en":["Exalt the name of your Lord, the Most High","Who created and proportioned","And who destined and [then] guided","And who brings out the pasture","And [then] makes it black stubble","We will make you recite, [O Muhammad], and you will not forget","Except what Allah should will. Indeed, He knows what is declared and what is hidden","And We will ease you toward ease","So remind, if the reminder should benefit","He who fears [Allah] will be reminded","But the wretched one will avoid it","[He] who will [enter and] burn in the greatest Fire","Neither dying therein nor living","He has certainly succeeded who purifies himself","And mentions the name of his Lord and prays","But you prefer the worldly life","While the Hereafter is better and more enduring","Indeed, this is in the former scriptures","The scriptures of Abraham and Moses"],"tl":["Sabbihi isma rabbika alaAAla","Allathee khalaqa fasawwa","Waallathee qaddara fahada","Waallathee akhraja almarAAa","FajaAAalahu ghuthaan ahwa","Sanuqrioka fala tansa","Illa ma shaa Allahu innahu yaAAlamu aljahra wama yakhfa","Wanuyassiruka lilyusra","Fathakkir in nafaAAati alththikra","Sayaththakkaru man yakhsha","Wayatajannabuha alashqa","Allathee yasla alnnara alkubra","Thumma la yamootu feeha wala yahya","Qad aflaha man tazakka","Wathakara isma rabbihi fasalla","Bal tuthiroona alhayata alddunya","Waalakhiratu khayrun waabqa","Inna hatha lafee alssuhufi aloola","Suhufi ibraheema wamoosa"]},"88":{"n":88,"name":"الغاشية","latin":"Al-Gasyiyah","ayat":26,"en_name":"The Overwhelming","type":"meccan","ar":["هَلْ اَتٰىكَ حَدِيْثُ الْغَاشِيَةِۗ","وُجُوْهٌ يَّوْمَىِٕذٍ خَاشِعَةٌ  ۙ","عَامِلَةٌ نَّاصِبَةٌ  ۙ","تَصْلٰى نَارًا حَامِيَةً  ۙ","تُسْقٰى مِنْ عَيْنٍ اٰنِيَةٍ ۗ","لَيْسَ لَهُمْ طَعَامٌ اِلَّا مِنْ ضَرِيْعٍۙ","لَّا يُسْمِنُ وَلَا يُغْنِيْ مِنْ جُوْعٍۗ","وُجُوْهٌ يَّوْمَىِٕذٍ نَّاعِمَةٌ  ۙ","لِّسَعْيِهَا رَاضِيَةٌ  ۙ ","فِيْ جَنَّةٍ عَالِيَةٍۙ","لَّا تَسْمَعُ فِيْهَا لَاغِيَةً ۗ","فِيْهَا عَيْنٌ جَارِيَةٌ  ۘ","فِيْهَا سُرُرٌ مَّرْفُوْعَةٌ  ۙ","وَّاَكْوَابٌ مَّوْضُوْعَةٌ  ۙ","وَّنَمَارِقُ مَصْفُوْفَةٌ  ۙ ","وَّزَرَابِيُّ مَبْثُوْثَةٌ  ۗ","اَفَلَا يَنْظُرُوْنَ اِلَى الْاِبِلِ كَيْفَ خُلِقَتْۗ","وَاِلَى السَّمَاۤءِ كَيْفَ رُفِعَتْۗ","وَاِلَى الْجِبَالِ كَيْفَ نُصِبَتْۗ","وَاِلَى الْاَرْضِ كَيْفَ سُطِحَتْۗ ","فَذَكِّرْۗ اِنَّمَآ اَنْتَ مُذَكِّرٌۙ","لَّسْتَ عَلَيْهِمْ بِمُصَيْطِرٍۙ","اِلَّا مَنْ تَوَلّٰى وَكَفَرَۙ","فَيُعَذِّبُهُ اللّٰهُ الْعَذَابَ الْاَكْبَرَۗ","اِنَّ اِلَيْنَآ اِيَابَهُمْ","ثُمَّ اِنَّ عَلَيْنَا حِسَابَهُمْ ࣖ"],"id":["Sudahkah sampai kepadamu berita tentang (hari Kiamat)?","Pada hari itu banyak wajah yang tertunduk terhina,","(karena) bekerja keras lagi kepayahan,","mereka memasuki api yang sangat panas (neraka),","diberi minum dari sumber mata air yang sangat panas.","Tidak ada makanan bagi mereka selain dari pohon yang berduri,","yang tidak menggemukkan dan tidak menghilangkan lapar.","Pada hari itu banyak (pula) wajah yang berseri-seri,","merasa senang karena usahanya (sendiri),","(mereka) dalam surga yang tinggi, ","di sana (kamu) tidak mendengar perkataan yang tidak berguna.","Di sana ada mata air yang mengalir.","Di sana ada dipan-dipan yang ditinggikan,","dan gelas-gelas yang tersedia (di dekatnya),","dan bantal-bantal sandaran yang tersusun,","dan permadani-permadani yang terhampar.","Maka tidakkah mereka memperhatikan unta, bagaimana diciptakan?","dan langit, bagaimana ditinggikan?","Dan gunung-gunung bagaimana ditegakkan?","Dan bumi bagaimana dihamparkan?","Maka berilah peringatan, karena sesungguhnya engkau (Muhammad) hanyalah pemberi peringatan.","Engkau bukanlah orang yang berkuasa atas mereka,","kecuali (jika ada) orang yang berpaling dan kafir,","maka Allah akan mengazabnya dengan azab yang besar.","Sungguh, kepada Kamilah mereka kembali,","kemudian sesungguhnya (kewajiban) Kamilah membuat perhitungan atas mereka."],"en":["Has there reached you the report of the Overwhelming [event]","[Some] faces, that Day, will be humbled","Working [hard] and exhausted","They will [enter to] burn in an intensely hot Fire","They will be given drink from a boiling spring","For them there will be no food except from a poisonous, thorny plant","Which neither nourishes nor avails against hunger","[Other] faces, that Day, will show pleasure","With their effort [they are] satisfied","In an elevated garden","Wherein they will hear no unsuitable speech","Within it is a flowing spring","Within it are couches raised high","And cups put in place","And cushions lined up","And carpets spread around","Then do they not look at the camels - how they are created","And at the sky - how it is raised","And at the mountains - how they are erected","And at the earth - how it is spread out","So remind, [O Muhammad]; you are only a reminder","You are not over them a controller","However, he who turns away and disbelieves","Then Allah will punish him with the greatest punishment","Indeed, to Us is their return","Then indeed, upon Us is their account"],"tl":["Hal ataka hadeethu alghashiyati","Wujoohun yawmaithin khashiAAatun","AAamilatun nasibatun","Tasla naran hamiyatan","Tusqa min AAaynin aniyatin","Laysa lahum taAAamun illa min dareeAAin","La yusminu wala yughnee min jooAAin","Wujoohun yawmaithin naAAimatun","LisaAAyiha radiyatun","Fee jannatin AAaliyatin","La tasmaAAu feeha laghiyatan","Feeha AAaynun jariyatun","Feeha sururun marfooAAatun","Waakwabun mawdooAAatun","Wanamariqu masfoofatun","Wazarabiyyu mabthoothatun","Afala yanthuroona ila alibili kayfa khuliqat","Waila alssamai kayfa rufiAAat","Waila aljibali kayfa nusibat","Waila alardi kayfa sutihat","Fathakkir innama anta muthakkirun","Lasta AAalayhim bimusaytirin","Illa man tawalla wakafara","FayuAAaththibuhu Allahu alAAathaba alakbara","Inna ilayna iyabahum","Thumma inna AAalayna hisabahum"]},"89":{"n":89,"name":"الفجر","latin":"Al-Fajr","ayat":30,"en_name":"The Dawn","type":"meccan","ar":["وَالْفَجْرِۙ","وَلَيَالٍ عَشْرٍۙ","وَّالشَّفْعِ وَالْوَتْرِۙ","وَالَّيْلِ اِذَا يَسْرِۚ","هَلْ فِيْ ذٰلِكَ قَسَمٌ لِّذِيْ حِجْرٍۗ","اَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍۖ","اِرَمَ ذَاتِ الْعِمَادِۖ","الَّتِيْ لَمْ يُخْلَقْ مِثْلُهَا فِى الْبِلَادِۖ","وَثَمُوْدَ الَّذِيْنَ جَابُوا الصَّخْرَ بِالْوَادِۖ","وَفِرْعَوْنَ ذِى الْاَوْتَادِۖ","الَّذِيْنَ طَغَوْا فِى الْبِلَادِۖ","فَاَكْثَرُوْا فِيْهَا الْفَسَادَۖ","فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍۖ","اِنَّ رَبَّكَ لَبِالْمِرْصَادِۗ","فَاَمَّا الْاِنْسَانُ اِذَا مَا ابْتَلٰىهُ رَبُّهٗ فَاَكْرَمَهٗ وَنَعَّمَهٗۙ فَيَقُوْلُ رَبِّيْٓ اَكْرَمَنِۗ","وَاَمَّآ اِذَا مَا ابْتَلٰىهُ فَقَدَرَ عَلَيْهِ رِزْقَهٗ ەۙ فَيَقُوْلُ رَبِّيْٓ اَهَانَنِۚ","كَلَّا بَلْ لَّا تُكْرِمُوْنَ الْيَتِيْمَۙ","وَلَا تَحٰۤضُّوْنَ عَلٰى طَعَامِ الْمِسْكِيْنِۙ","وَتَأْكُلُوْنَ التُّرَاثَ اَكْلًا لَّمًّاۙ","وَّتُحِبُّوْنَ الْمَالَ حُبًّا جَمًّاۗ","كَلَّآ اِذَا دُكَّتِ الْاَرْضُ دَكًّا دَكًّاۙ","وَّجَآءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّاۚ","وَجِايْۤءَ يَوْمَىِٕذٍۢ بِجَهَنَّمَۙ يَوْمَىِٕذٍ يَّتَذَكَّرُ الْاِنْسَانُ وَاَنّٰى لَهُ الذِّكْرٰىۗ","يَقُوْلُ يٰلَيْتَنِيْ قَدَّمْتُ لِحَيَاتِيْۚ","فَيَوْمَىِٕذٍ لَّا يُعَذِّبُ عَذَابَهٗٓ اَحَدٌ ۙ","وَّلَا يُوْثِقُ وَثَاقَهٗٓ اَحَدٌ ۗ","يٰٓاَيَّتُهَا النَّفْسُ الْمُطْمَىِٕنَّةُۙ","ارْجِعِيْٓ اِلٰى رَبِّكِ رَاضِيَةً مَّرْضِيَّةً ۚ","فَادْخُلِيْ فِيْ عِبٰدِيْۙ","وَادْخُلِيْ جَنَّتِيْ ࣖࣖ"],"id":["Demi fajar,","demi malam yang sepuluh,","demi yang genap dan yang ganjil,","demi malam apabila berlalu.","Adakah pada yang demikian itu terdapat sumpah (yang dapat diterima) bagi orang-orang yang berakal?","Tidakkah engkau (Muhammad) memperhatikan bagaimana Tuhanmu berbuat terhadap (kaum) ‘Ad?","(yaitu) penduduk Iram (ibukota kaum ‘Ad) yang mempunyai bangunan-bangunan yang tinggi,","yang belum pernah dibangun (suatu kota) seperti itu di negeri-negeri lain,","dan (terhadap) kaum samud yang memotong batu-batu besar di lembah,","dan (terhadap) Fir‘aun yang mempunyai pasak-pasak (bangunan yang besar),","yang berbuat sewenang-wenang dalam negeri,","lalu mereka banyak berbuat kerusakan dalam negeri itu,","karena itu Tuhanmu menimpakan cemeti azab kepada mereka,","sungguh, Tuhanmu benar-benar mengawasi.","Maka adapun manusia, apabila Tuhan mengujinya lalu memuliakannya dan memberinya kesenangan, maka dia berkata, “Tuhanku telah memuliakanku.”","Namun apabila Tuhan mengujinya lalu membatasi rezekinya, maka dia berkata, “Tuhanku telah menghinaku.”","Sekali-kali tidak! Bahkan kamu tidak memuliakan anak yatim,","dan kamu tidak saling mengajak memberi makan orang miskin,","sedangkan kamu memakan harta warisan dengan cara mencampurbaurkan (yang halal dan yang haram),","dan kamu mencintai harta dengan kecintaan yang berlebihan.","Sekali-kali tidak! Apabila bumi diguncangkan berturut-turut (berbenturan),","dan datanglah Tuhanmu; dan malaikat berbaris-baris,","dan pada hari itu diperlihatkan neraka Jahanam; pada hari itu sadarlah manusia, tetapi tidak berguna lagi baginya kesadaran itu.","Dia berkata, “Alangkah baiknya sekiranya dahulu aku mengerjakan (kebajikan) untuk hidupku ini.”","Maka pada hari itu tidak ada seorang pun yang mengazab seperti azab-Nya (yang adil),","dan tidak ada seorang pun yang mengikat seperti ikatan-Nya.","Wahai jiwa yang tenang!","Kembalilah kepada Tuhanmu dengan hati yang rida dan diridai-Nya.","Maka masuklah ke dalam golongan hamba-hamba-Ku,","dan masuklah ke dalam surga-Ku."],"en":["By the dawn","And [by] ten nights","And [by] the even [number] and the odd","And [by] the night when it passes","Is there [not] in [all] that an oath [sufficient] for one of perception","Have you not considered how your Lord dealt with 'Aad","[With] Iram - who had lofty pillars","The likes of whom had never been created in the land","And [with] Thamud, who carved out the rocks in the valley","And [with] Pharaoh, owner of the stakes","[All of] whom oppressed within the lands","And increased therein the corruption","So your Lord poured upon them a scourge of punishment","Indeed, your Lord is in observation","And as for man, when his Lord tries him and [thus] is generous to him and favors him, he says, \"My Lord has honored me","But when He tries him and restricts his provision, he says, \"My Lord has humiliated me","No! But you do not honor the orphan","And you do not encourage one another to feed the poor","And you consume inheritance, devouring [it] altogether","And you love wealth with immense love","No! When the earth has been leveled - pounded and crushed","And your Lord has come and the angels, rank upon rank","And brought [within view], that Day, is Hell - that Day, man will remember, but what good to him will be the remembrance","He will say, \"Oh, I wish I had sent ahead [some good] for my life","So on that Day, none will punish [as severely] as His punishment","And none will bind [as severely] as His binding [of the evildoers]","[To the righteous it will be said], \"O reassured soul","Return to your Lord, well-pleased and pleasing [to Him]","And enter among My [righteous] servants","And enter My Paradise"],"tl":["Waalfajri","Walayalin AAashrin","WaalshshafAAi waalwatri","Waallayli itha yasri","Hal fee thalika qasamun lithee hijrin","Alam tara kayfa faAAala rabbuka biAAadin","Irama thati alAAimadi","Allatee lam yukhlaq mithluha fee albiladi","Wathamooda allatheena jaboo alssakhra bialwadi","WafirAAawna thee alawtadi","Allatheena taghaw fee albiladi","Faaktharoo feeha alfasada","Fasabba AAalayhim rabbuka sawta AAathabin","Inna rabbaka labialmirsadi","Faamma alinsanu itha ma ibtalahu rabbuhu faakramahu wanaAAAAamahu fayaqoolu rabbee akramani","Waamma itha ma ibtalahu faqadara AAalayhi rizqahu fayaqoolu rabbee ahanani","Kalla bal la tukrimoona alyateema","Wala tahaddoona AAala taAAami almiskeeni","Watakuloona altturatha aklan lamman","Watuhibboona almala hubban jamman","Kalla itha dukkati alardu dakkan dakkan","Wajaa rabbuka waalmalaku saffan saffan","Wajeea yawmaithin bijahannama yawmaithin yatathakkaru alinsanu waanna lahu alththikra","Yaqoolu ya laytanee qaddamtu lihayatee","Fayawmaithin la yuAAaththibu AAathabahu ahadun","Wala yoothiqu wathaqahu ahadun","Ya ayyatuha alnnafsu almutmainnatu","IrjiAAee ila rabbiki radiyatan mardiyyatan","Faodkhulee fee AAibadee","Waodkhulee jannatee"]},"90":{"n":90,"name":"البلد","latin":"Al-Balad","ayat":20,"en_name":"The City","type":"meccan","ar":["لَآ اُقْسِمُ بِهٰذَا الْبَلَدِۙ","وَاَنْتَ حِلٌّۢ بِهٰذَا الْبَلَدِۙ","وَوَالِدٍ وَّمَا وَلَدَۙ","لَقَدْ خَلَقْنَا الْاِنْسَانَ فِيْ كَبَدٍۗ","اَيَحْسَبُ اَنْ لَّنْ يَّقْدِرَ عَلَيْهِ اَحَدٌ ۘ","يَقُوْلُ اَهْلَكْتُ مَالًا لُّبَدًاۗ","اَيَحْسَبُ اَنْ لَّمْ يَرَهٗٓ اَحَدٌۗ","اَلَمْ نَجْعَلْ لَّهٗ عَيْنَيْنِۙ","وَلِسَانًا وَّشَفَتَيْنِۙ","وَهَدَيْنٰهُ النَّجْدَيْنِۙ","فَلَا اقْتَحَمَ الْعَقَبَةَ ۖ","وَمَآ اَدْرٰىكَ مَا الْعَقَبَةُ ۗ","فَكُّ رَقَبَةٍۙ","اَوْ اِطْعَامٌ فِيْ يَوْمٍ ذِيْ مَسْغَبَةٍۙ","يَّتِيْمًا ذَا مَقْرَبَةٍۙ","اَوْ مِسْكِيْنًا ذَا مَتْرَبَةٍۗ","ثُمَّ كَانَ مِنَ الَّذِيْنَ اٰمَنُوْا وَتَوَاصَوْا بِالصَّبْرِ وَتَوَاصَوْا بِالْمَرْحَمَةِۗ","اُولٰۤىِٕكَ اَصْحٰبُ الْمَيْمَنَةِۗ","وَالَّذِيْنَ كَفَرُوْا بِاٰيٰتِنَا هُمْ اَصْحٰبُ الْمَشْئَمَةِۗ","عَلَيْهِمْ نَارٌ مُّؤْصَدَةٌ ࣖ"],"id":["Aku bersumpah dengan negeri ini (Mekah),","dan engkau (Muhammad), bertempat di negeri (Mekah) ini,","dan demi (pertalian) bapak dan anaknya.","Sungguh, Kami telah menciptakan manusia berada dalam susah payah.","Apakah dia (manusia) itu mengira bahwa tidak ada sesuatu pun yang berkuasa atasnya?","Dia mengatakan, “Aku telah menghabiskan harta yang banyak.” ","Apakah dia mengira bahwa tidak ada sesuatu pun yang melihatnya?","Bukankah Kami telah menjadikan untuknya sepasang mata,","dan lidah dan sepasang bibir?","Dan Kami telah menunjukkan kepadanya dua jalan (kebajikan dan kejahatan),","tetapi dia tidak menempuh jalan yang mendaki dan sukar?","Dan tahukah kamu apakah jalan yang mendaki dan sukar itu?","(yaitu) melepaskan perbudakan (hamba sahaya),","atau memberi makan pada hari terjadi kelaparan,","(kepada) anak yatim yang ada hubungan kerabat,","atau orang miskin yang sangat fakir.","Kemudian dia termasuk orang-orang yang beriman dan saling berpesan untuk bersabar dan saling berpesan untuk berkasih sayang.","Mereka (orang-orang yang beriman dan saling berpesan itu) adalah golongan kanan.","Dan orang-orang yang kafir kepada ayat-ayat Kami, mereka itu adalah golongan kiri.","Mereka berada dalam neraka yang ditutup rapat."],"en":["I swear by this city, Makkah","And you, [O Muhammad], are free of restriction in this city","And [by] the father and that which was born [of him]","We have certainly created man into hardship","Does he think that never will anyone overcome him","He says, \"I have spent wealth in abundance","Does he think that no one has seen him","Have We not made for him two eyes","And a tongue and two lips","And have shown him the two ways","But he has not broken through the difficult pass","And what can make you know what is [breaking through] the difficult pass","It is the freeing of a slave","Or feeding on a day of severe hunger","An orphan of near relationship","Or a needy person in misery","And then being among those who believed and advised one another to patience and advised one another to compassion","Those are the companions of the right","But they who disbelieved in Our signs - those are the companions of the left","Over them will be fire closed in"],"tl":["La oqsimu bihatha albaladi","Waanta hillun bihatha albaladi","Wawalidin wama walada","Laqad khalaqna alinsana fee kabadin","Ayahsabu an lan yaqdira AAalayhi ahadun","Yaqoolu ahlaktu malan lubadan","Ayahsabu an lam yarahu ahadun","Alam najAAal lahu AAaynayni","Walisanan washafatayni","Wahadaynahu alnnajdayni","Fala iqtahama alAAaqabata","Wama adraka ma alAAaqabatu","Fakku raqabatin","Aw itAAamun fee yawmin thee masghabatin","Yateeman tha maqrabatin","Aw miskeenan tha matrabatin","Thumma kana mina allatheena amanoo watawasaw bialssabri watawasaw bialmarhamati","Olaika ashabu almaymanati","Waallatheena kafaroo biayatina hum ashabu almashamati","AAalayhim narun musadatun"]},"91":{"n":91,"name":"الشمس","latin":"Asy-Syams","ayat":15,"en_name":"The Sun","type":"meccan","ar":["وَالشَّمْسِ وَضُحٰىهَاۖ","وَالْقَمَرِ اِذَا تَلٰىهَاۖ","وَالنَّهَارِ اِذَا جَلّٰىهَاۖ","وَالَّيْلِ اِذَا يَغْشٰىهَاۖ","وَالسَّمَاۤءِ وَمَا بَنٰىهَاۖ","وَالْاَرْضِ وَمَا طَحٰىهَاۖ","وَنَفْسٍ وَّمَا سَوّٰىهَاۖ","فَاَلْهَمَهَا فُجُوْرَهَا وَتَقْوٰىهَاۖ","قَدْ اَفْلَحَ مَنْ زَكّٰىهَاۖ","وَقَدْ خَابَ مَنْ دَسّٰىهَاۗ","كَذَّبَتْ ثَمُوْدُ بِطَغْوٰىهَآ  ۖ","اِذِ انْۢبَعَثَ اَشْقٰىهَاۖ","فَقَالَ لَهُمْ رَسُوْلُ اللّٰهِ نَاقَةَ اللّٰهِ وَسُقْيٰهَاۗ","فَكَذَّبُوْهُ فَعَقَرُوْهَاۖ فَدَمْدَمَ عَلَيْهِمْ رَبُّهُمْ بِذَنْۢبِهِمْ فَسَوّٰىهَاۖ","وَلَا يَخَافُ عُقْبٰهَا ࣖ"],"id":["Demi matahari dan sinarnya pada pagi hari,","demi bulan apabila mengiringinya,","demi siang apabila menampakkannya,","demi malam apabila menutupinya (gelap gulita),","demi langit serta pembinaannya (yang menakjubkan),","demi bumi serta penghamparannya,","demi jiwa serta penyempurnaan (ciptaan)nya,","maka Dia mengilhamkan kepadanya (jalan) kejahatan dan ketakwaannya,","sungguh beruntung orang yang menyucikannya (jiwa itu),","dan sungguh rugi orang yang mengotorinya.","(Kaum) samud telah mendustakan (rasulnya) karena mereka melampaui batas (zalim),","ketika bangkit orang yang paling celaka di antara mereka,","lalu Rasul Allah (Saleh) berkata kepada mereka, “(Biarkanlah) unta betina dari Allah ini dengan minumannya.”","Namun mereka mendustakannya dan menyembelihnya, karena itu Tuhan membinasakan mereka karena dosanya, lalu diratakan-Nya (dengan tanah),","dan Dia tidak takut terhadap akibatnya."],"en":["By the sun and its brightness","And [by] the moon when it follows it","And [by] the day when it displays it","And [by] the night when it covers it","And [by] the sky and He who constructed it","And [by] the earth and He who spread it","And [by] the soul and He who proportioned it","And inspired it [with discernment of] its wickedness and its righteousness","He has succeeded who purifies it","And he has failed who instills it [with corruption]","Thamud denied [their prophet] by reason of their transgression","When the most wretched of them was sent forth","And the messenger of Allah [Salih] said to them, \"[Do not harm] the she-camel of Allah or [prevent her from] her drink","But they denied him and hamstrung her. So their Lord brought down upon them destruction for their sin and made it equal [upon all of them]","And He does not fear the consequence thereof"],"tl":["Waalshshamsi waduhaha","Waalqamari itha talaha","Waalnnahari itha jallaha","Waallayli itha yaghshaha","Waalssamai wama banaha","Waalardi wama tahaha","Wanafsin wama sawwaha","Faalhamaha fujooraha wataqwaha","Qad aflaha man zakkaha","Waqad khaba man dassaha","Kaththabat thamoodu bitaghwaha","Ithi inbaAAatha ashqaha","Faqala lahum rasoolu Allahi naqata Allahi wasuqyaha","Fakaththaboohu faAAaqarooha fadamdama AAalayhim rabbuhum bithanbihim fasawwaha","Wala yakhafu AAuqbaha"]},"92":{"n":92,"name":"الّيل","latin":"Al-Lail","ayat":21,"en_name":"The Night","type":"meccan","ar":["وَالَّيْلِ اِذَا يَغْشٰىۙ","وَالنَّهَارِ اِذَا تَجَلّٰىۙ","وَمَا خَلَقَ الذَّكَرَ وَالْاُنْثٰىٓ ۙ","اِنَّ سَعْيَكُمْ لَشَتّٰىۗ","فَاَمَّا مَنْ اَعْطٰى وَاتَّقٰىۙ","وَصَدَّقَ بِالْحُسْنٰىۙ","فَسَنُيَسِّرُهٗ لِلْيُسْرٰىۗ","وَاَمَّا مَنْۢ بَخِلَ وَاسْتَغْنٰىۙ","وَكَذَّبَ بِالْحُسْنٰىۙ","فَسَنُيَسِّرُهٗ لِلْعُسْرٰىۗ","وَمَا يُغْنِيْ عَنْهُ مَالُهٗٓ اِذَا تَرَدّٰىٓۙ","اِنَّ عَلَيْنَا لَلْهُدٰىۖ","وَاِنَّ لَنَا لَلْاٰخِرَةَ وَالْاُوْلٰىۗ","فَاَنْذَرْتُكُمْ نَارًا تَلَظّٰىۚ","لَا يَصْلٰىهَآ اِلَّا الْاَشْقَىۙ","الَّذِيْ كَذَّبَ وَتَوَلّٰىۗ","وَسَيُجَنَّبُهَا الْاَتْقَىۙ","الَّذِيْ يُؤْتِيْ مَالَهٗ يَتَزَكّٰىۚ","وَمَا لِاَحَدٍ عِنْدَهٗ مِنْ نِّعْمَةٍ تُجْزٰىٓۙ","اِلَّا ابْتِغَاۤءَ وَجْهِ رَبِّهِ الْاَعْلٰىۚ","وَلَسَوْفَ يَرْضٰى ࣖ"],"id":["Demi malam apabila menutupi (cahaya siang),","demi siang apabila terang benderang,","demi penciptaan laki-laki dan perempuan,","sungguh, usahamu memang beraneka macam.","Maka barangsiapa memberikan (hartanya di jalan Allah) dan bertakwa,","dan membenarkan (adanya pahala) yang terbaik (surga),","maka akan Kami mudahkan baginya jalan menuju kemudahan (kebahagiaan),","dan adapun orang yang kikir dan merasa dirinya cukup (tidak perlu pertolongan Allah),","serta mendustakan (pahala) yang terbaik,","maka akan Kami mudahkan baginya jalan menuju kesukaran (kesengsaraan),","dan hartanya tidak bermanfaat baginya apabila dia telah binasa.","Sesungguhnya Kamilah yang memberi petunjuk,","dan sesungguhnya milik Kamilah akhirat dan dunia itu.","Maka Aku memperingatkan kamu dengan neraka yang menyala-nyala,","yang hanya dimasuki oleh orang yang paling celaka,","yang mendustakan (kebenaran) dan berpaling (dari iman).","Dan akan dijauhkan darinya (neraka) orang yang paling bertakwa, ","yang menginfakkan hartanya (di jalan Allah) untuk membersihkan (dirinya),","dan tidak ada seorang pun memberikan suatu nikmat padanya yang harus dibalasnya,","tetapi (dia memberikan itu semata-mata) karena mencari keridaan Tuhannya Yang Mahatinggi.","Dan niscaya kelak dia akan mendapat kesenangan (yang sempurna)."],"en":["By the night when it covers","And [by] the day when it appears","And [by] He who created the male and female","Indeed, your efforts are diverse","As for he who gives and fears Allah","And believes in the best [reward]","We will ease him toward ease","But as for he who withholds and considers himself free of need","And denies the best [reward]","We will ease him toward difficulty","And what will his wealth avail him when he falls","Indeed, [incumbent] upon Us is guidance","And indeed, to Us belongs the Hereafter and the first [life]","So I have warned you of a Fire which is blazing","None will [enter to] burn therein except the most wretched one","Who had denied and turned away","But the righteous one will avoid it","[He] who gives [from] his wealth to purify himself","And not [giving] for anyone who has [done him] a favor to be rewarded","But only seeking the countenance of his Lord, Most High","And he is going to be satisfied"],"tl":["Waallayli itha yaghsha","Waalnnahari itha tajalla","Wama khalaqa alththakara waalontha","Inna saAAyakum lashatta","Faamma man aAAta waittaqa","Wasaddaqa bialhusna","Fasanuyassiruhu lilyusra","Waamma man bakhila waistaghna","Wakaththaba bialhusna","Fasanuyassiruhu lilAAusra","Wama yughnee AAanhu maluhu itha taradda","Inna AAalayna lalhuda","Wainna lana lalakhirata waaloola","Faanthartukum naran talaththa","La yaslaha illa alashqa","Allathee kaththaba watawalla","Wasayujannabuha alatqa","Allathee yutee malahu yatazakka","Wama liahadin AAindahu min niAAmatin tujza","Illa ibtighaa wajhi rabbihi alaAAla","Walasawfa yarda"]},"93":{"n":93,"name":"الضحى","latin":"Ad-Duha","ayat":11,"en_name":"The Morning Hours","type":"meccan","ar":["وَالضُّحٰىۙ","وَالَّيْلِ اِذَا سَجٰىۙ","مَا وَدَّعَكَ رَبُّكَ وَمَا قَلٰىۗ","وَلَلْاٰخِرَةُ خَيْرٌ لَّكَ مِنَ الْاُوْلٰىۗ","وَلَسَوْفَ يُعْطِيْكَ رَبُّكَ فَتَرْضٰىۗ","اَلَمْ يَجِدْكَ يَتِيْمًا فَاٰوٰىۖ","وَوَجَدَكَ ضَاۤلًّا فَهَدٰىۖ","وَوَجَدَكَ عَاۤىِٕلًا فَاَغْنٰىۗ","فَاَمَّا الْيَتِيْمَ فَلَا تَقْهَرْۗ","وَاَمَّا السَّاۤىِٕلَ فَلَا تَنْهَرْ","وَاَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ ࣖ"],"id":["Demi waktu duha (ketika matahari naik sepenggalah),","dan demi malam apabila telah sunyi,","Tuhanmu tidak meninggalkan engkau (Muhammad) dan tidak (pula) membencimu,","dan sungguh, yang kemudian itu lebih baik bagimu dari yang permulaan.","Dan sungguh, kelak Tuhanmu pasti memberikan karunia-Nya kepadamu, sehingga engkau menjadi puas.","Bukankah Dia mendapatimu sebagai seorang yatim, lalu Dia melindungi(mu),","dan Dia mendapatimu sebagai seorang yang bingung, lalu Dia memberikan petunjuk,","dan Dia mendapatimu sebagai seorang yang kekurangan, lalu Dia memberikan kecukupan.","Maka terhadap anak yatim janganlah engkau berlaku sewenang-wenang.","Dan terhadap orang yang meminta-minta janganlah engkau menghardik(nya).","Dan terhadap nikmat Tuhanmu hendaklah engkau nyatakan (dengan bersyukur)."],"en":["By the morning brightness","And [by] the night when it covers with darkness","Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you]","And the Hereafter is better for you than the first [life]","And your Lord is going to give you, and you will be satisfied","Did He not find you an orphan and give [you] refuge","And He found you lost and guided [you]","And He found you poor and made [you] self-sufficient","So as for the orphan, do not oppress [him]","And as for the petitioner, do not repel [him]","But as for the favor of your Lord, report [it]"],"tl":["Waaldduha","Waallayli itha saja","Ma waddaAAaka rabbuka wama qala","Walalakhiratu khayrun laka mina aloola","Walasawfa yuAAteeka rabbuka fatarda","Alam yajidka yateeman faawa","Wawajadaka dallan fahada","Wawajadaka AAailan faaghna","Faamma alyateema fala taqhar","Waamma alssaila fala tanhar","Waamma biniAAmati rabbika fahaddith"]},"94":{"n":94,"name":"الشرح","latin":"Asy-Syarh","ayat":8,"en_name":"The Relief","type":"meccan","ar":["اَلَمْ نَشْرَحْ لَكَ صَدْرَكَۙ","وَوَضَعْنَا عَنْكَ وِزْرَكَۙ","الَّذِيْٓ اَنْقَضَ ظَهْرَكَۙ","وَرَفَعْنَا لَكَ ذِكْرَكَۗ","فَاِنَّ مَعَ الْعُسْرِ يُسْرًاۙ","اِنَّ مَعَ الْعُسْرِ يُسْرًاۗ","فَاِذَا فَرَغْتَ فَانْصَبْۙ","وَاِلٰى رَبِّكَ فَارْغَبْ ࣖ"],"id":["Bukankah Kami telah melapangkan dadamu (Muhammad)?","dan Kami pun telah menurunkan bebanmu darimu,","yang memberatkan punggungmu, ","dan Kami tinggikan sebutan (nama)mu bagimu.","Maka sesungguhnya beserta kesulitan ada kemudahan,","sesungguhnya beserta kesulitan itu ada kemudahan.","Maka apabila engkau telah selesai (dari sesuatu urusan), tetaplah bekerja keras (untuk urusan yang lain),","dan hanya kepada Tuhanmulah engkau berharap."],"en":["Did We not expand for you, [O Muhammad], your breast","And We removed from you your burden","Which had weighed upon your back","And raised high for you your repute","For indeed, with hardship [will be] ease","Indeed, with hardship [will be] ease","So when you have finished [your duties], then stand up [for worship]","And to your Lord direct [your] longing"],"tl":["Alam nashrah laka sadraka","WawadaAAna AAanka wizraka","Allathee anqada thahraka","WarafaAAna laka thikraka","Fainna maAAa alAAusri yusran","Inna maAAa alAAusri yusran","Faitha faraghta fainsab","Waila rabbika fairghab"]},"95":{"n":95,"name":"التين","latin":"At-Tin","ayat":8,"en_name":"The Fig","type":"meccan","ar":["وَالتِّيْنِ وَالزَّيْتُوْنِۙ","وَطُوْرِ سِيْنِيْنَۙ","وَهٰذَا الْبَلَدِ الْاَمِيْنِۙ","لَقَدْ خَلَقْنَا الْاِنْسَانَ فِيْٓ اَحْسَنِ تَقْوِيْمٍۖ","ثُمَّ رَدَدْنٰهُ اَسْفَلَ سَافِلِيْنَۙ","اِلَّا الَّذِيْنَ اٰمَنُوْا وَعَمِلُوا الصّٰلِحٰتِ فَلَهُمْ اَجْرٌ غَيْرُ مَمْنُوْنٍۗ","فَمَا يُكَذِّبُكَ بَعْدُ بِالدِّيْنِۗ","اَلَيْسَ اللّٰهُ بِاَحْكَمِ الْحٰكِمِيْنَ ࣖ"],"id":["Demi (buah) Tin dan (buah) Zaitun,","demi gunung Sinai,","dan demi negeri (Mekah) yang aman ini.","Sungguh, Kami telah menciptakan manusia dalam bentuk yang sebaik-baiknya,","kemudian Kami kembalikan dia ke tempat yang serendah-rendahnya,","kecuali orang-orang yang beriman dan mengerjakan kebajikan; maka mereka akan mendapat pahala yang tidak ada putus-putusnya.","Maka apa yang menyebabkan (mereka) mendustakanmu (tentang) hari pembalasan setelah (adanya keterangan-keterangan) itu?","Bukankah Allah hakim yang paling adil?"],"en":["By the fig and the olive","And [by] Mount Sinai","And [by] this secure city [Makkah]","We have certainly created man in the best of stature","Then We return him to the lowest of the low","Except for those who believe and do righteous deeds, for they will have a reward uninterrupted","So what yet causes you to deny the Recompense","Is not Allah the most just of judges"],"tl":["Waaltteeni waalzzaytooni","Watoori seeneena","Wahatha albaladi alameeni","Laqad khalaqna alinsana fee ahsani taqweemin","Thumma radadnahu asfala safileena","Illa allatheena amanoo waAAamiloo alssalihati falahum ajrun ghayru mamnoonin","Fama yukaththibuka baAAdu bialddeeni","Alaysa Allahu biahkami alhakimeena"]},"96":{"n":96,"name":"العلق","latin":"Al-'Alaq","ayat":19,"en_name":"The Clot","type":"meccan","ar":["اِقْرَأْ بِاسْمِ رَبِّكَ الَّذِيْ خَلَقَۚ","خَلَقَ الْاِنْسَانَ مِنْ عَلَقٍۚ","اِقْرَأْ وَرَبُّكَ الْاَكْرَمُۙ","الَّذِيْ عَلَّمَ بِالْقَلَمِۙ","عَلَّمَ الْاِنْسَانَ مَا لَمْ يَعْلَمْۗ","كَلَّآ اِنَّ الْاِنْسَانَ لَيَطْغٰىٓ ۙ","اَنْ رَّاٰهُ اسْتَغْنٰىۗ","اِنَّ اِلٰى رَبِّكَ الرُّجْعٰىۗ","اَرَاَيْتَ الَّذِيْ يَنْهٰىۙ","عَبْدًا اِذَا صَلّٰىۗ","اَرَاَيْتَ اِنْ كَانَ عَلَى الْهُدٰىٓۙ","اَوْ اَمَرَ بِالتَّقْوٰىۗ","اَرَاَيْتَ اِنْ كَذَّبَ وَتَوَلّٰىۗ","اَلَمْ يَعْلَمْ بِاَنَّ اللّٰهَ يَرٰىۗ","كَلَّا لَىِٕنْ لَّمْ يَنْتَهِ ەۙ لَنَسْفَعًاۢ بِالنَّاصِيَةِۙ","نَاصِيَةٍ كَاذِبَةٍ خَاطِئَةٍۚ","فَلْيَدْعُ نَادِيَهٗۙ","سَنَدْعُ الزَّبَانِيَةَۙ","كَلَّاۗ  لَا تُطِعْهُ وَاسْجُدْ وَاقْتَرِبْ ۩ ࣖ"],"id":["Bacalah dengan (menyebut) nama Tuhanmu yang menciptakan,","Dia telah menciptakan manusia dari segumpal darah.","Bacalah, dan Tuhanmulah Yang Mahamulia,","Yang mengajar (manusia) dengan pena.","Dia mengajarkan manusia apa yang tidak diketahuinya.","Sekali-kali tidak! Sungguh, manusia itu benar-benar melampaui batas,","apabila melihat dirinya serba cukup.","Sungguh, hanya kepada Tuhanmulah tempat kembali(mu).","Bagaimana pendapatmu tentang orang yang melarang?","seorang hamba ketika dia melaksanakan salat,","bagaimana pendapatmu jika dia (yang dilarang salat itu) berada di atas kebenaran (petunjuk),","atau dia menyuruh bertakwa (kepada Allah)?","Bagaimana pendapatmu jika dia (yang melarang) itu mendustakan dan berpaling?","Tidakkah dia mengetahui bahwa sesungguhnya Allah melihat (segala perbuatannya)?","Sekali-kali tidak! Sungguh, jika dia tidak berhenti (berbuat demikian) niscaya Kami tarik ubun-ubunnya, (ke dalam neraka),","yaitu) ubun-ubun orang yang mendustakan dan durhaka.","Maka biarlah dia memanggil golongannya (untuk menolongnya),","Kelak Kami akan memanggil Malaikat Zabaniyah, (penyiksa orang-orang yang berdosa), ","sekali-kali tidak! Janganlah kamu patuh kepadanya; dan sujudlah serta dekatkanlah (dirimu kepada Allah)."],"en":["Recite in the name of your Lord who created","Created man from a clinging substance","Recite, and your Lord is the most Generous","Who taught by the pen","Taught man that which he knew not","No! [But] indeed, man transgresses","Because he sees himself self-sufficient","Indeed, to your Lord is the return","Have you seen the one who forbids","A servant when he prays","Have you seen if he is upon guidance","Or enjoins righteousness","Have you seen if he denies and turns away","Does he not know that Allah sees","No! If he does not desist, We will surely drag him by the forelock","A lying, sinning forelock","Then let him call his associates","We will call the angels of Hell","No! Do not obey him. But prostrate and draw near [to Allah]"],"tl":["Iqra biismi rabbika allathee khalaqa","Khalaqa alinsana min AAalaqin","Iqra warabbuka alakramu","Allathee AAallama bialqalami","AAallama alinsana ma lam yaAAlam","Kalla inna alinsana layatgha","An raahu istaghna","Inna ila rabbika alrrujAAa","Araayta allathee yanha","AAabdan itha salla","Araayta in kana AAala alhuda","Aw amara bialttaqwa","Araayta in kaththaba watawalla","Alam yaAAlam bianna Allaha yara","Kalla lain lam yantahi lanasfaAAan bialnnasiyati","Nasiyatin kathibatin khatiatin","FalyadAAu nadiyahu","SanadAAu alzzabaniyata","Kalla la tutiAAhu waosjud waiqtarib"]},"97":{"n":97,"name":"القدر","latin":"Al-Qadr","ayat":5,"en_name":"The Power","type":"meccan","ar":["اِنَّآ اَنْزَلْنٰهُ فِيْ لَيْلَةِ الْقَدْرِ ","وَمَآ اَدْرٰىكَ مَا لَيْلَةُ الْقَدْرِۗ","لَيْلَةُ الْقَدْرِ ەۙ خَيْرٌ مِّنْ اَلْفِ شَهْرٍۗ","تَنَزَّلُ الْمَلٰۤىِٕكَةُ وَالرُّوْحُ فِيْهَا بِاِذْنِ رَبِّهِمْۚ مِنْ كُلِّ اَمْرٍۛ","سَلٰمٌ ۛهِيَ حَتّٰى مَطْلَعِ الْفَجْرِ ࣖ"],"id":["Sesungguhnya Kami telah menurunkannya (Al-Qur'an) pada malam qadar.","Dan tahukah kamu apakah malam kemuliaan itu?","Malam kemuliaan itu lebih baik daripada seribu bulan.","Pada malam itu turun para malaikat dan Ruh (Jibril) dengan izin Tuhannya untuk mengatur semua urusan.","Sejahteralah (malam itu) sampai terbit fajar."],"en":["Indeed, We sent the Qur'an down during the Night of Decree","And what can make you know what is the Night of Decree","The Night of Decree is better than a thousand months","The angels and the Spirit descend therein by permission of their Lord for every matter","Peace it is until the emergence of dawn"],"tl":["Inna anzalnahu fee laylati alqadri","Wama adraka ma laylatu alqadri","Laylatu alqadri khayrun min alfi shahrin","Tanazzalu almalaikatu waalrroohu feeha biithni rabbihim min kulli amrin","Salamun hiya hatta matlaAAi alfajri"]},"98":{"n":98,"name":"البيّنة","latin":"Al-Bayyinah","ayat":8,"en_name":"The Clear Proof","type":"medinan","ar":["لَمْ يَكُنِ الَّذِيْنَ كَفَرُوْا مِنْ اَهْلِ الْكِتٰبِ وَالْمُشْرِكِيْنَ مُنْفَكِّيْنَ حَتّٰى تَأْتِيَهُمُ الْبَيِّنَةُۙ","رَسُوْلٌ مِّنَ اللّٰهِ يَتْلُوْا صُحُفًا مُّطَهَّرَةًۙ","فِيْهَا كُتُبٌ قَيِّمَةٌ  ۗ","وَمَا تَفَرَّقَ الَّذِيْنَ اُوْتُوا الْكِتٰبَ اِلَّا مِنْۢ بَعْدِ مَا جَاۤءَتْهُمُ الْبَيِّنَةُ ۗ","وَمَآ اُمِرُوْٓا اِلَّا لِيَعْبُدُوا اللّٰهَ مُخْلِصِيْنَ لَهُ الدِّيْنَ ەۙ حُنَفَاۤءَ وَيُقِيْمُوا الصَّلٰوةَ وَيُؤْتُوا الزَّكٰوةَ وَذٰلِكَ دِيْنُ الْقَيِّمَةِۗ","اِنَّ الَّذِيْنَ كَفَرُوْا مِنْ اَهْلِ الْكِتٰبِ وَالْمُشْرِكِيْنَ فِيْ نَارِ جَهَنَّمَ خٰلِدِيْنَ فِيْهَاۗ اُولٰۤىِٕكَ هُمْ شَرُّ الْبَرِيَّةِۗ","اِنَّ الَّذِيْنَ اٰمَنُوْا وَعَمِلُوا الصّٰلِحٰتِ اُولٰۤىِٕكَ هُمْ خَيْرُ الْبَرِيَّةِۗ","جَزَاۤؤُهُمْ عِنْدَ رَبِّهِمْ جَنّٰتُ عَدْنٍ تَجْرِيْ مِنْ تَحْتِهَا الْاَنْهٰرُ خٰلِدِيْنَ فِيْهَآ اَبَدًا ۗرَضِيَ اللّٰهُ عَنْهُمْ وَرَضُوْا عَنْهُ ۗ ذٰلِكَ لِمَنْ خَشِيَ رَبَّهٗ ࣖ"],"id":["Orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik tidak akan meninggalkan (agama mereka) sampai datang kepada mereka bukti yang nyata,","(yaitu) seorang Rasul dari Allah (Muhammad) yang membacakan lembaran-lembaran yang suci (Al-Qur'an),","di dalamnya terdapat (isi) kitab-kitab yang lurus (benar).","Dan tidaklah terpecah-belah orang-orang Ahli Kitab melainkan setelah datang kepada mereka bukti yang nyata.","Padahal mereka hanya diperintah menyembah Allah dengan ikhlas menaati-Nya semata-mata karena (menjalankan) agama, dan juga agar melaksanakan salat dan menunaikan zakat; dan yang demikian itulah agama yang lurus (benar).","Sungguh, orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik (akan masuk) ke neraka Jahanam; mereka kekal di dalamnya selama-lamanya. Mereka itu adalah sejahat-jahat makhluk.","Sungguh, orang-orang yang beriman dan mengerjakan kebajikan, mereka itu adalah sebaik-baik makhluk.","Balasan mereka di sisi Tuhan mereka ialah surga ’Adn yang mengalir di bawahnya sungai-sungai; mereka kekal di dalamnya selama-lamanya. Allah rida terhadap mereka dan mereka pun rida kepada-Nya. Yang demikian itu adalah (balasan) bagi orang yang takut kepada Tuhannya. "],"en":["Those who disbelieved among the People of the Scripture and the polytheists were not to be parted [from misbelief] until there came to them clear evidence","A Messenger from Allah, reciting purified scriptures","Within which are correct writings","Nor did those who were given the Scripture become divided until after there had come to them clear evidence","And they were not commanded except to worship Allah, [being] sincere to Him in religion, inclining to truth, and to establish prayer and to give zakah. And that is the correct religion","Indeed, they who disbelieved among the People of the Scripture and the polytheists will be in the fire of Hell, abiding eternally therein. Those are the worst of creatures","Indeed, they who have believed and done righteous deeds - those are the best of creatures","Their reward with Allah will be gardens of perpetual residence beneath which rivers flow, wherein they will abide forever, Allah being pleased with them and they with Him. That is for whoever has feared his Lord"],"tl":["Lam yakuni allatheena kafaroo min ahli alkitabi waalmushrikeena munfakkeena hatta tatiyahumu albayyinatu","Rasoolun mina Allahi yatloo suhufan mutahharatan","Feeha kutubun qayyimatun","Wama tafarraqa allatheena ootoo alkitaba illa min baAAdi ma jaathumu albayyinatu","Wama omiroo illa liyaAAbudoo Allaha mukhliseena lahu alddeena hunafaa wayuqeemoo alssalata wayutoo alzzakata wathalika deenu alqayyimati","Inna allatheena kafaroo min ahli alkitabi waalmushrikeena fee nari jahannama khalideena feeha olaika hum sharru albariyyati","Inna allatheena amanoo waAAamiloo alssalihati olaika hum khayru albariyyati","Jazaohum AAinda rabbihim jannatu AAadnin tajree min tahtiha alanharu khalideena feeha abadan radiya Allahu AAanhum waradoo AAanhu thalika liman khashiya rabbahu"]},"99":{"n":99,"name":"الزلزلة","latin":"Az-Zalzalah","ayat":8,"en_name":"The Earthquake","type":"medinan","ar":["اِذَا زُلْزِلَتِ الْاَرْضُ زِلْزَالَهَاۙ","وَاَخْرَجَتِ الْاَرْضُ اَثْقَالَهَاۙ","وَقَالَ الْاِنْسَانُ مَا لَهَاۚ","يَوْمَىِٕذٍ تُحَدِّثُ اَخْبَارَهَاۙ","بِاَنَّ رَبَّكَ اَوْحٰى لَهَاۗ","يَوْمَىِٕذٍ يَّصْدُرُ النَّاسُ اَشْتَاتًا ەۙ لِّيُرَوْا اَعْمَالَهُمْۗ","فَمَنْ يَّعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَّرَهٗۚ","وَمَنْ يَّعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَّرَهٗ ࣖ"],"id":["Apabila bumi diguncangkan dengan guncangan yang dahsyat,","dan bumi telah mengeluarkan beban-beban berat (yang dikandung)nya,","Dan manusia bertanya, “Apa yang terjadi pada bumi ini?”","Pada hari itu bumi menyampaikan beritanya,","karena sesungguhnya Tuhanmu telah memerintahkan (yang sedemikian itu) padanya.","Pada hari itu manusia keluar dari kuburnya dalam keadaan berkelompok-kelompok, untuk diperlihatkan kepada mereka (balasan) semua perbuatannya.","Maka barangsiapa mengerjakan kebaikan seberat zarrah, niscaya dia akan melihat (balasan)nya,","dan barangsiapa mengerjakan kejahatan seberat zarrah, niscaya dia akan melihat (balasan)nya."],"en":["When the earth is shaken with its [final] earthquake","And the earth discharges its burdens","And man says, \"What is [wrong] with it","That Day, it will report its news","Because your Lord has commanded it","That Day, the people will depart separated [into categories] to be shown [the result of] their deeds","So whoever does an atom's weight of good will see it","And whoever does an atom's weight of evil will see it"],"tl":["Itha zulzilati alardu zilzalaha","Waakhrajati alardu athqalaha","Waqala alinsanu ma laha","Yawmaithin tuhaddithu akhbaraha","Bianna rabbaka awha laha","Yawmaithin yasduru alnnasu ashtatan liyuraw aAAmalahum","Faman yaAAmal mithqala tharratin khayran yarahu","Waman yaAAmal mithqala tharratin sharran yarahu"]},"100":{"n":100,"name":"العٰديٰت","latin":"Al-'Adiyat","ayat":11,"en_name":"The Courser","type":"meccan","ar":["وَالْعٰدِيٰتِ ضَبْحًاۙ ","فَالْمُوْرِيٰتِ قَدْحًاۙ","فَالْمُغِيْرٰتِ صُبْحًاۙ","فَاَثَرْنَ بِهٖ نَقْعًاۙ","فَوَسَطْنَ بِهٖ جَمْعًاۙ","اِنَّ الْاِنْسَانَ لِرَبِّهٖ لَكَنُوْدٌ ۚ","وَاِنَّهٗ عَلٰى ذٰلِكَ لَشَهِيْدٌۚ","وَاِنَّهٗ لِحُبِّ الْخَيْرِ لَشَدِيْدٌ ۗ","۞ اَفَلَا يَعْلَمُ اِذَا بُعْثِرَ مَا فِى الْقُبُوْرِۙ","وَحُصِّلَ مَا فِى الصُّدُوْرِۙ","اِنَّ رَبَّهُمْ بِهِمْ يَوْمَىِٕذٍ لَّخَبِيْرٌ ࣖ"],"id":["Demi kuda perang yang berlari kencang terengah-engah,","dan kuda yang memercikkan bunga api (dengan pukulan kuku kakinya),","dan kuda yang menyerang (dengan tiba-tiba) pada waktu pagi,","sehingga menerbangkan debu,","lalu menyerbu ke tengah-tengah kumpulan musuh,","sungguh, manusia itu sangat ingkar, (tidak bersyukur) kepada Tuhannya,","dan sesungguhnya dia (manusia) menyaksikan (mengakui) keingkarannya,","dan sesungguhnya cintanya kepada harta benar-benar berlebihan.","Maka tidakkah dia mengetahui apabila apa yang di dalam kubur dikeluarkan,","dan apa yang tersimpan di dalam dada dilahirkan?","sungguh, Tuhan mereka pada hari itu Mahateliti terhadap keadaan mereka."],"en":["By the racers, panting","And the producers of sparks [when] striking","And the chargers at dawn","Stirring up thereby [clouds of] dust","Arriving thereby in the center collectively","Indeed mankind, to his Lord, is ungrateful","And indeed, he is to that a witness","And indeed he is, in love of wealth, intense","But does he not know that when the contents of the graves are scattered","And that within the breasts is obtained","Indeed, their Lord with them, that Day, is [fully] Acquainted"],"tl":["WaalAAadiyati dabhan","Faalmooriyati qadhan","Faalmugheerati subhan","Faatharna bihi naqAAan","Fawasatna bihi jamAAan","Inna alinsana lirabbihi lakanoodun","Wainnahu AAala thalika lashaheedun","Wainnahu lihubbi alkhayri lashadeedun","Afala yaAAlamu itha buAAthira ma fee alquboori","Wahussila ma fee alssudoori","Inna rabbahum bihim yawmaithin lakhabeerun"]},"101":{"n":101,"name":"القارعة","latin":"Al-Qari'ah","ayat":11,"en_name":"The Calamity","type":"meccan","ar":["اَلْقَارِعَةُۙ","مَا الْقَارِعَةُ ۚ","وَمَآ اَدْرٰىكَ مَا الْقَارِعَةُ ۗ","يَوْمَ يَكُوْنُ النَّاسُ كَالْفَرَاشِ الْمَبْثُوْثِۙ","وَتَكُوْنُ الْجِبَالُ كَالْعِهْنِ الْمَنْفُوْشِۗ","فَاَمَّا مَنْ ثَقُلَتْ مَوَازِينُهٗۙ","فَهُوَ فِيْ عِيْشَةٍ رَّاضِيَةٍۗ","وَاَمَّا مَنْ خَفَّتْ مَوَازِيْنُهٗۙ","فَاُمُّهُ هَاوِيَةٌ  ۗ","وَمَآ اَدْرٰىكَ مَا هِيَهْۗ","نَارٌ حَامِيَةٌ ࣖ"],"id":["Hari Kiamat,","Apakah hari Kiamat itu?","Dan tahukah kamu apakah hari Kiamat itu?","Pada hari itu manusia seperti laron yang beterbangan,","dan gunung-gunung seperti bulu yang dihambur-hamburkan.","Maka adapun orang yang berat timbangan (kebaikan)nya,","maka dia berada dalam kehidupan yang memuaskan (senang).","Dan adapun orang yang ringan timbangan (kebaikan)nya,","maka tempat kembalinya adalah neraka Hawiyah.","Dan tahukah kamu apakah neraka Hawiyah itu?","(Yaitu) api yang sangat panas."],"en":["The Striking Calamity","What is the Striking Calamity","And what can make you know what is the Striking Calamity","It is the Day when people will be like moths, dispersed","And the mountains will be like wool, fluffed up","Then as for one whose scales are heavy [with good deeds]","He will be in a pleasant life","But as for one whose scales are light","His refuge will be an abyss","And what can make you know what that is","It is a Fire, intensely hot"],"tl":["AlqariAAatu","Ma alqariAAatu","Wama adraka ma alqariAAatu","Yawma yakoonu alnnasu kaalfarashi almabthoothi","Watakoonu aljibalu kaalAAihni almanfooshi","Faamma man thaqulat mawazeenuhu","Fahuwa fee AAeeshatin radiyatin","Waamma man khaffat mawazeenuhu","Faommuhu hawiyatun","Wama adraka ma hiyah","Narun hamiyatun"]},"102":{"n":102,"name":"التكاثر","latin":"At-Takasur","ayat":8,"en_name":"The Rivalry in world increase","type":"meccan","ar":["اَلْهٰىكُمُ التَّكَاثُرُۙ","حَتّٰى زُرْتُمُ الْمَقَابِرَۗ","كَلَّا سَوْفَ تَعْلَمُوْنَۙ","ثُمَّ كَلَّا سَوْفَ تَعْلَمُوْنَ ","كَلَّا لَوْ تَعْلَمُوْنَ عِلْمَ الْيَقِيْنِۗ","لَتَرَوُنَّ الْجَحِيْمَۙ","ثُمَّ لَتَرَوُنَّهَا عَيْنَ الْيَقِيْنِۙ","ثُمَّ لَتُسْـَٔلُنَّ يَوْمَىِٕذٍ عَنِ النَّعِيْمِ ࣖ"],"id":["Bermegah-megahan telah melalaikan kamu,","sampai kamu masuk ke dalam kubur.","Sekali-kali tidak! Kelak kamu akan mengetahui (akibat perbuatanmu itu),","kemudian sekali-kali tidak! Kelak kamu akan mengetahui.","Sekali-kali tidak! Sekiranya kamu mengetahui dengan pasti,","niscaya kamu benar-benar akan melihat neraka Jahim,","kemudian kamu benar-benar akan melihatnya dengan mata kepala sendiri,","kemudian kamu benar-benar akan ditanya pada hari itu tentang kenikmatan (yang megah di dunia itu)."],"en":["Competition in [worldly] increase diverts you","Until you visit the graveyards","No! You are going to know","Then no! You are going to know","No! If you only knew with knowledge of certainty","You will surely see the Hellfire","Then you will surely see it with the eye of certainty","Then you will surely be asked that Day about pleasure"],"tl":["Alhakumu alttakathuru","Hatta zurtumu almaqabira","Kalla sawfa taAAlamoona","Thumma kalla sawfa taAAlamoona","Kalla law taAAlamoona AAilma alyaqeeni","Latarawunna aljaheema","Thumma latarawunnaha AAayna alyaqeeni","Thumma latusalunna yawmaithin AAani alnnaAAeemi"]},"103":{"n":103,"name":"العصر","latin":"Al-'Asr","ayat":3,"en_name":"The Declining Day","type":"meccan","ar":["وَالْعَصْرِۙ","اِنَّ الْاِنْسَانَ لَفِيْ خُسْرٍۙ","اِلَّا الَّذِيْنَ اٰمَنُوْا وَعَمِلُوا الصّٰلِحٰتِ وَتَوَاصَوْا بِالْحَقِّ ەۙ وَتَوَاصَوْا بِالصَّبْرِ ࣖ"],"id":["Demi masa,","sungguh, manusia berada dalam kerugian,","kecuali orang-orang yang beriman dan mengerjakan kebajikan serta saling menasihati untuk kebenaran dan saling menasihati untuk kesabaran."],"en":["By time","Indeed, mankind is in loss","Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience"],"tl":["WaalAAasri","Inna alinsana lafee khusrin","Illa allatheena amanoo waAAamiloo alssalihati watawasaw bialhaqqi watawasaw bialssabri"]},"104":{"n":104,"name":"الهمزة","latin":"Al-Humazah","ayat":9,"en_name":"The Traducer","type":"meccan","ar":["وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍۙ"," ۨالَّذِيْ جَمَعَ مَالًا وَّعَدَّدَهٗۙ","يَحْسَبُ اَنَّ مَالَهٗٓ اَخْلَدَهٗۚ","كَلَّا لَيُنْۢبَذَنَّ فِى الْحُطَمَةِۖ","وَمَآ اَدْرٰىكَ مَا الْحُطَمَةُ ۗ","نَارُ اللّٰهِ الْمُوْقَدَةُۙ","الَّتِيْ تَطَّلِعُ عَلَى الْاَفْـِٕدَةِۗ","اِنَّهَا عَلَيْهِمْ مُّؤْصَدَةٌۙ","فِيْ عَمَدٍ مُّمَدَّدَةٍ ࣖ"],"id":["Celakalah bagi setiap pengumpat dan pencela,","yang mengumpulkan harta dan menghitung-hitungnya,","dia (manusia) mengira bahwa hartanya itu dapat mengekalkannya.","Sekali-kali tidak! Pasti dia akan dilemparkan ke dalam (neraka) Hutamah.","Dan tahukah kamu apakah (neraka) Hutamah itu?","(Yaitu) api  (azab) Allah yang dinyalakan,","yang (membakar) sampai ke hati.","Sungguh, api itu ditutup rapat atas (diri) mereka,","(sedang mereka itu) diikat pada tiang-tiang yang panjang."],"en":["Woe to every scorner and mocker","Who collects wealth and [continuously] counts it","He thinks that his wealth will make him immortal","No! He will surely be thrown into the Crusher","And what can make you know what is the Crusher","It is the fire of Allah, [eternally] fueled","Which mounts directed at the hearts","Indeed, Hellfire will be closed down upon them","In extended columns"],"tl":["Waylun likulli humazatin lumazatin","Allathee jamaAAa malan waAAaddadahu","Yahsabu anna malahu akhladahu","Kalla layunbathanna fee alhutamati","Wama adraka ma alhutamatu","Naru Allahi almooqadatu","Allatee tattaliAAu AAala alafidati","lnnaha AAalayhim musadatun","Fee AAamadin mumaddadatin"]},"105":{"n":105,"name":"الفيل","latin":"Al-Fil","ayat":5,"en_name":"The Elephant","type":"meccan","ar":["اَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِاَصْحٰبِ الْفِيْلِۗ","اَلَمْ يَجْعَلْ كَيْدَهُمْ فِيْ تَضْلِيْلٍۙ","وَّاَرْسَلَ عَلَيْهِمْ طَيْرًا اَبَابِيْلَۙ","تَرْمِيْهِمْ بِحِجَارَةٍ مِّنْ سِجِّيْلٍۙ","فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُوْلٍ ࣖ "],"id":["Tidakkah engkau (Muhammad) perhatikan bagaimana Tuhanmu telah bertindak terhadap pasukan bergajah?","Bukankah Dia telah menjadikan tipu daya mereka itu sia-sia?","dan Dia mengirimkan kepada mereka burung yang berbondong-bondong,","yang melempari mereka dengan batu dari tanah liat yang dibakar,","sehingga mereka dijadikan-Nya seperti daun-daun yang dimakan (ulat)."],"en":["Have you not considered, [O Muhammad], how your Lord dealt with the companions of the elephant","Did He not make their plan into misguidance","And He sent against them birds in flocks","Striking them with stones of hard clay","And He made them like eaten straw"],"tl":["Alam tara kayfa faAAala rabbuka biashabi alfeeli","Alam yajAAal kaydahum fee tadleelin","Waarsala AAalayhim tayran ababeela","Tarmeehim bihijaratin min sijjeelin","FajaAAalahum kaAAasfin makoolin"]},"106":{"n":106,"name":"قريش","latin":"Quraisy","ayat":4,"en_name":"Quraysh","type":"meccan","ar":["لِاِيْلٰفِ قُرَيْشٍۙ","اٖلٰفِهِمْ رِحْلَةَ الشِّتَاۤءِ وَالصَّيْفِۚ","فَلْيَعْبُدُوْا رَبَّ هٰذَا الْبَيْتِۙ","الَّذِيْٓ اَطْعَمَهُمْ مِّنْ جُوْعٍ ەۙ وَّاٰمَنَهُمْ مِّنْ خَوْفٍ ࣖ"],"id":["Karena kebiasaan orang-orang Quraisy,","(yaitu) kebiasaan mereka bepergian pada musim dingin dan musim panas.","Maka hendaklah mereka menyembah Tuhan (pemilik) rumah ini (Ka‘bah),","yang telah memberi makanan kepada mereka untuk menghilangkan lapar dan mengamankan mereka dari rasa ketakutan."],"en":["For the accustomed security of the Quraysh","Their accustomed security [in] the caravan of winter and summer","Let them worship the Lord of this House","Who has fed them, [saving them] from hunger and made them safe, [saving them] from fear"],"tl":["Lieelafi qurayshin","Eelafihim rihlata alshshitai waalssayfi","FalyaAAbudoo rabba hatha albayti","Allathee atAAamahum min jooAAin waamanahum min khawfin"]},"107":{"n":107,"name":"الماعون","latin":"Al-Ma'un","ayat":7,"en_name":"The Small kindnesses","type":"meccan","ar":["اَرَءَيْتَ الَّذِيْ يُكَذِّبُ بِالدِّيْنِۗ","فَذٰلِكَ الَّذِيْ يَدُعُّ الْيَتِيْمَۙ","وَلَا يَحُضُّ عَلٰى طَعَامِ الْمِسْكِيْنِۗ","فَوَيْلٌ لِّلْمُصَلِّيْنَۙ","الَّذِيْنَ هُمْ عَنْ صَلَاتِهِمْ سَاهُوْنَۙ","الَّذِيْنَ هُمْ يُرَاۤءُوْنَۙ","وَيَمْنَعُوْنَ الْمَاعُوْنَ ࣖ"],"id":["Tahukah kamu (orang) yang mendustakan agama?","Maka itulah orang yang menghardik anak yatim,","dan tidak mendorong memberi makan orang miskin.","Maka celakalah orang yang salat,","(yaitu) orang-orang yang lalai terhadap salatnya,","yang berbuat ria,","dan enggan (memberikan) bantuan."],"en":["Have you seen the one who denies the Recompense","For that is the one who drives away the orphan","And does not encourage the feeding of the poor","So woe to those who pray","[But] who are heedless of their prayer","Those who make show [of their deeds]","And withhold [simple] assistance"],"tl":["Araayta allathee yukaththibu bialddeeni","Fathalika allathee yaduAAAAu alyateema","Wala yahuddu AAala taAAami almiskeeni","Fawaylun lilmusalleena","Allatheena hum AAan salatihim sahoona","Allatheena hum yuraoona","WayamnaAAoona almaAAoona"]},"108":{"n":108,"name":"الكوثر","latin":"Al-Kausar","ayat":3,"en_name":"The Abundance","type":"meccan","ar":["اِنَّآ اَعْطَيْنٰكَ الْكَوْثَرَۗ","فَصَلِّ لِرَبِّكَ وَانْحَرْۗ","اِنَّ شَانِئَكَ هُوَ الْاَبْتَرُ ࣖ"],"id":["Sungguh, Kami telah memberimu (Muhammad) nikmat yang banyak.","Maka laksanakanlah salat karena Tuhanmu, dan berkurbanlah (sebagai ibadah dan mendekatkan diri kepada Allah).","Sungguh, orang-orang yang membencimu dialah yang terputus (dari rahmat Allah)."],"en":["Indeed, We have granted you, [O Muhammad], al-Kawthar","So pray to your Lord and sacrifice [to Him alone]","Indeed, your enemy is the one cut off"],"tl":["Inna aAAtaynaka alkawthara","Fasalli lirabbika wainhar","Inna shaniaka huwa alabtaru"]},"109":{"n":109,"name":"الكٰفرون","latin":"Al-Kafirun","ayat":6,"en_name":"The Disbelievers","type":"meccan","ar":["قُلْ يٰٓاَيُّهَا الْكٰفِرُوْنَۙ","لَآ اَعْبُدُ مَا تَعْبُدُوْنَۙ","وَلَآ اَنْتُمْ عٰبِدُوْنَ مَآ اَعْبُدُۚ","وَلَآ اَنَا۠ عَابِدٌ مَّا عَبَدْتُّمْۙ","وَلَآ اَنْتُمْ عٰبِدُوْنَ مَآ اَعْبُدُۗ","لَكُمْ دِيْنُكُمْ وَلِيَ دِيْنِ ࣖ"],"id":["Katakanlah (Muhammad), “Wahai orang-orang kafir!","aku tidak akan menyembah apa yang kamu sembah,","dan kamu bukan penyembah apa yang aku sembah,","dan aku tidak pernah menjadi penyembah apa yang kamu sembah,","dan kamu tidak pernah (pula) menjadi penyembah apa yang aku sembah.","Untukmu agamamu, dan untukku agamaku.”"],"en":["Say, \"O disbelievers","I do not worship what you worship","Nor are you worshippers of what I worship","Nor will I be a worshipper of what you worship","Nor will you be worshippers of what I worship","For you is your religion, and for me is my religion"],"tl":["Qul ya ayyuha alkafiroona","La aAAbudu ma taAAbudoona","Wala antum AAabidoona ma aAAbudu","Wala ana AAabidun ma AAabadtum","Wala antum AAabidoona ma aAAbudu","Lakum deenukum waliya deeni"]},"110":{"n":110,"name":"النصر","latin":"An-Nasr","ayat":3,"en_name":"The Divine Support","type":"medinan","ar":["اِذَا جَاۤءَ نَصْرُ اللّٰهِ وَالْفَتْحُۙ","وَرَاَيْتَ النَّاسَ يَدْخُلُوْنَ فِيْ دِيْنِ اللّٰهِ اَفْوَاجًاۙ","فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُۗ اِنَّهٗ كَانَ تَوَّابًا ࣖ"],"id":["Apabila telah datang pertolongan Allah dan kemenangan,","dan engkau melihat manusia berbondong-bondong masuk agama Allah,","maka bertasbihlah dalam dengan Tuhanmu dan mohonlah ampunan kepada-Nya. Sungguh, Dia Maha Penerima tobat."],"en":["When the victory of Allah has come and the conquest","And you see the people entering into the religion of Allah in multitudes","Then exalt [Him] with praise of your Lord and ask forgiveness of Him. Indeed, He is ever Accepting of repentance"],"tl":["Itha jaa nasru Allahi waalfathu","Waraayta alnnasa yadkhuloona fee deeni Allahi afwajan","Fasabbih bihamdi rabbika waistaghfirhu innahu kana tawwaban"]},"111":{"n":111,"name":"اللهب","latin":"Al-Lahab","ayat":5,"en_name":"The Palm Fiber","type":"meccan","ar":["تَبَّتْ يَدَآ اَبِيْ لَهَبٍ وَّتَبَّۗ","مَآ اَغْنٰى عَنْهُ مَالُهٗ وَمَا كَسَبَۗ","سَيَصْلٰى نَارًا ذَاتَ لَهَبٍۙ","وَّامْرَاَتُهٗ ۗحَمَّالَةَ الْحَطَبِۚ","فِيْ جِيْدِهَا حَبْلٌ مِّنْ مَّسَدٍ ࣖ"],"id":["Binasalah kedua tangan Abu Lahab dan benar-benar binasa dia!","Tidaklah berguna baginya hartanya dan apa yang dia usahakan.","Kelak dia akan masuk ke dalam api yang bergejolak (neraka).","Dan (begitu pula) istrinya, pembawa kayu bakar (penyebar fitnah). ","Di lehernya ada tali dari sabut yang dipintal."],"en":["May the hands of Abu Lahab be ruined, and ruined is he","His wealth will not avail him or that which he gained","He will [enter to] burn in a Fire of [blazing] flame","And his wife [as well] - the carrier of firewood","Around her neck is a rope of [twisted] fiber"],"tl":["Tabbat yada abee lahabin watabba","Ma aghna AAanhu maluhu wama kasaba","Sayasla naran thata lahabin","Waimraatuhu hammalata alhatabi","Fee jeediha hablun min masadin"]},"112":{"n":112,"name":"الاخلاص","latin":"Al-Ikhlas","ayat":4,"en_name":"The Sincerity","type":"meccan","ar":["قُلْ هُوَ اللّٰهُ اَحَدٌۚ","اَللّٰهُ الصَّمَدُۚ","لَمْ يَلِدْ وَلَمْ يُوْلَدْۙ","وَلَمْ يَكُنْ لَّهٗ كُفُوًا اَحَدٌ ࣖ"],"id":["Katakanlah (Muhammad), “Dialah Allah, Yang Maha Esa.","Allah tempat meminta segala sesuatu.","(Allah) tidak beranak dan tidak pula diperanakkan.","Dan tidak ada sesuatu yang setara dengan Dia.”"],"en":["Say, \"He is Allah, [who is] One","Allah, the Eternal Refuge","He neither begets nor is born","Nor is there to Him any equivalent"],"tl":["Qul huwa Allahu ahadun","Allahu alssamadu","Lam yalid walam yooladu","Walam yakun lahu kufuwan ahadun"]},"113":{"n":113,"name":"الفلق","latin":"Al-Falaq","ayat":5,"en_name":"The Daybreak","type":"meccan","ar":["قُلْ اَعُوْذُ بِرَبِّ الْفَلَقِۙ","مِنْ شَرِّ مَا خَلَقَۙ","وَمِنْ شَرِّ غَاسِقٍ اِذَا وَقَبَۙ","وَمِنْ شَرِّ النَّفّٰثٰتِ فِى الْعُقَدِۙ","وَمِنْ شَرِّ حَاسِدٍ اِذَا حَسَدَ ࣖ"],"id":["Katakanlah, “Aku berlindung kepada Tuhan yang menguasai subuh (fajar),","dari kejahatan (makhluk yang) Dia ciptakan,","dan dari kejahatan malam apabila telah gelap gulita,","dan dari kejahatan (perempuan-perempuan) penyihir yang meniup pada buhul-buhul (talinya),","dan dari kejahatan orang yang dengki apabila dia dengki.”"],"en":["Say, \"I seek refuge in the Lord of daybreak","From the evil of that which He created","And from the evil of darkness when it settles","And from the evil of the blowers in knots","And from the evil of an envier when he envies"],"tl":["Qul aAAoothu birabbi alfalaqi","Min sharri ma khalaqa","Wamin sharri ghasiqin itha waqaba","Wamin sharri alnnaffathati fee alAAuqadi","Wamin sharri hasidin itha hasada"]},"114":{"n":114,"name":"الناس","latin":"An-Nas","ayat":6,"en_name":"Mankind","type":"meccan","ar":["قُلْ اَعُوْذُ بِرَبِّ النَّاسِۙ","مَلِكِ النَّاسِۙ","اِلٰهِ النَّاسِۙ","مِنْ شَرِّ الْوَسْوَاسِ ەۙ الْخَنَّاسِۖ","الَّذِيْ يُوَسْوِسُ فِيْ صُدُوْرِ النَّاسِۙ","مِنَ الْجِنَّةِ وَالنَّاسِ ࣖ "],"id":["Katakanlah, “Aku berlindung kepada Tuhannya manusia,","Raja manusia,","sembahan manusia,","dari kejahatan (bisikan) setan yang bersembunyi,","yang membisikkan (kejahatan) ke dalam dada manusia,","dari (golongan) jin dan manusia.”"],"en":["Say, \"I seek refuge in the Lord of mankind","The Sovereign of mankind","The God of mankind","From the evil of the retreating whisperer","Who whispers [evil] into the breasts of mankind","From among the jinn and mankind"],"tl":["Qul aAAoothu birabbi alnnasi","Maliki alnnasi","Ilahi alnnasi","Min sharri alwaswasi alkhannasi","Allathee yuwaswisu fee sudoori alnnasi","Mina aljinnati wa alnnasm"]}};
const JUZMAN={"110":"Metode-Ummi-110-An-Nashr.mp3","78":"Metode-Ummi-078-An-Naba.mp3","107":"Metode-Ummi-107-Al-Maauun.mp3","79":"Metode-Ummi-079-An-Naaziaat.mp3","114":"Metode-Ummi-114-An-Naas.mp3","98":"Metode-Ummi-098-Al-Bayyinah.mp3","103":"Metode-Ummi-103-Al-Ashr.mp3","95":"Metode-Ummi-095-At-Tiin.mp3","92":"Metode-Ummi-092-Al-Lail.mp3","105":"Metode-Ummi-105-Al-Fiil.mp3","81":"Metode-Ummi-081-At-Takwiir.mp3","93":"Metode-Ummi-093-Adh-Dhuha.mp3","87":"Metode-Ummi-087-Al-Alaa.mp3","108":"Metode-Ummi-108-Al-Kautsar.mp3","106":"Metode-Ummi-106-Quraisy.mp3","94":"Metode-Ummi-094-As-Syarh.mp3","90":"Metode-Ummi-090-Al-Balad.mp3","109":"Metode-Ummi-109-Al-Kaafiruun.mp3","91":"Metode-Ummi-091-Asy-Syams.mp3","89":"Metode-Ummi-089-Al-Fajr.mp3","84":"Metode-Ummi-084-Al-Insyiqaaq.mp3","102":"Metode-Ummi-102-At-Takaatsur.mp3","86":"Metode-Ummi-086-Ath-Thariq.mp3","111":"Metode-Ummi-111-Al-Lahb.mp3","85":"Metode-Ummi-085-Al-Buruuj.mp3","112":"Metode-Ummi-112-Al-Ikhlash.mp3","82":"Metode-Ummi-082-Al-Infithaar.mp3","88":"Metode-Ummi-088-Al-Ghasyiyah.mp3","97":"Metode-Ummi-097-Al-Qadr.mp3","113":"Metode-Ummi-113-Al-Falaq.mp3","104":"Metode-Ummi-104-Al-Humazah.mp3","99":"Metode-Ummi-099-Az-Zalzalah.mp3","101":"Metode-Ummi-101-Al-Qaariah.mp3","96":"Metode-Ummi-096-Al-Alaq.mp3","100":"Metode-Ummi-100-Al-Adiyaat.mp3","83":"Metode-Ummi-083-Al-Muthaffifiin.mp3","80":"Metode-Ummi-080-Abasa.mp3"};
</script>
<script>
const $=id=>document.getElementById(id);
const NM=(window.SUPER&&SUPER.P)||(x=>x);
if(window.SUPER&&SUPER.mountBack)SUPER.mountBack();
document.body.classList.add("hasbar");
if(window.SUPER&&SUPER.bar)SUPER.bar.mount([
 {icon:"\u2039",fn:()=>$("prev").click()},
 {icon:"\u25B6",label:"Dengar",fn:()=>$("play").click()},
 {icon:"\u203A",label:"Lanjut",hot:true,fn:()=>$("next").click()}
]);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* Hafalan starts from the short surahs at the end of the mushaf and works
   backwards, which is how Juz 30 is normally taught, so An-Nas comes first. */
const NUMS=Object.keys(JUZ30).map(Number).sort((a,b)=>b-a);
const S={i:0,sound:true,audio:null,seen:store.get("juz30.seen",{}),files:null,local:null,
         lang:store.get("islami.lang","id")};

/* The recitation lives on archive.org. Rather than guessing file names, the page
   asks archive.org for its own file list once, then matches by surah number or
   name. Change ITEM if you prefer a different recording. */
const ITEM="murottal-anak-juz-30-metode-ummi";
function loadFiles(){
 /* The mapping is baked into this page. It used to be fetched, and when the
    fetch failed the code fell back to guessing file names, which is how
    An-Nas ended up playing An-Nasr: "annas" is inside "annashr".
    Nothing is guessed any more. */
 if(typeof JUZMAN==="object"&&JUZMAN){
  S.local=JUZMAN; S.dir="assets/audio/juz30/"; S.files=Object.values(JUZMAN);
  render(); return Promise.resolve();
 }
 return remoteFiles();
}
function remoteFiles(){
 return fetch("https://archive.org/metadata/"+ITEM)
  .then(r=>r.json())
  .then(j=>{
    const fs=(j.files||[]).filter(f=>/\.(mp3|ogg|m4a)$/i.test(f.name));
    S.files=fs.map(f=>f.name);
    S.dir="https://archive.org/download/"+ITEM+"/";
    render();
  })
  .catch(()=>{ S.files=[]; render(); });
}
/* Match on the surah NUMBER first, and only then on an exact name.
   Never on a substring: that is what made An-Nas match An-Nashr. */
function nameKey(s){return String(s).toLowerCase().replace(/[^a-z]/g,"")}
function fileFor(n){
 if(S.local&&S.local[n]){
  const fixed=(window.SUPER&&SUPER.juzfix)?SUPER.juzfix.for(n,S.local[n]):S.local[n];
  return S.dir+encodeURIComponent(fixed);
 }
 if(!S.files||!S.files.length)return null;
 const s=JUZ30[n], latin=nameKey(s.latin);
 const pads=[String(n).padStart(3,"0"),String(n).padStart(2,"0"),String(n)];
 /* the number is unambiguous, so try it first */
 let hit=S.files.find(f=>pads.some(p=>new RegExp("(^|[^0-9])"+p+"([^0-9]|$)").test(f)));
 if(!hit){
  /* exact name only. The name in the file must equal the surah name once
     punctuation and doubled vowels are levelled out. */
  const flat=x=>nameKey(x).replace(/aa/g,"a").replace(/ii/g,"i").replace(/uu/g,"u")
                          .replace(/sh/g,"s").replace(/ts/g,"s").replace(/kh/g,"k");
  const want=flat(latin);
  hit=S.files.find(f=>{
   const parts=f.replace(/\.[a-z0-9]+$/i,"").split(/[-_ ]+/);
   for(let i=0;i<parts.length;i++){
    for(let j=i+1;j<=Math.min(parts.length,i+3);j++){
     if(flat(parts.slice(i,j).join(""))===want)return true;
    }
   }
   return false;
  });
 }
 return hit?S.dir+encodeURIComponent(hit):null;
}
function renderList(){
 const box=$("list");box.innerHTML="";
 NUMS.forEach((n,i)=>{
  const s=JUZ30[n];
  const b=document.createElement("button");
  b.className="li"+(i===S.i?" on":"");
  b.innerHTML='<span class="n">'+n+'</span><span><span class="t">'+s.latin+
    '</span><br><span class="s">'+s.ayat+' ayat · '+s.en_name+'</span></span>'+
    (S.seen[n]?'<span class="done">\u2705</span>':'');
  b.onclick=()=>{S.i=i;render()};
  box.appendChild(b);
 });
}
function render(){
 const n=NUMS[S.i], s=JUZ30[n];
 let html='<div class="head"><h2>'+n+'. '+s.latin+'</h2>'+
   '<span class="sub">'+s.name+' · '+s.ayat+' ayat · '+s.en_name+'</span></div>';
 for(let k=0;k<s.ayat;k++){
   html+='<div class="ayah"><div class="ar">'+s.ar[k]+'<span class="no">'+(k+1)+'</span></div>'+
    (s.tl[k]?'<div class="tl">'+s.tl[k]+'</div>':'')+
    '<div class="mean"><b>'+s.id[k]+'</b><span class="en">'+s.en[k]+'</span></div></div>';
 }
 $("card").innerHTML=html;
 $("readWrapScroll")&&0;
 document.querySelector(".readWrap").scrollTop=0;
 $("bar").style.width=(Object.keys(S.seen).length/NUMS.length*100)+"%";
 const src=fileFor(n);
 $("note").innerHTML = S.files===null ? "Mencari rekaman di archive.org..."
   : (src? ((S.local?"Rekaman tersimpan di perangkat. ":"Rekaman dari archive.org. ")+
            "Murottal Anak Juz 30, Metode Ummi. Surah "+(S.i+1)+" dari "+NUMS.length+".")
         : ("Teks lengkap tersedia. Rekaman surah ini belum ada. Jalankan "+
            "tools/fetch-juz30.sh untuk mengunduhnya, atau buka archive.org/details/"+ITEM+"."));
 if(window.SUPER&&SUPER.say&&S.sound)SUPER.say.it("Surah "+s.latin);
 if(!S.seen[n]){S.seen[n]=1;store.set("juz30.seen",S.seen);
  if(window.SUPER&&SUPER.score){const r=SUPER.score.award("juz30",{level:4,wrongs:0});
   if(SUPER.bar&&SUPER.bar.fly)SUPER.bar.fly(r.xp,r.streak);}}
 renderList();
}
function play(){
 if(!S.sound)return;
 if(window.SUPER&&SUPER.say)SUPER.say.stop();
 try{if(S.audio){S.audio.pause();S.audio=null}}catch(e){}
 const src=fileFor(NUMS[S.i]);
 if(!src)return;
 const a=new Audio(src);S.audio=a;a.play().catch(()=>{});
}
$("play").onclick=play;
$("next").onclick=()=>{S.i=(S.i+1)%NUMS.length;render();};
$("prev").onclick=()=>{S.i=(S.i-1+NUMS.length)%NUMS.length;render();};
$("sound").onclick=()=>{S.sound=!S.sound;$("sound").textContent=S.sound?"🔊":"🔇";
 if(!S.sound&&S.audio){try{S.audio.pause()}catch(e){}}};
$("lang").onclick=()=>{S.lang=S.lang==="id"?"en":"id";store.set("islami.lang",S.lang);
 $("lang").textContent=S.lang.toUpperCase()};
$("lang").textContent=S.lang.toUpperCase();
render();loadFiles();

</script>
</body>
</html>
