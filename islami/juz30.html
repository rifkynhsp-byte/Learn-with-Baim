<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hafalan Juz 30</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--sand:#F3EAD4;--bone:#FFFDF7;--gold:#E2B455;--kelp:#6FD9A2;
 --sky1:#7A4A22;--sky2:#4A2E19;--sky3:#251510;--glow:#E5A03C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--bone);display:flex;flex-direction:column;
 min-height:100dvh;user-select:none;touch-action:manipulation;overflow:hidden;
 background:radial-gradient(130% 80% at 50% -14%,var(--glow) 0%,transparent 56%),
 linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 46%,var(--sky3) 100%);background-attachment:fixed}
.app{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;max-width:1400px;width:100%;
 margin:0 auto;padding:8px 16px 10px;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--sand);margin-right:auto}
.brand span{color:var(--gold)}
.icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:17px;
 background:rgba(243,234,212,.1);border:1px solid rgba(243,234,212,.2);color:var(--bone);cursor:pointer}
.progress{margin:8px 0 2px;height:7px;border-radius:99px;background:rgba(0,0,0,.3);overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:99px;
 background:linear-gradient(90deg,var(--kelp),var(--gold));transition:width .4s}

.stage{flex:1;display:grid;grid-template-columns:1fr;gap:12px;min-height:0;padding:8px 0;overflow:hidden}
@media (min-aspect-ratio:1/1){ .stage{grid-template-columns:minmax(0,30%) minmax(0,70%);gap:20px} }
.listWrap{min-height:0;overflow-y:auto;scrollbar-width:thin}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:14px;cursor:pointer;
 background:rgba(0,0,0,.26);border:1px solid rgba(243,234,212,.14);transition:.15s;text-align:left}
.li:hover{background:rgba(0,0,0,.4)}
.li.on{background:var(--gold);color:#3A2705;border-color:var(--gold)}
.li .n{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13px;opacity:.75;min-width:24px}
.li .t{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;line-height:1.25}
.li .s{font-size:11px;opacity:.7}
.li .done{margin-left:auto;font-size:13px}

.readWrap{min-height:0;overflow-y:auto;padding-right:2px}
.card{border-radius:24px;padding:16px 18px;background:linear-gradient(165deg,#FFFDF7,#F1E6CC);
 color:#2A2008;border:4px solid rgba(255,255,255,.7);box-shadow:0 18px 42px rgba(0,0,0,.4)}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.head h2{font-family:'Fredoka',sans-serif;margin:0;font-size:clamp(18px,3.4vw,25px);color:#1E4D36}
.head .sub{font-size:12.5px;color:#8A7238}
.ar{font-family:'Amiri',serif;font-size:clamp(24px,4.6vw,38px);line-height:2;direction:rtl;
 text-align:right;color:#1E4D36;margin:10px 0}
.tl{font-size:clamp(12.5px,2.2vw,15px);font-style:italic;color:#7A6430;margin-bottom:6px}
.mean{font-size:clamp(13.5px,2.4vw,16px);line-height:1.55;color:#2A2008}
.mean .en{display:block;margin-top:4px;color:#6A5A2E;font-size:.93em}
.ayah{border-top:1px solid rgba(138,114,56,.22);padding-top:10px;margin-top:10px}
.ayah:first-of-type{border-top:0}
.lbl{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:#8A7238;margin-bottom:5px;font-weight:800}
.ayah .no{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
 background:#1E6E4C;color:#fff;font-size:11px;font-weight:800;margin-left:6px;vertical-align:middle}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding-top:8px}
.big{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;border-radius:999px;padding:11px 20px;
 cursor:pointer;background:rgba(243,234,212,.13);color:var(--bone);border:1px solid rgba(243,234,212,.24)}
.big.go{background:var(--gold);color:#3A2705;border-color:var(--gold)}
body.hasbar .controls{display:none}
.note{font-size:12px;color:rgba(255,253,247,.6);text-align:center;padding-top:6px;line-height:1.5}
.warn{background:rgba(226,180,85,.16);border:1px solid rgba(226,180,85,.4);border-radius:12px;
 padding:9px 12px;font-size:12.5px;line-height:1.5;margin-top:8px;color:#F3EAD4}
</style>
</head>
<body>
<div class="app">
 <div class="topbar">
  <div class="brand">Hafalan <span>Juz 30</span></div>
  <button class="icon" id="lang" title="Bahasa">ID</button>
  <button class="icon" id="sound" aria-pressed="true">🔊</button>
 </div>
 <div class="progress"><i id="bar"></i></div>
 <main class="stage">
  <div class="listWrap"><div class="list" id="list"></div></div>
  <div class="readWrap">
   <div class="card" id="card"></div>
   <div class="controls">
    <button class="big" id="prev">‹</button>
    <button class="big" id="play">▶ Dengar</button>
    <button class="big go" id="next">›</button>
   </div>
   <div class="note" id="note"></div>
  </div>
 </main>
</div>
<script>
/* ============================================================
   common.js  —  shared by every game in the super app
   Names, settings, navigation, credits.
   ============================================================ */
(function (global) {

  var DEFAULTS = {
    child: "Baim",        // the learner
    dad: "Papi Rifky",
    mum: "Mommy Keke",
    sib: "Ade Yahya",
    dadShort: "Papi",
    mumShort: "Mommy",
    childShort: "Baim",
    sibShort: "Ade"
  };

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem("super.names") || "{}");
      var out = {};
      for (var k in DEFAULTS) out[k] = (raw[k] && String(raw[k]).trim()) || DEFAULTS[k];
      return out;
    } catch (e) { return Object.assign({}, DEFAULTS); }
  }
  function save(n) {
    try { localStorage.setItem("super.names", JSON.stringify(n)); } catch (e) {}
    N = load();
  }
  var N = load();

  /* Replace the built-in family names anywhere they appear in text or speech.
     Longest first so "Papi Rifky" wins over "Papi". */
  var MAP = [
    ["Papi Rifky", "dad"], ["Mommy Keke", "mum"], ["Ade Yahya", "sib"],
    ["Rifky", "dadShort"], ["Keke", "mumShort"], ["Yahya", "sibShort"],
    ["Mommy", "mumShort"], ["Papi", "dadShort"], ["Baim", "child"]
  ];
  function P(s) {
    if (s == null) return s;
    s = String(s);
    for (var i = 0; i < MAP.length; i++) {
      var from = MAP[i][0], to = N[MAP[i][1]];
      if (to && to !== from) s = s.split(from).join(to);
    }
    return s;
  }

  /* short forms derived from a full name: "Papi Rifky" -> "Papi" */
  function shorten(full, fallback) {
    if (!full) return fallback;
    var bits = String(full).trim().split(/\s+/);
    return bits[0] || fallback;
  }

  var GAMES = [
    { id: "shalat", file: "shalat.html", icon: "\uD83E\uDDCE", en: "Prayer, step by step", idn: "Shalat",
      note: "92 steps with Arabic, meaning and audio", tone: "#1F6E4C" },
    { id: "doa", file: "doa.html", icon: "\uD83E\uDD32", en: "Everyday duas", idn: "Doa Harian",
      note: "20 duas for waking, eating and travelling", tone: "#0C556C" },
    { id: "juz30", file: "juz30.html", icon: "\uD83D\uDCD6", en: "Memorising Juz 30", idn: "Hafalan Juz 30",
      note: "37 surahs, listen and follow along", tone: "#7A4A22" },
    { id: "nabi", file: "nabi.html", icon: "\u2B50", en: "Stories of 25 prophets", idn: "Kisah 25 Nabi",
      note: "Who they were and what they teach us", tone: "#5A3E8A" },
    { id: "koleksi", file: "koleksi.html", icon: "\uD83C\uDFC5", en: "Progress", idn: "Pencapaian",
      note: "What has been learned, and how often", tone: "#8A3552" },
    { id: "periksa", file: "periksa.html", icon: "\uD83C\uDF9A\uFE0F", en: "Check the recitations", idn: "Periksa Rekaman",
      note: "Listen and correct any wrong file, for parents", tone: "#7A4A22" }
  ];

  var CREDITS = "Created with love and care by Papi Rifky and Mommy Keke " +
                "for beloved Abang Baim and Ade Yahya.";

  var CURRICULUM = [
    ["Arabic and Indonesian translation", "Kemenag rendering via the MIT licensed rioastamal/quran-json"],
    ["English translation and transliteration", "risan/quran-json, CC BY-SA 4.0"],
    ["Prayer steps, audio and postures", "learnsalah/learnsalah, MIT licence"],
    ["Dua audio", "Islami-fork/koleksi-doa-dzikir-audio, MIT licence"],
    ["Prophet illustrations", "Islami-fork/Kisah-25-Nabi (no licence stated, ask the author)"],
    ["Juz 30 recitation for children", "Murottal Anak Juz 30, Metode Ummi, archive.org"]
  ];

  /* a back button injected into any game page */
  function mountBack(title) {
    if (document.getElementById("superbar")) { if (title) document.title = P(title); return; }
    var a = document.createElement("a");
    a.href = "index.html";
    a.className = "super-back";
    a.setAttribute("aria-label", "Back to the menu");
    a.innerHTML = "\u2190";
    document.body.appendChild(a);
    var css = document.createElement("style");
    css.textContent =
      ".super-back{position:fixed;left:10px;bottom:10px;z-index:95;width:44px;height:44px;" +
      "border-radius:50%;display:grid;place-items:center;font-size:22px;text-decoration:none;" +
      "background:rgba(4,34,46,.72);color:#FFFBF2;border:1px solid rgba(247,233,204,.28);" +
      "box-shadow:0 6px 18px rgba(2,18,26,.45)}" +
      ".super-back:hover{background:rgba(4,34,46,.92)}" +
      "@media (min-aspect-ratio:1/1){.super-back{left:8px;bottom:8px;width:40px;height:40px}}";
    document.head.appendChild(css);
    if (title) document.title = P(title);
  }

  global.SUPER = {
    names: function () { return N; },
    defaults: DEFAULTS,
    save: save,
    reset: function () { try { localStorage.removeItem("super.names"); } catch (e) {} N = load(); },
    P: P,
    shorten: shorten,
    GAMES: GAMES,
    CREDITS: CREDITS,
    CURRICULUM: CURRICULUM,
    mountBack: mountBack
  };
})(window);

/* ============================================================
   PROGRESS: xp, grade bands, the zoo and the pets
   ============================================================ */
(function (global) {
  var S = global.SUPER;

  /* Thresholds assume roughly 40 answers a day. Early bands sit on level 1-2
     work (about 4 XP an answer), later bands on level 6+ work (about 18).
     Kindy A to Kindy B is around two weeks of real practice, not two days. */
  var GRADES = [
    { xp: 0,      id: "kindy-a", label: "Kindy A",         note: "getting started" },
    { xp: 2500,   id: "kindy-b", label: "Kindy B",         note: "letters, sounds, counting to 10" },
    { xp: 7000,   id: "prep",    label: "Preparatory",     note: "blending, first words, writing" },
    { xp: 15000,  id: "g1",      label: "Primary Grade 1", note: "reading sentences, adding and taking away" },
    { xp: 28000,  id: "g2",      label: "Primary Grade 2", note: "comprehension, groups of animals" },
    { xp: 46000,  id: "g3",      label: "Primary Grade 3", note: "reasoning, food webs, longer writing" },
    { xp: 70000,  id: "g4",      label: "Primary Grade 4", note: "science vocabulary, Latin names" },
    { xp: 100000, id: "g5",      label: "Primary Grade 5", note: "systems, ethics, history" },
    { xp: 140000, id: "g6",      label: "Primary Grade 6", note: "independent reading and writing" }
  ];

  /* 50 animals to collect. The cost rises steeply so the rare ones
     really are rare. Kangaroo and koala are the last two. */
  var ZOO = [
    ["ant","\uD83D\uDC1C","Ant","Semut",40],
    ["fish","\uD83D\uDC1F","Fish","Ikan",45],
    ["chicken","\uD83D\uDC13","Chicken","Ayam",55],
    ["duck","\uD83E\uDD86","Duck","Bebek",65],
    ["cat","\uD83D\uDC08","Cat","Kucing",75],
    ["dog","\uD83D\uDC15","Dog","Anjing",90],
    ["rabbit","\uD83D\uDC30","Rabbit","Kelinci",110],
    ["butterfly","\uD83E\uDD8B","Butterfly","Kupu-kupu",130],
    ["bee","\uD83D\uDC1D","Bee","Lebah",150],
    ["frog","\uD83D\uDC38","Frog","Katak",180],
    ["snail","\uD83D\uDC0C","Snail","Siput",210],
    ["cow","\uD83D\uDC04","Cow","Sapi",240],
    ["goat","\uD83D\uDC10","Goat","Kambing",290],
    ["horse","\uD83D\uDC0E","Horse","Kuda",340],
    ["sheep","\uD83D\uDC11","Sheep","Domba",400],
    ["bird","\uD83D\uDC26","Bird","Burung",470],
    ["owl","\uD83E\uDD89","Owl","Burung hantu",560],
    ["turtle","\uD83D\uDC22","Turtle","Penyu",650],
    ["crab","\uD83E\uDD80","Crab","Kepiting",770],
    ["shrimp","\uD83E\uDD90","Shrimp","Udang",910],
    ["squid","\uD83E\uDD91","Squid","Cumi",1050],
    ["octopus","\uD83D\uDC19","Octopus","Gurita",1250],
    ["snake","\uD83D\uDC0D","Snake","Ular",1500],
    ["lizard","\uD83E\uDD8E","Lizard","Kadal",1750],
    ["monkey","\uD83D\uDC12","Monkey","Monyet",2050],
    ["deer","\uD83E\uDD8C","Deer","Rusa",2450],
    ["fox","\uD83E\uDD8A","Fox","Rubah",2850],
    ["boar","\uD83D\uDC17","Wild boar","Babi hutan",3400],
    ["penguin","\uD83D\uDC27","Penguin","Penguin",4000],
    ["peacock","\uD83E\uDD9A","Peacock","Merak",4700],
    ["parrot","\uD83E\uDD9C","Parrot","Nuri",5550],
    ["eagle","\uD83E\uDD85","Eagle","Elang",6550],
    ["dolphin","\uD83D\uDC2C","Dolphin","Lumba-lumba",7700],
    ["shark","\uD83E\uDD88","Shark","Hiu",9100],
    ["whale","\uD83D\uDC0B","Whale","Paus",10500],
    ["crocodile","\uD83D\uDC0A","Crocodile","Buaya",12500],
    ["zebra","\uD83E\uDD93","Zebra","Zebra",15000],
    ["camel","\uD83D\uDC2A","Camel","Unta",17500],
    ["buffalo","\uD83D\uDC03","Buffalo","Kerbau",20500],
    ["hippo","\uD83E\uDD9B","Hippopotamus","Kuda nil",24500],
    ["rhino","\uD83E\uDD8F","Rhinoceros","Badak",28500],
    ["giraffe","\uD83E\uDD92","Giraffe","Jerapah",34000],
    ["elephant","\uD83D\uDC18","Elephant","Gajah",40000],
    ["gorilla","\uD83E\uDD8D","Gorilla","Gorila",47000],
    ["orangutan","\uD83E\uDDA7","Orangutan","Orangutan",55500],
    ["lion","\uD83E\uDD81","Lion","Singa",65500],
    ["tiger","\uD83D\uDC05","Tiger","Harimau",77000],
    ["panda","\uD83D\uDC3C","Giant panda","Panda",90500],
    ["kangaroo","\uD83E\uDD98","Kangaroo","Kanguru",107000],
    ["koala","\uD83D\uDC28","Koala","Koala",126000]
  ].map(function (r) { return { id: r[0], emo: r[1], en: r[2], idn: r[3], xp: r[4] }; });

  /* pets grow up as the xp goes in */
  var PETS = [
    { id: "cat", en: "Cat", idn: "Kucing", stages: [
      { emo: "\uD83D\uDC31", en: "Kitten", xp: 0 },
      { emo: "\uD83D\uDC08", en: "Young cat", xp: 450 },
      { emo: "\uD83D\uDC08\u200D\u2B1B", en: "Grown cat", xp: 1500 },
      { emo: "\uD83D\uDC06", en: "Big wild cat", xp: 3600 } ] },
    { id: "chick", en: "Chicken", idn: "Ayam", stages: [
      { emo: "\uD83E\uDD5A", en: "Egg", xp: 0 },
      { emo: "\uD83D\uDC23", en: "Hatching", xp: 270 },
      { emo: "\uD83D\uDC24", en: "Chick", xp: 780 },
      { emo: "\uD83D\uDC14", en: "Hen", xp: 1860 },
      { emo: "\uD83D\uDC13", en: "Rooster", xp: 4200 } ] },
    { id: "frog", en: "Frog", idn: "Katak", stages: [
      { emo: "\uD83E\uDEB1", en: "Eggs in the pond", xp: 0 },
      { emo: "\uD83D\uDC1B", en: "Tadpole", xp: 330 },
      { emo: "\uD83D\uDC38", en: "Young frog", xp: 1020 },
      { emo: "\uD83D\uDC0A", en: "Big pond friend", xp: 2700 } ] },
    { id: "tree", en: "Tree", idn: "Pohon", stages: [
      { emo: "\uD83C\uDF30", en: "Seed", xp: 0 },
      { emo: "\uD83C\uDF31", en: "Sprout", xp: 240 },
      { emo: "\uD83E\uDEB4", en: "Young tree", xp: 900 },
      { emo: "\uD83C\uDF33", en: "Big tree", xp: 2340 },
      { emo: "\uD83C\uDF33\uD83C\uDF3A", en: "Tree full of life", xp: 4800 } ] }
  ];

  function pget() {
    try { return JSON.parse(localStorage.getItem("super.progress") || "{}"); }
    catch (e) { return {}; }
  }
  function pset(o) { try { localStorage.setItem("super.progress", JSON.stringify(o)); } catch (e) {} }

  function addXp(game, n) {
    var p = pget();
    p.xp = (p.xp || 0) + n;
    p.games = p.games || {};
    p.games[game] = (p.games[game] || 0) + n;
    p.answers = (p.answers || 0) + 1;
    var today = new Date().toISOString().slice(0, 10);
    p.days = p.days || {};
    p.days[today] = (p.days[today] || 0) + n;
    pset(p);
    return p.xp;
  }
  function gradeFor(xp) {
    var g = GRADES[0];
    for (var i = 0; i < GRADES.length; i++) if (xp >= GRADES[i].xp) g = GRADES[i];
    return g;
  }
  function nextGrade(xp) {
    for (var i = 0; i < GRADES.length; i++) if (xp < GRADES[i].xp) return GRADES[i];
    return null;
  }
  function unlockedZoo(xp) { return ZOO.filter(function (z) { return xp >= z.xp; }); }
  function petStage(pet, xp) {
    var s = pet.stages[0];
    for (var i = 0; i < pet.stages.length; i++) if (xp >= pet.stages[i].xp) s = pet.stages[i];
    return s;
  }
  function stats() {
    var p = pget(), xp = p.xp || 0;
    return { xp: xp, answers: p.answers || 0, games: p.games || {}, days: p.days || {},
             grade: gradeFor(xp), next: nextGrade(xp),
             zoo: unlockedZoo(xp).length, zooTotal: ZOO.length };
  }


  /* ============================================================
     SCORING
     Research note: streaks help young learners, but rewards that
     pay for volume alone push guessing. So points are paid for
     QUALITY: first time right is worth full marks, a second try
     less than half, and a third barely anything. The streak only
     counts clean first-time answers, so it cannot be farmed.
     ============================================================ */
  var FOOD_COST = 25;      /* one feed */
  var FOOD_VALUE = 25;     /* how much the pet grows per feed */

  function award(game, o) {
    o = o || {};
    var level = o.level || 1, wrongs = o.wrongs || 0;
    /* difficulty is weighted, not linear: level 1 is worth 3, level 8 is worth 22.
       Easy levels can no longer be farmed to climb the grades. */
    var base = Math.round(2 + Math.pow(level, 1.55));
    var quality = wrongs === 0 ? 1 : (wrongs === 1 ? 0.45 : 0.2);
    if (o.partial != null) quality *= Math.max(0.15, Math.min(1, o.partial));
    var p = pget();
    var streak = wrongs === 0 ? (p.streak || 0) + 1 : 0;
    var mult = 1 + Math.min(10, streak) * 0.06;          /* caps at 1.6x */
    var xp = Math.max(1, Math.round(base * quality * mult));
    p.streak = streak;
    p.best = Math.max(p.best || 0, streak);
    p.food = (p.food || 0) + Math.max(1, Math.round(xp / 3));
    p.xp = (p.xp || 0) + xp;
    p.games = p.games || {};
    p.games[game] = (p.games[game] || 0) + xp;
    p.answers = (p.answers || 0) + 1;
    if (wrongs === 0) p.clean = (p.clean || 0) + 1;
    var today = new Date().toISOString().slice(0, 10);
    p.days = p.days || {};
    p.days[today] = (p.days[today] || 0) + xp;
    pset(p);
    return { xp: xp, streak: streak, mult: mult, food: p.food, total: p.xp };
  }
  function food() { return pget().food || 0; }
  function streakNow() { return pget().streak || 0; }
  function petFed(id) { var p = pget(); return (p.fed || {})[id] || 0; }
  function feed(id) {
    var p = pget();
    if ((p.food || 0) < FOOD_COST) return null;
    p.food -= FOOD_COST;
    p.fed = p.fed || {};
    p.fed[id] = (p.fed[id] || 0) + FOOD_VALUE;
    pset(p);
    return { food: p.food, fed: p.fed[id] };
  }
  function stageOf(pet) {
    var f = petFed(pet.id), s = pet.stages[0];
    for (var i = 0; i < pet.stages.length; i++) if (f >= pet.stages[i].xp) s = pet.stages[i];
    return s;
  }

  /* ============================================================
     THE STRIP  —  a Touch Bar style row of live, contextual keys
     ============================================================ */
  function mountBar(actions) {
    try { noteVisit((location.pathname.split("/").pop() || "index.html")); } catch (e) {}
    if (document.getElementById("superbar")) return;
    var css = document.createElement("style");
    css.textContent =
     "#superbar{position:fixed;left:0;right:0;bottom:0;z-index:96;display:flex;align-items:center;gap:6px;" +

     "border-top:1px solid rgba(247,233,204,.18);backdrop-filter:blur(8px);overflow-x:auto;scrollbar-width:none}" +
     "#superbar::-webkit-scrollbar{display:none}" +
     "#superbar .k{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:12px;" +
     "background:rgba(247,233,204,.10);border:1px solid rgba(247,233,204,.18);color:#FFFBF2;cursor:pointer;" +
     "font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:14px;white-space:nowrap;transition:.15s}" +
     "#superbar .k:hover{background:rgba(247,233,204,.2)}#superbar .k:active{transform:scale(.95)}" +
     "#superbar .k.stat{cursor:default;background:rgba(6,20,28,.5)}" +
     "#superbar .k .em{font-size:17px}" +
     "#superbar .k.hot{background:linear-gradient(180deg,#FFB247,#E58A2C);color:#40230A;border-color:#FFB247}" +

  var barActions = [];

            (sk >= 3 ? "\uD83D\uDD25" : "\u26A1") + '</span><span>' + sk + '</span></div>';
    html += '<div class="k stat" title="Total XP"><span class="em">\u2B50</span><span>' + st.xp + "</span></div>";
    html += '<a class="k" href="../koleksi.html" title="Zoo, pets and progress"><span class="em">' +
            stage.emo + '</span><span>\uD83C\uDF3D ' + fd + "</span></a>";
    bar.innerHTML = html;
    var setBtn = bar.querySelector("#sbSet");
    if (setBtn) setBtn.addEventListener("click", function () { openSettings(); });

      b.addEventListener("click", function () {
        var a = barActions[Number(b.dataset.i)];

  function flyXp(n, streak) {
    var bar = document.getElementById("superbar");

    g.style.right = "18px";
    g.style.bottom = "60px";

  /* ============================================================
     SETTINGS, available from every page in the app
     ============================================================ */
  function openSettings() {
    if (document.getElementById("supersheet")) {
      document.getElementById("supersheet").classList.add("on");
      fillSettings(); return;
    }
    var css = document.createElement("style");
    css.textContent =
     "#supersheet{position:fixed;inset:0;z-index:120;background:rgba(3,16,22,.95);display:none;" +
     "overflow-y:auto;padding:18px;font-family:Nunito,system-ui,sans-serif}" +
     "#supersheet.on{display:block}" +
     "#supersheet .pn{background:#0B3C4E;border:1px solid rgba(247,233,204,.2);border-radius:22px;" +
     "padding:20px;max-width:640px;margin:0 auto;color:#FFFBF2}" +
     "#supersheet h2{font-family:Fredoka,sans-serif;margin:0 0 4px;font-size:21px;color:#F7E9CC}" +
     "#supersheet h3{font-family:Fredoka,sans-serif;margin:16px 0 6px;font-size:15px;color:#FFB247}" +
     "#supersheet p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:rgba(255,251,242,.82)}" +
     "#supersheet label{display:block;font-size:12px;color:rgba(255,251,242,.7);margin:9px 0 4px}" +
     "#supersheet input{width:100%;padding:11px 13px;border-radius:12px;font-size:15px;font-family:inherit;" +
     "background:rgba(4,34,46,.6);color:#FFFBF2;border:1px solid rgba(247,233,204,.25)}" +
     "#supersheet .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}" +
     "#supersheet ul{font-size:12.5px;line-height:1.6;padding-left:16px;margin:0;color:rgba(255,251,242,.78)}" +
     "#supersheet li{margin-bottom:5px}#supersheet li b{color:#F7E9CC}" +
     "#supersheet .luv{background:rgba(255,178,71,.13);border:1px solid rgba(255,178,71,.35);" +
     "border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.6;text-align:center}" +
     "#supersheet .rw{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}" +
     "#supersheet button{font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;border-radius:999px;" +
     "padding:11px 20px;cursor:pointer;background:rgba(247,233,204,.13);color:#FFFBF2;" +
     "border:1px solid rgba(247,233,204,.24)}" +
     "#supersheet button.go{background:#FFB247;color:#40230A;border-color:#FFB247}";
    document.head.appendChild(css);
    var sh = document.createElement("div");
    sh.id = "supersheet";
    sh.innerHTML =
     '<div class="pn">' +
      '<h2>Settings</h2>' +
      '<p>Change the names and the whole app follows: every prompt, every bit of praise, every voice.</p>' +
      '<label for="sxChild">Who is learning?</label><input id="sxChild" type="text" autocomplete="off">' +
      '<div class="two"><div><label for="sxDad">Father</label><input id="sxDad" type="text" autocomplete="off"></div>' +
      '<div><label for="sxMum">Mother</label><input id="sxMum" type="text" autocomplete="off"></div></div>' +
      '<label for="sxSib">Brother or sister</label><input id="sxSib" type="text" autocomplete="off">' +
      '<h3>Suara</h3><div id="sxVoice" class="luv" style="text-align:left"></div>' +
      '<h3>Built on</h3><ul id="sxRefs"></ul>' +
      '<h3>With love</h3><div class="luv" id="sxLove"></div>' +
      '<div class="rw">' +
       '<button class="go" id="sxSave">Save</button>' +
       '<button id="sxReset">Reset names</button>' +
       '<a href="index.html" style="text-decoration:none"><button>\uD83C\uDFE0 Home</button></a>' +
       '<button id="sxClose">Close</button>' +
      '</div></div>';
    document.body.appendChild(sh);
    sh.addEventListener("click", function (e) { if (e.target.id === "supersheet") sh.classList.remove("on"); });
    document.getElementById("sxClose").onclick = function () { sh.classList.remove("on"); };
    document.getElementById("sxReset").onclick = function () { S.reset(); fillSettings(); };
    document.getElementById("sxSave").onclick = function () {
      var D = S.defaults;
      var c = document.getElementById("sxChild").value.trim() || D.child;
      var d = document.getElementById("sxDad").value.trim() || D.dad;
      var m = document.getElementById("sxMum").value.trim() || D.mum;
      var b = document.getElementById("sxSib").value.trim() || D.sib;
      S.save({ child: c, dad: d, mum: m, sib: b,
             childShort: S.shorten(c, c), dadShort: S.shorten(d, "Papi"),
             mumShort: S.shorten(m, "Mommy"), sibShort: S.shorten(b, "Ade") });
      sh.classList.remove("on");
      location.reload();
    };
    sh.classList.add("on");
    fillSettings();
  }
  function fillSettings() {
    var n = S.names();
    document.getElementById("sxChild").value = n.child;
    document.getElementById("sxDad").value = n.dad;
    document.getElementById("sxMum").value = n.mum;
    document.getElementById("sxSib").value = n.sib;
    var vb = document.getElementById("sxVoice");
    if (vb) {
      pickTalk();
      var v = S.say.voices();
      if (v.id) {
        vb.innerHTML = "Suara Indonesia siap: <b>" + v.id.name + "</b> (" + v.id.lang + ").";
      } else {
        vb.innerHTML = "<b>Belum ada suara Indonesia di perangkat ini.</b><br>" +
          "Teks Indonesia akan dibacakan suara Inggris dengan ejaan yang disesuaikan, " +
          "jadi bunyinya mendekati tapi tidak sempurna.<br><br>" +
          "iPad: Settings, Accessibility, Spoken Content, Voices, tambahkan Bahasa Indonesia.<br>" +
          "Android: Settings, Sistem, Bahasa, Text-to-speech, unduh Bahasa Indonesia.<br><br>" +
          "<span style='opacity:.75;font-size:12px'>Suara yang terdeteksi: " +
          (v.all && v.all.length ? v.all.slice(0, 8).map(function (x) {
            return x.name + " (" + x.lang + ")"; }).join(", ") : "belum dimuat") + "</span>";
      }
    }
    document.getElementById("sxRefs").innerHTML = S.CURRICULUM
      .map(function (r) { return "<li><b>" + r[0] + "</b> — " + r[1] + "</li>"; }).join("");
    document.getElementById("sxLove").innerHTML =
      "Created with love and care by <b>" + n.dad + "</b> and <b>" + n.mum +
      "</b><br>for beloved <b>" + n.child + "</b> and <b>" + n.sib + "</b>.";
  }
  S.settings = { open: openSettings };


  /* ============================================================
     VISITS
     Two different questions, two different answers:

     1. "How much has my child used this?"  -> kept on the device.
        Private, works offline, never leaves the iPad.
     2. "How many people opened my site?"   -> needs a server.
        Set COUNTER_URL below and it lights up. Left blank it stays
        quiet and nothing is ever sent anywhere.
     ============================================================ */
  var COUNTER_URL = "";   /* e.g. "https://your-worker.workers.dev/hit" */

  function vget() {
    try { return JSON.parse(localStorage.getItem("super.visits") || "{}"); }
    catch (e) { return {}; }
  }
  function vset(o) { try { localStorage.setItem("super.visits", JSON.stringify(o)); } catch (e) {} }

  function noteVisit(page) {
    var v = vget(), now = Date.now();
    var today = new Date().toISOString().slice(0, 10);
    var who = S.names().child || "child";
    if (!v.first) { v.first = today; v.player = who; }
    /* a new session is any gap of more than 30 minutes */
    if (!v.last || now - v.last > 30 * 60 * 1000) v.sessions = (v.sessions || 0) + 1;
    v.last = now;
    v.dayList = v.dayList || [];
    if (v.dayList.indexOf(today) < 0) v.dayList.push(today);
    v.opens = v.opens || {};
    if (page) v.opens[page] = (v.opens[page] || 0) + 1;
    /* names that have used this copy, so a shared iPad shows more than one player */
    v.players = v.players || [];
    if (v.players.indexOf(who) < 0) v.players.push(who);
    vset(v);
    return v;
  }
  function visitStats() {
    var v = vget();
    var days = (v.dayList || []).length;
    var streak = 0;
    if (days) {
      var d = new Date(), i = 0;
      for (;;) {
        var key = new Date(d.getTime() - i * 86400000).toISOString().slice(0, 10);
        if ((v.dayList || []).indexOf(key) >= 0) { streak++; i++; }
        else if (i === 0) { i++; }          /* today may not have happened yet */
        else break;
        if (i > 400) break;
      }
    }
    return { sessions: v.sessions || 0, days: days, streak: streak,
             first: v.first || null, opens: v.opens || {},
             players: v.players || [] };
  }
  /* optional global count. Fails quietly, never blocks the page. */
  function globalCount(cb) {
    if (!COUNTER_URL) { cb(null); return; }
    var once = "super.counted." + new Date().toISOString().slice(0, 10);
    var already = false;
    try { already = !!sessionStorage.getItem(once); } catch (e) {}
    var url = COUNTER_URL + (already ? (COUNTER_URL.indexOf("?") < 0 ? "?peek=1" : "&peek=1") : "");
    try {
      fetch(url, { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          try { sessionStorage.setItem(once, "1"); } catch (e) {}
          cb(j && (j.count != null ? j.count : (j.value != null ? j.value : null)));
        })
        .catch(function () { cb(null); });
    } catch (e) { cb(null); }
  }

  S.visits = { note: noteVisit, stats: visitStats, global: globalCount,
               url: function (u) { COUNTER_URL = u || ""; },
               reset: function () { vset({}); } };


  /* ============================================================
     RECITATION FIXES
     If a file in the archive turns out to hold a different surah
     than its name claims, the parent can remap it here without
     touching any code. Saved on the device.
     ============================================================ */
  function fixGet(){ try{ return JSON.parse(localStorage.getItem("juz.fix")||"{}"); }catch(e){ return {}; } }
  function fixSet(o){ try{ localStorage.setItem("juz.fix", JSON.stringify(o)); }catch(e){} }
  function fixFor(n, fallback){ var f=fixGet(); return f[String(n)] || fallback; }
  function fixPut(n, file){ var f=fixGet(); if(file) f[String(n)]=file; else delete f[String(n)]; fixSet(f); }
  S.juzfix = { get: fixGet, set: fixSet, for: fixFor, put: fixPut,
               clear: function(){ fixSet({}); } };

  /* ============================================================
     SAY IT OUT LOUD
     He cannot read yet, so every screen announces itself: which
     dua, which prophet, which prayer and which step.
     ============================================================ */
  var vID = null, vEN = null, voiceList = [];

  /* Indonesian voices do not all report the same locale code. Android and
     anything built on old Java report "in-ID", because "in" was the original
     ISO code for Indonesian. Chrome reports "id-ID", some report bare "id".
     Matching only /^id[-_]/ missed them, the voice fell back to English, and
     Indonesian text came out with an English accent. */
  function isIndonesian(v){
    var lang = String(v.lang || "").toLowerCase().replace("_", "-");
    var name = String(v.name || "").toLowerCase();
    if (lang === "id" || lang === "in") return true;
    if (lang.indexOf("id-") === 0 || lang.indexOf("in-") === 0) return true;
    if (lang.indexOf("ind") === 0) return true;
    return /indonesia|bahasa|damayanti|andika|gadis|reza/.test(name);
  }
  function isEnglish(v){
    var lang = String(v.lang || "").toLowerCase();
    return lang.indexOf("en") === 0;
  }
  function pickTalk(){
    if(!("speechSynthesis" in window)) return;
    voiceList = speechSynthesis.getVoices() || [];
    vID = voiceList.filter(isIndonesian)[0] || null;
    vEN = voiceList.filter(isEnglish)[0] || null;
  }
  if("speechSynthesis" in window){
    pickTalk();
    speechSynthesis.addEventListener("voiceschanged", pickTalk);
    setTimeout(pickTalk, 500); setTimeout(pickTalk, 1500); setTimeout(pickTalk, 3000);
  }

  /* If there really is no Indonesian voice on the device, an English voice
     reading Indonesian sounds wrong and teaches nothing. Respell it so the
     English voice at least lands near the right sounds. Indonesian spelling is
     regular, so this is a small, honest mapping. */
  function respell(text){
    var V = { a:"ah", e:"eh", i:"ee", o:"oh", u:"oo" };
    return String(text).split(/(\s+)/).map(function(w){
      if(!/[a-zA-Z]/.test(w)) return w;
      var upper = /^[A-Z]/.test(w);
      var t = w.toLowerCase();
      /* consonants first, then every vowel in ONE pass so the letters we
         insert are never re-processed */
      t = t.replace(/sy/g, "sh").replace(/c/g, "ch");
      t = t.replace(/[aeiou]/g, function(m){ return V[m]; });
      return upper ? t.charAt(0).toUpperCase() + t.slice(1) : t;
    }).join("");
  }
  function haveIndonesian(){ return !!vID; }

  var lastSaid = "", lastAt = 0, spokeCount = 0, lastError = null, fallbackCount = 0;
  function voicesReady(){
    /* Android reports an empty list until the engine wakes up. Deciding too
       early meant falling back to English on the very first tap. */
    return new Promise(function(res){
      pickTalk();
      if(voiceList.length) return res();
      var tries = 0;
      var iv = setInterval(function(){
        pickTalk(); tries++;
        if(voiceList.length || tries > 12){ clearInterval(iv); res(); }
      }, 120);
    });
  }
  function announce(text, opts){
    opts = opts || {};
    if(!text) return Promise.resolve();
    return voicesReady().then(function(){ return speakNow(text, opts); });
  }
  function speakNow(text, opts){
    var now = Date.now();
    if(text === lastSaid && now - lastAt < 1500) return Promise.resolve();
    lastSaid = text; lastAt = now;
    return new Promise(function(res){
      if(!("speechSynthesis" in window)){ res(); return; }
      try{
        speechSynthesis.cancel();
        var en = opts.lang === "en";
        var body = S.P(text);
        var usedFallback = false;
        if(!en && !vID){
          /* No Indonesian voice on this device. Keep the Indonesian words,
             respelled so an English voice lands near the right sounds.
             Never swap in an English translation: the language being taught
             must not change just because a voice is missing. */
          body = respell(body);
          en = true;
          usedFallback = true;
        }
        var u = new SpeechSynthesisUtterance(body);
        u.lang = en ? "en-GB" : "id-ID";
        u.voice = en ? vEN : vID;
        u.rate = opts.rate || 0.86;
        u.pitch = 1.05;
        u.volume = 1;
        u.onend = res; u.onerror = res;
        speechSynthesis.speak(u);
        spokeCount++;
        if(usedFallback) fallbackCount++;
        setTimeout(res, Math.max(2500, String(body).length * 95));
      }catch(e){
        /* this used to fail silently, which is how a scope bug hid for a
           whole round. Say so out loud in the console. */
        lastError = String(e && e.message || e);
        if (window.console && console.warn) console.warn("SUPER.say failed:", lastError);
        res();
      }
    });
  }

  S.say = { it: announce, stop: function(){ try{ speechSynthesis.cancel(); }catch(e){} },
            voices: function(){ return { id: vID, en: vEN, all: voiceList }; },
            haveIndonesian: haveIndonesian, respell: respell,
            count: function(){ return spokeCount; }, error: function(){ return lastError; },
            usedFallback: function(){ return fallbackCount > 0; },
            isIndonesian: isIndonesian, refresh: pickTalk };

  S.score = { award: award, food: food, streak: streakNow, feed: feed,
              stageOf: stageOf, petFed: petFed, FOOD_COST: FOOD_COST };
  S.bar = { mount: mountBar, render: renderBar, fly: flyXp,
            set: function (a) { barActions = a || []; renderBar(); } };

  S.GRADES = GRADES; S.ZOO = ZOO; S.PETS = PETS;
  S.xp = { add: addXp, stats: stats, award: award, gradeFor: gradeFor, nextGrade: nextGrade,
           unlockedZoo: unlockedZoo, petStage: petStage,
           reset: function () { pset({}); } };
})(window);

const JUZ30={"78":{"n":78,"name":"النبأ","latin":"An-Naba'","ayat":40,"en_name":"The Tidings","type":"meccan","ar":["عَمَّ يَتَسَاۤءَلُوْنَۚ ","عَنِ النَّبَاِ الْعَظِيْمِۙ ","الَّذِيْ هُمْ فِيْهِ مُخْتَلِفُوْنَۗ ","كَلَّا سَيَعْلَمُوْنَۙ ","ثُمَّ كَلَّا سَيَعْلَمُوْنَ","اَلَمْ نَجْعَلِ الْاَرْضَ مِهٰدًاۙ","وَّالْجِبَالَ اَوْتَادًاۖ","وَّخَلَقْنٰكُمْ اَزْوَاجًاۙ ","وَّجَعَلْنَا نَوْمَكُمْ سُبَاتًاۙ ","وَّجَعَلْنَا الَّيْلَ لِبَاسًاۙ ","وَّجَعَلْنَا النَّهَارَ مَعَاشًاۚ","وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًاۙ ","وَّجَعَلْنَا سِرَاجًا وَّهَّاجًاۖ","وَّاَنْزَلْنَا مِنَ الْمُعْصِرٰتِ مَاۤءً ثَجَّاجًاۙ","لِّنُخْرِجَ بِهٖ حَبًّا وَّنَبَاتًاۙ","وَّجَنّٰتٍ اَلْفَافًاۗ","اِنَّ يَوْمَ الْفَصْلِ كَانَ مِيْقَاتًاۙ","يَّوْمَ يُنْفَخُ فِى الصُّوْرِ فَتَأْتُوْنَ اَفْوَاجًاۙ","وَّفُتِحَتِ السَّمَاۤءُ فَكَانَتْ اَبْوَابًاۙ","وَّسُيِّرَتِ الْجِبَالُ فَكَانَتْ سَرَابًاۗ","اِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًاۙ","لِّلطّٰغِيْنَ مَاٰبًاۙ","لّٰبِثِيْنَ فِيْهَآ اَحْقَابًاۚ","لَا يَذُوْقُوْنَ فِيْهَا بَرْدًا وَّلَا شَرَابًاۙ","اِلَّا حَمِيْمًا وَّغَسَّاقًاۙ","جَزَاۤءً وِّفَاقًاۗ","اِنَّهُمْ كَانُوْا لَا يَرْجُوْنَ حِسَابًاۙ","وَّكَذَّبُوْا بِاٰيٰتِنَا كِذَّابًاۗ","وَكُلَّ شَيْءٍ اَحْصَيْنٰهُ كِتٰبًاۙ","فَذُوْقُوْا فَلَنْ نَّزِيْدَكُمْ اِلَّا عَذَابًا ࣖ","اِنَّ لِلْمُتَّقِيْنَ مَفَازًاۙ","حَدَاۤىِٕقَ وَاَعْنَابًاۙ","وَّكَوَاعِبَ اَتْرَابًاۙ","وَّكَأْسًا دِهَاقًاۗ","لَا يَسْمَعُوْنَ فِيْهَا لَغْوًا وَّلَا كِذَّابًا","جَزَاۤءً مِّنْ رَّبِّكَ عَطَاۤءً حِسَابًاۙ","رَّبِّ السَّمٰوٰتِ وَالْاَرْضِ وَمَا بَيْنَهُمَا الرَّحْمٰنِ لَا يَمْلِكُوْنَ مِنْهُ خِطَابًاۚ ","يَوْمَ يَقُوْمُ الرُّوْحُ وَالْمَلٰۤىِٕكَةُ صَفًّاۙ  لَّا يَتَكَلَّمُوْنَ اِلَّا مَنْ اَذِنَ لَهُ الرَّحْمٰنُ وَقَالَ صَوَابًا","ذٰلِكَ الْيَوْمُ الْحَقُّۚ فَمَنْ شَاۤءَ اتَّخَذَ اِلٰى رَبِّهٖ مَاٰبًا","اِنَّآ اَنْذَرْنٰكُمْ عَذَابًا قَرِيْبًا ەۙ يَّوْمَ يَنْظُرُ الْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُوْلُ الْكٰفِرُ يٰلَيْتَنِيْ كُنْتُ تُرَابًا ࣖ"],"id":["Tentang apakah mereka saling bertanya-tanya?","Tentang berita yang besar (hari kebangkitan),","yang dalam hal itu mereka berselisih.","Tidak! Kelak mereka akan mengetahui,","sekali lagi tidak! Kelak mereka akan mengetahui. ","Bukankah Kami telah menjadikan bumi sebagai hamparan, ","dan gunung-gunung sebagai pasak?","Dan Kami menciptakan kamu berpasang-pasangan,","dan Kami menjadikan tidurmu untuk istirahat,","dan Kami menjadikan malam sebagai pakaian,","dan Kami menjadikan siang untuk mencari penghidupan,","dan Kami membangun di atas kamu tujuh (langit) yang kokoh,","dan Kami menjadikan pelita yang terang-benderang (matahari),","dan Kami turunkan dari awan, air hujan yang tercurah dengan hebatnya,","untuk Kami tumbuhkan dengan air itu biji-bijian dan tanam-tanaman,","dan kebun-kebun yang rindang.","Sungguh, hari keputusan adalah suatu waktu yang telah ditetapkan,","(yaitu) pada hari (ketika) sangkakala ditiup, lalu kamu datang berbondong-bondong,","dan langit pun dibukalah, maka terdapatlah beberapa pintu,","dan gunung-gunung pun dijalankan sehingga menjadi fatamorgana.","Sungguh, (neraka) Jahanam itu (sebagai) tempat mengintai (bagi penjaga yang mengawasi isi neraka), ","menjadi tempat kembali bagi orang-orang yang melampaui batas.","Mereka tinggal di sana dalam masa yang lama,","mereka tidak merasakan kesejukan di dalamnya dan tidak (pula mendapat) minuman,","selain air yang mendidih dan nanah,","sebagai pembalasan yang setimpal.","Sesungguhnya dahulu mereka tidak pernah mengharapkan perhitungan.","Dan mereka benar-benar mendustakan ayat-ayat Kami.","Dan segala sesuatu telah Kami catat dalam suatu Kitab (buku catatan amalan manusia). ","Maka karena itu rasakanlah! Maka tidak ada yang akan Kami tambahkan kepadamu selain azab.","Sungguh, orang-orang yang bertakwa mendapat kemenangan,","(yaitu) kebun-kebun dan buah anggur,","dan gadis-gadis montok yang sebaya,","dan gelas-gelas yang penuh (berisi minuman).","Di sana mereka tidak mendengar percakapan yang sia-sia maupun (perkataan) dusta.","Sebagai balasan dan pemberian yang cukup banyak dari Tuhanmu,","Tuhan (yang memelihara) langit dan bumi dan apa yang ada di antara keduanya; Yang Maha Pengasih, mereka tidak mampu berbicara dengan Dia.","Pada hari, ketika ruh dan para malaikat berdiri bersaf-saf, mereka tidak berkata-kata, kecuali siapa yang telah diberi izin kepadanya oleh Tuhan Yang Maha Pengasih dan dia hanya mengatakan yang benar.","Itulah hari yang pasti terjadi. Maka barang siapa menghendaki, niscaya dia menempuh jalan kembali kepada Tuhannya.","Sesungguhnya Kami telah memperingatkan kepadamu (orang kafir) azab yang dekat, pada hari manusia melihat apa yang telah diperbuat oleh kedua tangannya; dan orang kafir berkata, “Alangkah baiknya seandainya dahulu aku jadi tanah.”"],"en":["About what are they asking one another","About the great news","That over which they are in disagreement","No! They are going to know","Then, no! They are going to know","Have We not made the earth a resting place","And the mountains as stakes","And We created you in pairs","And made your sleep [a means for] rest","And made the night as clothing","And made the day for livelihood","And constructed above you seven strong [heavens]","And made [therein] a burning lamp","And sent down, from the rain clouds, pouring water","That We may bring forth thereby grain and vegetation","And gardens of entwined growth","Indeed, the Day of Judgement is an appointed time","The Day the Horn is blown and you will come forth in multitudes","And the heaven is opened and will become gateways","And the mountains are removed and will be [but] a mirage","Indeed, Hell has been lying in wait","For the transgressors, a place of return","In which they will remain for ages [unending]","They will not taste therein [any] coolness or drink","Except scalding water and [foul] purulence","An appropriate recompense","Indeed, they were not expecting an account","And denied Our verses with [emphatic] denial","But all things We have enumerated in writing","So taste [the penalty], and never will We increase you except in torment","Indeed, for the righteous is attainment","Gardens and grapevines","And full-breasted [companions] of equal age","And a full cup","No ill speech will they hear therein or any falsehood","[As] reward from your Lord, [a generous] gift [made due by] account","[From] the Lord of the heavens and the earth and whatever is between them, the Most Merciful. They possess not from Him [authority for] speech","The Day that the Spirit and the angels will stand in rows, they will not speak except for one whom the Most Merciful permits, and he will say what is correct","That is the True Day; so he who wills may take to his Lord a [way of] return","Indeed, We have warned you of a near punishment on the Day when a man will observe what his hands have put forth and the disbeliever will say, \"Oh, I wish that I were dust"],"tl":["AAamma yatasaaloona","AAani alnnabai alAAatheemi","Allathee hum feehi mukhtalifoona","Kalla sayaAAlamoona","Thumma kalla sayaAAlamoona","Alam najAAali alarda mihadan","Waaljibala awtadan","Wakhalaqnakum azwajan","WajaAAalna nawmakum subatan","WajaAAalna allayla libasan","WajaAAalna alnnahara maAAashan","Wabanayna fawqakum sabAAan shidadan","WajaAAalna sirajan wahhajan","Waanzalna mina almuAAsirati maan thajjajan","Linukhrija bihi habban wanabatan","Wajannatin alfafan","Inna yawma alfasli kana meeqatan","Yawma yunfakhu fee alssoori fatatoona afwajan","Wafutihati alssamao fakanat abwaban","Wasuyyirati aljibalu fakanat saraban","Inna jahannama kanat mirsadan","Lilttagheena maaban","Labitheena feeha ahqaban","La yathooqoona feeha bardan wala sharaban","Illa hameeman waghassaqan","Jazaan wifaqan","Innahum kanoo la yarjoona hisaban","Wakaththaboo biayatina kiththaban","Wakulla shayin ahsaynahu kitaban","Fathooqoo falan nazeedakum illa AAathaban","Inna lilmuttaqeena mafazan","Hadaiqa waaAAnaban","WakawaAAiba atraban","Wakasan dihaqan","La yasmaAAoona feeha laghwan wala kiththaban","Jazaan min rabbika AAataan hisaban","Rabbi alssamawati waalardi wama baynahuma alrrahmani la yamlikoona minhu khitaban","Yawma yaqoomu alrroohu waalmalaikatu saffan la yatakallamoona illa man athina lahu alrrahmanu waqala sawaban","Thalika alyawmu alhaqqu faman shaa ittakhatha ila rabbihi maaban","Inna antharnakum AAathaban qareeban yawma yanthuru almaro ma qaddamat yadahu wayaqoolu alkafiru ya laytanee kuntu turaban"]},"79":{"n":79,"name":"النّٰزعٰت","latin":"An-Nazi'at","ayat":46,"en_name":"Those who drag forth","type":"meccan","ar":["وَالنّٰزِعٰتِ غَرْقًاۙ","وَّالنّٰشِطٰتِ نَشْطًاۙ","وَّالسّٰبِحٰتِ سَبْحًاۙ","فَالسّٰبِقٰتِ سَبْقًاۙ","فَالْمُدَبِّرٰتِ اَمْرًاۘ","يَوْمَ تَرْجُفُ الرَّاجِفَةُۙ","تَتْبَعُهَا الرَّادِفَةُ ۗ","قُلُوْبٌ يَّوْمَىِٕذٍ وَّاجِفَةٌۙ","اَبْصَارُهَا خَاشِعَةٌ  ۘ","يَقُوْلُوْنَ ءَاِنَّا لَمَرْدُوْدُوْنَ فِى الْحَافِرَةِۗ","ءَاِذَا كُنَّا عِظَامًا نَّخِرَةً ۗ","قَالُوْا تِلْكَ اِذًا كَرَّةٌ خَاسِرَةٌ  ۘ","فَاِنَّمَا هِيَ زَجْرَةٌ وَّاحِدَةٌۙ","فَاِذَا هُمْ بِالسَّاهِرَةِۗ","هَلْ اَتٰىكَ حَدِيْثُ مُوْسٰىۘ","اِذْ نَادٰىهُ رَبُّهٗ بِالْوَادِ الْمُقَدَّسِ طُوًىۚ","اِذْهَبْ اِلٰى فِرْعَوْنَ اِنَّهٗ طَغٰىۖ","فَقُلْ هَلْ لَّكَ اِلٰٓى اَنْ تَزَكّٰىۙ","وَاَهْدِيَكَ اِلٰى رَبِّكَ فَتَخْشٰىۚ","فَاَرٰىهُ الْاٰيَةَ الْكُبْرٰىۖ","فَكَذَّبَ وَعَصٰىۖ","ثُمَّ اَدْبَرَ يَسْعٰىۖ","فَحَشَرَ فَنَادٰىۖ","فَقَالَ اَنَا۠ رَبُّكُمُ الْاَعْلٰىۖ","فَاَخَذَهُ اللّٰهُ نَكَالَ الْاٰخِرَةِ وَالْاُوْلٰىۗ","اِنَّ فِيْ ذٰلِكَ لَعِبْرَةً لِّمَنْ يَّخْشٰى ۗ ࣖ","ءَاَنْتُمْ اَشَدُّ خَلْقًا اَمِ السَّمَاۤءُ ۚ بَنٰىهَاۗ","رَفَعَ سَمْكَهَا فَسَوّٰىهَاۙ","وَاَغْطَشَ لَيْلَهَا وَاَخْرَجَ ضُحٰىهَاۖ","وَالْاَرْضَ بَعْدَ ذٰلِكَ دَحٰىهَاۗ","اَخْرَجَ مِنْهَا مَاۤءَهَا وَمَرْعٰىهَاۖ","وَالْجِبَالَ اَرْسٰىهَاۙ","مَتَاعًا لَّكُمْ وَلِاَنْعَامِكُمْۗ","فَاِذَا جَاۤءَتِ الطَّاۤمَّةُ الْكُبْرٰىۖ","يَوْمَ يَتَذَكَّرُ الْاِنْسَانُ مَا سَعٰىۙ","وَبُرِّزَتِ الْجَحِيْمُ لِمَنْ يَّرٰى","فَاَمَّا مَنْ طَغٰىۖ","وَاٰثَرَ الْحَيٰوةَ الدُّنْيَاۙ","فَاِنَّ الْجَحِيْمَ هِيَ الْمَأْوٰىۗ","وَاَمَّا مَنْ خَافَ مَقَامَ رَبِّهٖ وَنَهَى النَّفْسَ عَنِ الْهَوٰىۙ","فَاِنَّ الْجَنَّةَ هِيَ الْمَأْوٰىۗ","يَسْـَٔلُوْنَكَ عَنِ السَّاعَةِ اَيَّانَ مُرْسٰىهَاۗ","فِيْمَ اَنْتَ مِنْ ذِكْرٰىهَاۗ","اِلٰى رَبِّكَ مُنْتَهٰىهَاۗ","اِنَّمَآ اَنْتَ مُنْذِرُ مَنْ يَّخْشٰىهَاۗ","كَاَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوْٓا اِلَّا عَشِيَّةً اَوْ ضُحٰىهَا ࣖ"],"id":["Demi (malaikat) yang mencabut (nyawa) dengan keras.","Demi (malaikat) yang mencabut (nyawa) dengan lemah lembut.","Demi (malaikat) yang turun dari langit dengan cepat,","dan (malaikat) yang mendahului dengan kencang,","dan (malaikat) yang mengatur urusan (dunia).","(Sungguh, kamu akan dibangkitkan) pada hari ketika tiupan pertama mengguncangkan alam,","(tiupan pertama) itu diiringi oleh tiupan kedua.","Hati manusia pada waktu itu merasa sangat takut,","pandangannya tunduk.","(Orang-orang kafir) berkata, “Apakah kita benar-benar akan dikembalikan kepada kehidupan yang semula?   ","Apakah (akan dibangkitkan juga) apabila kita telah menjadi tulang belulang yang hancur?”","Mereka berkata, “Kalau demikian, itu adalah suatu pengembalian yang merugikan.”","Maka pengembalian itu hanyalah dengan sekali tiupan saja.","Maka seketika itu mereka hidup kembali di bumi (yang baru).","Sudahkah sampai kepadamu (Muhammad) kisah Musa?","Ketika Tuhan memanggilnya (Musa) di lembah suci yaitu Lembah Tuwa;","pergilah engkau kepada Fir‘aun! Sesungguhnya dia telah melampaui batas,","Maka katakanlah (kepada Fir‘aun), “Adakah keinginanmu untuk membersihkan diri (dari kesesatan),","dan engkau akan kupimpin ke jalan Tuhanmu agar engkau takut kepada-Nya?”","Lalu (Musa) memperlihatkan kepadanya mukjizat yang besar.","Tetapi dia (Fir‘aun) mendustakan dan mendurhakai.","Kemudian dia berpaling seraya berusaha menantang (Musa).","Kemudian dia mengumpulkan (pembesar-pembesarnya) lalu berseru (memanggil kaumnya).","(Seraya) berkata, “Akulah tuhanmu yang paling tinggi.”","Maka Allah menghukumnya dengan azab di akhirat dan siksaan di dunia.","Sungguh, pada yang demikian itu terdapat pelajaran bagi orang yang takut (kepada Allah).","Apakah penciptaan kamu yang lebih hebat ataukah langit yang telah dibangun-Nya?","Dia telah meninggikan bangunannya lalu menyempurnakannya,","dan Dia menjadikan malamnya (gelap gulita), dan menjadikan siangnya (terang benderang).","Dan setelah itu bumi Dia hamparkan. ","Darinya Dia pancarkan mata air, dan (ditumbuhkan) tumbuh-tumbuhannya.","Dan gunung-gunung Dia pancangkan dengan teguh.","(Semua itu) untuk kesenanganmu dan untuk hewan-hewan ternakmu.","Maka apabila malapetaka besar (hari Kiamat) telah datang,","yaitu pada hari (ketika) manusia teringat akan apa yang telah dikerjakannya,","dan neraka diperlihatkan dengan jelas kepada setiap orang yang melihat.","Maka adapun orang yang melampaui batas,","dan lebih mengutamakan kehidupan dunia,","maka sungguh, nerakalah tempat tinggalnya.","Dan adapun orang-orang yang takut kepada kebesaran Tuhannya dan menahan diri dari (keinginan) hawa nafsunya,","maka sungguh, surgalah tempat tinggal(nya).","Mereka (orang-orang kafir) bertanya kepadamu (Muhammad) tentang hari Kiamat, “Kapankah terjadinya?” ","Untuk apa engkau perlu menyebutkannya (waktunya)?","Kepada Tuhanmulah (dikembalikan) kesudahannya (ketentuan waktunya).","Engkau (Muhammad) hanyalah pemberi peringatan bagi siapa yang takut kepadanya (hari Kiamat).","Pada hari ketika mereka melihat hari Kiamat itu (karena suasananya hebat), mereka merasa seakan-akan hanya (sebentar saja) tinggal (di dunia) pada waktu sore atau pagi hari."],"en":["By those [angels] who extract with violence","And [by] those who remove with ease","And [by] those who glide [as if] swimming","And those who race each other in a race","And those who arrange [each] matter","On the Day the blast [of the Horn] will convulse [creation]","There will follow it the subsequent [one]","Hearts, that Day, will tremble","Their eyes humbled","They are [presently] saying, \"Will we indeed be returned to [our] former state [of life]","Even if we should be decayed bones","They say, \"That, then, would be a losing return","Indeed, it will be but one shout","And suddenly they will be [alert] upon the earth's surface","Has there reached you the story of Moses","When his Lord called to him in the sacred valley of Tuwa","Go to Pharaoh. Indeed, he has transgressed","And say to him, 'Would you [be willing to] purify yourself","And let me guide you to your Lord so you would fear [Him]","And he showed him the greatest sign","But Pharaoh denied and disobeyed","Then he turned his back, striving","And he gathered [his people] and called out","And said, \"I am your most exalted lord","So Allah seized him in exemplary punishment for the last and the first [transgression]","Indeed in that is a warning for whoever would fear [Allah]","Are you a more difficult creation or is the heaven? Allah constructed it","He raised its ceiling and proportioned it","And He darkened its night and extracted its brightness","And after that He spread the earth","He extracted from it its water and its pasture","And the mountains He set firmly","As provision for you and your grazing livestock","But when there comes the greatest Overwhelming Calamity","The Day when man will remember that for which he strove","And Hellfire will be exposed for [all] those who see","So as for he who transgressed","And preferred the life of the world","Then indeed, Hellfire will be [his] refuge","But as for he who feared the position of his Lord and prevented the soul from [unlawful] inclination","Then indeed, Paradise will be [his] refuge","They ask you, [O Muhammad], about the Hour: when is its arrival","In what [position] are you that you should mention it","To your Lord is its finality","You are only a warner for those who fear it","It will be, on the Day they see it, as though they had not remained [in the world] except for an afternoon or a morning thereof"],"tl":["WaalnnaziAAati gharqan","Waalnnashitati nashtan","Waalssabihati sabhan","Faalssabiqati sabqan","Faalmudabbirati amran","Yawma tarjufu alrrajifatu","TatbaAAuha alrradifatu","Quloobun yawmaithin wajifatun","Absaruha khashiAAatun","Yaqooloona ainna lamardoodoona fee alhafirati","Aitha kunna AAithaman nakhiratan","Qaloo tilka ithan karratun khasiratun","Fainnama hiya zajratun wahidatun","Faitha hum bialssahirati","Hal ataka hadeethu moosa","Ith nadahu rabbuhu bialwadi almuqaddasi tuwan","Ithhab ila firAAawna innahu tagha","Faqul hal laka ila an tazakka","Waahdiyaka ila rabbika fatakhsha","Faarahu alayata alkubra","Fakaththaba waAAasa","Thumma adbara yasAAa","Fahashara fanada","Faqala ana rabbukumu alaAAla","Faakhathahu Allahu nakala alakhirati waaloola","Inna fee thalika laAAibratan liman yakhsha","Aantum ashaddu khalqan ami alssamao banaha","RafaAAa samkaha fasawwaha","Waaghtasha laylaha waakhraja duhaha","Waalarda baAAda thalika dahaha","Akhraja minha maaha wamarAAaha","Waaljibala arsaha","MataAAan lakum walianAAamikum","Faitha jaati alttammatu alkubra","Yawma yatathakkaru alinsanu ma saAAa","Waburrizati aljaheemu liman yara","Faamma man tagha","Waathara alhayata alddunya","Fainna aljaheema hiya almawa","Waama man khafa maqama rabbihi wanaha alnnafsa AAani alhawa","Fainna aljannata hiya almawa","Yasaloonaka AAani alssaAAati ayyana mursaha","Feema anta min thikraha","Ila rabbika muntahaha","Innama anta munthiru man yakhshaha","Kaannahum yawma yarawnaha lam yalbathoo illa AAashiyyatan aw duhaha"]},"80":{"n":80,"name":"عبس","latin":"'Abasa","ayat":42,"en_name":"He Frowned","type":"meccan","ar":["عَبَسَ وَتَوَلّٰىٓۙ","اَنْ جَاۤءَهُ الْاَعْمٰىۗ","وَمَا يُدْرِيْكَ لَعَلَّهٗ يَزَّكّٰىٓۙ","اَوْ يَذَّكَّرُ فَتَنْفَعَهُ الذِّكْرٰىۗ","اَمَّا مَنِ اسْتَغْنٰىۙ","فَاَنْتَ لَهٗ تَصَدّٰىۗ","وَمَا عَلَيْكَ اَلَّا يَزَّكّٰىۗ","وَاَمَّا مَنْ جَاۤءَكَ يَسْعٰىۙ","وَهُوَ يَخْشٰىۙ","فَاَنْتَ عَنْهُ تَلَهّٰىۚ","كَلَّآ اِنَّهَا تَذْكِرَةٌ ۚ","فَمَنْ شَاۤءَ ذَكَرَهٗ ۘ","فِيْ صُحُفٍ مُّكَرَّمَةٍۙ","مَّرْفُوْعَةٍ مُّطَهَّرَةٍ ۢ ۙ","بِاَيْدِيْ سَفَرَةٍۙ","كِرَامٍۢ بَرَرَةٍۗ","قُتِلَ الْاِنْسَانُ مَآ اَكْفَرَهٗۗ","مِنْ اَيِّ شَيْءٍ خَلَقَهٗۗ","مِنْ نُّطْفَةٍۗ خَلَقَهٗ فَقَدَّرَهٗۗ","ثُمَّ السَّبِيْلَ يَسَّرَهٗۙ","ثُمَّ اَمَاتَهٗ فَاَقْبَرَهٗۙ","ثُمَّ اِذَا شَاۤءَ اَنْشَرَهٗۗ","كَلَّا لَمَّا يَقْضِ مَآ اَمَرَهٗۗ","فَلْيَنْظُرِ الْاِنْسَانُ اِلٰى طَعَامِهٖٓ ۙ ","اَنَّا صَبَبْنَا الْمَاۤءَ صَبًّاۙ","ثُمَّ شَقَقْنَا الْاَرْضَ شَقًّاۙ","فَاَنْۢبَتْنَا فِيْهَا حَبًّاۙ","وَّعِنَبًا وَّقَضْبًاۙ","وَّزَيْتُوْنًا وَّنَخْلًاۙ","وَّحَدَاۤئِقَ غُلْبًا","وَفَاكِهَةً وَّاَبًّا","مَتَاعًا لَّكُمْ وَلِاَنْعَامِكُمْۗ","فَاِذَا جَاۤءَتِ الصَّاۤخَّةُ ۖ","يَوْمَ يَفِرُّ الْمَرْءُ مِنْ اَخِيْهِۙ","وَاُمِّهٖ وَاَبِيْهِۙ","وَصَاحِبَتِهٖ وَبَنِيْهِۗ","لِكُلِّ امْرِئٍ مِّنْهُمْ يَوْمَىِٕذٍ شَأْنٌ يُّغْنِيْهِۗ","وُجُوْهٌ يَّوْمَىِٕذٍ مُّسْفِرَةٌۙ","ضَاحِكَةٌ مُّسْتَبْشِرَةٌ ۚ","وَوُجُوْهٌ يَّوْمَىِٕذٍ عَلَيْهَا غَبَرَةٌۙ","تَرْهَقُهَا قَتَرَةٌ ۗ","اُولٰۤىِٕكَ هُمُ الْكَفَرَةُ الْفَجَرَةُ ࣖ"],"id":["Dia (Muhammad) berwajah masam dan berpaling,","karena seorang buta telah datang kepadanya (Abdullah bin Ummi Maktum).","Dan tahukah engkau (Muhammad) barangkali dia ingin menyucikan dirinya (dari dosa),","atau dia (ingin) mendapatkan pengajaran, yang memberi manfaat kepadanya?","Adapun orang yang merasa dirinya serba cukup (pembesar-pembesar Quraisy),","maka engkau (Muhammad) memberi perhatian kepadanya,","padahal tidak ada (cela) atasmu kalau dia tidak menyucikan diri (beriman).","Dan adapun orang yang datang kepadamu dengan bersegera (untuk mendapatkan pengajaran),","sedang dia takut (kepada Allah),","engkau (Muhammad) malah mengabaikannya.","Sekali-kali jangan (begitu)! Sungguh, (ajaran-ajaran Allah) itu suatu peringatan,","maka barangsiapa menghendaki, tentulah dia akan memperhatikannya,","di dalam kitab-kitab yang dimuliakan (di sisi Allah),","yang ditinggikan (dan) disucikan,","di tangan para utusan (malaikat),","yang mulia lagi berbakti.","Celakalah manusia! Alangkah kufurnya dia!","Dari apakah Dia (Allah) menciptakannya?","Dari setetes mani, Dia menciptakannya lalu menentukannya.","Kemudian jalannya Dia mudahkan,","kemudian Dia mematikannya lalu menguburkannya,","kemudian jika Dia menghendaki, Dia membangkitkannya kembali.","Sekali-kali jangan (begitu)! Dia (manusia) itu belum melaksanakan apa yang Dia (Allah) perintahkan kepadanya.","Maka hendaklah manusia itu memperhatikan makanannya.","Kamilah yang telah mencurahkan air melimpah (dari langit),","kemudian Kami belah bumi dengan sebaik-baiknya,","lalu di sana Kami tumbuhkan biji-bijian,","dan anggur dan sayur-sayuran,","dan zaitun dan pohon kurma,","dan kebun-kebun (yang) rindang,","dan buah-buahan serta rerumputan.","(Semua itu) untuk kesenanganmu dan untuk hewan-hewan ternakmu.","Maka apabila datang suara yang memekakkan (tiupan sangkakala yang kedua),","pada hari itu manusia lari dari saudaranya,","dan dari ibu dan bapaknya,","dan dari istri dan anak-anaknya.","Setiap orang dari mereka pada hari itu mempunyai urusan yang menyibukkannya.","Pada hari itu ada wajah-wajah yang berseri-seri,","tertawa dan gembira ria,","dan pada hari itu ada (pula) wajah-wajah yang tertutup debu (suram),","tertutup oleh kegelapan (ditimpa kehinaan dan kesusahan).","Mereka itulah orang-orang kafir yang durhaka."],"en":["The Prophet frowned and turned away","Because there came to him the blind man, [interrupting]","But what would make you perceive, [O Muhammad], that perhaps he might be purified","Or be reminded and the remembrance would benefit him","As for he who thinks himself without need","To him you give attention","And not upon you [is any blame] if he will not be purified","But as for he who came to you striving [for knowledge]","While he fears [Allah]","From him you are distracted","No! Indeed, these verses are a reminder","So whoever wills may remember it","[It is recorded] in honored sheets","Exalted and purified","[Carried] by the hands of messenger-angels","Noble and dutiful","Cursed is man; how disbelieving is he","From what substance did He create him","From a sperm-drop He created him and destined for him","Then He eased the way for him","Then He causes his death and provides a grave for him","Then when He wills, He will resurrect him","No! Man has not yet accomplished what He commanded him","Then let mankind look at his food","How We poured down water in torrents","Then We broke open the earth, splitting [it with sprouts]","And caused to grow within it grain","And grapes and herbage","And olive and palm trees","And gardens of dense shrubbery","And fruit and grass","[As] enjoyment for you and your grazing livestock","But when there comes the Deafening Blast","On the Day a man will flee from his brother","And his mother and his father","And his wife and his children","For every man, that Day, will be a matter adequate for him","[Some] faces, that Day, will be bright","Laughing, rejoicing at good news","And [other] faces, that Day, will have upon them dust","Blackness will cover them","Those are the disbelievers, the wicked ones"],"tl":["AAabasa watawalla","An jaahu alaAAma","Wama yudreeka laAAallahu yazzakka","Aw yaththakkaru fatanfaAAahu alththikra","Amma mani istaghna","Faanta lahu tasadda","Wama AAalayka alla yazzakka","Waamma man jaaka yasAAa","Wahuwa yakhsha","Faanta AAanhu talahha","Kalla innaha tathkiratun","Faman shaa thakarahu","Fee suhufin mukarramatin","MarfooAAatin mutahharatin","Biaydee safaratin","Kiramin bararatin","Qutila alinsanu ma akfarahu","Min ayyi shayin khalaqahu","Min nutfatin khalaqahu faqaddarahu","Thumma alssabeela yassarahu","Thumma amatahu faaqbarahu","Thumma itha shaa ansharahu","Kalla lamma yaqdi ma amarahu","Falyanthuri alinsanu ila taAAamihi","Anna sababna almaa sabban","Thumma shaqaqna alarda shaqqan","Faanbatna feeha habban","WaAAinaban waqadban","Wazaytoonan wanakhlan","Wahadaiqa ghulban","Wafakihatan waabban","MataAAan lakum walianAAamikum","Faitha jaati alssakhkhatu","Yawma yafirru almaro min akheehi","Waommihi waabeehi","Wasahibatihi wabaneehi","Likulli imriin minhum yawmaithin shanun yughneehi","Wujoohun yawmaithin musfiratun","Dahikatun mustabshiratun","Wawujoohun yawmaithin AAalayha ghabaratun","Tarhaquha qataratun","Olaika humu alkafaratu alfajaratu"]},"81":{"n":81,"name":"التكوير","latin":"At-Takwir","ayat":29,"en_name":"The Overthrowing","type":"meccan","ar":["اِذَا الشَّمْسُ كُوِّرَتْۖ","وَاِذَا النُّجُوْمُ انْكَدَرَتْۖ","وَاِذَا الْجِبَالُ سُيِّرَتْۖ","وَاِذَا الْعِشَارُ عُطِّلَتْۖ","وَاِذَا الْوُحُوْشُ حُشِرَتْۖ","وَاِذَا الْبِحَارُ سُجِّرَتْۖ","وَاِذَا النُّفُوْسُ زُوِّجَتْۖ","وَاِذَا الْمَوْءٗدَةُ سُىِٕلَتْۖ ","بِاَيِّ ذَنْۢبٍ قُتِلَتْۚ","وَاِذَا الصُّحُفُ نُشِرَتْۖ","وَاِذَا السَّمَاۤءُ كُشِطَتْۖ","وَاِذَا الْجَحِيْمُ سُعِّرَتْۖ","وَاِذَا الْجَنَّةُ اُزْلِفَتْۖ","عَلِمَتْ نَفْسٌ مَّآ اَحْضَرَتْۗ","فَلَآ اُقْسِمُ بِالْخُنَّسِۙ","الْجَوَارِ الْكُنَّسِۙ","وَالَّيْلِ اِذَا عَسْعَسَۙ","وَالصُّبْحِ اِذَا تَنَفَّسَۙ","اِنَّهٗ لَقَوْلُ رَسُوْلٍ كَرِيْمٍۙ","ذِيْ قُوَّةٍ عِنْدَ ذِى الْعَرْشِ مَكِيْنٍۙ","مُّطَاعٍ ثَمَّ اَمِيْنٍۗ","وَمَا صَاحِبُكُمْ بِمَجْنُوْنٍۚ","وَلَقَدْ رَاٰهُ بِالْاُفُقِ الْمُبِيْنِۚ","وَمَا هُوَ عَلَى الْغَيْبِ بِضَنِيْنٍۚ","وَمَا هُوَ بِقَوْلِ شَيْطٰنٍ رَّجِيْمٍۚ","فَاَيْنَ تَذْهَبُوْنَۗ","اِنْ هُوَ اِلَّا ذِكْرٌ لِّلْعٰلَمِيْنَۙ","لِمَنْ شَاۤءَ مِنْكُمْ اَنْ يَّسْتَقِيْمَۗ","وَمَا تَشَاۤءُوْنَ اِلَّآ اَنْ يَّشَاۤءَ اللّٰهُ رَبُّ الْعٰلَمِيْنَ ࣖ"],"id":["Apabila matahari digulung,","dan apabila bintang-bintang berjatuhan,","dan apabila gunung-gunung dihancurkan,","dan apabila unta-unta yang bunting ditinggalkan (tidak terurus),","dan apabila binatang-binatang liar dikumpulkan,","dan apabila lautan dipanaskan,","dan apabila roh-roh dipertemukan (dengan tubuh), ","dan apabila bayi-bayi perempuan yang dikubur hidup-hidup ditanya, ","karena dosa apa dia dibunuh? ","Dan apabila lembaran-lembaran (catatan amal) telah dibuka lebar-lebar, ","dan apabila langit dilenyapkan, ","dan apabila neraka Jahim dinyalakan, ","dan apabila surga didekatkan, ","setiap jiwa akan mengetahui apa yang telah dikerjakannya. ","Aku bersumpah demi bintang-bintang,","yang beredar dan terbenam, ","demi malam apabila telah larut, ","dan demi subuh apabila fajar telah menyingsing, ","sesungguhnya (Al-Qur'an) itu benar-benar firman (Allah yang dibawa oleh) utusan yang mulia (Jibril),","yang memiliki kekuatan, memiliki kedudukan tinggi di sisi (Allah) yang memiliki ‘Arsy,","yang di sana (di alam malaikat) ditaati dan dipercaya.","Dan temanmu (Muhammad) itu bukanlah orang gila. ","Dan sungguh, dia (Muhammad) telah melihatnya (Jibril) di ufuk yang terang. ","Dan dia (Muhammad) bukanlah seorang yang kikir (enggan) untuk menerangkan yang gaib.","Dan (Al-Qur'an) itu bukanlah perkataan setan yang terkutuk,","maka ke manakah kamu akan pergi?","(Al-Qur'an) itu tidak lain adalah peringatan bagi seluruh alam, ","(yaitu) bagi siapa di antara kamu yang menghendaki menempuh jalan yang lurus. ","Dan kamu tidak dapat menghendaki (menempuh jalan itu) kecuali apabila dikehendaki Allah, Tuhan seluruh alam."],"en":["When the sun is wrapped up [in darkness]","And when the stars fall, dispersing","And when the mountains are removed","And when full-term she-camels are neglected","And when the wild beasts are gathered","And when the seas are filled with flame","And when the souls are paired","And when the girl [who was] buried alive is asked","For what sin she was killed","And when the pages are made public","And when the sky is stripped away","And when Hellfire is set ablaze","And when Paradise is brought near","A soul will [then] know what it has brought [with it]","So I swear by the retreating stars","Those that run [their courses] and disappear","And by the night as it closes in","And by the dawn when it breathes","[That] indeed, the Qur'an is a word [conveyed by] a noble messenger","[Who is] possessed of power and with the Owner of the Throne, secure [in position]","Obeyed there [in the heavens] and trustworthy","And your companion is not [at all] mad","And he has already seen Gabriel in the clear horizon","And Muhammad is not a withholder of [knowledge of] the unseen","And the Qur'an is not the word of a devil, expelled [from the heavens]","So where are you going","It is not except a reminder to the worlds","For whoever wills among you to take a right course","And you do not will except that Allah wills - Lord of the worlds"],"tl":["Itha alshshamsu kuwwirat","Waitha alnnujoomu inkadarat","Waitha aljibalu suyyirat","Waitha alAAisharu AAuttilat","Waitha alwuhooshu hushirat","Waitha albiharu sujjirat","Waitha alnnufoosu zuwwijat","Waitha almawoodatu suilat","Biayyi thanbin qutilat","Waitha alssuhufu nushirat","Waitha alssamao kushitat","Waitha aljaheemu suAAAAirat","Waitha aljannatu ozlifat","AAalimat nafsun ma ahdarat","Fala oqsimu bialkhunnasi","Aljawari alkunnasi","Waallayli itha AAasAAasa","Waalssubhi itha tanaffasa","Innahu laqawlu rasoolin kareemin","Thee quwwatin AAinda thee alAAarshi makeenin","MutaAAin thamma ameenin","Wama sahibukum bimajnoonin","Walaqad raahu bialofuqi almubeeni","Wama huwa AAala alghaybi bidaneenin","Wama huwa biqawli shaytanin rajeemin","Faayna tathhaboona","In huwa illa thikrun lilAAalameena","Liman shaa minkum an yastaqeema","Wama tashaoona illa an yashaa Allahu rabbu alAAalameena"]},"82":{"n":82,"name":"الانفطار","latin":"Al-Infitar","ayat":19,"en_name":"The Cleaving","type":"meccan","ar":["اِذَا السَّمَاۤءُ انْفَطَرَتْۙ","وَاِذَا الْكَوَاكِبُ انْتَثَرَتْۙ","وَاِذَا الْبِحَارُ فُجِّرَتْۙ","وَاِذَا الْقُبُوْرُ بُعْثِرَتْۙ","عَلِمَتْ نَفْسٌ مَّا قَدَّمَتْ وَاَخَّرَتْۗ","يٰٓاَيُّهَا الْاِنْسَانُ مَا غَرَّكَ بِرَبِّكَ الْكَرِيْمِۙ","الَّذِيْ خَلَقَكَ فَسَوّٰىكَ فَعَدَلَكَۙ","فِيْٓ اَيِّ صُوْرَةٍ مَّا شَاۤءَ رَكَّبَكَۗ","كَلَّا بَلْ تُكَذِّبُوْنَ بِالدِّيْنِۙ","وَاِنَّ عَلَيْكُمْ لَحٰفِظِيْنَۙ","كِرَامًا كَاتِبِيْنَۙ","يَعْلَمُوْنَ مَا تَفْعَلُوْنَ","اِنَّ الْاَبْرَارَ لَفِيْ نَعِيْمٍۙ","وَّاِنَّ الْفُجَّارَ لَفِيْ جَحِيْمٍ","يَصْلَوْنَهَا يَوْمَ الدِّيْنِ","وَمَا هُمْ عَنْهَا بِغَاۤىِٕبِيْنَۗ","وَمَآ اَدْرٰىكَ مَا يَوْمُ الدِّيْنِۙ","ثُمَّ مَآ اَدْرٰىكَ مَا يَوْمُ الدِّيْنِۗ","يَوْمَ لَا تَمْلِكُ نَفْسٌ لِّنَفْسٍ شَيْـًٔا ۗوَالْاَمْرُ يَوْمَىِٕذٍ لِّلّٰهِ ࣖ"],"id":["Apabila langit terbelah, ","dan apabila bintang-bintang jatuh berserakan, ","dan apabila lautan dijadikan meluap, ","dan apabila kuburan-kuburan dibongkar,","(maka) setiap jiwa akan mengetahui apa yang telah dikerjakan dan yang dilalaikan(nya).","Wahai manusia! Apakah yang telah memperdayakan kamu (berbuat durhaka) terhadap Tuhanmu Yang Mahamulia, ","yang telah menciptakanmu lalu menyempurnakan kejadianmu dan menjadikan (susunan tubuh)mu seimbang, ","dalam bentuk apa saja yang dikehendaki, Dia menyusun tubuhmu. ","Sekali-kali jangan begitu! Bahkan kamu mendustakan hari pembalasan.","Dan sesungguhnya bagi kamu ada (malaikat-malaikat) yang mengawasi (pekerjaanmu), ","yang mulia (di sisi Allah) dan yang mencatat (amal perbuatanmu), ","mereka mengetahui apa yang kamu kerjakan. ","Sesungguhnya orang-orang yang berbakti benar-benar berada dalam (surga yang penuh) kenikmatan, ","dan sesungguhnya orang-orang yang durhaka benar-benar berada dalam neraka. ","Mereka masuk ke dalamnya pada hari pembalasan.","Dan mereka tidak mungkin keluar dari neraka itu. ","Dan tahukah kamu apakah hari pembalasan itu? ","Sekali lagi, tahukah kamu apakah hari pembalasan itu? ","(Yaitu) pada hari (ketika) seseorang sama sekali tidak berdaya (menolong) orang lain. Dan segala urusan pada hari itu dalam kekuasaan Allah. "],"en":["When the sky breaks apart","And when the stars fall, scattering","And when the seas are erupted","And when the [contents of] graves are scattered","A soul will [then] know what it has put forth and kept back","O mankind, what has deceived you concerning your Lord, the Generous","Who created you, proportioned you, and balanced you","In whatever form He willed has He assembled you","No! But you deny the Recompense","And indeed, [appointed] over you are keepers","Noble and recording","They know whatever you do","Indeed, the righteous will be in pleasure","And indeed, the wicked will be in Hellfire","They will [enter to] burn therein on the Day of Recompense","And never therefrom will they be absent","And what can make you know what is the Day of Recompense","Then, what can make you know what is the Day of Recompense","It is the Day when a soul will not possess for another soul [power to do] a thing; and the command, that Day, is [entirely] with Allah"],"tl":["Itha alssamao infatarat","Waitha alkawakibu intatharat","Waitha albiharu fujjirat","Waitha alqubooru buAAthirat","AAalimat nafsun ma qaddamat waakhkharat","Ya ayyuha alinsanu ma gharraka birabbika alkareemi","Allathee khalaqaka fasawwaka faAAadalaka","Fee ayyi sooratin ma shaa rakkabaka","Kalla bal tukaththiboona bialddeeni","Wainna AAalaykum lahafitheena","Kiraman katibeena","YaAAlamoona ma tafAAaloona","Inna alabrara lafee naAAeemin","Wainna alfujjara lafee jaheemin","Yaslawnaha yawma alddeeni","Wama hum AAanha bighaibeena","Wama adraka ma yawmu alddeeni","Thumma ma adraka ma yawmu alddeeni","Yawma la tamliku nafsun linafsin shayan waalamru yawmaithin lillahi"]},"83":{"n":83,"name":"المطفّفين","latin":"Al-Mutaffifin","ayat":36,"en_name":"The Defrauding","type":"meccan","ar":["وَيْلٌ لِّلْمُطَفِّفِيْنَۙ","الَّذِيْنَ اِذَا اكْتَالُوْا عَلَى النَّاسِ يَسْتَوْفُوْنَۖ","وَاِذَا كَالُوْهُمْ اَوْ وَّزَنُوْهُمْ يُخْسِرُوْنَۗ","اَلَا يَظُنُّ اُولٰۤىِٕكَ اَنَّهُمْ مَّبْعُوْثُوْنَۙ","لِيَوْمٍ عَظِيْمٍۙ","يَّوْمَ يَقُوْمُ النَّاسُ لِرَبِّ الْعٰلَمِيْنَۗ","كَلَّآ اِنَّ كِتٰبَ الْفُجَّارِ لَفِيْ سِجِّيْنٍۗ","وَمَآ اَدْرٰىكَ مَا سِجِّيْنٌۗ","كِتٰبٌ مَّرْقُوْمٌۗ","وَيْلٌ يَّوْمَىِٕذٍ لِّلْمُكَذِّبِيْنَۙ","الَّذِيْنَ يُكَذِّبُوْنَ بِيَوْمِ الدِّيْنِۗ","وَمَا يُكَذِّبُ بِهٖٓ اِلَّا كُلُّ مُعْتَدٍ اَثِيْمٍۙ","اِذَا تُتْلٰى عَلَيْهِ اٰيٰتُنَا قَالَ اَسَاطِيْرُ الْاَوَّلِيْنَۗ","كَلَّا بَلْ ۜرَانَ عَلٰى قُلُوْبِهِمْ مَّا كَانُوْا يَكْسِبُوْنَ ","كَلَّآ اِنَّهُمْ عَنْ رَّبِّهِمْ يَوْمَىِٕذٍ لَّمَحْجُوْبُوْنَۗ","ثُمَّ اِنَّهُمْ لَصَالُوا الْجَحِيْمِۗ","ثُمَّ يُقَالُ هٰذَا الَّذِيْ كُنْتُمْ بِهٖ تُكَذِّبُوْنَۗ","كَلَّآ اِنَّ كِتٰبَ الْاَبْرَارِ لَفِيْ عِلِّيِّيْنَۗ ","وَمَآ اَدْرٰىكَ مَا عِلِّيُّوْنَۗ","كِتٰبٌ مَّرْقُوْمٌۙ","يَّشْهَدُهُ الْمُقَرَّبُوْنَۗ","اِنَّ الْاَبْرَارَ لَفِيْ نَعِيْمٍۙ","عَلَى الْاَرَاۤىِٕكِ يَنْظُرُوْنَۙ","تَعْرِفُ فِيْ وُجُوْهِهِمْ نَضْرَةَ النَّعِيْمِۚ","يُسْقَوْنَ مِنْ رَّحِيْقٍ مَّخْتُوْمٍۙ","خِتٰمُهٗ مِسْكٌ ۗوَفِيْ ذٰلِكَ فَلْيَتَنَافَسِ الْمُتَنَافِسُوْنَۗ","وَمِزَاجُهٗ مِنْ تَسْنِيْمٍۙ","عَيْنًا يَّشْرَبُ بِهَا الْمُقَرَّبُوْنَۗ","اِنَّ الَّذِيْنَ اَجْرَمُوْا كَانُوْا مِنَ الَّذِيْنَ اٰمَنُوْا يَضْحَكُوْنَۖ","وَاِذَا مَرُّوْا بِهِمْ يَتَغَامَزُوْنَۖ","وَاِذَا انْقَلَبُوْٓا اِلٰٓى اَهْلِهِمُ انْقَلَبُوْا فَكِهِيْنَۖ","وَاِذَا رَاَوْهُمْ قَالُوْٓا اِنَّ هٰٓؤُلَاۤءِ لَضَاۤلُّوْنَۙ","وَمَآ اُرْسِلُوْا عَلَيْهِمْ حٰفِظِيْنَۗ","فَالْيَوْمَ الَّذِيْنَ اٰمَنُوْا مِنَ الْكُفَّارِ يَضْحَكُوْنَۙ","عَلَى الْاَرَاۤىِٕكِ يَنْظُرُوْنَۗ","هَلْ ثُوِّبَ الْكُفَّارُ مَا كَانُوْا يَفْعَلُوْنَ ࣖ"],"id":["Celakalah bagi orang-orang yang curang (dalam menakar dan menimbang)! ","(Yaitu) orang-orang yang apabila menerima takaran dari orang lain mereka minta dicukupkan, ","dan apabila mereka menakar atau menimbang (untuk orang lain), mereka mengurangi. ","Tidakkah mereka itu mengira, bahwa sesungguhnya mereka akan dibangkitkan, ","pada suatu hari yang besar, ","(yaitu) pada hari (ketika) semua orang bangkit menghadap Tuhan seluruh alam.","Sekali-kali jangan begitu! Sesungguhnya catatan orang yang durhaka benar-benar tersimpan dalam Sijjin. ","Dan tahukah engkau apakah Sijjin itu? ","(Yaitu) Kitab yang berisi catatan (amal).","Celakalah pada hari itu, bagi orang-orang yang mendustakan! ","(yaitu) orang-orang yang mendustakannya (hari pembalasan).","Dan tidak ada yang mendustakannya (hari pembalasan) kecuali setiap orang yang melampaui batas dan berdosa,","yang apabila dibacakan kepadanya ayat-ayat Kami, dia berkata, “Itu adalah dongeng orang-orang dahulu.” ","Sekali-kali tidak! Bahkan apa yang mereka kerjakan itu telah menutupi hati mereka. ","Sekali-kali tidak! Sesungguhnya mereka pada hari itu benar-benar terhalang dari (melihat) Tuhannya. ","Kemudian, sesungguhnya mereka benar-benar masuk neraka. ","Kemudian, dikatakan (kepada mereka), “Inilah (azab) yang dahulu kamu dustakan.”","Sekali-kali tidak! Sesungguhnya catatan orang-orang yang berbakti benar-benar tersimpan dalam ’Illiyyin. ","Dan tahukah engkau apakah ’Illiyyin itu?","(Yaitu) Kitab yang berisi catatan (amal),","yang disaksikan oleh (malaikat-malaikat) yang didekatkan (kepada Allah). ","Sesungguhnya orang-orang yang berbakti benar-benar berada dalam (surga yang penuh) kenikmatan,","mereka (duduk) di atas dipan-dipan melepas pandangan. ","Kamu dapat mengetahui dari wajah mereka kesenangan hidup yang penuh kenikmatan.","Mereka diberi minum dari khamar murni (tidak memabukkan) yang (tempatnya) masih dilak (disegel), ","laknya dari kasturi. Dan untuk yang demikian itu hendaknya orang berlomba-lomba. ","Dan campurannya dari tasnim, ","(yaitu) mata air yang diminum oleh mereka yang dekat (kepada Allah). ","Sesungguhnya orang-orang yang berdosa adalah mereka yang dahulu menertawakan orang-orang yang beriman.","Dan apabila mereka (orang-orang yang beriman) melintas di hadapan mereka, mereka saling mengedip-ngedipkan matanya,","dan apabila kembali kepada kaumnya, mereka kembali dengan gembira ria. ","Dan apabila mereka melihat (orang-orang mukmin), mereka mengatakan, “Sesungguhnya mereka benar-benar orang-orang sesat,”","padahal (orang-orang yang berdosa itu), mereka tidak diutus sebagai penjaga (orang-orang mukmin). ","Maka pada hari ini, orang-orang yang beriman yang menertawakan orang-orang kafir, ","mereka (duduk) di atas dipan-dipan melepas pandangan.","Apakah orang-orang kafir itu diberi balasan (hukuman) terhadap apa yang telah mereka perbuat? "],"en":["Woe to those who give less [than due]","Who, when they take a measure from people, take in full","But if they give by measure or by weight to them, they cause loss","Do they not think that they will be resurrected","For a tremendous Day","The Day when mankind will stand before the Lord of the worlds","No! Indeed, the record of the wicked is in sijjeen","And what can make you know what is sijjeen","It is [their destination recorded in] a register inscribed","Woe, that Day, to the deniers","Who deny the Day of Recompense","And none deny it except every sinful transgressor","When Our verses are recited to him, he says, \"Legends of the former peoples","No! Rather, the stain has covered their hearts of that which they were earning","No! Indeed, from their Lord, that Day, they will be partitioned","Then indeed, they will [enter and] burn in Hellfire","Then it will be said [to them], \"This is what you used to deny","No! Indeed, the record of the righteous is in 'illiyyun","And what can make you know what is 'illiyyun","It is [their destination recorded in] a register inscribed","Which is witnessed by those brought near [to Allah]","Indeed, the righteous will be in pleasure","On adorned couches, observing","You will recognize in their faces the radiance of pleasure","They will be given to drink [pure] wine [which was] sealed","The last of it is musk. So for this let the competitors compete","And its mixture is of Tasneem","A spring from which those near [to Allah] drink","Indeed, those who committed crimes used to laugh at those who believed","And when they passed by them, they would exchange derisive glances","And when they returned to their people, they would return jesting","And when they saw them, they would say, \"Indeed, those are truly lost","But they had not been sent as guardians over them","So Today those who believed are laughing at the disbelievers","On adorned couches, observing","Have the disbelievers [not] been rewarded [this Day] for what they used to do"],"tl":["Waylun lilmutaffifeena","Allatheena itha iktaloo AAala alnnasi yastawfoona","Waitha kaloohum aw wazanoohum yukhsiroona","Ala yathunnu olaika annahum mabAAoothoona","Liyawmin AAatheemin","Yawma yaqoomu alnnasu lirabbi alAAalameena","Kalla inna kitaba alfujjari lafee sijjeenin","Wama adraka ma sijjeenun","Kitabun marqoomun","Waylun yawmaithin lilmukaththibeena","Allatheena yukaththiboona biyawmi alddeeni","Wama yukaththibu bihi illa kullu muAAtadin atheemin","Itha tutla AAalayhi ayatuna qala asateeru alawwaleena","Kalla bal rana AAala quloobihim ma kanoo yaksiboona","Kalla innahum AAan rabbihim yawmaithin lamahjooboona","Thumma innahum lasaloo aljaheemi","Thumma yuqalu hatha allathee kuntum bihi tukaththiboona","Kalla inna kitaba alabrari lafee AAilliyyeena","Wama adraka ma AAilliyyoona","Kitabun marqoomun","Yashhaduhu almuqarraboona","Inna alabrara lafee naAAeemin","AAala alaraiki yanthuroona","TaAArifu fee wujoohihim nadrata alnnaAAeemi","Yusqawna min raheeqin makhtoomin","Khitamuhu miskun wafee thalika falyatanafasi almutanafisoona","Wamizajuhu min tasneemin","AAaynan yashrabu biha almuqarraboona","Inna allatheena ajramoo kanoo mina allatheena amanoo yadhakoona","Waitha marroo bihim yataghamazoona","Waitha inqalaboo ila ahlihimu inqalaboo fakiheena","Waitha raawhum qaloo inna haolai ladalloona","Wama orsiloo AAalayhim hafitheena","Faalyawma allatheena amanoo mina alkuffari yadhakoona","AAala alaraiki yanthuroona","Hal thuwwiba alkuffaru ma kanoo yafAAaloona"]},"84":{"n":84,"name":"الانشقاق","latin":"Al-Insyiqaq","ayat":25,"en_name":"The Sundering","type":"meccan","ar":["اِذَا السَّمَاۤءُ انْشَقَّتْۙ ","وَاَذِنَتْ لِرَبِّهَا وَحُقَّتْۙ ","وَاِذَا الْاَرْضُ مُدَّتْۙ ","وَاَلْقَتْ مَا فِيْهَا وَتَخَلَّتْۙ ","وَاَذِنَتْ لِرَبِّهَا وَحُقَّتْۗ ","يٰٓاَيُّهَا الْاِنْسَانُ اِنَّكَ كَادِحٌ اِلٰى رَبِّكَ كَدْحًا فَمُلٰقِيْهِۚ ","فَاَمَّا مَنْ اُوْتِيَ كِتٰبَهٗ بِيَمِيْنِهٖۙ ","فَسَوْفَ يُحَاسَبُ حِسَابًا يَّسِيْرًاۙ ","وَّيَنْقَلِبُ اِلٰٓى اَهْلِهٖ مَسْرُوْرًاۗ ","وَاَمَّا مَنْ اُوْتِيَ كِتٰبَهٗ وَرَاۤءَ ظَهْرِهٖۙ ","فَسَوْفَ يَدْعُوْ ثُبُوْرًاۙ ","وَّيَصْلٰى سَعِيْرًاۗ ","اِنَّهٗ كَانَ فِيْٓ اَهْلِهٖ مَسْرُوْرًاۗ ","اِنَّهٗ ظَنَّ اَنْ لَّنْ يَّحُوْرَ ۛ ","بَلٰىۛ اِنَّ رَبَّهٗ كَانَ بِهٖ بَصِيْرًاۗ ","فَلَآ اُقْسِمُ بِالشَّفَقِۙ ","وَالَّيْلِ وَمَا وَسَقَۙ ","وَالْقَمَر
