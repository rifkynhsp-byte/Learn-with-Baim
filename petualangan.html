<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lab Petualangan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sand:#F7E9CC;--bone:#FFFBF2;--amber:#FFB247;--coral:#FF6B5B;--kelp:#5FE0A4;--ink:#2D2410;
 --sky1:#12796B;--sky2:#0A4A52;--sky3:#04222E;--glow:#6FE3C8;
 /* semantic tokens from the age-6 visual spec */
 --paper:#FFFDF7;--ink-navy:#1E293B;--go:#10B981;--nogo:#EF4444;--switch:#8B5CF6;
 --boost:#F59E0B;--steel:#0EA5E9;--bounce:#EC4899;
 --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--bone);display:flex;flex-direction:column;
 min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation;
 background:radial-gradient(130% 80% at 50% -14%,var(--glow) 0%,transparent 56%),
 linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 46%,var(--sky3) 100%);background-attachment:fixed}
button{font-family:inherit}
small{display:block}
.app{flex:1;display:flex;flex-direction:column;max-width:1400px;width:100%;margin:0 auto;padding:8px 14px;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.brand{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--sand);margin-right:auto}
.brand span{color:var(--amber)}
.seg{display:flex;gap:3px;background:rgba(4,26,32,.5);padding:4px;border-radius:999px;border:1px solid rgba(247,233,204,.16)}
.seg button{font-family:'Fredoka',sans-serif;font-weight:600;font-size:13.5px;color:rgba(255,251,242,.6);background:none;border:0;padding:6px 10px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--amber);color:#40230A}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;text-decoration:none;
 background:rgba(247,233,204,.1);border:1px solid rgba(247,233,204,.2);color:var(--bone);cursor:pointer}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{overflow-y:auto;padding:4px 2px 26px;flex:1}
h1{font-family:'Fredoka',sans-serif;font-size:clamp(23px,4vw,34px);margin:4px 0 2px;color:var(--sand)}
.sub{margin:0 0 14px;color:rgba(255,251,242,.78);font-size:14.5px;line-height:1.5;max-width:70ch}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.gcard{position:relative;border:0;text-align:left;cursor:pointer;border-radius:22px;overflow:hidden;color:var(--bone);padding:0;
 background:#08333A;box-shadow:0 14px 30px rgba(0,0,0,.34);transition:transform .18s;display:flex;flex-direction:column}
.gcard:hover{transform:translateY(-4px)}
.gcard .art{height:96px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:var(--emoji);font-size:44px;
 background:linear-gradient(150deg,rgba(255,178,71,.28),rgba(95,224,164,.12))}
.gcard .art i{font-style:normal;animation:bob 2.6s ease-in-out infinite}
.gcard .art i:nth-child(2){animation-delay:.6s}
.gcard .txt{flex:1;padding:12px 15px 14px;background:rgba(0,0,0,.3)}
.gcard h3{font-family:'Fredoka',sans-serif;margin:0;font-size:19px}
.gcard .en{font-size:12.5px;color:rgba(255,251,242,.66)}
.gcard .nt{font-size:12.5px;margin-top:6px;line-height:1.45;color:rgba(255,251,242,.85)}
.gcard .sk{position:absolute;right:10px;top:10px;font-size:12px;background:rgba(4,26,32,.7);border:1px solid rgba(247,233,204,.2);
 border-radius:999px;padding:3px 9px;color:var(--sand)}
.note{background:rgba(255,178,71,.14);border:1px solid rgba(255,178,71,.4);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.55;margin:10px 0 0}
.playhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 6px}
.playhead .ttl{font-family:'Fredoka',sans-serif;font-size:17px;margin-right:auto}
.playhead .ttl small{font-size:12.5px;color:rgba(255,251,242,.7)}
.btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;border-radius:999px;padding:10px 18px;cursor:pointer;white-space:nowrap;
 background:rgba(247,233,204,.13);color:var(--bone);border:1px solid rgba(247,233,204,.24)}
.btn.go{background:var(--amber);color:#40230A;border-color:var(--amber)}
.btn.small{padding:7px 13px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.stageBox{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;touch-action:none;
 background:linear-gradient(180deg,#0B3C4E,#062028);box-shadow:0 16px 36px rgba(0,0,0,.4)}
.stageBox canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;max-width:94%;text-align:center;
 background:rgba(4,26,32,.86);color:#FFF6DF;border-radius:999px;padding:7px 16px;font-family:'Fredoka',sans-serif;font-size:14.5px;pointer-events:none}
.hint small{font-family:'Nunito',sans-serif;font-size:12px;opacity:.8}
.meter{height:8px;border-radius:99px;background:rgba(4,26,32,.6);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--kelp),var(--amber));transition:width .2s}
.done{position:absolute;inset:0;z-index:9;display:none;place-items:center;background:rgba(4,20,26,.62);padding:12px}
.done.on{display:grid}
.done .box{background:var(--bone);color:var(--ink);border-radius:24px;padding:18px 24px;text-align:center;max-width:420px;
 animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.done .stars{font-size:34px;letter-spacing:4px}
.done h2{font-family:'Fredoka',sans-serif;margin:2px 0 4px;font-size:22px}
.done p{margin:2px 0 12px;font-weight:800;color:#6A5A3A;line-height:1.45}
.done .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.done .btn{background:#EFE3C8;color:#3A2F16;border-color:#D8C7A3}
.done .btn.go{background:var(--amber)}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:'Fredoka',sans-serif;font-size:14px;margin-bottom:6px}
.pill{background:rgba(247,233,204,.12);border:1px solid rgba(247,233,204,.22);border-radius:999px;padding:5px 12px}
.pill.hot{background:linear-gradient(180deg,#FFB247,#E58A2C);color:#40230A;border-color:#FFB247}
.pill.bad{background:rgba(255,107,91,.3);border-color:rgba(255,107,91,.6)}
.dots{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:2px 0 8px}
.dots i{width:15px;height:15px;border-radius:50%;background:rgba(247,233,204,.16);
 border:1px solid rgba(247,233,204,.22);display:block;transition:transform .2s,background .2s}
.dots i.done{background:var(--kelp);border-color:var(--kelp)}
.dots i.now{background:var(--amber);border-color:var(--amber);transform:scale(1.35)}
.dots i.boss{border-color:var(--coral);border-style:dashed}

/* ---------- rhythm ---------- */
.lanes{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px;
 border-radius:22px;background:linear-gradient(180deg,#0B3C4E,#062028);overflow:hidden;touch-action:none}
.lane{position:relative;border-radius:14px;background:rgba(247,233,204,.07);border:1px solid rgba(247,233,204,.12);overflow:hidden}
.lane.lit{background:rgba(255,178,71,.34)}
.lane .judge{position:absolute;left:6%;right:6%;bottom:66px;height:4px;border-radius:9px;background:rgba(255,178,71,.55)}
.note{position:absolute;left:50%;width:60px;height:60px;margin-left:-30px;display:grid;place-items:center;
 font-family:var(--emoji);font-size:24px;font-weight:800;color:#062028;box-shadow:0 6px 12px rgba(0,0,0,.3);will-change:transform}
/* the four shapes of the age-6 spec: circle, diamond, star, octagon */
.note.tap{background:var(--go);border-radius:50%}
.note.num{background:var(--steel);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.note.cross{background:var(--switch);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.note.bomb{background:var(--nogo);clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.note.gone{transition:transform .12s,opacity .12s;opacity:0}
.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.pad{font-family:var(--emoji);font-size:26px;height:64px;border-radius:16px;cursor:pointer;border:1px solid rgba(247,233,204,.22);
 background:rgba(247,233,204,.12);color:var(--bone);display:grid;place-items:center;gap:0}
.pad small{font-family:'Fredoka',sans-serif;font-size:11px;opacity:.75}
.pad:active,.pad.on{background:var(--amber);color:#40230A}
.carry{position:absolute;left:0;top:0;right:0;text-align:center;z-index:5;pointer-events:none;
 font-family:'Fredoka',sans-serif;font-size:clamp(17px,3vw,26px);text-shadow:0 3px 10px rgba(0,0,0,.55)}
.carry small{font-size:.5em;opacity:.85}

/* ---------- tangram ---------- */
.tangram{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;touch-action:none;
 background:radial-gradient(circle at 50% 40%,#0E4A56,#04191F)}
.tangram svg.ghost{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.piece{position:absolute;cursor:grab;touch-action:none;transform-origin:50% 50%;will-change:transform;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.piece svg{display:block;width:100%;height:100%}
.piece.sel{filter:drop-shadow(0 0 10px #FFB247) drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.piece.locked{cursor:default;filter:drop-shadow(0 0 8px #5FE0A4)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}

/* ---------- maze ---------- */
.mazeWrap{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start}
.maze{position:relative;flex:1 1 320px;min-width:280px;aspect-ratio:1/1;max-height:56vh;margin:0 auto;border-radius:18px;overflow:hidden;
 background:linear-gradient(160deg,#0E4A56,#062028);display:grid;gap:2px;padding:6px}
.cell{position:relative;border-radius:6px;background:rgba(95,224,164,.08);display:grid;place-items:center;font-family:var(--emoji);font-size:min(5vw,22px)}
.cell.wall{background:rgba(247,233,204,.06)}
.cell.rock{background:rgba(140,124,92,.5)}
.cell.water{background:rgba(80,160,220,.28)}
.cell.switch{background:rgba(255,178,71,.28);box-shadow:inset 0 0 0 2px rgba(255,178,71,.6)}
.cell.actor{background:rgba(95,224,164,.34)}
.cell .who{position:absolute;font-family:var(--emoji);line-height:1}
.cell .face{position:absolute;right:3px;bottom:2px;font-size:min(4vw,13px);line-height:1;opacity:.95}
.cmdbar{flex:0 0 100%;min-height:56px;border-radius:16px;border:1px dashed rgba(247,233,204,.3);padding:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;background:rgba(4,26,32,.45)}
.cmdbar .c{font-family:'Fredoka',sans-serif;font-size:13px;background:rgba(247,233,204,.14);border:1px solid rgba(247,233,204,.24);
 border-radius:10px;padding:6px 9px;cursor:pointer;display:flex;gap:4px;align-items:center}
.cmdbar .c.active{background:var(--amber);color:#40230A;transform:scale(1.15);box-shadow:0 0 0 2px rgba(95,224,164,.7)}
.cmdbar .c.warn{background:#F59E0B;color:#40230A;animation:nudge .4s ease-in-out 3}
.cmdbar .c.badglow{background:var(--coral);color:#fff}
.cmdbar .c em{font-style:normal;font-family:var(--emoji)}
.tray2{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tray2 .c{font-family:'Fredoka',sans-serif;font-size:13.5px;background:rgba(247,233,204,.12);border:1px solid rgba(247,233,204,.24);
 border-radius:12px;padding:8px 11px;cursor:pointer;display:flex;gap:5px;align-items:center;color:var(--bone)}
.tray2 .c em{font-style:normal;font-family:var(--emoji);font-size:16px}
.levels{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 8px}
.levels button{font-family:'Fredoka',sans-serif;font-size:13px;min-width:40px;height:34px;border-radius:11px;
 border:1px solid rgba(247,233,204,.22);background:rgba(247,233,204,.1);color:var(--bone);cursor:pointer;transition:.15s}
.levels button.on{background:var(--amber);color:#40230A;border-color:var(--amber)}
.levels button.done{border-color:var(--kelp);color:var(--kelp)}
.padRow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.bigbtn{height:74px;border-radius:20px;border:1px solid rgba(247,233,204,.25);background:rgba(247,233,204,.12);
 color:var(--bone);font-size:27px;line-height:1;cursor:pointer;display:grid;place-items:center;gap:2px;
 touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:var(--emoji),'Fredoka',sans-serif}
.bigbtn small{font-family:'Fredoka',sans-serif;font-size:12px;opacity:.85;display:block}
.bigbtn:active{background:var(--amber);color:#40230A;transform:scale(.97)}

/* ---------- factory ---------- */
.factory{position:relative;flex:1;min-height:0;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;
 background:linear-gradient(180deg,#0B3C4E,#062028);touch-action:none}
.rulebar{display:flex;gap:8px;align-items:center;justify-content:center;padding:8px;font-family:'Fredoka',sans-serif;font-size:clamp(15px,2.6vw,20px);
 background:rgba(4,26,32,.55);border-bottom:1px solid rgba(247,233,204,.14)}
.rulebar.flash{animation:siren .5s ease-in-out 4}
.belt{position:relative;flex:1;min-height:80px;margin:0 10px;border-radius:14px;background:repeating-linear-gradient(90deg,rgba(247,233,204,.09) 0 22px,rgba(247,233,204,.04) 22px 44px);overflow:hidden}
.belt .item{position:absolute;top:50%;width:68px;height:68px;margin-top:-34px;border-radius:16px;display:grid;place-items:center;
 font-family:var(--emoji);font-size:30px;color:#062028;box-shadow:0 6px 12px rgba(0,0,0,.35);will-change:left}
.belt .item b{font-family:'Fredoka',sans-serif;font-size:19px}
.chutes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.chute{border-radius:16px;border:2px solid rgba(247,233,204,.28);background:rgba(247,233,204,.1);color:var(--bone);
 font-family:'Fredoka',sans-serif;font-size:clamp(13px,2.2vw,17px);padding:10px 6px;cursor:pointer;min-height:64px;line-height:1.25}
.chute em{display:block;font-style:normal;font-family:var(--emoji);font-size:22px}
.chute.ok{background:var(--kelp);color:#063A22}
.chute.no{background:var(--coral);color:#3A0F08}

@keyframes bob{50%{transform:translateY(-8%)}}
@keyframes popin{from{transform:scale(.3);opacity:0}}
@keyframes siren{50%{background:rgba(139,92,246,.85)}}
@keyframes nudge{50%{transform:scale(1.15) translateX(3px)}}
@keyframes fallDown{to{transform:translateY(140%) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
.confetti{position:fixed;top:-20px;z-index:90;pointer-events:none;width:10px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="app">
 <div class="topbar">
  <div class="brand">Lab <span>Petualangan</span></div>
  <div class="seg" id="tiers">
   <button data-lv="1" class="on">TK</button>
   <button data-lv="2">Transisi</button>
   <button data-lv="3">SD 1</button>
  </div>
  <button class="icon" id="lang" title="Bahasa / Language">🇮🇩</button>
  <button class="icon" id="snd" title="Sound">🔊</button>
  <a class="icon" href="index.html" title="Home">🏠</a>
 </div>
 <main id="main"></main>
</div>
<script>
/* ============================================================
   common.js  —  shared by every game in the super app
   Names, settings, navigation, credits.
   ============================================================ */
(function (global) {

  var DEFAULTS = {
    child: "Baim",        // the learner
    dad: "Papi Rifky",
    mum: "Mommy Keke",
    sib: "Ade Yahya",
    dadShort: "Papi",
    mumShort: "Mommy",
    childShort: "Baim",
    sibShort: "Ade"
  };

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem("super.names") || "{}");
      var out = {};
      for (var k in DEFAULTS) out[k] = (raw[k] && String(raw[k]).trim()) || DEFAULTS[k];
      return out;
    } catch (e) { return Object.assign({}, DEFAULTS); }
  }
  function save(n) {
    try { localStorage.setItem("super.names", JSON.stringify(n)); } catch (e) {}
    N = load();
  }
  var N = load();

  /* Replace the built-in family names anywhere they appear in text or speech.
     Longest first so "Papi Rifky" wins over "Papi". */
  var MAP = [
    ["Papi Rifky", "dad"], ["Mommy Keke", "mum"], ["Ade Yahya", "sib"],
    ["Rifky", "dadShort"], ["Keke", "mumShort"], ["Yahya", "sibShort"],
    ["Mommy", "mumShort"], ["Papi", "dadShort"], ["Baim", "child"]
  ];
  function P(s) {
    if (s == null) return s;
    s = String(s);
    for (var i = 0; i < MAP.length; i++) {
      var from = MAP[i][0], to = N[MAP[i][1]];
      if (to && to !== from) s = s.split(from).join(to);
    }
    return s;
  }

  /* short forms derived from a full name: "Papi Rifky" -> "Papi" */
  function shorten(full, fallback) {
    if (!full) return fallback;
    var bits = String(full).trim().split(/\s+/);
    return bits[0] || fallback;
  }

  var GAMES = [
    { id: "membaca", file: "membaca.html", icon: "\uD83D\uDCD6", en: "Reading", idn: "Membaca",
      note: "Bahasa Indonesia, metode suku kata", tone: "#0C556C" },
    { id: "english", file: "english.html", icon: "\uD83D\uDDE3\uFE0F", en: "English", idn: "Bahasa Inggris",
      note: "Cambridge Starters & Movers", tone: "#2E7A55" },
    { id: "ensiklopedia", file: "ensiklopedia.html", icon: "\uD83E\uDD81", en: "Encyclopedia", idn: "Ensiklopedia",
      note: "Animals, Latin names, science, stories", tone: "#7A4A22" },
    { id: "dongeng", file: "dongeng.html", icon: "\uD83E\uDD95", en: "Animal Stories", idn: "Dongeng Hewan",
      note: "Interactive tales of Kancil, deer, dinosaurs and Komodo", tone: "#2F6B3F" },
    { id: "siklus", file: "dongeng.html?set=siklus", icon: "\uD83C\uDF0D", en: "Nature Cycles", idn: "Siklus Alam",
      note: "Water, carbon, methane, food chains, climate, energy, oceans and wildlife", tone: "#1F5F8A" },
    { id: "motorik", file: "motorik.html", icon: "\uD83E\uDD38", en: "Motor & Sensory", idn: "Motorik & Sensori",
      note: "Pre-writing worksheets, sticker patterns, sensory games, body movement", tone: "#6B3E9A" },
    { id: "berhitung", file: "berhitung.html", icon: "\uD83D\uDD22", en: "Counting", idn: "Berhitung",
      note: "Food webs, adding and taking away", tone: "#5A3E8A" },
    { id: "menulis", file: "menulis.html", icon: "\u270F\uFE0F", en: "Writing", idn: "Menulis",
      note: "Trace letters, numbers and words", tone: "#8A3552" },
    { id: "runner", file: "runner/index.html", icon: "\uD83C\uDFC3", en: "Move & Learn Runner", idn: "Lari Sambil Belajar",
      note: "Run with your whole body: the water cycle, butterflies, sea life, wildlife and the food chain",
      tone: "#B5541C", group: "move" },
    { id: "petualangan", file: "petualangan.html", icon: "\uD83D\uDE80", en: "Brain & Motor Lab", idn: "Lab Petualangan",
      note: "Six challenge games for a six year old: draw a rocket track, keep the beat with both hands, " +
            "build tangram mirrors, code Kancil through the forest, run the sorting factory, and a " +
            "three-lane runner driven by buttons instead of a camera",
      tone: "#0F7A6B", group: "move" },
    { id: "shalat", file: "islami/shalat.html", icon: "\uD83E\uDDCE", en: "Prayer, step by step", idn: "Shalat",
      note: "92 steps with Arabic, meaning and audio", tone: "#1F6E4C", group: "islami" },
    { id: "doa", file: "islami/doa.html", icon: "\uD83E\uDD32", en: "Everyday duas", idn: "Doa Harian",
      note: "20 duas for waking, eating and travelling", tone: "#0C556C", group: "islami" },
    { id: "juz30", file: "islami/juz30.html", icon: "\uD83D\uDCD6", en: "Memorising Juz 30", idn: "Hafalan Juz 30",
      note: "37 surahs, listen and follow along", tone: "#7A4A22", group: "islami" },

<script>
/* ============================================================
   LAB PETUALANGAN  —  the age-6 motor and mind challenge lab
   Five games that carry Baim from kindergarten worksheets into
   primary school, and that give every skill its own reading:
     1 Insinyur Jalur Roket  causal physics + number bonds
     2 Irama Silang          bilateral rhythm + Go/No-Go
     3 Bengkel Tangram       mental rotation + symmetry
     4 Misi Kancil Kode      4-7 step working memory + planning
     5 Pabrik Sortir Kilat   mid-round rule switching
   Every game pays XP through common.js and records the skill it
   trains in the radar on koleksi.html.
   ============================================================ */
const $ = (id) => document.getElementById(id);
const NM = (window.SUPER && SUPER.P) || ((x) => x);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const S = { lang: LS.get("petualangan.lang", "id"), sound: true, level: 1 };
const T = (p) => NM(S.lang === "en" ? p[1] : p[0]) +
      (S.lang === "both" ? "<small>" + NM(p[1]) + "</small>" : "");
const TI = (p) => NM(S.lang === "en" ? p[1] : p[0]);   /* text only, no <small> */

/* ---------- voices and sounds, the same helpers every page uses ---------- */
let AC = null, vEN = null, vID = null, sayTok = 0;
function pickVoices() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices() || [];
  vEN = vs.find((v) => /^en[-_]?(GB|US)/i.test(v.lang)) || vs.find((v) => /^en/i.test(v.lang)) || null;
  vID = vs.find((v) => /^id[-_]?/i.test(v.lang)) || vs.find((v) => /indones/i.test(v.name)) || null;
}
if ("speechSynthesis" in window) { pickVoices(); speechSynthesis.addEventListener("voiceschanged", pickVoices); setTimeout(pickVoices, 800); }
function speak1(text, lang) {
  text = NM(text);
  return new Promise((res) => {
    if (!S.sound || !("speechSynthesis" in window) || !text || (lang === "id" && !vID)) { res(); return; }
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang === "id" ? "id-ID" : "en-GB";
      u.voice = lang === "id" ? vID : vEN;
      u.rate = lang === "id" ? 0.92 : 0.86; u.pitch = 1.08;
      let d = false; const f = () => { if (!d) { d = true; res(); } };
      u.onend = f; u.onerror = f;
      speechSynthesis.speak(u); setTimeout(f, Math.max(1800, text.length * 85));
    } catch (e) { res(); }
  });
}
function stopAudio() { sayTok++; try { speechSynthesis.cancel(); } catch (e) {} }
async function say(pairs, keep) {
  if (!keep) stopAudio();
  const tok = sayTok;
  for (const p of pairs) {
    if (!p) continue;
    for (const l of (S.lang === "both" ? ["id", "en"] : [S.lang])) {
      if (tok !== sayTok) return;
      await speak1(l === "id" ? p[0] : p[1], l);
    }
  }
}
function tone(f, d, type, g) {
  if (!S.sound) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || "sine"; o.frequency.value = f;
    gn.gain.setValueAtTime(0, AC.currentTime);
    gn.gain.linearRampToValueAtTime(g || 0.15, AC.currentTime + 0.02);
    gn.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(gn).connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
const sfxWin = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.28, "triangle", 0.16), i * 100));
const sfxPop = (n) => { const f = 440 + (n || 0) * 60; tone(f, 0.12, "sine", 0.16); setTimeout(() => tone(f * 1.5, 0.12, "sine", 0.12), 60); };
const sfxWrong = () => { tone(200, 0.2, "sawtooth", 0.09); setTimeout(() => tone(150, 0.24, "sawtooth", 0.08), 100); };
const sfxBell = () => { tone(880, 0.5, "sine", 0.14); setTimeout(() => tone(1320, 0.5, "sine", 0.09), 40); };
document.addEventListener("pointerdown", () => {
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); } catch (e) {}
  if ("speechSynthesis" in window) { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {} }
}, { once: true });
function confetti() {
  const c = ["#FFB247", "#5FE0A4", "#FF6B5B", "#7FC8FF", "#F7E9CC", "#C79BFF"];
  for (let i = 0; i < 46; i++) {
    const d = document.createElement("div");
    d.className = "confetti"; d.style.left = Math.random() * 100 + "vw";
    d.style.background = c[i % c.length]; d.style.animationDelay = Math.random() * 0.5 + "s";
    document.body.appendChild(d); setTimeout(() => d.remove(), 3200);
  }
}
const PRAISE = [["Hebat!", "Great job!"], ["Keren!", "Awesome!"], ["Pintar!", "Clever!"], ["Luar biasa!", "Amazing!"]];
const praise = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];

/* ---------- shared scoring ---------- */
function award(level, wrongs, partial) {
  let r = null;
  try {
    if (window.SUPER && SUPER.score) {
      r = SUPER.score.award("petualangan", { level, wrongs: wrongs || 0, partial });
      if (SUPER.bar && SUPER.bar.fly) SUPER.bar.fly(r.xp, r.streak);
    }
  } catch (e) {}
  return r;
}
function skill(id, n) { try { if (window.SUPER && SUPER.skills) SUPER.skills.bump(id, n); } catch (e) {} }
const BEST = LS.get("petualangan.best", {});
function saveBest(id, stars) { BEST[id] = Math.max(BEST[id] || 0, stars); LS.set("petualangan.best", BEST); }
function starsFor(wrongs) { return wrongs === 0 ? 3 : (wrongs === 1 ? 2 : 1); }

const LVNAME = [["TK", "Kindergarten"], ["Transisi", "Transition"], ["SD Kelas 1", "Grade 1"]];

/* ---------- teardown ----------
   Every game adds window listeners. Changing game, level or language has to
   take the old ones away, or the previous game keeps answering taps. */
let CLEAN = [];
const onCleanup = (fn) => CLEAN.push(fn);
function runCleanup() {
  CLEAN.forEach((f) => { try { f(); } catch (e) {} });
  CLEAN = [];
}
function listenWindow(type, fn, opts) {
  window.addEventListener(type, fn, opts);
  onCleanup(() => window.removeEventListener(type, fn, opts));
}

/* ============================================================
   THE HUB
   ============================================================ */
const GAMES = [
  { id: "roket", icon: ["🚀", "🛠️"], t: ["Insinyur Jalur Roket", "Rocket Track Engineer"], sk: "trace",
    n: ["Gambar jalur, lalu lihat roketmu meluncur dan jatuh karena gaya tarik.", "Draw a track and watch your rocket roll, fall and fly because of gravity."] },
  { id: "irama", icon: ["🥁", "🙌"], t: ["Irama Silang", "Cross-Hand Rhythm"], sk: "rhythm",
    n: ["Ketuk dengan dua tangan, jangan ketuk bom kepiting.", "Tap with both hands, and never tap the crab bombs."] },
  { id: "tangram", icon: ["🔷", "🪞"], t: ["Bengkel Tangram", "Tangram & Mirror Workshop"], sk: "rotation",
    n: ["Putar, balik, dan susun potongan sampai bentuknya jadi.", "Rotate, flip and fit the pieces until the shape appears."] },
  { id: "kancil", icon: ["🦌", "🤖"], t: ["Misi Kancil Kode", "Kancil Code Mission"], sk: "switch",
    n: ["Susun kartu perintah, lalu tekan JALANKAN.", "Line up command cards, then press RUN."] },
  { id: "pabrik", icon: ["🏭", "📦"], t: ["Pabrik Sortir Kilat", "Speed Sorting Factory"], sk: "switch",
    n: ["Sortir barang di ban berjalan sebelum aturannya berganti.", "Sort the belt before the rule changes on you."] },
  { id: "lari", icon: ["🏃", "🛣️"], t: ["Lari Tiga Jalur", "Three-Lane Runner"], sk: "inhibit",
    n: ["Lari dengan tombol: kiri, kanan, lompat, tiarap. Tanpa kamera.", "Run with buttons: left, right, jump, duck. No camera needed."] }
];

function syncTierButtons() {
  document.querySelectorAll("#tiers button").forEach((b) =>
    b.classList.toggle("on", Number(b.dataset.lv) === S.level));
}

function hub() {
  S.view = "hub";
  runCleanup();
  stopAudio();
  const m = $("main");
  const best = (id) => (BEST[id] ? "⭐".repeat(BEST[id]) : "");
  m.innerHTML = `<div class="scroll">
    <h1>${T(["Lab Petualangan", "Adventure Lab"])}</h1>
    <p class="sub">${T(["Lima tantangan untuk Abang Baim yang sudah enam tahun. Pilih tingkat di atas, lalu pilih permainan. Setiap permainan menambah XP, memberi makan hewan di Koleksi, dan mengisi radar keterampilan di halaman orang tua.",
      "Five challenges for a six year old. Pick a level above, then pick a game. Every game adds XP, feeds the animals in Koleksi, and fills in the skills radar on the parents page."])}</p>
    <div class="cards">${GAMES.map((g) => `
      <button class="gcard" data-g="${g.id}">
        ${best(g.id) ? `<span class="sk">${best(g.id)}</span>` : ""}
        <div class="art"><i>${g.icon[0]}</i><i>${g.icon[1]}</i></div>
        <div class="txt">
          <h3>${TI(g.t)}</h3>
          <div class="en">${TI(S.lang === "en" ? g.t : [g.t[1], g.t[0]])}</div>
          <div class="nt">${TI(g.n)}</div>
        </div>
      </button>`).join("")}</div>
    <div class="note">👨‍👩‍👦 <b>${T(["Untuk orang tua", "For parents"])}:</b> ${T([
      "Tingkat 1 untuk TK, tingkat 2 untuk masa transisi ke SD, tingkat 3 untuk kelas 1 SD. Semua bisa dibuka, tidak ada yang dikunci. Dampingi saat bermain, dan berhenti kalau anak lelah.",
      "Level 1 is kindergarten, level 2 is the transition into primary school, level 3 is Grade 1. Nothing is ever locked. Sit alongside, and stop when he is tired."])}</div>
  </div>`;
  m.querySelectorAll("[data-g]").forEach((b) => b.addEventListener("click", () => open(b.dataset.g)));
}

function open(id) {
  const g = GAMES.find((x) => x.id === id);
  if (!g) return hub();
  runCleanup();
  stopAudio();
  const m = $("main");
  m.innerHTML = "";
  const box = document.createElement("div");
  box.className = "scroll";
  box.style.display = "flex";
  box.style.flexDirection = "column";

  g.mount(box, S.level);
}

/* ---------- the little overlay every game ends with ---------- */
function finish(root, o) {
  const stars = starsFor(o.wrongs);
  const r = award(o.level, o.wrongs, o.partial);
  saveBest(o.gameId, stars);

  /* Quality beside the volume, and the tier follows the child: two clean
     wins promote, three or more mistakes in a round step back. */
  let nextTier = o.level;
  try {
    if (window.SUPER && SUPER.skills) {
      const total = Math.max(1, o.questions || 0);
      const right = Math.max(0, total - (o.wrongs || 0));
      SUPER.skills.log(o.gameId, total > 1 ? (100 * right) / total : (o.wrongs ? 40 : 100), o.reactionMs || 0);
    }
    if (window.SUPER && SUPER.tier) {
      nextTier = SUPER.tier.adjust(o.gameId, (o.wrongs || 0) === 0, o.wrongs || 0);
    }
  } catch (e) {}

  if (stars === 3) confetti();
  sfxWin();
  const box = document.createElement("div");
  box.className = "done on";
  box.innerHTML = `<div class="box">
    <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
    <h2>${o.title || T(["Selesai!", "Finished!"])}</h2>
    <p>${o.text || ""}${r ? `<br><small style="color:#6A5A3A">+${r.xp} XP</small>` : ""}</p>
    <div class="row">
      <button class="btn go" data-act="again">🔁 ${o.againLabel || T(["Main lagi", "Play again"])}</button>
      <button class="btn" data-act="hub">🏠 ${T(["Pilih permainan", "Choose a game"])}</button>
    </div></div>`;
  root.style.position = "relative";
  root.appendChild(box);
  box.querySelector('[data-act="again"]').onclick = () => { box.remove(); if (o.again) o.again(); else open(o.gameId); };
  box.querySelector('[data-act="hub"]').onclick = hub;

  if (nextTier !== o.level) {
    const b = document.createElement("button");
    b.className = "btn";
    b.textContent = (nextTier > o.level ? "⬆️ " : "⬇️ ") + T(["Tingkat", "Level"]) + " " + nextTier;
    b.onclick = () => { S.level = nextTier; syncTierButtons(); box.remove(); open(o.gameId); };
    box.querySelector(".row").insertBefore(b, box.querySelector(".row").firstChild);
  }

  say([[o.title ? "" : T(["Selesai!", "Finished!"]), T(["Selesai!", "Finished!"])], praise()]);
  return box;
}

/* ============================================================
   GAME 1 — INSINYUR JALUR ROKET

const ROKET_WORDS = [["ku-da", "ku", "da"], ["ro-ket", "ro", "ket"], ["mo-bil", "mo", "bil"]];

GAMES[0].mount = function (root, lv) {
  S.view = "roket";

  const W = 960, H = 560;                 /* logical drawing board */
  const groundY = H * 0.68;
  const startX = W * 0.10, goalX = W * 0.88;
  const STAGES = 10;
  const SCENES = [
    { n: ["Lembah", "Valley"], gaps: [[0.26, 0.74]], sky: "#E7F6EF", cliff: "#F3E8D2" },
    { n: ["Pulau", "Island"], gaps: [[0.20, 0.38], [0.52, 0.70]], sky: "#E7F1FB", cliff: "#EDE6D6" },
    { n: ["Dinding", "Wall"], gaps: [[0.24, 0.78]], hole: [0.16, 0.46], walls: [0.50], sky: "#F1EAFB", cliff: "#EFE2E8" },
    { n: ["Batu", "Boulder"], gaps: [[0.26, 0.74]], rocks: [0.50], sky: "#FDF0E5", cliff: "#F3E4CE" },
    { n: ["Jurang Panjang", "Long Canyon"], gaps: [[0.20, 0.80]], sky: "#EDF7E4", cliff: "#EDE9CF" },
    { n: ["Dua Dinding", "Twin Wall"], gaps: [[0.22, 0.80]], hole: [0.14, 0.42], walls: [0.34, 0.58], sky: "#EFE9F9", cliff: "#E9E2F0" },
    { n: ["Dua Batu", "Twin Boulder"], gaps: [[0.26, 0.74]], rocks: [0.38, 0.62], sky: "#FBEDE5", cliff: "#F2E1D2" },
    { n: ["Tiga Pulau", "Three Islands"], gaps: [[0.16, 0.30], [0.42, 0.56], [0.68, 0.82]], sky: "#E5F6F8", cliff: "#E7E7D8" },
    { n: ["Badai", "Storm"], gaps: [[0.22, 0.80]], hole: [0.18, 0.44], walls: [0.36], rocks: [0.62], sky: "#EDEDF6", cliff: "#E4E4EE" },
    { n: ["Puncak", "Summit"], gaps: [[0.20, 0.82]], hole: [0.16, 0.42], walls: [0.34, 0.52], rocks: [0.66], sky: "#FFF0E0", cliff: "#F6E0C8" }
  ];
  const TARGETS = [10, 10, 10, 10, 11, 11, 11, 12, 12, 13];

  /* Ten scenes, each with its own silhouette, its own colour and its own
     hazard mix. The numbers are fractions of the board, so the same recipe
     scales to any screen. */
  function pickPair(sum) {
    const a = 1 + Math.floor(Math.random() * (sum - 2));
    return [a, sum - a];
  }

  function makeScene(i) {
    const idx = Math.max(0, Math.min(SCENES.length - 1, i));
    const r = SCENES[idx];
    const sc = {
      idx, name: r.n, sky: r.sky, cliff: r.cliff || "#F3E8D2",
      walls: [], rocks: [], stars: [], gates: [], target: TARGETS[idx]
    };

    sc.gaps = r.gaps.map((g) => [W * g[0], W * g[1]]);
    sc.left = sc.gaps[0][0];
    sc.right = sc.gaps[sc.gaps.length - 1][1];

    sc.platforms = [[0, sc.gaps[0][0]]];
    for (let g = 0; g < sc.gaps.length - 1; g++) sc.platforms.push([sc.gaps[g][1], sc.gaps[g + 1][0]]);
    sc.platforms.push([sc.gaps[sc.gaps.length - 1][1], W]);

    (r.walls || []).forEach((x) => {
      const hole = r.hole || [0.14, 0.46];
      sc.walls.push({ x: W * x, top: H * hole[0], bottom: H * hole[1] });
    });
    (r.rocks || []).forEach((x) => {
      sc.rocks.push({ x: W * x, restY: H * 0.48, y: -70, state: "idle" });
    });

    const pair = pickPair(sc.target);
    sc.gates.push({ x: W * 0.34, y: H * 0.36, v: pair[0] });
    sc.gates.push({ x: W * 0.64, y: H * 0.30, v: pair[1] });

    const starCount = 3;
    for (let k = 0; k < starCount; k++) {
      const t = (k + 1) / (starCount + 1);
      sc.stars.push({
        x: sc.left + (sc.right - sc.left) * t,
        y: Math.max(H * 0.16, groundY - 80 - Math.sin(t * Math.PI * 3 + idx) * 55),
        got: false
      });
    }
    return sc;
  }

  let scene = makeScene(0);
  let stageIdx = 0;
  let path = [], stroke = [], drawing = false, continuing = false, ink = 0;
  let phase = "draw", wrongs = 0, turbo = false;
  let rover = null, raf = 0, last = 0, gotStars = 0, gatesHit = 0;
  let passedGates = [], rubber = false, clocks = 0;

  const inkMax = (goalX - startX) * (lv === 1 ? 2.1 : lv === 2 ? 1.8 : 1.55);

  root.innerHTML = `
    <div class="playhead">
      <div class="ttl">🚀 ${T(["Insinyur Jalur Roket", "Rocket Track Engineer"])}
        <small id="rkSub">${T(["Adegan", "Scene"])} 1/${STAGES}</small></div>
      <button class="btn small" id="rkRub">🧽 ${T(["Hapus", "Erase"])}</button>
      ${lv >= 2 ? `<button class="btn small" id="rkMode">🎈 ${T(["Karet", "Rubber"])}</button>` : ""}
      <button class="btn go" id="rkGo">▶ ${T(["Jalankan", "Run"])}</button>
    </div>
    <div class="hud">
      <span class="pill" id="rkScene">🎬 1/${STAGES}</span>
      <span class="pill" id="rkInk">🖊️ ${T(["Tinta", "Ink"])} 100%</span>
      <span class="pill" id="rkStar">⭐ 0</span>
      <span class="pill" id="rkGate">🔢 0/${STAGES * 2}</span>
    </div>
    <div class="dots" id="rkDots"></div>
    <div class="stageBox" id="rkStage">
      <canvas id="rkCv"></canvas>
      <div class="hint" id="rkHint"></div>
    </div>
    <div class="meter"><i id="rkMeter"></i></div>`;

  const c = $("rkCv"), ctx = c.getContext("2d");
  let px = 1, py = 1;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  function fit() {
    const box = $("rkStage").getBoundingClientRect();
    px = box.width; py = box.height;
    c.width = Math.round(px * dpr); c.height = Math.round(py * dpr);
    c.style.width = px + "px"; c.style.height = py + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  const sx = () => px / W, sy = () => py / H;
  const frameIndex = (n) => ((window.SUPER && SUPER.anim) ? SUPER.anim.frameIndex(n)
                                                          : Math.floor(performance.now() / 125) % (n || 4));

  /* ---------------------------------------------------------------- geometry */
  function pathY(x) {
    if (path.length < 2) return null;
    if (x < path[0].x || x > path[path.length - 1].x) return null;
    for (let i = 1; i < path.length; i++) {
      if (x <= path[i].x) {
        const a = path[i - 1], b = path[i];
        const t = (x - a.x) / Math.max(1e-6, b.x - a.x);
        return a.y + (b.y - a.y) * t;
      }
    }
    return path[path.length - 1].y;
  }

  function newRover() {
    return { x: startX, y: groundY, vx: 150, vy: 0, air: false, dead: false, won: false, reason: null };
  }

  function resetHazards() {
    scene.rocks.forEach((k) => { k.y = -70; k.state = "idle"; });
  }

  /* ---------------------------------------------------------------- drawing */
  function clampPoint(p) {
    return { x: Math.max(0, Math.min(W, p.x)), y: Math.max(20, Math.min(H - 20, p.y)) };
  }
  function normalise(points) {
    const sorted = points.slice().sort((a, b) => a.x - b.x);
    const out = [];
    for (const p of sorted) {
      const prev = out[out.length - 1];
      if (prev && Math.abs(p.x - prev.x) < 3) { prev.y = p.y; continue; }
      out.push({ x: p.x, y: p.y });
    }
    return out;
  }
  function anchor(pts) {
    if (!pts.length) return pts;
    /* The track always begins exactly on the launch pad. Anything drawn left
       of it is dropped, and the first point is replaced by the pad itself, so
       pathY(startX) is always defined even when the touch landed a hair to the
       right of it. */
    const body = pts.filter((p) => p.x > startX + 1);
    const out = [{ x: startX, y: groundY }].concat(body);
    const end = out[out.length - 1];
    if (end.x > goalX - 130 && end.x < goalX - 2) out.push({ x: goalX, y: groundY });
    return out;
  }
  function commitStroke() {
    if (!stroke.length) return;
    const pts = normalise(stroke);
    path = (continuing && path.length) ? normalise(path.concat(pts)) : pts;
    path = anchor(path);
    ink = 0;
    for (let i = 1; i < path.length; i++) ink += Math.hypot(path[i].x - path[i - 1].x, path[i].y - path[i - 1].y);
    judgeTrack();
  }

  const toWorld = (e) => {
    const r = c.getBoundingClientRect();
    return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
  };

  c.addEventListener("pointerdown", (e) => {
    if (phase !== "draw") return;
    const p = toWorld(e);
    const tip = path[path.length - 1];
    continuing = !!(tip && Math.hypot(p.x - tip.x, p.y - tip.y) < 80);
    if (!continuing) { path = []; ink = 0; passedGates = []; turbo = false; scene.stars.forEach((s) => s.got = false); countStarsNow(); }
    drawing = true;
    stroke = [clampPoint(p)];
    try { c.setPointerCapture(e.pointerId); } catch (er) {}
    updHud(); draw();
  });
  c.addEventListener("pointermove", (e) => {
    if (!drawing || phase !== "draw") return;
    const q = clampPoint(toWorld(e));
    const lastP = stroke[stroke.length - 1];
    if (!lastP) { stroke.push(q); return; }
    const d = Math.hypot(q.x - lastP.x, q.y - lastP.y);
    if (d < 3) return;
    if (ink + d > inkMax) {
      hint([["Tintanya habis. Tekan Hapus lalu gambar lebih pendek.", "Out of ink. Tap Erase and draw a shorter line."]]);
      return;
    }
    ink += d;
    stroke.push(q);
    updHud(); draw();
  });
  const endStroke = () => {
    if (!drawing) return;
    drawing = false;
    commitStroke();
    stroke = [];
    draw();
  };
  c.addEventListener("pointerup", endStroke);
  c.addEventListener("pointercancel", endStroke);

  let sceneStars = 0;
  function countStarsNow() {
    sceneStars = scene.stars.filter((s) => s.got).length;
  }

  function judgeTrack() {
    if (path.length < 2) {
      hint([["Gambar dari roket di kiri sampai kotak hadiah di kanan.", "Draw from the rocket on the left to the present on the right."]]);
      return;
    }
    scene.stars.forEach((s) => {
      const was = s.got;
      s.got = path.some((p) => Math.hypot(p.x - s.x, p.y - s.y) < 34);
      if (s.got && !was) gotStars++;
    });
    passedGates = scene.gates.filter((gt) => path.some((p) => Math.hypot(p.x - gt.x, p.y - gt.y) < 40));
    gatesHit = Math.max(gatesHit, 0);
    turbo = passedGates.length >= 2 &&
      passedGates[0].v + passedGates[1].v === scene.target;
    countStarsNow();
    updHud(); draw();
    const end = path[path.length - 1];
    if (end.x < goalX - 4) {
      hint([["Jalurnya belum sampai ke seberang. Tarik terus sampai kotak hadiah.", "The track stops before the far side. Keep drawing to the present."]]);
    } else if (turbo) {
      hint([["Gerbangnya berjumlah " + scene.target + "! Turbo menyala!", "Those gates add up to " + scene.target + "! Turbo on!"]]);
    } else {
      hint([["Tekan Jalankan.", "Press Run."]]);
    }
  }

  function updHud() {
    const pct = Math.max(0, 100 - (ink / inkMax) * 100);
    $("rkMeter").style.width = pct + "%";
    $("rkInk").textContent = "🖊️ " + T(["Tinta", "Ink"]) + " " + Math.round(pct) + "%";
    $("rkStar").textContent = "⭐ " + gotStars + "/" + (STAGES * 3);
    $("rkGate").textContent = "🔢 " + (gatesHit + passedGates.length) + "/" + (STAGES * 2);
    $("rkScene").textContent = "🎬 " + (stageIdx + 1) + "/" + STAGES;
    $("rkSub").textContent = T(["Adegan", "Scene"]) + " " + (stageIdx + 1) + "/" + STAGES +
                             " · " + TI(scene.name);
    $("rkDots").innerHTML = SCENES.map((s, i) =>
      `<i class="${i < stageIdx ? "done" : ""}${i === stageIdx ? " now" : ""}${i === STAGES - 1 ? " boss" : ""}"></i>`).join("");
  }

  function hint(pair) { $("rkHint").innerHTML = T(pair); }

  /* ---------------------------------------------------------------- render */
  function drawCliff(x0, x1) {
    if (x1 - x0 < 2) return;
    const SX = sx(), SY = sy(), r = 10;
    ctx.beginPath();
    ctx.moveTo(x0 * SX, py);
    ctx.lineTo(x0 * SX, groundY * SY + r);
    ctx.quadraticCurveTo(x0 * SX, groundY * SY, x0 * SX + r, groundY * SY);
    ctx.lineTo(x1 * SX - r, groundY * SY);
    ctx.quadraticCurveTo(x1 * SX, groundY * SY, x1 * SX, groundY * SY + r);
    ctx.lineTo(x1 * SX, py);
    ctx.closePath();
    ctx.fillStyle = scene.cliff;
    ctx.fill();
    ctx.strokeStyle = "#1E293B";
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }

  function gear(cx, cy, rad, phase) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a0 = phase + (i / 8) * Math.PI * 2;
      ctx.moveTo(cx + Math.cos(a0) * rad * 0.55, cy + Math.sin(a0) * rad * 0.55);
      ctx.lineTo(cx + Math.cos(a0) * rad, cy + Math.sin(a0) * rad);
    }
    ctx.strokeStyle = "#1E293B"; ctx.lineWidth = 2.2; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, rad * 0.62, 0, Math.PI * 2);
    ctx.fillStyle = "#F3E8D2"; ctx.fill();
    ctx.strokeStyle = "#1E293B"; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, rad * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = "#1E293B"; ctx.fill();
  }

  function drawRover(r) {
    const SX = sx(), SY = sy();
    const s = Math.max(0.55, Math.min(1.25, (SX + SY) / 2.4));
    const gx = r.x * SX, gy = r.y * SY;
    const w = 78 * s, h = 50 * s, rad = 17 * s;
    const f = frameIndex(4);
    const phase = (f * Math.PI) / 4;
    const dip = [-3, 2, 0, 0][f] * s;

    ctx.save();
    ctx.translate(gx, gy - h / 2 + dip);
    ctx.strokeStyle = "#1E293B"; ctx.lineWidth = 2.4 * s;
    ctx.fillStyle = "#0EA5E9";
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.lineTo(-w / 2 + 10 * s, -h * 0.62);
    ctx.lineTo(w / 2 - 16 * s, -h * 0.62);
    ctx.lineTo(w / 2, -h * 0.12);
    ctx.lineTo(w / 2, 0);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#EF4444";
    ctx.beginPath();
    ctx.ellipse(w / 2 - 7 * s, -h * 0.34, 12 * s, 10 * s, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    const flame = [10, 18, 26, 16][f] * s;
    ctx.fillStyle = f === 2 ? "#F59E0B" : "#FB923C";
    ctx.beginPath();
    ctx.moveTo(-w / 2, -h * 0.30);
    ctx.lineTo(-w / 2 - flame, -h * 0.22);
    ctx.lineTo(-w / 2, -h * 0.12);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    gear(gx - w * 0.22, gy - rad * 0.75, rad, phase);
    gear(gx + w * 0.24, gy - rad * 0.75, rad, -phase);
  }

  function draw() {
    if (!px) return;
    const SX = sx(), SY = sy();
    ctx.clearRect(0, 0, px, py);

    ctx.fillStyle = "#FFFDF7";
    ctx.fillRect(0, 0, px, py);
    /* each scene has its own wash, so no two boards look alike */
    const wash = ctx.createRadialGradient(px * 0.5, py * 0.05, 0, px * 0.5, py * 0.05, px * 0.95);
    wash.addColorStop(0, scene.sky);
    wash.addColorStop(1, "rgba(255,253,247,0)");
    ctx.fillStyle = wash;
    ctx.fillRect(0, 0, px, py);
    ctx.fillStyle = "rgba(30,41,59,.10)";
    for (let x = 28; x < px; x += 28) {
      for (let y = 28; y < py; y += 28) {
        ctx.beginPath(); ctx.arc(x, y, 0.9, 0, Math.PI * 2); ctx.fill();
      }
    }
    /* the scene number, stamped large and faint */
    ctx.fillStyle = "rgba(30,41,59,.07)";
    ctx.font = `bold ${Math.round(py * 0.52)}px Fredoka, sans-serif`;
    ctx.textAlign = "right"; ctx.textBaseline = "top";
    ctx.fillText(String(stageIdx + 1), px - 18, 4);

    /* the drops, hatched so they read as a fall */
    scene.gaps.forEach((g) => {
      ctx.save();
      ctx.beginPath();
      ctx.rect(g[0] * SX, groundY * SY, (g[1] - g[0]) * SX, py - groundY * SY);
      ctx.clip();
      ctx.strokeStyle = "rgba(239,68,68,.22)";
      ctx.lineWidth = 1.4;
      for (let x = g[0] * SX - py; x < g[1] * SX; x += 16) {
        ctx.beginPath();
        ctx.moveTo(x, groundY * SY);
        ctx.lineTo(x + (py - groundY * SY), py);
        ctx.stroke();
      }
      ctx.restore();
    });

    scene.platforms.forEach((p) => drawCliff(p[0], p[1]));

    /* level 1 keeps a wide guide band over the whole crossing */
    if (lv === 1) {
      ctx.save();
      ctx.strokeStyle = "rgba(16,185,129,.18)";
      ctx.lineWidth = 34 * Math.min(SX, SY) * 0.8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(scene.left * SX, groundY * SY);
      ctx.bezierCurveTo(W * 0.40 * SX, (groundY - 140) * SY,
                        W * 0.60 * SX, (groundY - 140) * SY,
                        scene.right * SX, groundY * SY);
      ctx.stroke();
      ctx.restore();
    }

    /* the crate at the far side */
    ctx.fillStyle = "#1E293B";
    ctx.fillRect(goalX * SX - 1, (groundY - 96) * SY, 3, 96 * SY);
    ctx.font = `${Math.round(34 * Math.min(SX, SY) * 1.1)}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("🎁", goalX * SX + 26 * SX, (groundY - 74) * SY);

    /* walls: a solid slab with a hole the track has to thread */
    scene.walls.forEach((wl) => {
      const x0 = (wl.x - 12) * SX, x1 = (wl.x + 12) * SX;
      ctx.fillStyle = "#8B5CF6";
      ctx.strokeStyle = "#4C1D95"; ctx.lineWidth = 2;
      ctx.fillRect(x0, 0, x1 - x0, wl.top * SY);
      ctx.strokeRect(x0, 0, x1 - x0, wl.top * SY);
      ctx.fillRect(x0, wl.bottom * SY, x1 - x0, groundY * SY - wl.bottom * SY);
      ctx.strokeRect(x0, wl.bottom * SY, x1 - x0, groundY * SY - wl.bottom * SY);
      /* the hole glows so it reads as "go through here" */
      ctx.fillStyle = "rgba(95,224,164,.22)";
      ctx.fillRect(x0, wl.top * SY, x1 - x0, (wl.bottom - wl.top) * SY);
      ctx.strokeStyle = "#10B981"; ctx.lineWidth = 2;
      ctx.strokeRect(x0 + 1, wl.top * SY + 1, x1 - x0 - 2, (wl.bottom - wl.top) * SY - 2);
    });

    /* boulders: idle shows where it will land, then it drops when it hears him */
    scene.rocks.forEach((k) => {
      if (k.state === "idle") {
        ctx.beginPath();
        ctx.arc(k.x * SX, k.restY * SY, 26 * Math.min(SX, SY), 0, Math.PI * 2);
        ctx.fillStyle = "rgba(239,68,68,.10)";
        ctx.fill();
        ctx.strokeStyle = "rgba(239,68,68,.7)";
        ctx.setLineDash([6, 5]); ctx.lineWidth = 2; ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(239,68,68,.85)";
        ctx.font = `bold ${Math.round(15 * Math.min(SX, SY) * 1.2)}px Fredoka, sans-serif`;
        ctx.fillText(T(["lompati", "cross high"]), k.x * SX, (k.restY + 48) * SY);
      } else {
        ctx.font = `${Math.round(44 * Math.min(SX, SY) * 1.2)}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
        ctx.fillText("🪨", k.x * SX, (k.y) * SY);
      }
    });

    /* number-bond rings */
    scene.gates.forEach((gt) => {
      const ok = passedGates.includes(gt);
      const rad = 30 * (SX + SY) / 2 * 0.55;
      ctx.beginPath();
      ctx.arc(gt.x * SX, gt.y * SY, rad + 6, 0, Math.PI * 2);
      ctx.strokeStyle = ok ? "rgba(16,185,129,.35)" : "rgba(245,158,11,.30)";
      ctx.lineWidth = 9; ctx.stroke();
      ctx.beginPath();
      ctx.arc(gt.x * SX, gt.y * SY, rad, 0, Math.PI * 2);
      ctx.fillStyle = ok ? "rgba(16,185,129,.22)" : "rgba(245,158,11,.18)";
      ctx.fill();
      ctx.strokeStyle = ok ? "#10B981" : "#F59E0B"; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = "#1E293B";
      ctx.font = `bold ${Math.round(22 * Math.min(SX, SY) * 1.2)}px Fredoka, system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(gt.v, gt.x * SX, gt.y * SY);
    });

    /* stars */
    scene.stars.forEach((s) => {
      if (s.got) return;
      ctx.font = `${Math.round(26 * Math.min(SX, SY) * 1.2)}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText("⭐", s.x * SX, s.y * SY);
    });

    /* the track */
    const inkColor = rubber ? "#EC4899" : "#0EA5E9";
    const drawLine = (line) => {
      if (line.length < 2) return;
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.strokeStyle = rubber ? "rgba(236,72,153,.22)" : "rgba(14,165,233,.18)";
      ctx.lineWidth = 18 * Math.min(SX, SY);
      ctx.beginPath();
      ctx.moveTo(line[0].x * SX, line[0].y * SY);
      for (let i = 1; i < line.length; i++) ctx.lineTo(line[i].x * SX, line[i].y * SY);
      ctx.stroke();
      ctx.strokeStyle = inkColor;
      ctx.lineWidth = 5 * Math.min(SX, SY);
      ctx.stroke();
    };
    drawLine(path);
    if (drawing) drawLine(stroke);

    /* the launch pad */
    ctx.beginPath();
    ctx.arc(startX * SX, groundY * SY, 15 * Math.min(SX, SY), 0, Math.PI * 2);
    ctx.fillStyle = "rgba(16,185,129,.16)";
    ctx.fill();
    ctx.strokeStyle = "rgba(16,185,129,.85)";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([5, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    drawRover(rover || { x: startX, y: groundY });
  }

  /* ---------------------------------------------------------------- run */
  function reset() {
    phase = "draw"; path = []; stroke = []; ink = 0; rover = null;
    passedGates = []; turbo = false; drawing = false; continuing = false;
    scene.stars.forEach((s) => s.got = false);
    sceneStars = 0;
    resetHazards();
    $("rkGo").disabled = false;
    updHud(); draw();
    hint([["Adegan " + (stageIdx + 1) + ": mulai dari roket, tarik lewat gerbang berjumlah " +
           scene.target + ", sampai kotak hadiah.", "Scene " + (stageIdx + 1) + ": start at the rocket, draw through gates that add up to " +
           scene.target + ", and reach the present."]]);
  }

  function bankGates() {
    gatesHit += passedGates.length;
    passedGates = [];
    updHud();
  }

  function nextStage() {
    bankGates();
    stageIdx++;
    if (stageIdx >= STAGES) { stageIdx = STAGES - 1; return; }
    scene = makeScene(stageIdx);
    sfxWin();
    reset();
    hint([["Bagus! Adegan berikutnya.", "Nice! Here comes the next one."]]);
    say([["Bagus! Adegan berikutnya.", "Nice! Next scene."]]);
  }

  $("rkRub").onclick = () => { stop(); reset(); };
  if ($("rkMode")) $("rkMode").onclick = () => {
    rubber = !rubber;
    $("rkMode").textContent = rubber ? "🛠️ " + TI(["Baja", "Steel"]) : "🎈 " + TI(["Karet", "Rubber"]);
    tone(rubber ? 620 : 320, 0.12, "sine", 0.12);
    hint(rubber
      ? [["Tinta karet: jalur yang putus sedikit akan memantul.", "Rubber ink: a small break in the track will bounce."]]
      : [["Tinta baja: jalur harus bersambung penuh.", "Steel ink: the track must be unbroken."]]);
    draw();
  };
  $("rkGo").onclick = () => {
    if (phase !== "draw") return;
    if (path.length < 2) {
      hint([["Gambarlah jalurnya dulu, dari roket sampai kotak hadiah.", "Draw the track first, from the rocket to the present."]]);
      return;
    }
    phase = "run"; $("rkGo").disabled = true;
    resetHazards();
    rover = newRover();
    if (turbo) rover.vx = 260;
    last = performance.now();
    say([[turbo ? "Turbo! Ayo!" : "Ayo!", turbo ? "Turbo! Go!" : "Go!"]]);
    loop();
  };

  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; }

  function loop(t) {
    raf = requestAnimationFrame(loop);
    const now = t || performance.now();
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    if (!rover || rover.dead) return;
    step(dt);
    draw();
    if (rover.won || rover.dead) { stop(); endRun(); }
  }

  function step(dt) {
    const r = rover;
    if (r.air) {
      r.vy += 1500 * dt;
      r.x += r.vx * dt;
      r.y += r.vy * dt;
      if (r.y > H + 60) r.dead = true;
      return;
    }

    /* the boulder drops when he gets close, then it is a wall in the air */
    scene.rocks.forEach((k) => {
      if (k.state === "idle" && r.x > k.x - 240) k.state = "falling";
      if (k.state === "falling") {
        k.y += 1100 * dt;
        if (k.y >= k.restY) { k.y = k.restY; k.state = "rest"; tone(120, 0.18, "square", 0.10); }
      }
      if (k.state === "rest" && Math.abs(r.x - k.x) < 30 && Math.abs((r.y - 26) - k.y) < 42) {
        r.dead = true; r.reason = "rock"; return;
      }
    });

    let y = pathY(r.x);
    if (y == null && rubber) {
      let best = null, bd = 1e9;
      for (const p of path) {
        const d = Math.abs(p.x - r.x);
        if (d < bd) { bd = d; best = p; }
      }
      if (best && bd < 70) { y = best.y - 6; r.vx = Math.max(r.vx, 240); }
    }
    if (y == null) {
      r.air = true;
      r.reason = (path.length && path[path.length - 1].x < goalX - 10) ? "short" : "fell";
      r.vy = 60;
      return;
    }

    const ahead = pathY(r.x + 14);
    const slope = ahead == null ? 0 : (ahead - y) / 14;
    const g = 1500;
    r.vx += (g * slope / Math.sqrt(1 + slope * slope)) * dt * 0.55;
    const cap = turbo ? 620 : 420;
    r.vx = Math.max(70, Math.min(cap, r.vx));
    r.x += r.vx * dt;
    if (r.x >= goalX - 2) { r.won = true; r.x = goalX; r.y = groundY; return; }
    const ny = pathY(r.x);
    r.y = ny == null ? y : ny;

    /* a wall only lets the track through its hole */
    for (const wl of scene.walls) {
      if (r.x > wl.x - 7 && r.x < wl.x + 7 && (r.y < wl.top || r.y > wl.bottom)) {
        r.dead = true; r.reason = "wall";
        return;
      }
    }

    /* stars are collected as he passes */
    scene.stars.forEach((s) => {
      if (!s.got && Math.hypot(r.x - s.x, r.y - s.y) < 34) {
        s.got = true; gotStars++; sceneStars++; sfxPop(sceneStars);
      }
    });
  }

  function endRun() {
    const r = rover;
    if (r.won) {
      skill("trace", 2);
      if (stageIdx < STAGES - 1) { phase = "between"; nextStage(); return; }
      bankGates();
      phase = "won";
      if (lv === 1) { countStars(); return; }
      win();
      return;
    }
    wrongs++;
    phase = "draw";
    sfxWrong();
    const why = r.reason === "wall"
      ? ["Jalurnya menabrak dinding. Coba lewat lubangnya.", "The track hit the wall. Try through the hole."]
      : r.reason === "rock"
        ? ["Batu Besar jatuh menimpanya. Gambar jalurnya lebih tinggi di situ.", "The boulder landed on it. Draw the track higher there."]
        : r.reason === "short"
          ? ["Jalurnya berhenti sebelum seberang. Tarik terus sampai kotak hadiah.", "The track stopped before the far side. Draw all the way to the present."]
          : ["Roketnya jatuh ke jurang. Jalurnya harus menyambung sampai seberang.", "The rocket fell into the canyon. The track has to reach the other side."];
    hint(why);
    say([why]);
    resetHazards();
    $("rkGo").disabled = false;
    rover = null;
    draw();
  }

  /* Level 1 asks him to count the stars from the scene he just finished. */
  function countStars() {
    phase = "ask";
    const right = Math.max(0, Math.min(3, sceneStars));
    const others = [0, 1, 2, 3].filter((v) => v !== right).sort(() => Math.random() - 0.5);
    const opts = [right].concat(others.slice(0, 3)).sort(() => Math.random() - 0.5);
    const box = document.createElement("div");
    box.className = "done on";
    box.innerHTML = `<div class="box">
      <h2>${T(["Berapa bintang di adegan terakhir?", "How many stars in the last scene?"])}</h2>
      <p style="font-size:22px;letter-spacing:2px">${"⭐".repeat(right) || "—"}</p>
      <div class="row" style="gap:10px">${opts.map((v) => `<button class="btn go" data-v="${v}" style="font-size:22px;min-width:58px">${v}</button>`).join("")}</div>
    </div>`;
    $("rkStage").appendChild(box);
    say([["Berapa bintang di adegan terakhir?", "How many stars in the last scene?"]]);
    box.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => {
      if (Number(b.dataset.v) === right) { box.remove(); win(); }
      else { b.style.opacity = .35; wrongs++; sfxWrong(); say([["Coba hitung lagi.", "Count again."]]); }
    });
  }

  /* Level 3: trace the two-syllable word to open the hangar door. */
  function hangar() {
    phase = "hangar";
    const word = ROKET_WORDS[Math.floor(Math.random() * ROKET_WORDS.length)];
    const box = document.createElement("div");
    box.className = "done on";
    box.innerHTML = `<div class="box" style="max-width:520px">
      <h2>${T(["Pintu hanggar terkunci!", "The hangar door is locked!"])}</h2>
      <p>${T(["Tebalkan tulisan ini untuk membukanya.", "Trace this word to open it."])}</p>
      <div style="position:relative;width:100%;height:110px;background:#FFFDF6;border-radius:14px;overflow:hidden">
        <div id="hwGuide" style="position:absolute;inset:0;display:grid;place-items:center;font-family:Fredoka,sans-serif;
             font-size:64px;color:#D9CBA6;letter-spacing:4px">${word[0]}</div>
        <canvas id="hwCv" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas>
      </div>
      <div class="meter" style="margin-top:8px"><i id="hwMeter" style="width:0%"></i></div>
      <div class="row"><button class="btn go" id="hwDone">🔓 ${T(["Buka", "Open"])}</button></div>
    </div>`;
    $("rkStage").appendChild(box);
    const cv = $("hwCv"), hc = cv.getContext("2d");
    let hp = [], drawing2 = false, cover = 0;
    const fitH = () => {
      const r = cv.getBoundingClientRect();
      cv.width = r.width * dpr; cv.height = r.height * dpr;
      hc.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    setTimeout(fitH, 30); window.addEventListener("resize", fitH);
    onCleanup(() => window.removeEventListener("resize", fitH));
    const hpt = (e) => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    cv.addEventListener("pointerdown", (e) => {
      drawing2 = true; hp = [];
      try { cv.setPointerCapture(e.pointerId); } catch (er) {}
      hp.push(hpt(e));
    });
    cv.addEventListener("pointermove", (e) => {
      if (!drawing2) return;
      const p = hpt(e);
      const a = hp[hp.length - 1] || p;
      if (Math.hypot(p.x - a.x, p.y - a.y) < 2) return;
      hp.push(p);
      hc.strokeStyle = "#1C6B7A"; hc.lineWidth = 6; hc.lineCap = "round";
      hc.beginPath(); hc.moveTo(a.x, a.y); hc.lineTo(p.x, p.y); hc.stroke();
      cover = Math.min(100, Math.round(100 * Math.min(1, hp.length / 90)));
      $("hwMeter").style.width = cover + "%";
    });
    cv.addEventListener("pointerup", () => { drawing2 = false; });
    $("hwDone").onclick = () => {
      if (cover >= 45 || hp.length > 60) { box.remove(); win(); }
      else { sfxWrong(); wrongs++; say([["Tebalkan lebih penuh lagi.", "Trace more of the word."]]); }
    };
    say([["Tebalkan kata " + word[0], "Trace the word " + word[1]]]);
  }

  function win() {
    phase = "won";
    finish($("rkStage"), {
      gameId: "roket", level: lv, wrongs,
      questions: 3 + gatesHit + (gotStars ? 1 : 0),
      title: T(["Roketnya mendarat!", "The rocket landed!"]),
      text: T(["Bintang: " + gotStars + " · Gerbang: " + gatesHit + "/" + (STAGES * 2) + " · Adegan: " + STAGES + "/" + STAGES,
               "Stars: " + gotStars + " · Gates: " + gatesHit + "/" + (STAGES * 2) + " · Scenes: " + STAGES + "/" + STAGES]),
      again: () => open("roket")
    });
  }

  window.addEventListener("resize", fit);
  onCleanup(() => window.removeEventListener("resize", fit));
  setTimeout(fit, 30);
  reset();
};

/* ============================================================
   GAME 2 — IRAMA SILANG (Go / No-Go)
   Four lanes, two hands. Green is a plain tap, purple is a cross
   (the other hand takes it), a red crab bomb must be left alone,
   and from level 2 a number means "left hand for even, right hand
   for odd". Level 3 takes the notes away and asks for the pattern
   back from memory.
   ============================================================ */
const PAD_KEYS = ["a", "s", "j", "k"];

GAMES[1].mount = function (root, lv) {
  S.view = "irama";
  const bpm = lv === 1 ? 80 : (lv === 2 ? 100 : 112);
  const beatMs = 60000 / bpm;
  const fallBeats = 2.2;                 /* a note takes this many beats to fall */

  let notes = [], raf = 0, last = 0, spawnAt = 0, beat = 0;
  let wrongs = 0, hits = 0, misses = 0, running = false, ending = false;
  const ROUND = lv === 1 ? 22 : (lv === 2 ? 26 : 24);
  const endAt = beat + ROUND;

  root.innerHTML = `
    <div class="playhead">
      <div class="ttl">🥁 ${T(["Irama Silang", "Cross-Hand Rhythm"])}
        <small>${T(["Tingkat", "Level"])} ${lv} · ${bpm} BPM</small></div>
      <button class="btn small" id="irStop">⏹ ${T(["Berhenti", "Stop"])}</button>
    </div>
    <div class="hud">
      <span class="pill" id="irHit">✅ 0</span>
      <span class="pill" id="irMiss">❌ 0</span>
      <span class="pill" id="irBeat">🎵 0/${ROUND}</span>
    </div>
    <div class="lanes" id="irLanes">
      <div class="carry" id="irCall"></div>
      ${[0, 1, 2, 3].map((i) => `<div class="lane" data-l="${i}"><div class="judge"></div></div>`).join("")}
    </div>
    <div class="pads">${[0, 1, 2, 3].map((i) =>
      `<button class="pad" data-p="${i}">${["🖐️", "✋", "🤚", "🖐️"][i]}<small>${PAD_KEYS[i].toUpperCase()}</small></button>`).join("")}</div>
    <div class="hint" style="position:static;transform:none;margin-top:6px;border-radius:14px" id="irHint"></div>`;

  if (lv === 3) return echoMode();

  const lanes = Array.from(root.querySelectorAll(".lane"));
  const pads = Array.from(root.querySelectorAll(".pad"));
  const hallH = () => $("irLanes").getBoundingClientRect().height || 320;
  let judgeY = 0;
  setTimeout(() => { judgeY = hallH() - 70; }, 50);

  function hint(pair) { $("irHint").innerHTML = T(pair); }
  function upd() {
    $("irHit").textContent = "✅ " + hits;
    $("irMiss").textContent = "❌ " + wrongs;
    $("irBeat").textContent = "🎵 " + Math.min(ROUND, beat) + "/" + ROUND;
  }

  function makeNote(k) {
    const roll = Math.random();
    const lane = Math.floor(Math.random() * 4);
    let kind = "tap";
    if (lv === 1) kind = roll < 0.15 ? "bomb" : "tap";
    else if (lv === 2) kind = roll < 0.16 ? "bomb" : roll < 0.40 ? "cross" : roll < 0.70 ? "num" : "tap";
    else kind = roll < 0.14 ? "bomb" : roll < 0.36 ? "cross" : roll < 0.64 ? "num" : "tap";
    const n = { lane, kind, y: -60, done: false, id: "n" + Math.random().toString(36).slice(2, 7) };
    if (kind === "num") n.value = 1 + Math.floor(Math.random() * 9);
    if (kind === "cross") n.lane = lane;
    return n;
  }
  /* Which pads are allowed to take this note? */
  function wantPads(n) {
    if (n.kind === "tap") return [n.lane];
    if (n.kind === "cross") return [3 - n.lane];
    if (n.kind === "num") return n.value % 2 === 0 ? [0, 1] : [2, 3];
    return [];
  }
  function label(n) {
    if (n.kind === "bomb") return "🦀";
    if (n.kind === "cross") return "🌟";
    if (n.kind === "num") return n.value;
    return "●";
  }

  function drawNote(n) {
    if (!n.el) {
      const el = document.createElement("div");
      el.className = "note " + n.kind;
      el.textContent = label(n);
      lanes[n.lane].appendChild(el);
      n.el = el;
    }
    n.el.style.top = n.y + "px";
    n.el.style.transform = "";
  }

  function spawn() {
    if (beat >= endAt) return;
    const b = beat;
    /* rest beats keep the pulse without crowding the screen */
    if (b % 4 === 3 && Math.random() < 0.35) { beat++; return; }
    const n = makeNote(b);
    notes.push(n);
    if (n.kind !== "tap") {
      const call = n.kind === "bomb" ? ["Jangan ketuk!", "Don't tap!"]
        : n.kind === "cross" ? ["Silang! Tangan lain!", "Cross! Other hand!"]
        : [n.value % 2 === 0 ? "Genap, kiri!" : "Ganjil, kanan!", n.value % 2 === 0 ? "Even, left!" : "Odd, right!"];
      $("irCall").innerHTML = T(call);
    }
    beat++;
  }

  function tick(t) {
    raf = requestAnimationFrame(tick);
    const now = t || performance.now();
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    if (!running) return;
    const h = hallH();
    judgeY = h - 70;
    if (now >= spawnAt) { spawn(); spawnAt = now + beatMs; }
    const v = (h + 60) / (fallBeats * beatMs / 1000);   /* px per second */
    notes.forEach((n) => { n.y += v * dt; drawNote(n); });
    /* notes that passed the line untouched */
    notes.forEach((n) => {
      if (n.done) return;
      if (n.y > judgeY + 34) {
        n.done = true;
        if (n.kind !== "bomb") { misses++; if (n.kind !== "tap") wrongs++; }
        n.el.classList.add("gone");
        setTimeout(() => n.el.remove(), 200);
      }
    });
    upd();
    if (beat >= endAt && notes.every((n) => n.done)) end();
  }

  function tap(padIdx) {
    if (!running) return;
    const pad = pads[padIdx];
    pad.classList.add("on"); setTimeout(() => pad.classList.remove("on"), 110);
    tone(300 + padIdx * 70, 0.08, "sine", 0.1);
    const h = hallH();
    /* nearest live note in the judge window */
    let best = null, bestD = 1e9;
    notes.forEach((n) => {
      if (n.done) return;
      if (Math.abs(n.y - (h - 70)) > 62) return;
      const d = Math.abs(n.y - (h - 70));
      if (d < bestD) { bestD = d; best = n; }
    });
    if (!best) return;
    const want = wantPads(best);
    if (best.kind === "bomb") {
      wrongs++; sfxWrong(); best.done = true;
      best.el.classList.add("gone"); setTimeout(() => best.el.remove(), 200);
      $("irCall").innerHTML = T(["Aduh, itu bom!", "Oops, that was a bomb!"]);
      return;
    }
    if (want.includes(padIdx)) {
      hits++; best.done = true; sfxPop(hits % 6);
      best.el.classList.add("gone"); setTimeout(() => best.el.remove(), 200);
      $("irCall").innerHTML = "✅";
    } else {
      wrongs++; sfxWrong();
      best.el.style.background = "#FF6B5B";
      $("irCall").innerHTML = T(["Tangan lain!", "The other hand!"]);
    }
    upd();
  }

  pads.forEach((p, i) => p.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(i); }));
  lanes.forEach((ln, i) => ln.addEventListener("pointerdown", (e) => { e.preventDefault(); tap(i); }));
  const key = (e) => {
    const i = PAD_KEYS.indexOf(e.key.toLowerCase());
    if (i >= 0) { e.preventDefault(); tap(i); }
  };
  listenWindow("keydown", key);

  function end() {
    if (ending) return;
    ending = true; running = false; cancelAnimationFrame(raf);
    skill("rhythm", Math.max(1, Math.round(hits / 4)));
    skill("inhibit", Math.max(1, Math.round((hits - wrongs) / 6)));
    finish(root, {
      gameId: "irama", level: lv, wrongs: Math.min(3, wrongs),
      questions: Math.max(1, hits + wrongs + misses),
      title: T(["Iramanya selesai!", "The rhythm is done!"]),
      text: T(["Tepat: " + hits + " · Meleset: " + (wrongs + misses), "On time: " + hits + " · Missed: " + (wrongs + misses)]),
      again: () => open("irama")
    });
  }

  $("irStop").onclick = () => { running = false; cancelAnimationFrame(raf); open("irama"); };
  hint([["Ketuk pad saat not melewati garis. Merah = jangan!", "Tap the pad as a note crosses the line. Red = never!"]]);
  running = true; last = performance.now(); spawnAt = last + 900;
  raf = requestAnimationFrame(tick);
  say([["Siap? Ikuti iramanya.", "Ready? Follow the beat."]]);

  /* ---------- level 3: echo blackout ---------- */
  function echoMode() {
    const INSTR = [
      { e: "🥁", f: 180, name: ["drum", "drum"] },
      { e: "🔔", f: 660, name: ["bell", "bell"] },
      { e: "🎹", f: 440, name: ["piano", "piano"] },
      { e: "🎺", f: 523, name: ["trumpet", "terompet"] }
    ];
    let round = 0, seq = [], input = [], phase2 = "ready", wrongs2 = 0;
    const padRow = [0, 1, 2, 3].map((i) => `<button class="pad" data-e="${i}">${INSTR[i].e}<small>${PAD_KEYS[i].toUpperCase()}</small></button>`).join("");
    root.innerHTML = `
      <div class="playhead">
        <div class="ttl">🥁 ${T(["Irama Silang", "Cross-Hand Rhythm"])}
          <small>${T(["Tingkat 3", "Level 3"])} · ${T(["Echo Blackout", "Echo Blackout"])}</small></div>
        <button class="btn small" id="irStop">⏹ ${T(["Berhenti", "Stop"])}</button>
      </div>
      <div class="hud"><span class="pill" id="ecRound">🎵 1/3</span><span class="pill" id="ecState">👀</span></div>
      <div class="stageBox" style="min-height:180px;display:grid;place-items:center;text-align:center">
        <div>
          <div id="ecShow" style="font-family:var(--emoji);font-size:clamp(38px,9vw,64px);letter-spacing:10px;min-height:70px"></div>
          <div id="ecMsg" style="font-family:Fredoka,sans-serif;font-size:17px;margin-top:8px"></div>
        </div>
      </div>
      <div class="pads">${padRow}</div>`;
    const pads2 = Array.from(root.querySelectorAll("[data-e]"));
    const msg = (pair) => { $("ecMsg").innerHTML = T(pair); };
    function playSeq() {
      phase2 = "play"; input = [];
      seq = [0, 0, 0, 0].map(() => Math.floor(Math.random() * 4));
      $("ecShow").textContent = "";
      msg([["Dengarkan dulu...", "Listen first..."]]);
      $("ecState").textContent = "👂";
      seq.forEach((i, k) => setTimeout(() => {
        $("ecShow").textContent = INSTR[i].e;
        tone(INSTR[i].f, 0.3, "triangle", 0.18);
        setTimeout(() => { $("ecShow").textContent = ""; }, 260);
        if (k === seq.length - 1) setTimeout(() => { phase2 = "input"; msg([["Sekarang ulangi!", "Now repeat it!"]]); $("ecState").textContent = "🙌"; }, 420);
      }, 520 * k + 300));
    }
    function press(i) {
      if (phase2 !== "input") return;
      tone(INSTR[i].f, 0.22, "triangle", 0.16);
      input.push(i);
      $("ecShow").textContent = INSTR[i].e;
      setTimeout(() => { $("ecShow").textContent = ""; }, 200);
      if (input.length === 4) {
        const ok = input.every((v, k) => v === seq[k]);
        if (!ok) { wrongs2++; sfxWrong(); msg([["Hampir! Coba ingat lagi.", "Almost! Remember it again."]]); }
        else { sfxPop(round); msg([["Tepat!", "Exactly!"]]); }
        round++;
        $("ecRound").textContent = "🎵 " + Math.min(3, round + 1) + "/3";
        if (round >= 3) {
          skill("rhythm", 4); skill("inhibit", 2);
          finish(root, {
            gameId: "irama", level: 3, wrongs: Math.min(3, wrongs2),
            title: T(["Ingatan iramamu kuat!", "Your rhythm memory is strong!"]),
            text: T(["Tiga pola diingat.", "Three patterns remembered."]),
            again: () => open("irama")
          });
          return;
        }
        setTimeout(playSeq, 900);
      }
    }
    pads2.forEach((p, i) => p.addEventListener("pointerdown", (e) => { e.preventDefault(); press(i); }));
    listenWindow("keydown", (e) => { const i = PAD_KEYS.indexOf(e.key.toLowerCase()); if (i >= 0) { e.preventDefault(); press(i); } });
    $("irStop").onclick = () => open("irama");
    setTimeout(playSeq, 600);
    say([["Dengarkan empat bunyi, lalu ulangi.", "Listen to four sounds, then repeat them."]]);
  }
};

/* ============================================================
   GAME 3 — BENGKEL TANGRAM & CERMIN
   Drag the pieces onto the ghost shape. Rotate in 90 degree steps
   at level 1, 45 at level 2, and at level 3 the ghost is a mirror
   reflection: he moves the left-hand block, the reflection on the
   right has to land on the target.
   ============================================================ */
const SHAPES = {
  tri: "50,0 100,100 0,100",      /* equilateral, point up */
  triR: "0,0 100,50 0,100",       /* right triangle */
  sq: "0,0 100,0 100,100 0,100",
  para: "20,0 100,0 80,100 0,100",
  thin: "0,0 100,0 100,34 0,34",
  trap: "20,0 80,0 100,100 0,100", /* isosceles trapezoid */
  hex: "50,0 93,25 93,75 50,100 7,75 7,25"
};
/* the five core polygons of the visual spec, each with one meaning */
const SHAPE_COLORS = {
  tri: "#0EA5E9",    /* sky blue, equilateral */
  triR: "#F97316",   /* orange, right triangle */
  para: "#8B5CF6",   /* purple, parallelogram */
  trap: "#EAB308",   /* gold, trapezoid */
  hex: "#10B981",    /* green, hexagon */
  sq: "#F59E0B",
  thin: "#94A3B8"
};

/* A layout: where each piece belongs, in percent of the board. */
const LAYOUTS = {
  1: {   /* rocket, 5 pieces, seams shown */
    name: ["Roket", "Rocket"],
    pieces: [
      { s: "tri", size: 18, x: 50, y: 12, rot: 0, flip: 1 },
      { s: "sq", size: 18, x: 50, y: 30, rot: 0, flip: 1 },
      { s: "thin", size: 18, x: 50, y: 46, rot: 0, flip: 1 },
      { s: "triR", size: 15, x: 38, y: 60, rot: 0, flip: 1 },
      { s: "triR", size: 15, x: 62, y: 60, rot: 0, flip: -1 }
    ]
  },
  2: {   /* kancil / deer head, 7 pieces, silhouette only */
    name: ["Rusa", "Deer"],
    pieces: [
      { s: "tri", size: 16, x: 46, y: 18, rot: 0, flip: 1 },
      { s: "tri", size: 12, x: 32, y: 9, rot: 45, flip: 1 },
      { s: "tri", size: 12, x: 60, y: 9, rot: -45, flip: -1 },
      { s: "hex", size: 15, x: 46, y: 36, rot: 0, flip: 1 },
      { s: "para", size: 15, x: 46, y: 54, rot: 0, flip: 1 },
      { s: "trap", size: 14, x: 34, y: 70, rot: 0, flip: 1 },
      { s: "trap", size: 14, x: 60, y: 70, rot: 180, flip: -1 }
    ]
  },
  3: {   /* mirror workshop */
    name: ["Cermin Laser", "Laser Mirror"],
    mirror: true,
    pieces: [
      { s: "tri", size: 15, x: 22, y: 22, rot: 0, flip: 1 },
      { s: "sq", size: 14, x: 22, y: 44, rot: 0, flip: 1 },
      { s: "para", size: 14, x: 22, y: 64, rot: 0, flip: 1 },
      { s: "triR", size: 13, x: 30, y: 80, rot: 90, flip: 1 }
    ],
    targets: [ { x: 78, y: 22 }, { x: 78, y: 44 }, { x: 78, y: 64 }, { x: 70, y: 80 } ]
  }
};

GAMES[2].mount = function (root, lv) {
  S.view = "tangram";
  const L = LAYOUTS[lv] || LAYOUTS[1];
  const step = lv === 1 ? 90 : 45;
  const SNAP_PX = 18;      /* the spec: within 18 screen pixels */
  const SNAP_DEG = 10;     /* and within ten degrees */
  let placed = 0, wrongs = 0, sel = null, dragging = null;

  root.innerHTML = `
    <div class="playhead">
      <div class="ttl">🔷 ${T(["Bengkel Tangram", "Tangram Workshop"])}
        <small>${T(["Tingkat", "Level"])} ${lv} · ${TI(L.name)}</small></div>
      <button class="btn small" id="tgHint">👀 ${T(["Lihat bentuk", "Show shape"])}</button>
    </div>
    <div class="hud"><span class="pill" id="tgProg">🧩 0/${L.pieces.length}</span>
      <span class="pill" id="tgTip">${T(["Sentuh potongan, lalu putar", "Tap a piece, then turn it"])}</span></div>
    <div class="tangram" id="tgBoard">
      <svg class="ghost" id="tgGhost" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
    <div class="tools">
      <button class="btn go" id="tgRot">↻ ${T(["Putar", "Turn"])}</button>
      <button class="btn" id="tgFlip">↔ ${T(["Balik", "Flip"])}</button>
      <button class="btn small" id="tgReset">🧽 ${T(["Ulang", "Reset"])}</button>
    </div>`;

  const board = $("tgBoard");
  const ghost = $("tgGhost");
  const total = L.pieces.length;

  function paintGhost() {
    ghost.innerHTML = "";
    if (L.mirror) {
      /* targets on the right, and the laser axis in the middle */
      L.targets.forEach((t) => {
        ghost.insertAdjacentHTML("beforeend",
          `<circle cx="${t.x}" cy="${t.y}" r="9" fill="none" stroke="rgba(255,107,91,.75)" stroke-width="0.7" stroke-dasharray="2 2"/>`);
      });
      ghost.insertAdjacentHTML("beforeend",
        `<line x1="50" y1="4" x2="50" y2="96" stroke="rgba(199,155,255,.8)" stroke-width="0.6" stroke-dasharray="3 2"/>`);
      return;
    }
    if (lv === 2) {
      /* silhouette only: the union is drawn as a soft blob behind the slots */
      const pts = L.pieces.map((p) => `${p.x},${p.y}`);
      ghost.innerHTML = `<g opacity=".22">${L.pieces.map((p) =>
        `<polygon points="${SHAPES[p.s]}" fill="#5FE0A4"
          transform="translate(${p.x} ${p.y}) rotate(${p.rot}) scale(${p.flip} 1) translate(-50 -50) scale(${p.size / 100})"/>`).join("")}</g>`;
      return;
    }
    /* level 1 keeps the seams so he can see how the pieces tile */
    L.pieces.forEach((p) => {
      const rot = p.rot, fl = p.flip, sz = p.size;
      ghost.insertAdjacentHTML("beforeend",
        `<g transform="translate(${p.x} ${p.y}) rotate(${rot}) scale(${fl} 1) translate(-50 -50)">
           <polygon points="${SHAPES[p.s]}" fill="rgba(95,224,164,.14)" stroke="rgba(95,224,164,.6)" stroke-width="0.6"
             transform="scale(${sz / 100})"/>
         </g>`);
    });
  }
  paintGhost();

  const pieces = L.pieces.map((spec, i) => {
    const el = document.createElement("div");
    el.className = "piece";
    const w = spec.size, h = spec.size;
    el.style.width = w + "%"; el.style.height = h + "%";
    el.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <polygon points="${SHAPES[spec.s]}" fill="${SHAPE_COLORS[spec.s] || "#94A3B8"}" stroke="rgba(30,41,59,.55)" stroke-width="2"/></svg>`;
    board.appendChild(el);

    /* At level 3 every block carries a live mirror twin, so he can watch the
       reflection travel while he is still moving the block itself. */
    let twin = null;
    if (L.mirror) {
      twin = el.cloneNode(true);
      twin.className = "piece";
      twin.style.pointerEvents = "none";
      twin.style.opacity = ".8";
      board.appendChild(twin);
    }

    const p = {
      el, twin, spec, i, locked: false,
      rot: (i % 2 ? step : 0),
