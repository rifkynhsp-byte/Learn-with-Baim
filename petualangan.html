      flip: 1,
      x: 10 + (i * 80) / Math.max(1, total - 1),
      y: 90
    };
    apply(p);
    el.addEventListener("pointerdown", (e) => {
      if (p.locked) return;
      e.preventDefault();
      sel = p; markSel();
      dragging = { id: e.pointerId, dx: 0, dy: 0 };
      const r = board.getBoundingClientRect();
      const cxp = r.left + (p.x / 100) * r.width, cyp = r.top + (p.y / 100) * r.height;
      dragging.dx = cxp - e.clientX; dragging.dy = cyp - e.clientY;
      try { el.setPointerCapture(e.pointerId); } catch (er) {}
    });
    el.addEventListener("pointermove", (e) => {
      if (!dragging || dragging.id !== e.pointerId || p.locked) return;
      const r = board.getBoundingClientRect();
      p.x = Math.max(3, Math.min(97, ((e.clientX + dragging.dx - r.left) / r.width) * 100));
      p.y = Math.max(3, Math.min(97, ((e.clientY + dragging.dy - r.top) / r.height) * 100));
      apply(p);
    });
    const drop = () => { if (dragging) { dragging = null; trySnap(p); } };
    el.addEventListener("pointerup", drop);
    el.addEventListener("pointercancel", drop);
    return p;
  });

  function apply(p) {
    p.el.style.left = p.x + "%";
    p.el.style.top = p.y + "%";
    p.el.style.transform = `translate(-50%,-50%) rotate(${p.rot}deg) scaleX(${p.flip})`;
    if (p.twin) {
      p.twin.style.left = (100 - p.x) + "%";
      p.twin.style.top = p.y + "%";
      p.twin.style.transform = `translate(-50%,-50%) rotate(${-p.rot}deg) scaleX(${-p.flip})`;
    }
  }
  function markSel() {
    pieces.forEach((p) => p.el.classList.toggle("sel", p === sel));
  }
  /* full turns are the same turn: 360 is 0 */
  const norm = (d) => ((d % 360) + 360) % 360;
  /* distance in screen pixels, so the tolerance means the same thing on a
     phone and on an iPad */
  function gapPx(x0, y0, x1, y1) {
    const r = board.getBoundingClientRect();
    return Math.hypot((x0 - x1) / 100 * r.width, (y0 - y1) / 100 * r.height);
  }

  function trySnap(p) {
    if (L.mirror) {
      /* Only the reflection has to land: the block itself stays where he put it. */
      const t = L.targets[p.i];
      if (gapPx(100 - p.x, p.y, t.x, t.y) < SNAP_PX) {
        p.locked = true; p.el.classList.add("locked");
        if (p.twin) p.twin.style.opacity = "1";
        placed++; sfxPop(placed); tone(440 + placed * 55, 0.18, "triangle", 0.15);
        $("tgProg").textContent = "🧩 " + placed + "/" + total;
        if (placed === total) done();
      }
      return;
    }
    const t = p.spec;
    const d = gapPx(p.x, p.y, t.x, t.y);
    const rotOk = Math.abs(norm(p.rot - t.rot)) < SNAP_DEG ||
                  Math.abs(norm(p.rot - t.rot) - 360) < SNAP_DEG;
    /* a square and an isoceles triangle look the same when flipped */
    const flipSym = t.s === "sq" || t.s === "tri";
    const flipOk = lv === 1 || flipSym || p.flip === t.flip;
    if (d < SNAP_PX && rotOk && flipOk) {
      p.x = t.x; p.y = t.y; p.rot = t.rot; p.flip = t.flip;
      p.locked = true; p.el.classList.add("locked");
      apply(p);
      placed++; sfxPop(placed); tone(440 + placed * 55, 0.18, "triangle", 0.15);
      $("tgProg").textContent = "🧩 " + placed + "/" + total;
      $("tgTip").innerHTML = T(["Pas! Lanjut.", "It fits! Keep going."]);
      if (placed === total) done();
    } else if (d < SNAP_PX * 3) {
      $("tgTip").innerHTML = T(["Dekat! Coba putar atau balik.", "Close! Try turning or flipping it."]);
    }
  }

  function rotate() {
    if (!sel || sel.locked) { hintSel(); return; }
    sel.rot = (sel.rot + step) % 360;
    apply(sel); tone(560, 0.1, "sine", 0.1); trySnap(sel);
  }
  function flip() {
    if (!sel || sel.locked) { hintSel(); return; }
    sel.flip = -sel.flip;
    apply(sel); tone(420, 0.1, "sine", 0.1); trySnap(sel);
  }
  function hintSel() {
    $("tgTip").innerHTML = T(["Sentuh satu potongan dulu.", "Tap a piece first."]);
  }
  $("tgRot").onclick = rotate;
  $("tgFlip").onclick = flip;
  $("tgHint").onclick = () => {
    ghost.style.opacity = ghost.style.opacity === "0" ? "1" : "0";
  };
  $("tgReset").onclick = () => open("tangram");
  const keyTurn = (e) => {
    if (e.key === "r") rotate();
    if (e.key === "f") flip();
  };
  listenWindow("keydown", keyTurn);

  function done() {
    skill("rotation", 3);
    confetti();
    finish(board, {
      gameId: "tangram", level: lv, wrongs,
      questions: total,
      title: T(["Bentuknya jadi!", "The shape is complete!"]),
      text: L.mirror ? T(["Semua pantulan mengenai sasaran.", "Every reflection hit its target."])
                     : T([total + " potongan tersusun.", total + " pieces fitted."]),
      again: () => open("tangram")
    });
  }

  $("tgProg").textContent = "🧩 0/" + total;
  $("tgTip").innerHTML = L.mirror
    ? T(["Geser balok kiri sampai pantulannya kena lingkaran.", "Move the left block until its reflection lands in a circle."])
    : T(["Geser potongan ke bayangannya.", "Drag each piece onto its ghost."]);
  say([[L.mirror ? "Cermin laser" : "Susun potongannya", L.mirror ? "Laser mirror" : "Build the shape"]]);
};

/* ============================================================
   GAME 4 — MISI KANCIL KODE
   A grid, a memory bar of 4 to 7 command cards, and a RUN button.
   The program is executed step by step; the card that fails glows
   yellow so he can debug just that step. Level 3 runs Kancil and
   Kura-kura side by side, each with its own program.
   ============================================================ */
const CMD = {
  fwd: { e: "⬆️", id: "Maju", en: "Forward" },
  left: { e: "↰", id: "Kiri", en: "Left" },
  right: { e: "↱", id: "Kanan", en: "Right" },
  jump: { e: "⤒", id: "Lompat", en: "Jump" },
  loop: { e: "🔁", id: "Ulangi 2x", en: "Repeat 2x" }
};

GAMES[3].mount = function (root, lv) {
  S.view = "kancil";
  const TOTAL = 10;
  const BEST = LS.get("petualangan.kancil", {});
  let levelIdx = 0;

  /* Ten hand-made courses, easiest first. Each one is solvable with the cards
     on the tray, and each carries the intended plan so the hint button can
     hand over one card at a time.

       walls  stop you, water stops you, rocks are for jumping over. */
  const courses = {
    1: {
      size: 4, start: { x: 0, y: 3 }, dir: 0, goal: { x: 3, y: 3 },
      walls: [], water: [], rocks: [],
      picks: [{ x: 1, y: 3 }, { x: 2, y: 3 }],
      solution: ["fwd", "fwd", "fwd"]
    },
    2: {
      size: 4, start: { x: 0, y: 3 }, dir: 0, goal: { x: 3, y: 1 },
      walls: [], water: [], rocks: [],
      picks: [{ x: 1, y: 3 }, { x: 3, y: 3 }, { x: 3, y: 2 }],
      solution: ["fwd", "fwd", "fwd", "left", "fwd", "fwd"]
    },
    3: {
      size: 5, start: { x: 0, y: 4 }, dir: 0, goal: { x: 2, y: 0 },
      walls: ["3,4", "0,2"], water: [], rocks: [],
      picks: [{ x: 1, y: 4 }, { x: 2, y: 3 }, { x: 2, y: 1 }],
      solution: ["fwd", "fwd", "left", "fwd", "fwd", "fwd", "fwd"]
    },
    4: {
      size: 5, start: { x: 0, y: 4 }, dir: 0, goal: { x: 2, y: 0 },
      walls: ["4,4"], water: [], rocks: ["1,4"],
      picks: [{ x: 2, y: 4 }, { x: 2, y: 3 }, { x: 2, y: 1 }],
      solution: ["jump", "left", "fwd", "fwd", "fwd", "fwd"]
    },
    5: {
      size: 5, start: { x: 0, y: 4 }, dir: 0, goal: { x: 4, y: 2 },
      walls: ["0,1", "1,1"], water: [], rocks: [],
      picks: [{ x: 1, y: 4 }, { x: 2, y: 3 }, { x: 3, y: 2 }],
      solution: ["fwd", "fwd", "left", "fwd", "fwd", "right", "fwd", "fwd"]
    },
    6: {
      size: 6, start: { x: 0, y: 5 }, dir: 0, goal: { x: 5, y: 3 },
      walls: [], water: ["1,4", "2,4", "3,4", "4,4"], rocks: [],
      picks: [{ x: 1, y: 5 }, { x: 3, y: 5 }, { x: 5, y: 4 }],
      solution: ["fwd", "fwd", "fwd", "fwd", "fwd", "left", "fwd", "fwd"]
    },
    7: {
      size: 6, start: { x: 0, y: 5 }, dir: 0, goal: { x: 4, y: 5 },
      walls: [], water: [], rocks: [],
      picks: [{ x: 1, y: 5 }, { x: 2, y: 5 }, { x: 3, y: 5 }],
      solution: ["fwd", "loop", "fwd", "fwd"]
    },
    8: {
      size: 6, start: { x: 0, y: 5 }, dir: 0, goal: { x: 4, y: 3 },
      walls: [], water: [], rocks: ["1,5", "3,5"],
      picks: [{ x: 2, y: 5 }, { x: 4, y: 4 }],
      solution: ["jump", "jump", "left", "fwd", "fwd"]
    },
    9: {
      size: 6, start: { x: 0, y: 5 }, dir: 0, goal: { x: 3, y: 1 },
      walls: ["4,3"], water: ["2,2", "2,3", "2,4"], rocks: ["1,5"],
      picks: [{ x: 2, y: 5 }, { x: 3, y: 3 }, { x: 3, y: 2 }],
      solution: ["jump", "fwd", "left", "fwd", "fwd", "fwd", "fwd"]
    },
    10: {
      size: 6, start: { x: 0, y: 2 }, dir: 0, goal: { x: 3, y: 2 },
      walls: ["0,1", "1,1", "4,1", "5,1"], water: [], rocks: [],
      picks: [],
      turtle: { start: { x: 5, y: 5 }, dir: 2, goal: { x: 2, y: 5 } },
      switchAt: { x: 2, y: 5 },
      bridge: ["3,2"],
      solution: ["fwd", "fwd", "fwd"],
      tsolution: ["fwd", "fwd", "fwd"]
    }
  };

  function starsFor(w) { return w === 0 ? 3 : (w === 1 ? 2 : 1); }

  function levelStrip(idx) {
    return `<div class="levels" id="knLevels">${Array.from({ length: TOTAL }, (_, i) =>
      `<button data-l="${i}" class="${i === idx ? "on" : ""}${BEST[i] ? " done" : ""}">${BEST[i] ? "⭐" : ""}${i + 1}</button>`).join("")}</div>`;
  }

  function build() {
    const idx = levelIdx;
    const C = courses[idx + 1];
    const n = C.size;
    const prog = { kancil: [], kura: [] };
    let active = "kancil";
    let running = false, wrongs = 0, collected = [];
    let state = { kx: C.start.x, ky: C.start.y, dir: C.dir, tx: 0, ty: 0, tdir: 0 };
    if (C.turtle) { state.tx = C.turtle.start.x; state.ty = C.turtle.start.y; state.tdir = C.turtle.dir; }

    root.innerHTML = `
      <div class="playhead">
        <div class="ttl">🦌 ${T(["Misi Kancil Kode", "Kancil Code Mission"])}
          <small>${T(["Tingkat", "Level"])} ${idx + 1}/${TOTAL} · ${n}×${n}</small></div>
        <button class="btn small" id="knHint2">💡 ${T(["Petunjuk", "Hint"])}</button>
        <button class="btn small" id="knClear">🧽 ${T(["Hapus", "Clear"])}</button>
        <button class="btn go" id="knRun">▶ ${T(["Jalankan", "Run"])}</button>
      </div>
      ${levelStrip(idx)}
      <div class="hud">
        <span class="pill" id="knPick">🥒 0/${C.picks.length}</span>
        <span class="pill" id="knStep">👣 0</span>
        ${C.turtle ? `<span class="pill" id="knWho">🦌 Kancil</span>` : ""}
      </div>
      <div class="mazeWrap">
        <div class="maze" id="knMaze" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)"></div>
        <div style="flex:1 1 260px;min-width:240px">
          <div class="cmdbar" id="knBar"></div>
          <div class="tray2" id="knTray"></div>
          <div class="hint" style="position:static;transform:none;margin-top:8px;border-radius:14px" id="knHint"></div>
        </div>
      </div>`;

    const cells = {};
    const maze = $("knMaze");
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const d = document.createElement("div");
      d.className = "cell";
      const key = x + "," + y;
      if (C.walls.includes(key)) d.classList.add("wall");
      if ((C.water || []).includes(key)) { d.classList.add("water"); d.textContent = "🌊"; }
      if (C.rocks.includes(key)) { d.classList.add("rock"); d.textContent = "🪨"; }
      if (C.goal.x === x && C.goal.y === y) d.textContent = "🏁";
      if (C.switchAt && C.switchAt.x === x && C.switchAt.y === y) d.classList.add("switch");
      maze.appendChild(d);
      cells[key] = d;
    }

    function render() {
      Object.values(cells).forEach((c) => {
        c.classList.remove("actor");
        const w = c.querySelector(".who"); if (w) w.remove();
        const f = c.querySelector(".face"); if (f) f.remove();
      });
      C.picks.forEach((p) => {
        if (collected.includes(p.x + "," + p.y)) return;
        const c = cells[p.x + "," + p.y];
        if (c && !c.querySelector(".pick")) {
          const s = document.createElement("span");
          s.className = "pick"; s.textContent = "🥒";
          c.appendChild(s);
        }
      });
      const put = (x, y, emo, dir) => {
        const c = cells[x + "," + y]; if (!c) return;
        c.classList.add("actor");
        const s = document.createElement("span");
        s.className = "who"; s.textContent = emo; s.style.fontSize = "min(7vw,30px)";
        c.appendChild(s);
        const a = document.createElement("span");
        a.className = "face"; a.textContent = ["➡️", "⬇️", "⬅️", "⬆️"][((dir % 4) + 4) % 4];
        c.appendChild(a);
      };
      put(state.kx, state.ky, "🦌", state.dir);
      if (C.turtle) put(state.tx, state.ty, "🐢", state.tdir);
    }

    function renderBar() {
      const list = prog[active];
      $("knBar").innerHTML = list.length
        ? list.map((c, i) => `<span class="c" data-i="${i}"><em>${CMD[c].e}</em>${TI([CMD[c].id, CMD[c].en])}</span>`).join("")
        : `<span style="opacity:.6;font-size:13px">${T(["Kartu perintah muncul di sini", "Command cards appear here"])}</span>`;
      $("knBar").querySelectorAll("[data-i]").forEach((b) => b.onclick = () => {
        if (running) return;
        prog[active].splice(Number(b.dataset.i), 1); renderBar();
      });
    }

    function renderTray() {
      const keys = C.turtle ? ["fwd", "left", "right"]
                 : idx >= 6 ? ["fwd", "left", "right", "jump", "loop"]
                 : idx >= 3 ? ["fwd", "left", "right", "jump"]
                 : ["fwd", "left", "right"];
      $("knTray").innerHTML = keys.map((k) =>
        `<button class="c" data-k="${k}"><em>${CMD[k].e}</em>${TI([CMD[k].id, CMD[k].en])}</button>`).join("");
      $("knTray").querySelectorAll("[data-k]").forEach((b) => b.onclick = () => {
        if (running) return;
        if (prog[active].length >= 10) return;
        prog[active].push(b.dataset.k); sfxPop(prog[active].length); renderBar();
      });
    }

    function hint(pair, keep) { $("knHint").innerHTML = T(pair); if (!keep) say([pair]); }

    const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
    function cellFree(x, y, rock) {
      if (x < 0 || y < 0 || x >= n || y >= n) return false;
      const k = x + "," + y;
      if (C.walls.includes(k)) return false;
      if ((C.water || []).includes(k)) return false;
      if (!rock && C.rocks.includes(k)) return false;
      return true;
    }
    function expand(list) {
      const out = [];
      for (let i = 0; i < list.length; i++) {
        if (list[i] === "loop") {
          const nxt = list[i + 1];
          if (nxt && nxt !== "loop") { out.push(nxt, nxt); i++; }
        } else out.push(list[i]);
      }
      return out;
    }

    function advance(st, cmd, isTurtle, bridgeOpen) {
      const bridge = (nx, ny) =>
        !(C.bridge && !isTurtle && C.bridge.includes(nx + "," + ny) && !bridgeOpen);

      if (cmd === "fwd") {
        const [dx, dy] = DIRS[st.dir];
        const nx = st.x + dx, ny = st.y + dy;
        if (C.rocks.includes(nx + "," + ny)) {
          return [["Ada batu di depan. Pakai kartu Lompat.", "There is a rock ahead. Use the Jump card."]];
        }
        if (!cellFree(nx, ny, false)) {
          return [["Ada yang menghalangi. Coba belok.", "Something is in the way. Try turning."]];
        }
        if (!bridge(nx, ny)) {
          return [["Jembatannya masih terangkat. Kura-kura harus menginjak sakelar dulu.",
                   "The bridge is still up. The turtle has to stand on the switch first."]];
        }
        st.x = nx; st.y = ny;
        return true;
      }
      if (cmd === "jump") {
        const [dx, dy] = DIRS[st.dir];
        const mid = (st.x + dx) + "," + (st.y + dy);
        const nx = st.x + dx * 2, ny = st.y + dy * 2;
        if (!C.rocks.includes(mid)) {
          return [["Lompat hanya untuk melewati batu.", "Jump is only for clearing a rock."]];
        }
        if (!cellFree(nx, ny, true)) {
          return [["Tempat mendaratnya terhalang.", "The landing spot is blocked."]];
        }
        if (!bridge(nx, ny)) {
          return [["Jembatannya masih terangkat. Kura-kura harus menginjak sakelar dulu.",
                   "The bridge is still up. The turtle has to stand on the switch first."]];
        }
        st.x = nx; st.y = ny;
        return true;
      }
      if (cmd === "left") { st.dir = (st.dir + 3) % 4; return true; }
      if (cmd === "right") { st.dir = (st.dir + 1) % 4; return true; }
      return [["Kartu tidak dikenal.", "Unknown card."]];
    }

    function run() {
      if (running) return;
      const plan = expand(prog.kancil);
      if (!plan.length) { hint([["Susun kartu dulu.", "Add some cards first."]]); return; }
      running = true;
      const tplan = C.turtle ? expand(prog.kura) : [];
      const kstate = { x: C.start.x, y: C.start.y, dir: C.dir };
      const tstate = C.turtle ? { x: C.turtle.start.x, y: C.turtle.start.y, dir: C.turtle.dir } : null;
      let step = 0;
      const maxStep = Math.max(plan.length, tplan.length);

      const tick = () => {
        if (step >= maxStep) { settle(kstate, tstate); return; }
        let fail = null;
        /* the turtle moves first, so it can hold the bridge on the same beat */
        if (tstate && step < tplan.length) {
          const r = advance(tstate, tplan[step], true, false);
          if (r !== true) fail = { who: "kura", i: step, why: r };
        }
        if (!fail && step < plan.length) {
          const open = !!(tstate && C.switchAt && tstate.x === C.switchAt.x && tstate.y === C.switchAt.y);
          const r = advance(kstate, plan[step], false, open);
          if (r !== true) fail = { who: "kancil", i: step, why: r };
        }
        if (fail) {
          running = false;
          wrongs++;
          if (C.turtle && fail.who !== active) {
            active = fail.who;
            $("knWho").textContent = (active === "kancil" ? "🦌 Kancil" : "🐢 Kura-kura");
            renderBar();
          }
          const el = $("knBar").querySelectorAll(".c")[Math.min(prog[fail.who].length - 1, fail.i)];
          if (el) el.classList.add("warn");
          sfxWrong();
          hint([["Berhenti di langkah " + (fail.i + 1) + ". " + fail.why[0],
                 "Stopped at step " + (fail.i + 1) + ". " + fail.why[1]]], true);
          say([fail.why]);
          setTimeout(() => { resetRun(); }, 1100);
          return;
        }
        if (step < plan.length) {
          const el = $("knBar").querySelectorAll(".c")[step];
          if (el) { el.classList.add("active"); setTimeout(() => el.classList.remove("active"), 260); }
        }
        tone(320 + step * 40, 0.08, "square", 0.07);
        state.kx = kstate.x; state.ky = kstate.y; state.dir = kstate.dir;
        if (tstate) { state.tx = tstate.x; state.ty = tstate.y; state.tdir = tstate.dir; }
        render();
        $("knStep").textContent = "👣 " + (step + 1);
        const here = kstate.x + "," + kstate.y;
        const p = C.picks.find((q) => q.x + "," + q.y === here);
        if (p && !collected.includes(here)) {
          collected.push(here); sfxPop(collected.length);
          $("knPick").textContent = "🥒 " + collected.length + "/" + C.picks.length;
        }
        step++;
        setTimeout(tick, 340);
      };

      function settle(k, t) {
        running = false;
        const atGoal = k.x === C.goal.x && k.y === C.goal.y;
        const turtleOk = !C.turtle || (t.x === C.turtle.goal.x && t.y === C.turtle.goal.y);
        const allPick = collected.length === C.picks.length;
        if (atGoal && turtleOk) {
          skill("switch", 2);
          confetti();
          const stars = starsFor(wrongs + (allPick ? 0 : 1));
          BEST[idx] = Math.max(BEST[idx] || 0, stars);
          LS.set("petualangan.kancil", BEST);
          const isLast = idx >= TOTAL - 1;
          finish(root, {
            gameId: "kancil", level: idx + 1, wrongs: wrongs + (allPick ? 0 : 1),
            questions: Math.max(1, prog.kancil.length),
            title: isLast ? T(["Semua misi selesai!", "Every mission done!"])
                          : T(["Misi berhasil!", "Mission complete!"]),
            text: (allPick ? T(["Semua mentimun terkumpul.", "Every cucumber collected."])
                           : T(["Sampai di tujuan. Coba ambil semua mentimun.", "You reached the goal. Try collecting every cucumber."])) +
                  (isLast ? "" : `<br><small>${T(["Level berikutnya terbuka", "The next level is open"])}</small>`),
            againLabel: isLast ? T(["Main dari awal", "Start again"]) : T(["Level berikutnya", "Next level"]),
            again: () => {
              if (isLast) { levelIdx = 0; }
              else { levelIdx = idx + 1; }
              build();
            }
          });
        } else {
          wrongs++;
          sfxWrong();
          hint([["Belum sampai. Tambah atau ubah kartunya.", "Not there yet. Add or change a card."]]);
          resetRun();
        }
      }

      function resetRun() {
        state.kx = C.start.x; state.ky = C.start.y; state.dir = C.dir;
        if (C.turtle) { state.tx = C.turtle.start.x; state.ty = C.turtle.start.y; state.tdir = C.turtle.dir; }
        collected = [];
        Object.values(cells).forEach((c) => { const s = c.querySelector(".pick"); if (s) s.remove(); });
        $("knPick").textContent = "🥒 0/" + C.picks.length;
        $("knStep").textContent = "👣 0";
        running = false;
        render();
      }
      tick();
    }

    $("knRun").onclick = run;
    $("knClear").onclick = () => { if (running) return; prog[active] = []; renderBar(); };
    $("knHint2").onclick = () => {
      if (running) return;
      const sol = active === "kura" ? C.tsolution : C.solution;
      if (!sol) return;
      const cur = prog[active];
      const isPrefix = cur.every((c, i) => c === sol[i]);
      if (!isPrefix || cur.length >= sol.length) {
        hint([["Tekan Hapus dulu, lalu minta petunjuk.", "Tap Clear first, then ask for a hint."]]);
        return;
      }
      prog[active].push(sol[cur.length]);
      sfxPop(cur.length + 1);
      renderBar();
      hint([["Satu kartu dibantu. Sisanya giliranmu.", "One card helped. The rest is yours."]], true);
    };
    if (C.turtle) {
      $("knWho").style.cursor = "pointer";
      $("knWho").onclick = () => {
        if (running) return;
        active = active === "kancil" ? "kura" : "kancil";
        $("knWho").textContent = (active === "kancil" ? "🦌 Kancil" : "🐢 Kura-kura");
        renderBar();
      };
    }
    $("knLevels").querySelectorAll("[data-l]").forEach((b) => b.onclick = () => {
      if (running) return;
      levelIdx = Number(b.dataset.l);
      build();
    });

    renderTray(); renderBar(); render();
    $("knPick").textContent = "🥒 0/" + C.picks.length;
    hint(C.turtle
      ? [["Susun 3 langkah untuk Kancil dan 3 untuk Kura-kura. Kura-kura harus berhenti di ubin oranye.", "Plan 3 steps for Kancil and 3 for Kura-kura. The turtle must stop on the orange tile."]]
      : [["Susun kartu sampai Kancil mencapai bendera.", "Add cards until Kancil reaches the flag."]]);
  }

  build();
};

/* ============================================================
   GAME 5 — PABRIK SORTIR KILAT
   A belt, three chutes, and a rule that changes under him. The
   switch is the point: the first sort after a siren is where the
   set-shifting happens, so the siren is loud and the rule bar
   flashes rather than quietly changing.
   ============================================================ */
const SORT_RULES = {
  1: [
    { id: "color", label: ["Warna", "Colour"], chutes: [["Merah", "Red", "#FF6B5B", "🔴"], ["Biru", "Blue", "#7FC8FF", "🔵"], ["Hijau", "Green", "#5FE0A4", "🟢"]],
      items: [["", "#FF6B5B", "🔴"], ["", "#7FC8FF", "🔵"], ["", "#5FE0A4", "🟢"]],
      keyOf: (it) => it.color },
    { id: "shape", label: ["Bentuk", "Shape"], chutes: [["Bulat", "Round", "#FFB247", "⭕"], ["Kotak", "Square", "#C79BFF", "⬛"], ["Segitiga", "Triangle", "#FF8FA3", "🔺"]],
      items: [["⭕", "", ""], ["⬛", "", ""], ["🔺", "", ""]],
      keyOf: (it) => it.shape }
  ],
  2: [
    { id: "suku", label: ["Suku kata", "Syllable"], chutes: [["BA-", "BA-", "#FFB247", "🅰️"], ["BI-", "BI-", "#7FC8FF", "🅱️"], ["BU-", "BU-", "#C79BFF", "🅾️"]],
      items: [["ba", "", ""], ["bi", "", ""], ["bu", "", ""]],
      keyOf: (it) => it.syl },
    { id: "math", label: ["Angka", "Number"], chutes: [["< 10", "< 10", "#5FE0A4", "🔽"], ["= 10", "= 10", "#FFB247", "🟰"], ["> 10", "> 10", "#FF6B5B", "🔼"]],
      items: [["", "", ""], ["", "", ""], ["", "", ""]],
      keyOf: (it) => (it.num < 10 ? 0 : it.num === 10 ? 1 : 2) }
  ],
  3: [
    { id: "english", label: ["English", "English"], chutes: [["Animals", "Animals", "#5FE0A4", "🐾"], ["Food", "Food", "#FFB247", "🍎"], ["Other", "Other", "#7FC8FF", "📦"]],
      items: [["", "", ""], ["", "", ""], ["", "", ""]],
      keyOf: (it) => it.cat },
    { id: "invert", label: ["Lampu ungu: geser satu!", "Purple lamp: shift one!"], chutes: [["Animals", "Animals", "#5FE0A4", "🐾"], ["Food", "Food", "#FFB247", "🍎"], ["Other", "Other", "#7FC8FF", "📦"]],
      items: [["", "", ""], ["", "", ""], ["", "", ""]],
      keyOf: (it) => it.cat, invert: true }
  ]
};
const LW = ["🐱", "🐶", "🐟", "🐦", "🍎", "🍌", "🍞", "🥕", "📦", "⚽", "🚗", "🎈"];
const EN_CATS = ["animal", "animal", "animal", "animal", "food", "food", "food", "food", "other", "other", "other", "other"];
const SYL = ["ba", "bi", "bu", "be", "bo", "ba", "bi", "bu"];

GAMES[4].mount = function (root, lv) {
  S.view = "pabrik";
  const rules = SORT_RULES[lv] || SORT_RULES[1];
  const ROUND = 60;                     /* seconds */
  const SWITCH = 20;                    /* seconds between rule flips */
  const SPEED = lv === 1 ? 0.10 : (lv === 2 ? 0.13 : 0.15);  /* belts per second */

  let ruleIdx = 0, t = 0, raf = 0, last = 0, running = false, ending = false;
  let items = [], spawnAt = 0, score = 0, wrongs = 0, missed = 0, nextSwitch = SWITCH;
  let idc = 0;

  root.innerHTML = `
    <div class="playhead">
      <div class="ttl">🏭 ${T(["Pabrik Sortir Kilat", "Speed Sorting Factory"])}
        <small>${T(["Tingkat", "Level"])} ${lv}</small></div>
      <span class="pill" id="fbTime">⏱️ ${ROUND}</span>
    </div>
    <div class="hud">
      <span class="pill" id="fbScore">✅ 0</span>
      <span class="pill" id="fbWrong">❌ 0</span>
      <span class="pill" id="fbNext">🔄 ${SWITCH}</span>
    </div>
    <div class="factory" id="fbStage">
      <div class="rulebar" id="fbRule"></div>
      <div class="belt" id="fbBelt"></div>
      <div class="chutes" id="fbChutes"></div>
    </div>`;

  const belt = $("fbBelt");
  const chutesEl = $("fbChutes");
  const ruleBar = $("fbRule");

  function rule() { return rules[ruleIdx]; }
  function paintRule() {
    const r = rule();
    ruleBar.innerHTML = `<span>${T(["Aturannya:", "The rule:"])}</span><b>${TI(r.label)}</b>`;
    chutesEl.innerHTML = r.chutes.map((c, i) =>
      `<button class="chute" data-c="${i}" style="border-color:${c[2]};box-shadow:inset 0 -7px 0 ${c[2]}55">
         <em>${c[3]}</em>${TI([c[0], c[1]])}</button>`).join("");
    chutesEl.querySelectorAll("[data-c]").forEach((b) => b.onclick = () => sort(Number(b.dataset.c), b));
    /* keep the belt readable: item colours follow the rule */
    items.forEach((it) => paintItem(it));
  }
  /* Every crate carries all of its attributes at once: a colour, a shape, a
     number, a syllable and a category. That way a crate already on the belt
     is always answerable after the rule flips, with nothing to relabel. */
  const MATH_POOL = [3, 5, 7, 8, 10, 12, 14, 16, 18];
  const SHAPE_FACE = ["\u2B55", "\u2B1B", "\uD83D\uDD3A"];   /* circle, square, triangle */
  function newItem() {
    const k = Math.floor(Math.random() * LW.length);
    const it = {
      id: "i" + (++idc), x: -0.15, done: false,
      color: Math.floor(Math.random() * 3),
      shape: Math.floor(Math.random() * 3),
      num: MATH_POOL[Math.floor(Math.random() * MATH_POOL.length)],
      syl: SYL[Math.floor(Math.random() * 3)],
      cat: k < 4 ? 0 : (k < 8 ? 1 : 2),
      picture: LW[k]
    };
    const el = document.createElement("div");
    el.className = "item"; el.dataset.id = it.id;
    belt.appendChild(el); it.el = el;
    paintItem(it);
    return it;
  }

  function answerFor(it, r) {
    if (r.id === "color") return it.color;
    if (r.id === "shape") return it.shape;
    if (r.id === "suku") return ["ba", "bi", "bu"].indexOf(it.syl);
    if (r.id === "math") return r.keyOf(it);
    /* the purple lamp means "do the opposite": every category moves round one */
    if (r.invert) return (it.cat + 1) % 3;
    return it.cat;
  }
  function faceFor(it, r) {
    if (r.id === "suku") return it.syl.toUpperCase();
    if (r.id === "math") return String(it.num);
    if (r.id === "color" || r.id === "shape") return SHAPE_FACE[it.shape];
    return it.picture;
  }
  function paintItem(it) {
    const r = rule();
    const a = answerFor(it, r);
    it.answer = a;
    it.el.style.background = (r.id === "color") ? r.items[it.color][1] : r.chutes[a][2];
    const face = faceFor(it, r);
    const emoji = (r.id === "english" || r.id === "invert" || r.id === "shape" || r.id === "color");
    it.el.innerHTML = `<b style="font-family:${emoji ? "var(--emoji)" : "Fredoka,sans-serif"}">${face}</b>`;
  }

  function sort(chute, btn) {
    if (!running) return;
    /* the item closest to the chutes that has not been sent yet */
    const live = items.filter((i) => !i.done).sort((a, b) => b.x - a.x);
    const it = live[0];
    if (!it) return;
    const right = it.answer === chute;
    it.done = true;
    if (right) {
      score++; sfxPop(score % 6);
      btn.classList.add("ok"); setTimeout(() => btn.classList.remove("ok"), 200);
      it.el.style.transition = "transform .3s,opacity .3s";
      it.el.style.transform = "translateY(-140%) scale(.6)"; it.el.style.opacity = "0";
    } else {
      wrongs++; sfxWrong();
      btn.classList.add("no"); setTimeout(() => btn.classList.remove("no"), 260);
      it.el.style.transition = "transform .3s,opacity .3s";
      it.el.style.transform = "translateY(140%) scale(.6)"; it.el.style.opacity = "0";
      $("fbWrong").textContent = "❌ " + wrongs;
      ruleBar.classList.add("flash");
      setTimeout(() => ruleBar.classList.remove("flash"), 700);
    }
    setTimeout(() => it.el.remove(), 340);
    $("fbScore").textContent = "✅ " + score;
  }

  function tick(ts) {
    raf = requestAnimationFrame(tick);
    const now = ts || performance.now();
    const dt = Math.max(0, Math.min(0.06, (now - last) / 1000));
    last = now;
    if (!running) return;
    t += dt;
    const left = Math.max(0, Math.ceil(ROUND - t));
    $("fbTime").textContent = "⏱️ " + left;
    const toSwitch = Math.max(0, Math.ceil(nextSwitch - t));
    $("fbNext").textContent = "🔄 " + toSwitch;

    if (t >= nextSwitch && nextSwitch < ROUND) {
      ruleIdx = (ruleIdx + 1) % rules.length;
      nextSwitch += SWITCH;
      paintRule();
      ruleBar.classList.add("flash");
      setTimeout(() => ruleBar.classList.remove("flash"), 2200);
      sfxBell();
      say([[rules[ruleIdx].label[0], rules[ruleIdx].label[1]]]);
    }

    spawnAt -= dt;
    if (spawnAt <= 0) { items.push(newItem()); spawnAt = lv === 1 ? 1.9 : (lv === 2 ? 1.6 : 1.4); }

    const w = belt.getBoundingClientRect().width || 600;
    items.forEach((it) => {
      if (it.done) return;
      it.x += SPEED * dt;
      it.el.style.left = (it.x * w) + "px";
      if (it.x > 1.02) {
        it.done = true; missed++;
        it.el.style.opacity = "0";
        setTimeout(() => it.el.remove(), 300);
      }
    });
    items = items.filter((i) => !i.done || i.el.parentNode);

    if (t >= ROUND) end();
  }

  function end() {
    if (ending) return;
    ending = true; running = false; cancelAnimationFrame(raf);
    skill("switch", 3);
    skill("inhibit", 1);
    finish(root, {
      gameId: "pabrik", level: lv, wrongs: Math.min(3, wrongs),
      questions: Math.max(1, score + wrongs + missed),
      title: T(["Shift selesai!", "Shift over!"]),
      text: T(["Benar: " + score + " · Salah: " + wrongs + " · Terlewat: " + missed,
               "Right: " + score + " · Wrong: " + wrongs + " · Missed: " + missed]),
      again: () => open("pabrik")
    });
  }

  paintRule();
  running = true; last = performance.now(); spawnAt = 0.4;
  raf = requestAnimationFrame(tick);
  say([["Sortir sesuai aturan. Aturannya nanti berganti!", "Sort by the rule. The rule will change!"]]);
};

/* ============================================================

];

GAMES[5].mount = function (root, lv) {
  S.view = "lari";

  const W = 1000, H = 620;
  const horizon = H * 0.30, groundY = H * 0.90;
  const LANES = [-1, 0, 1];
  const GOAL = lv === 1 ? 320 : (lv === 2 ? 430 : 540);
  const SPEED0 = lv === 1 ? 11 : (lv === 2 ? 13 : 15);
  const SPEEDMAX = lv === 1 ? 21 : (lv === 2 ? 25 : 29);

  let lane = 0, xVis = 0, y = 0, vy = 0, duck = 0, invuln = 0;
  let obstacles = [], fruit = [], hearts = 3;
  let distance = 0, coins = 0, judged = 0, cleared = 0;
  let running = false, over = false, spawnAt = 20, last = 0, raf = 0;
  let zoneIdx = 0, banner = "", bannerT = 0, flash = 0, shake = 0;

  root.innerHTML = `
    <div class="playhead">
      <div class="ttl">🏃 ${T(["Lari Tiga Jalur", "Three-Lane Runner"])}
        <small>${T(["Tanpa kamera. Pakai tombol.", "No camera. Use the buttons."])}</small></div>
      <button class="btn small" id="lrStop">⏹ ${T(["Berhenti", "Stop"])}</button>
    </div>
    <div class="hud">
      <span class="pill" id="lrHearts">❤️❤️❤️</span>
      <span class="pill" id="lrScore">⭐ 0</span>
      <span class="pill" id="lrZone">💧</span>
      <span class="pill" id="lrDist">🏁 0/${GOAL}m</span>
    </div>
    <div class="stageBox" id="lrStage" style="min-height:240px">
      <canvas id="lrCv"></canvas>
      <div class="hint" id="lrHint"></div>
    </div>
    <div class="meter"><i id="lrMeter" style="width:0%"></i></div>
    <div class="padRow">
      <button class="bigbtn" id="lrL">⬅️<small>${T(["Kiri", "Left"])}</small></button>
      <button class="bigbtn" id="lrU">⬆️<small>${T(["Lompat", "Jump"])}</small></button>
      <button class="bigbtn" id="lrD">⬇️<small>${T(["Tiarap", "Duck"])}</small></button>
      <button class="bigbtn" id="lrR">➡️<small>${T(["Kanan", "Right"])}</small></button>
    </div>`;

  const c = $("lrCv"), ctx = c.getContext("2d");
  let px = 1, py = 1;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  function fit() {
    const box = $("lrStage").getBoundingClientRect();
    px = box.width; py = box.height;
    c.width = Math.round(px * dpr); c.height = Math.round(py * dpr);
    c.style.width = px + "px"; c.style.height = py + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  const sx = () => px / W, sy = () => py / H;

  /* perspective: lane offset and height at depth z, in logical units */
  function project(laneX, height, z) {
    const s = 1 / (1 + Math.max(z, -0.8) / 14);
    return {
      x: W / 2 + laneX * 0.30 * W * s,
      y: horizon + (groundY - horizon) * s - height * (groundY - horizon) * 0.95 * s,
      s
    };
  }

  function factFor(i) {
    const z = RUN_ZONES[i];
    return z.facts[Math.floor(Math.random() * z.facts.length)];
  }

  function updHud() {
    $("lrHearts").textContent = "❤️".repeat(Math.max(0, hearts)) + "🖤".repeat(Math.max(0, 3 - hearts));
    $("lrScore").textContent = "⭐ " + (Math.floor(distance) + coins * 2);
    $("lrZone").textContent = RUN_ZONES[zoneIdx].e + " " + TI(RUN_ZONES[zoneIdx].name);
    $("lrDist").textContent = "🏁 " + Math.min(GOAL, Math.floor(distance)) + "/" + GOAL + "m";
    $("lrMeter").style.width = Math.min(100, (distance / GOAL) * 100) + "%";
  }

  /* ---------------------------------------------------------------- input */
  function move(dir) {
    if (!running) return;
    const next = Math.max(-1, Math.min(1, lane + dir));
    if (next === lane) return;
    lane = next;
    tone(dir > 0 ? 520 : 460, 0.07, "sine", 0.1);
  }
  function jump() {
    if (!running || y > 0) return;
    vy = 6.2;
    duck = 0;
    tone(680, 0.1, "triangle", 0.12);
  }
  function duckNow() {
    if (!running) return;
    duck = 0.55;
    if (y > 0) vy = Math.min(vy, 0);
    tone(300, 0.1, "sine", 0.1);
  }

  $("lrL").addEventListener("pointerdown", (e) => { e.preventDefault(); move(-1); });
  $("lrR").addEventListener("pointerdown", (e) => { e.preventDefault(); move(1); });
  $("lrU").addEventListener("pointerdown", (e) => { e.preventDefault(); jump(); });
  $("lrD").addEventListener("pointerdown", (e) => { e.preventDefault(); duckNow(); });

  const key = (e) => {
    if (e.key === "ArrowLeft") { e.preventDefault(); move(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp" || e.key === " ") { e.preventDefault(); jump(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); duckNow(); }
  };
  listenWindow("keydown", key);

  /* ---------------------------------------------------------------- world */
  function spawn() {
    const roll = Math.random();
    const pick = LANES[Math.floor(Math.random() * 3)];
    if (roll > 0.9) {
      fruit.push({ lane: pick, z: 52, taken: false });
      return;
    }
    const type = roll < 0.44 ? "ground" : (roll < 0.78 ? "bar" : "wall");
    obstacles.push({ type, lane: pick, z: 52, judged: false });
  }

  function judgeAll() {
    let changed = false;
    obstacles.forEach((o) => {
      if (o.judged) return;
      if (o.z > 0.7) return;
      o.judged = true;
      judged++;
      const same = o.lane === lane;
      let hit = false;
      if (same) {
        if (o.type === "ground") hit = y < 0.34;
        else if (o.type === "bar") hit = duck <= 0;
        else hit = true;
      }
      if (hit && invuln <= 0) {
        hearts--;
        invuln = 1.3;
        flash = 0.45;
        shake = 0.5;
        sfxWrong();
        $("lrHint").innerHTML = o.type === "ground"
          ? T(["Lompati hewannya!", "Jump over it!"])
          : o.type === "bar"
            ? T(["Tiarap di bawahnya!", "Duck under it!"])
            : T(["Pindah jalur!", "Change lane!"]);
        if (hearts <= 0) end();
      } else if (!hit && same) {
        cleared++;
        coins++;
        sfxPop(cleared % 6);
        changed = true;
      }
    });
    fruit.forEach((f) => {
      if (f.taken) return;
      if (Math.abs(f.z) < 0.9 && f.lane === lane) {
        f.taken = true;
        coins += 3;
        sfxPop(3);
        changed = true;
      }
    });
    if (changed) updHud();
  }

  function tick(ts) {
    raf = requestAnimationFrame(tick);
    const now = ts || performance.now();
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    frame(dt);
  }

  function frame(dt) {
    if (!running) return;

    const speed = Math.min(SPEEDMAX, SPEED0 + distance * 0.012);
    distance += speed * dt;
    xVis += (lane - xVis) * Math.min(1, dt * 13);
    shake = Math.max(0, shake - dt * 3);
    flash = Math.max(0, flash - dt * 3);
    invuln = Math.max(0, invuln - dt);
    duck = Math.max(0, duck - dt);

    if (y > 0 || vy > 0) {
      vy -= 17 * dt;
      y += vy * dt;
      if (y <= 0) { y = 0; vy = 0; }
    }

    spawnAt -= speed * dt;
    if (spawnAt <= 0) {
      spawn();
      spawnAt = Math.max(12, 23 - distance * 0.012) + Math.random() * 7;
    }

    obstacles.forEach((o) => { o.z -= speed * dt; });
    obstacles = obstacles.filter((o) => o.z > -6);
    fruit.forEach((f) => { f.z -= speed * dt; });
    fruit = fruit.filter((f) => f.z > -6 && !f.taken);

    judgeAll();

    const zi = Math.min(RUN_ZONES.length - 1, Math.floor(distance / (GOAL / 5)));
    if (zi !== zoneIdx) {
      zoneIdx = zi;
      const f = factFor(zi);
      banner = TI(f);
      bannerT = 4.5;
      say([f]);
      tone(880, 0.25, "triangle", 0.12);
    }
    bannerT = Math.max(0, bannerT - dt);

    draw();
    updHud();
    if (distance >= GOAL) end();
  }

  function end() {
    if (over) return;
    over = true;
    running = false;
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    skill("inhibit", 2);
    skill("switch", 1);
    const stars = hearts >= 3 ? 3 : (hearts === 2 ? 2 : 1);
    finish($("lrStage"), {
      gameId: "lari", level: lv, wrongs: Math.max(0, 3 - hearts),
      questions: Math.max(1, judged),
      partial: stars / 3,
      title: hearts > 0 ? T(["Sampai di garis akhir!", "You reached the finish!"]) : T(["Hatinya habis!", "Out of hearts!"]),
      text: T(["Jarak: " + Math.floor(distance) + " m · Buah: " + coins + " · Rintangan: " + cleared,
               "Distance: " + Math.floor(distance) + " m · Fruit: " + coins + " · Cleared: " + cleared]),
      again: () => open("lari")
    });
  }

  $("lrStop").onclick = () => { running = false; if (raf) cancelAnimationFrame(raf); open("lari"); };

  /* ---------------------------------------------------------------- render */
  function quad(a, b, cc, d) {
    const SX = sx(), SY = sy();
    ctx.beginPath();
    ctx.moveTo(a.x * SX, a.y * SY);
    ctx.lineTo(b.x * SX, b.y * SY);
    ctx.lineTo(cc.x * SX, cc.y * SY);
    ctx.lineTo(d.x * SX, d.y * SY);
    ctx.closePath();
  }

  function drawRoad() {
    const SX = sx(), SY = sy();
    const zone = RUN_ZONES[zoneIdx];
    /* sky */
    const g = ctx.createLinearGradient(0, 0, 0, py);
    g.addColorStop(0, zone.sky);
    g.addColorStop(1, "#FFFFFF");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, px, py);
    /* far hills */
    ctx.fillStyle = zone.far;
    ctx.globalAlpha = 0.55;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.ellipse(((i * 0.24 + 0.05) % 1) * px, horizon * SY + 6, px * 0.20, py * 0.09, 0, Math.PI, 0);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    /* the road: a trapezoid from the horizon down to the bottom */
    const nearL = project(-1.5, 0, -2), nearR = project(1.5, 0, -2);
    const farL = project(-1.5, 0, 60), farR = project(1.5, 0, 60);
    ctx.fillStyle = zone.road;
    quad(nearL, nearR, farR, farL);
    ctx.fill();
    /* lane lines */
    ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.lineWidth = Math.max(1, 3 * SX);
    [-0.5, 0.5].forEach((l) => {
      const a = project(l, 0, -2), b = project(l, 0, 60);
      ctx.beginPath(); ctx.moveTo(a.x * SX, a.y * SY); ctx.lineTo(b.x * SX, b.y * SY); ctx.stroke();
    });
    /* themed props beside the road */
    ctx.font = `${Math.round(34 * Math.min(SX, SY))}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    for (let i = 0; i < 6; i++) {
      const z = 6 + ((distance * 0.6 + i * 9) % 54);
      const side = i % 2 ? 1 : -1;
      const p = project(side * 2.15, 0, z);
      ctx.globalAlpha = Math.min(1, 60 / (z + 6));
      ctx.fillText(zone.props[i % zone.props.length], p.x * SX, p.y * SY);
    }
    ctx.globalAlpha = 1;
  }

  function drawObstacle(o) {
    const SX = sx(), SY = sy();
    const p = project(o.lane, o.type === "bar" ? 0.72 : 0, o.z);
    const size = Math.min(0.9 * 200 * p.s * Math.min(SX, SY), py * 0.16);
    if (size < 3) return;
    const emoji = o.type === "ground" ? "🐊" : (o.type === "bar" ? "🦅" : "🐘");
    ctx.font = `${Math.round(size)}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(emoji, p.x * SX, p.y * SY);
  }

  function drawPlayer() {
    const SX = sx(), SY = sy();
    const p = project(xVis, y, 0);
    const size = Math.min(90 * Math.min(SX, SY), py * 0.18);
    const squash = duck > 0 ? 0.62 : 1;
    if (invuln > 0 && Math.floor(invuln * 12) % 2 === 0) return;
    ctx.save();
    ctx.translate(p.x * SX, p.y * SY);
    ctx.scale(1, squash);
    ctx.font = `${Math.round(size)}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText("🏃", 0, 0);
    ctx.restore();
  }

  function draw() {
    if (!px) return;
    const SX = sx(), SY = sy();
    ctx.clearRect(0, 0, px, py);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 8 * shake);

    drawRoad();

    /* far things first */
    const items = [];
    obstacles.forEach((o) => items.push({ z: o.z, d: () => drawObstacle(o) }));
    fruit.forEach((f) => {
      const p = project(f.lane, 0.45, f.z);
      const size = Math.min(60 * p.s * Math.min(SX, SY), py * 0.10);
      if (size < 3) return;
      items.push({ z: f.z, d: () => {
        ctx.font = `${Math.round(size)}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("🍎", p.x * SX, p.y * SY);
      } });
    });
    items.sort((a, b) => b.z - a.z);
    items.forEach((it) => it.d());
    drawPlayer();

    /* the current zone's fact */
    if (bannerT > 0) {
      ctx.globalAlpha = Math.min(1, bannerT);
      ctx.fillStyle = "rgba(4,26,32,.82)";
      const bw = Math.min(px * 0.9, 620 * SX);
      ctx.fillRect((px - bw) / 2, 10, bw, 46 * Math.min(SX, SY) * 1.4);
      ctx.fillStyle = "#FFFBF2";
      ctx.font = `${Math.round(17 * Math.min(SX, SY) * 1.3)}px Nunito, system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(banner, px / 2, 10 + 23 * Math.min(SX, SY) * 1.4);
      ctx.globalAlpha = 1;
    }

    if (flash > 0) {
      ctx.fillStyle = "rgba(239,68,68," + (flash * 0.5) + ")";
      ctx.fillRect(0, 0, px, py);
    }
    ctx.restore();
  }

  window.addEventListener("resize", fit);
  onCleanup(() => window.removeEventListener("resize", fit));

  setTimeout(fit, 30);
  updHud();
  $("lrHint").innerHTML = T(["Kiri/kanan pindah jalur · ⬆️ lompat · ⬇️ tiarap",
                             "Left/right changes lane · ⬆️ jump · ⬇️ duck"]);
  running = true;
  last = performance.now();
  raf = requestAnimationFrame(tick);
};

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  const langs = ["id", "en", "both"];
  const marks = { id: "🇮🇩", en: "🇬🇧", both: "🌐" };
  $("lang").textContent = marks[S.lang] || "🇮🇩";
  $("lang").onclick = () => {
    S.lang = langs[(langs.indexOf(S.lang) + 1) % langs.length];
    LS.set("petualangan.lang", S.lang);
    $("lang").textContent = marks[S.lang];
    if (S.view === "hub") hub(); else open(S.view);
  };
  $("snd").onclick = () => {
    S.sound = !S.sound;
    $("snd").textContent = S.sound ? "🔊" : "🔇";
    if (!S.sound) stopAudio();
  };
  document.querySelectorAll("#tiers button").forEach((b) => {
    b.onclick = () => {
      S.level = Number(b.dataset.lv);
      syncTierButtons();
      if (S.view && S.view !== "hub") open(S.view); else hub();
    };
  });
  try { if (window.SUPER && SUPER.bar) SUPER.bar.mount([]); } catch (e) {}
  hub();
})();
</script>
</body>
</html>
