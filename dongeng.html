<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dongeng Hewan</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--sand:#F7E9CC;--bone:#FFFBF2;--amber:#FFB247;--coral:#FF6B5B;--kelp:#5FE0A4;
 --sky1:#2F6B3F;--sky2:#1B4429;--sky3:#0C2416;--glow:#9BE8A8;
 --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--bone);display:flex;flex-direction:column;
 min-height:100dvh;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;
 background:radial-gradient(130% 80% at 50% -14%,var(--glow) 0%,transparent 56%),
 linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 46%,var(--sky3) 100%);background-attachment:fixed}
button{font-family:inherit}
.app{position:relative;flex:1;display:flex;flex-direction:column;max-width:1400px;width:100%;
 margin:0 auto;padding:8px 14px 8px;overflow:hidden;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--sand);margin-right:auto}
.brand span{color:var(--amber)}
.seg{display:flex;gap:3px;background:rgba(4,20,10,.5);padding:4px;border-radius:999px;border:1px solid rgba(247,233,204,.16)}
.seg button{font-family:'Fredoka',sans-serif;font-weight:600;font-size:14px;color:rgba(255,251,242,.6);
 background:none;border:0;padding:6px 11px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--amber);color:#40230A}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;
 background:rgba(247,233,204,.1);border:1px solid rgba(247,233,204,.2);color:var(--bone);cursor:pointer}

/* ---------- library ---------- */
#lib{flex:1;overflow-y:auto;padding:10px 2px 20px}
#lib h1{font-family:'Fredoka',sans-serif;font-size:clamp(24px,4vw,36px);margin:6px 0 2px;color:var(--sand)}
#lib .sub{margin:0 0 14px;color:rgba(255,251,242,.75);font-size:14.5px}
.shelf{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.book{position:relative;border:0;text-align:left;cursor:pointer;border-radius:24px;overflow:hidden;color:var(--bone);
 padding:0;display:flex;flex-direction:column;align-items:stretch;background:#0B1F14;box-shadow:0 14px 30px rgba(0,0,0,.35);transition:transform .2s}
.book:hover{transform:translateY(-4px) rotate(-.4deg)}
.book:active{transform:scale(.97)}
.book .art{height:150px;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:12px;
 font-family:var(--emoji);font-size:54px;position:relative}
.book .art i{font-style:normal;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.book .art i:nth-child(2){animation-delay:.4s}.book .art i:nth-child(3){animation-delay:.8s}
.book .art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;background:rgba(0,0,0,.14)}
.book .txt{flex:1;padding:12px 16px 16px;background:rgba(3,14,8,.55)}
.book h3{font-family:'Fredoka',sans-serif;margin:0;font-size:21px}
.book .en{font-size:13px;color:rgba(255,251,242,.7);margin-top:1px}
.book .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px}
.book .lvl{background:rgba(247,233,204,.16);padding:3px 9px;border-radius:99px}
.book .st{font-size:16px;letter-spacing:1px}

/* ---------- play ---------- */
#play{flex:1;display:none;flex-direction:column;align-items:center;gap:8px;min-height:0;padding-top:6px}
#play.on{display:flex}#lib.off{display:none}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(247,233,204,.22);transition:.3s}
.dots i.done{background:var(--kelp)}.dots i.now{background:var(--amber);transform:scale(1.35)}
.scene{position:relative;width:min(100%,calc((100dvh - 290px) * 16 / 9));aspect-ratio:16/9;flex:none;
 border-radius:22px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.45);container-type:inline-size;isolation:isolate;
 background:#6EC6FF;border:3px solid rgba(255,251,242,.18)}
.scene.shake{animation:quake .12s linear 8}
.bg{position:absolute;inset:0;transition:opacity 1s}
.bg svg{width:100%;height:100%;display:block}
.layer{position:absolute;inset:0}
#actors{z-index:1}#items{z-index:4;pointer-events:none}#fx{z-index:5}
#sea{top:auto;height:0;z-index:2;pointer-events:none;transition:height 1.4s ease;
 background:linear-gradient(180deg,rgba(90,190,235,.8),rgba(20,95,160,.92));border-top:.4cqw solid rgba(225,247,255,.9);animation:seabob 3s ease-in-out infinite}
@keyframes seabob{50%{transform:translateY(-.5cqw)}}
#smog,#heat,#shade{pointer-events:none;opacity:0;transition:opacity 1.2s;z-index:3}
#smog{background:linear-gradient(180deg,rgba(80,70,62,.9),rgba(150,130,105,.45))}
#heat{background:radial-gradient(circle at 50% 55%,rgba(255,90,40,.6),rgba(255,140,40,.25) 45%,transparent 70%)}
#shade{background:#010712}
#meter{position:absolute;right:1.6%;top:18%;bottom:24%;width:5cqw;z-index:6;display:none;flex-direction:column;align-items:center;gap:.6cqw;pointer-events:none}
#meter b{font-family:'Fredoka',var(--emoji);font-size:max(13px,2.4cqw);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);white-space:nowrap}
#meter span{flex:1;width:48%;border-radius:99px;background:rgba(255,255,255,.3);position:relative;overflow:hidden;border:.3cqw solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
#meter i{position:absolute;left:0;right:0;bottom:0;height:40%;transition:height 1s,background 1s}
.actor.gray .an{filter:grayscale(1) brightness(1.6)}
.spin{animation:spin 2.4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.loopbox{position:absolute;inset:0;z-index:6;pointer-events:none}
.loopbox svg{position:absolute;inset:0;width:100%;height:100%}
.loopbox path{fill:none;stroke:rgba(255,255,255,.9);stroke-width:4;stroke-dasharray:12 10;vector-effect:non-scaling-stroke;
 animation:dash 1s linear infinite;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
@keyframes dash{to{stroke-dashoffset:-22}}
.lnode{position:absolute;transform:translate(-50%,50%);pointer-events:auto;border:0;cursor:pointer;background:rgba(255,251,242,.94);
 border-radius:16px;padding:.5cqw .9cqw .6cqw;text-align:center;color:#2D2410;min-width:8cqw;max-width:17cqw;box-shadow:0 6px 16px rgba(0,0,0,.35)}
.lnode .e{font-family:var(--emoji);font-size:max(22px,3.8cqw);display:block;line-height:1.15}
.lnode b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:max(11px,1.35cqw);display:block;line-height:1.15}
.lnode b small{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.85em;color:#6A5A3A}
.lnode.lit{background:#C9F5DF}
.lnode.next{animation:nodeglow 1s ease-in-out infinite}
@keyframes nodeglow{50%{box-shadow:0 0 0 .6cqw rgba(255,230,107,.9),0 6px 16px rgba(0,0,0,.35);transform:translate(-50%,50%) scale(1.08)}}
.lnode.nope{animation:nope .4s}.lnode.poke{animation:none}
.lmover{position:absolute;transform:translate(-50%,-30%);font-family:var(--emoji);font-size:4.2cqw;line-height:1;pointer-events:none;
 transition:left 1.1s ease-in-out,bottom 1.1s ease-in-out;filter:drop-shadow(0 0 .25em #fff);z-index:3}
.slider{position:absolute;left:4%;right:4%;bottom:3%;z-index:8;background:rgba(6,18,12,.78);border-radius:20px;padding:1cqw 1.6cqw 1.2cqw}
.slider .row{display:flex;align-items:center;gap:1.4cqw}
.slider .end{font-family:var(--emoji);font-size:max(24px,3.6cqw)}
.slider input{flex:1;height:44px;accent-color:#FFB247;cursor:pointer}
.slider input::-webkit-slider-thumb{width:40px;height:40px}
.slider .cap{text-align:center;font-weight:800;font-size:max(13px,1.6cqw);color:#FFF1D0;min-height:1.3em;line-height:1.35}
.panel2{position:absolute;left:3%;right:3%;bottom:3%;top:17%;z-index:8;background:rgba(6,18,12,.84);border-radius:22px;
 padding:1.2cqw 1.6cqw;display:flex;flex-direction:column;gap:.8cqw}
.panel2 .q{text-align:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:max(14px,2cqw);line-height:1.25}
.panel2 .q small{display:block;font-family:'Nunito',sans-serif;font-size:.78em;color:rgba(255,251,242,.8)}
.panel2 .body{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw}
.panel2 .body.cols{flex-direction:row;align-items:stretch}
.panel2 .col{flex:1;display:flex;flex-direction:column;gap:.8cqw;justify-content:center}
.panel2 .why{text-align:center;min-height:1.3em;font-weight:800;color:#FFE3A6;font-size:max(12px,1.5cqw)}
.mbtn,.bin,.card1{border:0;border-radius:16px;background:var(--bone);color:#2D2410;display:flex;align-items:center;gap:.8cqw;
 padding:.6cqw 1cqw;cursor:pointer;box-shadow:0 4px 0 #D7C6A2;text-align:left}
.mbtn .e,.bin .e,.card1 .e{font-family:var(--emoji);font-size:max(22px,3.4cqw);line-height:1}
.mbtn b,.bin b,.card1 b{font-family:'Fredoka',sans-serif;font-weight:600;font-size:max(12px,1.5cqw);line-height:1.2}
.mbtn b small,.bin b small,.card1 b small{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.8em;color:#6A5A3A}
.mbtn.sel{background:#FFE08A;box-shadow:0 0 0 .4cqw #FFB247}
.mbtn.right{background:var(--kelp);box-shadow:0 4px 0 #2E9C68;cursor:default}
.mbtn.nope,.bin.nope{animation:nope .4s;background:#FFD9D2}
.card1{flex-direction:column;gap:.3cqw;padding:1cqw 3cqw;cursor:default;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.card1 .e{font-size:max(40px,6.5cqw)}.card1 small{font-weight:800;color:#8A7A5A;font-size:max(11px,1.2cqw)}
.card1.popin{animation:popin .45s cubic-bezier(.2,1.6,.4,1)}
.bins{display:flex;gap:1.2cqw;width:100%;justify-content:center}
.bin{flex:1 1 0;max-width:32%;flex-direction:column;text-align:center;gap:.3cqw;padding:.8cqw}
.bin .got{font-family:var(--emoji);font-size:max(12px,1.6cqw);min-height:1.2em;letter-spacing:-2px}
.bin.poke{animation:poke .5s}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.tabs button{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;border-radius:999px;padding:9px 16px;cursor:pointer;
 background:rgba(247,233,204,.12);color:var(--bone);border:1px solid rgba(247,233,204,.25)}
.tabs button.on{background:var(--amber);color:#40230A;border-color:var(--amber)}
#items .item{pointer-events:auto}
.actor{position:absolute;transform:translateX(-50%);line-height:1;cursor:pointer;
 transition-property:left,bottom,font-size,opacity;transition-duration:1.4s,1.4s,.6s,.6s;transition-timing-function:ease-in-out}
.actor .fl{display:inline-block;transition:transform .5s}
.actor.flip .fl{transform:scaleX(-1)}
.actor .an{display:inline-block;font-family:var(--emoji);transform-origin:50% 100%;
 filter:drop-shadow(0 .06em .05em rgba(0,0,0,.35))}
.actor::after{content:"";position:absolute;left:15%;right:15%;bottom:-.04em;height:.12em;border-radius:50%;
 background:rgba(0,0,0,.22);filter:blur(2px);z-index:-1}
.actor.noshadow::after,.actor.a-fly::after{display:none}
.a-bob .an{animation:bob 2.4s ease-in-out infinite}
.a-hop .an{animation:hop 1.6s ease-in-out infinite}
.a-walk .an{animation:walk .5s ease-in-out infinite}
.a-sway .an{animation:sway 3s ease-in-out infinite}
.a-fly .an{animation:fly 3s ease-in-out infinite}
.a-swim .an{animation:swim 2.6s ease-in-out infinite}
.a-shake .an{animation:shiver .35s linear infinite}
.a-stomp .an{animation:stomp .9s ease-in-out infinite}
.actor.poke .an{animation:poke .5s ease-out}
.actor.jump .an{animation:jump .6s ease-in-out}
.actor.glow .an{animation:glowpulse 1s ease-in-out infinite}
.actor.nope .an{animation:nope .4s linear}
.actor.hidden{opacity:0}
.item{position:absolute;transform:translate(-50%,0);font-family:var(--emoji);line-height:1;cursor:pointer;
 transition:left .7s ease-in,bottom .7s ease-in,transform .7s ease-in,opacity .7s;
 filter:drop-shadow(0 0 .18em rgba(255,240,150,.95))}
.item .in{display:inline-block;animation:glowbob 1.4s ease-in-out infinite}
.item.flutter .in{animation:flutter 4s ease-in-out infinite}
.item.got{transform:translate(-50%,0) scale(.3);opacity:0;pointer-events:none}
.count{position:absolute;font-family:'Fredoka',sans-serif;font-weight:700;color:#fff;pointer-events:none;
 text-shadow:0 3px 8px rgba(0,0,0,.6);font-size:6cqw;transform:translate(-50%,0);animation:rise 1.1s ease-out forwards}
.spark{position:absolute;pointer-events:none;font-family:var(--emoji);transform:translate(-50%,50%);animation:spark .9s ease-out forwards}
.pill{position:absolute;left:50%;top:3%;transform:translateX(-50%);z-index:7;pointer-events:none;max-width:92%;
 background:rgba(255,251,242,.94);color:#2D2410;border-radius:999px;padding:.55em 1.1em;text-align:center;
 font-family:'Fredoka',sans-serif;font-weight:600;font-size:max(14px,2.1cqw);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.pill small{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.78em;color:#6A5A3A}
.pill.done{background:var(--kelp);color:#063A22}
.pill.nudge{animation:nudge .5s}
.choice{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:1.4cqw 2cqw 2cqw;
 background:linear-gradient(180deg,rgba(6,18,12,0),rgba(6,18,12,.82) 22%);}
.choice .q{text-align:center;font-family:'Fredoka',sans-serif;font-weight:600;font-size:max(15px,2.3cqw);margin:1.6cqw 0 1.2cqw;
 text-shadow:0 2px 6px rgba(0,0,0,.6)}
.choice .q small{display:block;font-family:'Nunito',sans-serif;font-size:.75em;color:rgba(255,251,242,.8)}
.opts{display:flex;gap:1.4cqw;justify-content:center}
.opt{flex:1 1 0;max-width:30%;border:0;cursor:pointer;border-radius:18px;padding:1cqw .8cqw 1.1cqw;
 background:var(--bone);color:#2D2410;box-shadow:0 6px 0 #D7C6A2,0 10px 20px rgba(0,0,0,.3);transition:transform .15s}
.opt:active{transform:translateY(3px)}
.opt .e{font-family:var(--emoji);font-size:max(26px,4.6cqw);line-height:1.1;display:block}
.opt b{display:block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:max(13px,1.7cqw);line-height:1.2}
.opt span{display:block;font-size:max(11px,1.35cqw);color:#6A5A3A;font-weight:800;line-height:1.2}
.opt.wrong{background:#FFD9D2;animation:nope .4s;box-shadow:0 6px 0 #E6A89C}
.opt.right{background:var(--kelp);box-shadow:0 6px 0 #2E9C68}
.why{text-align:center;margin-top:1cqw;font-size:max(13px,1.6cqw);color:#FFE3A6;min-height:1.2em;font-weight:800}

.card{width:min(100%,calc((100dvh - 290px) * 16 / 9));min-width:min(100%,560px);display:flex;gap:10px;align-items:center;
 background:rgba(255,251,242,.95);color:#2D2410;border-radius:20px;padding:10px 12px;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.card .lines{flex:1;min-width:0}
.line{display:flex;gap:8px;align-items:flex-start;cursor:pointer;border-radius:10px;padding:3px 4px}
.line:hover{background:rgba(0,0,0,.05)}
.line .fg{font-family:var(--emoji);font-size:18px;line-height:1.35}
.line p{margin:0;font-size:clamp(15px,2vw,20px);line-height:1.4;font-weight:800}
.line.en p{font-weight:600;color:#5A4B30;font-size:clamp(14px,1.8vw,18px)}
.line.speaking{background:rgba(255,178,71,.25)}
.nav{display:flex;flex-direction:column;gap:6px}
.nb{width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;font-size:24px;display:grid;place-items:center;
 background:#EFE3C8;color:#2D2410}
.nb.go{background:var(--amber);box-shadow:0 0 0 0 rgba(255,178,71,.7);animation:ping 1.6s infinite}
.nb.locked{opacity:.45}
@media (max-aspect-ratio:1/1){.scene,.card{width:100%}#play.on{justify-content:center}}

/* ---------- ending ---------- */
.end{position:fixed;inset:0;z-index:200;display:none;place-items:center;background:rgba(3,14,8,.82);padding:18px;overflow-y:auto}
.end.on{display:grid}
.end .box{background:#FFFBF2;color:#2D2410;border-radius:28px;padding:22px;max-width:620px;width:100%;text-align:center;
 box-shadow:0 20px 50px rgba(0,0,0,.5);animation:popin .5s cubic-bezier(.2,1.6,.4,1)}
.end .big{font-family:var(--emoji);font-size:72px;line-height:1}
.end h2{font-family:'Fredoka',sans-serif;margin:6px 0 0;font-size:28px}
.end .stars{font-size:40px;letter-spacing:6px;margin:6px 0}
.end .stars i{font-style:normal;display:inline-block;animation:popin .5s both}
.end .stars i:nth-child(2){animation-delay:.25s}.end .stars i:nth-child(3){animation-delay:.5s}
.end .lesson{background:#FFF1D6;border-radius:16px;padding:12px 14px;margin:12px 0 8px;text-align:left}
.end .fact{background:#DDF6E9;border-radius:16px;padding:12px 14px;text-align:left}
.end .lesson b,.end .fact b{font-family:'Fredoka',sans-serif;display:block;margin-bottom:4px}
.end p{margin:3px 0;font-size:15.5px;line-height:1.45;font-weight:700}
.end p.en{font-weight:600;color:#5A4B30;font-size:14.5px}
.end .row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;border-radius:999px;padding:12px 20px;cursor:pointer;
 background:#EFE3C8;color:#2D2410;border:0}
.btn.go{background:var(--amber);color:#40230A}
.confetti{position:fixed;top:-20px;z-index:90;pointer-events:none;width:10px;height:14px;border-radius:2px;animation:fall 2.4s linear forwards}

/* ---------- svg scenery ---------- */
.drift{animation:drift 60s linear infinite}
.drift.slow{animation-duration:95s}
.tw{animation:twinkle 2.4s ease-in-out infinite}
.ff{animation:firefly 5s ease-in-out infinite}
.smoke{animation:smoke 5s ease-out infinite;transform-box:fill-box;transform-origin:center}
.wave{animation:wave 3s ease-in-out infinite}
.bub{animation:bubble 6s linear infinite;transform-box:fill-box}
@keyframes bubble{from{transform:translateY(0);opacity:.8}to{transform:translateY(-900px);opacity:0}}
.scene.under .actor::after{display:none}
.drop{position:absolute;top:-10%;width:2px;height:7%;background:linear-gradient(transparent,rgba(220,240,255,.85));animation:drop .8s linear infinite}
@keyframes drop{to{transform:translateY(1600%)}}
.item.planted{filter:none}.item.planted .in{animation:popin .5s}
.item.fled{opacity:0;pointer-events:none}
.swayp{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}

@keyframes bob{50%{transform:translateY(-6%)}}
@keyframes hop{0%,55%,100%{transform:translateY(0)}70%{transform:translateY(-22%)}85%{transform:translateY(0) scaleY(.92)}}
@keyframes walk{50%{transform:translateY(-8%) rotate(-3deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(8%,-14%)}50%{transform:translate(0,-4%)}75%{transform:translate(-8%,-14%)}}
@keyframes swim{50%{transform:translateY(8%) rotate(2deg)}}
@keyframes shiver{25%{transform:translateX(-3%)}75%{transform:translateX(3%)}}
@keyframes stomp{0%,100%{transform:translateY(0)}40%{transform:translateY(-6%) rotate(-2deg)}55%{transform:translateY(0) scaleY(.95)}}
@keyframes poke{30%{transform:scale(1.25,.8)}60%{transform:scale(.9,1.15) translateY(-12%)}}
@keyframes jump{50%{transform:translateY(-70%) rotate(-8deg)}}
@keyframes glowpulse{50%{filter:drop-shadow(0 0 .25em #FFE66B) drop-shadow(0 0 .12em #fff);transform:scale(1.08)}}
@keyframes nope{20%{transform:translateX(-8%)}40%{transform:translateX(8%)}60%{transform:translateX(-5%)}80%{transform:translateX(5%)}}
@keyframes glowbob{50%{transform:translateY(-12%) scale(1.08)}}

<script>
/* ============================================================
   common.js  —  shared by every game in the super app
   Names, settings, navigation, credits.
   ============================================================ */
(function (global) {

  var DEFAULTS = {
    child: "Baim",        // the learner
    dad: "Papi Rifky",
    mum: "Mommy Keke",
    sib: "Ade Yahya",
    dadShort: "Papi",
    mumShort: "Mommy",
    childShort: "Baim",
    sibShort: "Ade"
  };

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem("super.names") || "{}");
      var out = {};
      for (var k in DEFAULTS) out[k] = (raw[k] && String(raw[k]).trim()) || DEFAULTS[k];
      return out;
    } catch (e) { return Object.assign({}, DEFAULTS); }
  }
  function save(n) {
    try { localStorage.setItem("super.names", JSON.stringify(n)); } catch (e) {}
    N = load();
  }
  var N = load();

  /* Replace the built-in family names anywhere they appear in text or speech.
     Longest first so "Papi Rifky" wins over "Papi". */
  var MAP = [
    ["Papi Rifky", "dad"], ["Mommy Keke", "mum"], ["Ade Yahya", "sib"],
    ["Rifky", "dadShort"], ["Keke", "mumShort"], ["Yahya", "sibShort"],
    ["Mommy", "mumShort"], ["Papi", "dadShort"], ["Baim", "child"]
  ];
  function P(s) {
    if (s == null) return s;
    s = String(s);
    for (var i = 0; i < MAP.length; i++) {
      var from = MAP[i][0], to = N[MAP[i][1]];
      if (to && to !== from) s = s.split(from).join(to);
    }
    return s;
  }

  /* short forms derived from a full name: "Papi Rifky" -> "Papi" */
  function shorten(full, fallback) {
    if (!full) return fallback;
    var bits = String(full).trim().split(/\s+/);
    return bits[0] || fallback;
  }

  var GAMES = [

    { id: "siklus", file: "dongeng.html?set=siklus", icon: "\uD83C\uDF0D", en: "Nature Cycles", idn: "Siklus Alam",

  var CREDITS = "Created with love and care by Papi Rifky and Mommy Keke " +
                "for beloved Abang Baim and Ade Yahya.";

  var CURRICULUM = [
    ["Cambridge Pre A1 Starters / A1 Movers", "English vocabulary and listening papers"],
    ["Cambridge Primary English & Science", "progression of comprehension and enquiry"],
    ["NSW Early Stage 1 and Stage 1 (Australia)", "phonics, number sense, handwriting"],
    ["Kurikulum Merdeka PAUD & SD (Indonesia)", "calistung, IPAS, Profil Pelajar Pancasila"],
    ["Metode Suku Kata & SAS", "Indonesian syllable reading method"]
  ];

  /* a back button injected into any game page */
  function mountBack(title) {
    if (document.getElementById("superbar")) { if (title) document.title = P(title); return; }
    var a = document.createElement("a");
    a.href = "index.html";
    a.className = "super-back";
    a.setAttribute("aria-label", "Back to the menu");
    a.innerHTML = "\u2190";
    document.body.appendChild(a);
    var css = document.createElement("style");
    css.textContent =
      ".super-back{position:fixed;left:10px;bottom:10px;z-index:95;width:44px;height:44px;" +
      "border-radius:50%;display:grid;place-items:center;font-size:22px;text-decoration:none;" +
      "background:rgba(4,34,46,.72);color:#FFFBF2;border:1px solid rgba(247,233,204,.28);" +

    document.head.appendChild(css);
    if (title) document.title = P(title);
  }

  global.SUPER = {
    names: function () { return N; },
    defaults: DEFAULTS,
    save: save,
    reset: function () { try { localStorage.removeItem("super.names"); } catch (e) {} N = load(); },
    P: P,
    shorten: shorten,
    GAMES: GAMES,
    CREDITS: CREDITS,
    CURRICULUM: CURRICULUM,
    mountBack: mountBack
  };
})(window);

/* ============================================================
   PROGRESS: xp, grade bands, the zoo and the pets
   ============================================================ */
(function (global) {
  var S = global.SUPER;

  /* Thresholds assume roughly 40 answers a day. Early bands sit on level 1-2
     work (about 4 XP an answer), later bands on level 6+ work (about 18).
     Kindy A to Kindy B is around two weeks of real practice, not two days. */
  var GRADES = [

    { xp: 7000,   id: "prep",    label: "Preparatory",     note: "blending, first words, writing" },
    { xp: 15000,  id: "g1",      label: "Primary Grade 1", note: "reading sentences, adding and taking away" },
    { xp: 28000,  id: "g2",      label: "Primary Grade 2", note: "comprehension, groups of animals" },
    { xp: 46000,  id: "g3",      label: "Primary Grade 3", note: "reasoning, food webs, longer writing" },
    { xp: 70000,  id: "g4",      label: "Primary Grade 4", note: "science vocabulary, Latin names" },
    { xp: 100000, id: "g5",      label: "Primary Grade 5", note: "systems, ethics, history" },
    { xp: 140000, id: "g6",      label: "Primary Grade 6", note: "independent reading and writing" }
  ];

  /* 50 animals to collect. The cost rises steeply so the rare ones

  var ZOO = [
    ["ant","\uD83D\uDC1C","Ant","Semut",40],
    ["fish","\uD83D\uDC1F","Fish","Ikan",45],
    ["chicken","\uD83D\uDC13","Chicken","Ayam",55],
    ["duck","\uD83E\uDD86","Duck","Bebek",65],
    ["cat","\uD83D\uDC08","Cat","Kucing",75],
    ["dog","\uD83D\uDC15","Dog","Anjing",90],
    ["rabbit","\uD83D\uDC30","Rabbit","Kelinci",110],
    ["butterfly","\uD83E\uDD8B","Butterfly","Kupu-kupu",130],
    ["bee","\uD83D\uDC1D","Bee","Lebah",150],
    ["frog","\uD83D\uDC38","Frog","Katak",180],
    ["snail","\uD83D\uDC0C","Snail","Siput",210],
    ["cow","\uD83D\uDC04","Cow","Sapi",240],
    ["goat","\uD83D\uDC10","Goat","Kambing",290],
    ["horse","\uD83D\uDC0E","Horse","Kuda",340],
    ["sheep","\uD83D\uDC11","Sheep","Domba",400],
    ["bird","\uD83D\uDC26","Bird","Burung",470],
    ["owl","\uD83E\uDD89","Owl","Burung hantu",560],
    ["turtle","\uD83D\uDC22","Turtle","Penyu",650],
    ["crab","\uD83E\uDD80","Crab","Kepiting",770],
    ["shrimp","\uD83E\uDD90","Shrimp","Udang",910],
    ["squid","\uD83E\uDD91","Squid","Cumi",1050],
    ["octopus","\uD83D\uDC19","Octopus","Gurita",1250],
    ["snake","\uD83D\uDC0D","Snake","Ular",1500],
    ["lizard","\uD83E\uDD8E","Lizard","Kadal",1750],
    ["monkey","\uD83D\uDC12","Monkey","Monyet",2050],
    ["deer","\uD83E\uDD8C","Deer","Rusa",2450],
    ["fox","\uD83E\uDD8A","Fox","Rubah",2850],
    ["boar","\uD83D\uDC17","Wild boar","Babi hutan",3400],
    ["penguin","\uD83D\uDC27","Penguin","Penguin",4000],
    ["peacock","\uD83E\uDD9A","Peacock","Merak",4700],
    ["parrot","\uD83E\uDD9C","Parrot","Nuri",5550],
    ["eagle","\uD83E\uDD85","Eagle","Elang",6550],
    ["dolphin","\uD83D\uDC2C","Dolphin","Lumba-lumba",7700],
    ["shark","\uD83E\uDD88","Shark","Hiu",9100],
    ["whale","\uD83D\uDC0B","Whale","Paus",10500],
    ["crocodile","\uD83D\uDC0A","Crocodile","Buaya",12500],
    ["zebra","\uD83E\uDD93","Zebra","Zebra",15000],
    ["camel","\uD83D\uDC2A","Camel","Unta",17500],
    ["buffalo","\uD83D\uDC03","Buffalo","Kerbau",20500],
    ["hippo","\uD83E\uDD9B","Hippopotamus","Kuda nil",24500],
    ["rhino","\uD83E\uDD8F","Rhinoceros","Badak",28500],
    ["giraffe","\uD83E\uDD92","Giraffe","Jerapah",34000],
    ["elephant","\uD83D\uDC18","Elephant","Gajah",40000],
    ["gorilla","\uD83E\uDD8D","Gorilla","Gorila",47000],
    ["orangutan","\uD83E\uDDA7","Orangutan","Orangutan",55500],
    ["lion","\uD83E\uDD81","Lion","Singa",65500],
    ["tiger","\uD83D\uDC05","Tiger","Harimau",77000],
    ["panda","\uD83D\uDC3C","Giant panda","Panda",90500],
    ["kangaroo","\uD83E\uDD98","Kangaroo","Kanguru",107000],
    ["koala","\uD83D\uDC28","Koala","Koala",126000]
  ].map(function (r) { return { id: r[0], emo: r[1], en: r[2], idn: r[3], xp: r[4] }; });

  /* pets grow up as the xp goes in */
  var PETS = [
    { id: "cat", en: "Cat", idn: "Kucing", stages: [
      { emo: "\uD83D\uDC31", en: "Kitten", xp: 0 },
      { emo: "\uD83D\uDC08", en: "Young cat", xp: 450 },
      { emo: "\uD83D\uDC08\u200D\u2B1B", en: "Grown cat", xp: 1500 },
      { emo: "\uD83D\uDC06", en: "Big wild cat", xp: 3600 } ] },
    { id: "chick", en: "Chicken", idn: "Ayam", stages: [
      { emo: "\uD83E\uDD5A", en: "Egg", xp: 0 },
      { emo: "\uD83D\uDC23", en: "Hatching", xp: 270 },
      { emo: "\uD83D\uDC24", en: "Chick", xp: 780 },
      { emo: "\uD83D\uDC14", en: "Hen", xp: 1860 },
      { emo: "\uD83D\uDC13", en: "Rooster", xp: 4200 } ] },
    { id: "frog", en: "Frog", idn: "Katak", stages: [
      { emo: "\uD83E\uDEB1", en: "Eggs in the pond", xp: 0 },
      { emo: "\uD83D\uDC1B", en: "Tadpole", xp: 330 },

      { emo: "\uD83C\uDF31", en: "Sprout", xp: 240 },
      { emo: "\uD83E\uDEB4", en: "Young tree", xp: 900 },
      { emo: "\uD83C\uDF33", en: "Big tree", xp: 2340 },
      { emo: "\uD83C\uDF33\uD83C\uDF3A", en: "Tree full of life", xp: 4800 } ] }
  ];

  function pget() {
    try { return JSON.parse(localStorage.getItem("super.progress") || "{}"); }
    catch (e) { return {}; }
  }
  function pset(o) { try { localStorage.setItem("super.progress", JSON.stringify(o)); } catch (e) {} }

  function addXp(game, n) {
    var p = pget();
    p.xp = (p.xp || 0) + n;
    p.games = p.games || {};
    p.games[game] = (p.games[game] || 0) + n;
    p.answers = (p.answers || 0) + 1;
    var today = new Date().toISOString().slice(0, 10);
    p.days = p.days || {};
    p.days[today] = (p.days[today] || 0) + n;
    pset(p);
    return p.xp;
  }
  function gradeFor(xp) {
    var g = GRADES[0];
    for (var i = 0; i < GRADES.length; i++) if (xp >= GRADES[i].xp) g = GRADES[i];
    return g;
  }
  function nextGrade(xp) {
    for (var i = 0; i < GRADES.length; i++) if (xp < GRADES[i].xp) return GRADES[i];
    return null;
  }
  function unlockedZoo(xp) { return ZOO.filter(function (z) { return xp >= z.xp; }); }
  function petStage(pet, xp) {
    var s = pet.stages[0];
    for (var i = 0; i < pet.stages.length; i++) if (xp >= pet.stages[i].xp) s = pet.stages[i];
    return s;
  }
  function stats() {
    var p = pget(), xp = p.xp || 0;
    return { xp: xp, answers: p.answers || 0, games: p.games || {}, days: p.days || {},
             grade: gradeFor(xp), next: nextGrade(xp),
             zoo: unlockedZoo(xp).length, zooTotal: ZOO.length };
  }


  /* ============================================================
     SCORING
     Research note: streaks help young learners, but rewards that
     pay for volume alone push guessing. So points are paid for
     QUALITY: first time right is worth full marks, a second try
     less than half, and a third barely anything. The streak only
     counts clean first-time answers, so it cannot be farmed.
     ============================================================ */
  var FOOD_COST = 25;      /* one feed */
  var FOOD_VALUE = 25;     /* how much the pet grows per feed */

  function award(game, o) {
    o = o || {};
    var level = o.level || 1, wrongs = o.wrongs || 0;
    /* difficulty is weighted, not linear: level 1 is worth 3, level 8 is worth 22.
       Easy levels can no longer be farmed to climb the grades. */
    var base = Math.round(2 + Math.pow(level, 1.55));
    var quality = wrongs === 0 ? 1 : (wrongs === 1 ? 0.45 : 0.2);
    if (o.partial != null) quality *= Math.max(0.15, Math.min(1, o.partial));
    var p = pget();
    var streak = wrongs === 0 ? (p.streak || 0) + 1 : 0;
    var mult = 1 + Math.min(10, streak) * 0.06;          /* caps at 1.6x */
    var xp = Math.max(1, Math.round(base * quality * mult));
    p.streak = streak;
    p.best = Math.max(p.best || 0, streak);
    p.food = (p.food || 0) + Math.max(1, Math.round(xp / 3));
    p.xp = (p.xp || 0) + xp;
    p.games = p.games || {};
    p.games[game] = (p.games[game] || 0) + xp;
    p.answers = (p.answers || 0) + 1;
    if (wrongs === 0) p.clean = (p.clean || 0) + 1;
    var today = new Date().toISOString().slice(0, 10);
    p.days = p.days || {};
    p.days[today] = (p.days[today] || 0) + xp;
    pset(p);
    return { xp: xp, streak: streak, mult: mult, food: p.food, total: p.xp };
  }
  function food() { return pget().food || 0; }
  function streakNow() { return pget().streak || 0; }
  function petFed(id) { var p = pget(); return (p.fed || {})[id] || 0; }
  function feed(id) {
    var p = pget();
    if ((p.food || 0) < FOOD_COST) return null;
    p.food -= FOOD_COST;
    p.fed = p.fed || {};
    p.fed[id] = (p.fed[id] || 0) + FOOD_VALUE;
    pset(p);
    return { food: p.food, fed: p.fed[id] };
  }
  function stageOf(pet) {
    var f = petFed(pet.id), s = pet.stages[0];
    for (var i = 0; i < pet.stages.length; i++) if (f >= pet.stages[i].xp) s = pet.stages[i];
    return s;
  }

  /* ============================================================
     THE STRIP  —  a Touch Bar style row of live, contextual keys
     ============================================================ */
  function mountBar(actions) {
    if (document.getElementById("superbar")) return;
    var css = document.createElement("style");
    css.textContent =
     "#superbar{position:fixed;left:0;right:0;bottom:0;z-index:96;display:flex;align-items:center;gap:6px;" +

     "border-top:1px solid rgba(247,233,204,.18);backdrop-filter:blur(8px);overflow-x:auto;scrollbar-width:none}" +
     "#superbar::-webkit-scrollbar{display:none}" +
     "#superbar .k{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 13px;border-radius:12px;" +
     "background:rgba(247,233,204,.10);border:1px solid rgba(247,233,204,.18);color:#FFFBF2;cursor:pointer;" +
     "font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:14px;white-space:nowrap;transition:.15s}" +
     "#superbar .k:hover{background:rgba(247,233,204,.2)}#superbar .k:active{transform:scale(.95)}" +
     "#superbar .k.stat{cursor:default;background:rgba(6,20,28,.5)}" +
     "#superbar .k .em{font-size:17px}" +
     "#superbar .k.hot{background:linear-gradient(180deg,#FFB247,#E58A2C);color:#40230A;border-color:#FFB247}" +
     "#superbar .grow{flex:1 1 auto;min-width:4px}" +
     "#superbar .gain{position:fixed;pointer-events:none;font-family:Fredoka,sans-serif;font-weight:700;" +
     "font-size:18px;color:#5FE0A4;text-shadow:0 2px 8px rgba(0,0,0,.6)}" +
     "@keyframes floatup{to{transform:translateY(-46px);opacity:0}}" +
     "body{padding-bottom:56px}.super-back{bottom:60px!important}" +
     "@media (min-aspect-ratio:1/1){#superbar{padding:4px 8px}#superbar .k{height:36px;font-size:13px;padding:0 11px}" +
     "body{padding-bottom:48px}.super-back{bottom:52px!important}}";
    document.head.appendChild(css);
    var bar = document.createElement("div");
    bar.id = "superbar";
    document.body.appendChild(bar);
    barActions = actions || [];
    renderBar();
    return bar;
  }
  var barActions = [];
  function renderBar() {
    var bar = document.getElementById("superbar"); if (!bar) return;
    var st = stats(), fd = food(), sk = streakNow();
    var pet = PETS[0], stage = stageOf(pet);
    var html = "";
    barActions.forEach(function (a, i) {
      html += '<button class="k' + (a.hot ? " hot" : "") + '" data-i="' + i + '">' +
              '<span class="em">' + a.icon + '</span>' + (a.label ? "<span>" + a.label + "</span>" : "") + "</button>";
    });
    html += '<span class="grow"></span>';
    html += '<a class="k" href="index.html" title="Home"><span class="em">\uD83C\uDFE0</span></a>';
    html += '<button class="k" id="sbSet" title="Settings"><span class="em">\u2699\uFE0F</span></button>';
    html += '<div class="k stat" title="Streak of clean first-time answers"><span class="em">' +
            (sk >= 3 ? "\uD83D\uDD25" : "\u26A1") + '</span><span>' + sk + '</span></div>';
    html += '<div class="k stat" title="Total XP"><span class="em">\u2B50</span><span>' + st.xp + "</span></div>";
    html += '<a class="k" href="koleksi.html" title="Zoo, pets and progress"><span class="em">' +
            stage.emo + '</span><span>\uD83C\uDF3D ' + fd + "</span></a>";
    bar.innerHTML = html;
    var setBtn = bar.querySelector("#sbSet");

const $=id=>document.getElementById(id);
const NM=(window.SUPER&&SUPER.P)||(x=>x);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const S={lang:LS.get("dongeng.lang","both"),sound:true,story:null,at:0,act:null,wrongs:0,done:{}};
let AC=null,vEN=null,vID=null;
function pickVoices(){
  if(!("speechSynthesis" in window))return;
  const vs=speechSynthesis.getVoices()||[];
  vEN=vs.find(v=>/^en[-_]?(GB|US)/i.test(v.lang)&&/female|samantha|karen|google/i.test(v.name))
    ||vs.find(v=>/^en[-_]/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
  vID=vs.find(v=>/^id[-_]?/i.test(v.lang))||vs.find(v=>/indones/i.test(v.name))||null;
}
if("speechSynthesis" in window){pickVoices();speechSynthesis.addEventListener("voiceschanged",pickVoices);setTimeout(pickVoices,800)}
let sayToken=0;
function stopAudio(){sayToken++;try{speechSynthesis.cancel()}catch(e){}}
function speak1(text,lang,rate){
  text=NM(text);
  return new Promise(res=>{
    if(!S.sound||!("speechSynthesis" in window)||!text){res();return}
    if(lang==="id"&&!vID){res();return}
    try{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang==="id"?"id-ID":"en-GB";u.voice=lang==="id"?vID:vEN;
      u.rate=rate||(lang==="id"?.9:.85);u.pitch=1.08;
      let done=false;const fin=()=>{if(!done){done=true;res()}};
      u.onend=fin;u.onerror=fin;speechSynthesis.speak(u);
      setTimeout(fin,Math.max(2200,text.length*85));
    }catch(e){res()}
  });
}
/* pair = [indonesian, english]; speaks whichever the language mode asks for */
async function say(pairs,opts){
  opts=opts||{};
  if(!opts.keep)stopAudio();
  const tok=sayToken;
  for(const p of pairs){
    if(!p)continue;
    for(const l of (S.lang==="both"?["id","en"]:[S.lang])){
      if(tok!==sayToken)return;
      if(opts.mark)mark(l,p);
      await speak1(l==="id"?p[0]:p[1],l,opts.rate);
    }
  }
  if(tok===sayToken&&opts.mark)mark(null);
}
function tone(f,d,type,g){
  if(!S.sound)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),gn=AC.createGain();
    o.type=type||"sine";o.frequency.value=f;
    gn.gain.setValueAtTime(0,AC.currentTime);gn.gain.linearRampToValueAtTime(g||.16,AC.currentTime+.02);
    gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(gn).connect(AC.destination);o.start();o.stop(AC.currentTime+d);
  }catch(e){}
}
const sfxWin=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.3,"triangle",.16),i*110));
const sfxWrong=()=>{tone(200,.22,"sawtooth",.1);setTimeout(()=>tone(150,.26,"sawtooth",.08),110)};
const sfxPop=n=>{const f=440+(n||0)*70;tone(f,.14,"sine",.18);setTimeout(()=>tone(f*1.5,.14,"sine",.14),70)};
const sfxBoing=()=>{tone(300,.12,"triangle",.14);setTimeout(()=>tone(520,.16,"triangle",.12),80)};
const sfxBoom=()=>{tone(70,.5,"sawtooth",.2);setTimeout(()=>tone(55,.5,"sawtooth",.18),260)};
let unlocked=false;
function unlockAudio(){
  if(unlocked)return;unlocked=true;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}
  if("speechSynthesis" in window){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}pickVoices()}
}

/* ============================================================

const ACT={};           /* key -> {el, data} */
let front="bgA";
function setBg(type,time){
  const key=type+"|"+time,cur=$(front);
  if(cur.dataset.k===key)return;
  const other=$(front==="bgA"?"bgB":"bgA");
  other.innerHTML=bgSVG(type,time);other.dataset.k=key;
  other.style.opacity=1;cur.style.opacity=0;
  front=other.id;$("scene").insertBefore(other,cur);   /* new one behind, old fades out on top */
}
function actorHTML(a){return `<span class="fl"><span class="an" style="${a.rot?"transform:rotate("+a.rot+"deg)":""}">${a.e}</span></span>`}
function place(el,a){el.style.left=a.x+"%";el.style.bottom=a.y+"%";el.style.fontSize="calc("+a.s+"cqw)"}
function styleActor(el,a){
  el.className="actor"+(a.flip?" flip":"")+(a.anim?" a-"+a.anim:"")+(a.shadow===0?" noshadow":"")+(a.gray?" gray":"");
}
function setActors(list){
  const keep={};
  list.forEach(a=>{
    keep[a.k]=1;
    let o=ACT[a.k];
    if(!o){
      const el=document.createElement("div");
      el.dataset.k=a.k;el.innerHTML=actorHTML(a);styleActor(el,a);
      const st=a.from?{x:a.from[0],y:a.from[1],s:a.s}:a;
      el.style.transitionDuration="0s";place(el,st);
      if(!a.from)el.style.opacity=0;
      $("actors").appendChild(el);
      el.addEventListener("pointerdown",e=>{e.stopPropagation();tapActor(a.k)});
      o=ACT[a.k]={el,data:a};
      void el.offsetWidth;
      el.style.transitionDuration="";
      requestAnimationFrame(()=>{el.style.opacity=a.hide?0:1;place(el,a)});
    }else{
      if(o.data.e!==a.e||o.data.rot!==a.rot)o.el.innerHTML=actorHTML(a);
      o.data=a;styleActor(o.el,a);o.el.style.opacity=a.hide?0:1;place(o.el,a);
    }
    o.el.style.zIndex=a.z||Math.round(100-a.y);
  });
  Object.keys(ACT).forEach(k=>{if(!keep[k]){const el=ACT[k].el;el.style.opacity=0;delete ACT[k];setTimeout(()=>el.remove(),700)}});
}
function pos(k){const a=ACT[k]&&ACT[k].data;return a?{x:a.x,y:a.y,s:a.s}:{x:50,y:20,s:8}}
function moveActor(k,x,y,dur,cls){
  const o=ACT[k];if(!o)return;
  o.data=Object.assign({},o.data,{x,y});
  o.el.style.transitionDuration=dur?`${dur}s,${dur}s,.6s,.6s`:"";
  place(o.el,o.data);o.el.style.zIndex=Math.round(100-y)+50;
  if(cls){o.el.classList.remove(cls);void o.el.offsetWidth;o.el.classList.add(cls)}
}
function pulse(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),650)}
function nameOf(a){return a.n||NAMES[a.e]}
function tapActor(k){
  const o=ACT[k];if(!o)return;
  const act=S.act;
  if(act&&!act.done){
    if(act.type==="hop"&&act.stones.includes(k))return hopTap(k);
    if(act.type==="tapmany"&&(act.k===k||(act.also||[]).includes(k)))return manyTap();
  }
  pulse(o.el,"poke");sfxBoing();
  const nm=nameOf(o.data);if(nm)say([nm]);
}

/* ---------- effects ---------- */
function sparkle(x,y,n,e){
  for(let i=0;i<(n||6);i++){
    const d=document.createElement("div");d.className="spark";d.textContent=e||["✨","⭐","💫"][i%3];
    d.style.left=x+"%";d.style.bottom=y+"%";d.style.fontSize="3cqw";
    const ang=i/(n||6)*Math.PI*2;d.style.setProperty("--dx",Math.cos(ang)*60+"px");d.style.setProperty("--dy",-Math.sin(ang)*60+"px");
    $("fx").appendChild(d);setTimeout(()=>d.remove(),950);
  }
}
function countPop(x,y,txt){const d=document.createElement("div");d.className="count";d.textContent=txt;d.style.left=x+"%";d.style.bottom=y+"%";$("fx").appendChild(d);setTimeout(()=>d.remove(),1150)}
function hearts(k){const p=pos(k||"");for(let i=0;i<10;i++)setTimeout(()=>{const h=document.createElement("div");h.className="heart";
  h.textContent=["💖","💕","💗"][i%3];h.style.left=(40+Math.random()*25)+"%";h.style.bottom=(30+Math.random()*10)+"%";h.style.fontSize=(3+Math.random()*2)+"cqw";
  $("fx").appendChild(h);setTimeout(()=>h.remove(),2300)},i*180)}
function confetti(){const c=["#FFB247","#5FE0A4","#FF6B5B","#7FC8FF","#F7E9CC","#C79BFF"];
  for(let i=0;i<60;i++){const d=document.createElement("div");d.className="confetti";d.style.left=Math.random()*100+"vw";
   d.style.background=c[i%c.length];d.style.animationDelay=Math.random()*.6+"s";d.style.animationDuration=(1.8+Math.random()*1.4)+"s";
   document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}}
$("scene").addEventListener("pointerdown",e=>{
  if(e.target.closest(".choice,.item"))return;
  const r=$("scene").getBoundingClientRect();
  sparkle((e.clientX-r.left)/r.width*100,(r.bottom-e.clientY)/r.height*100,5);tone(900+Math.random()*400,.1,"sine",.08);
});

/* ============================================================
   STORY FLOW
   ============================================================ */
function scene(){return S.story.scenes[S.at]}
function renderLines(){
  const sc=scene();let h="";
  const row=(l,txt)=>`<div class="line ${l}" data-l="${l}"><span class="fg">${l==="id"?"🇮🇩":"🇬🇧"}</span><p>${NM(txt)}</p></div>`;
  if(S.lang!=="en")h+=row("id",sc.t[0]);
  if(S.lang!=="id")h+=row("en",sc.t[1]);
  $("lines").innerHTML=h;
  $("lines").querySelectorAll(".line").forEach(el=>el.onclick=()=>{
    const l=el.dataset.l;stopAudio();mark(l,sc.t);speak1(l==="id"?sc.t[0]:sc.t[1],l).then(()=>mark(null));
  });
}
function mark(l,p){$("lines").querySelectorAll(".line").forEach(el=>el.classList.toggle("speaking",el.dataset.l===l&&p===scene().t))}
function renderDots(){
  $("dots").innerHTML=S.story.scenes.map((_,i)=>`<i class="${i<S.at?"done":i===S.at?"now":""}"></i>`).join("");
}
function clearAct(){
  $("items").innerHTML="";
  const sc=$("scene");sc.querySelectorAll(".pill,.choice,.loopbox,.slider,.panel2").forEach(e=>e.remove());
  if(S.act){clearInterval(S.act.orbit);clearTimeout(S.act.sayT)}
  Object.values(ACT).forEach(o=>o.el.classList.remove("glow"));
}
function openStory(st){
  S.story=st;S.at=0;S.wrongs=0;S.done={};
  Object.keys(ACT).forEach(k=>{ACT[k].el.remove();delete ACT[k]});
  $("lib").classList.add("off");$("play").classList.add("on");$("toLib").hidden=false;
  document.title=st.title[0]+" · "+SETS[SET].name;
  showScene();
}
function showScene(){
  const sc=scene();
  clearAct();stopAudio();
  setBg(sc.bg,sc.time);
  setActors(sc.actors);
  renderLines();renderDots();
  $("prev").disabled=S.at===0;$("prev").style.visibility=S.at===0?"hidden":"visible";
  if(sc.fx==="shake"){setTimeout(()=>{pulse($("scene"),"shake");sfxBoom()},700)}
  if(sc.fx==="hearts")setTimeout(hearts,1200);
  if(sc.fx==="confetti")setTimeout(confetti,600);
  setEnv({sea:sc.sea||0,smog:sc.smog||0,heat:sc.heat||0,shade:sc.shade||0,meter:sc.meter||null});
  $("fx").querySelectorAll(".drop").forEach(e=>e.remove());
  if(sc.fx==="rain")for(let i=0;i<40;i++){const d=document.createElement("div");d.className="drop";d.style.left=(i*2.5+Math.random()*2)+"%";
    d.style.animationDelay=(-Math.random())+"s";d.style.animationDuration=(.6+Math.random()*.4)+"s";$("fx").appendChild(d)}
  $("scene").classList.toggle("under",sc.bg==="reef");
  S.act=sc.act?Object.assign({},sc.act,{done:!!S.done[S.at],i:0,wrongs:0}):null;
  updateNext();
  const token=++showToken;
  setTimeout(async()=>{
    if(token!==showToken)return;
    if(S.act&&!S.act.done)startAct();
    await say([sc.t],{mark:true});
    if(token!==showToken||!S.act||S.act.done)return;
    await say([S.act.p||S.act.q],{keep:true});
  },sc.actors.some(a=>a.from)?900:450);
}
let showToken=0;
function updateNext(){
  const locked=S.act&&!S.act.done;
  $("next").classList.toggle("locked",!!locked);$("next").classList.toggle("go",!locked);
  if(window.SUPER&&SUPER.bar&&SUPER.bar.set)SUPER.bar.set(barKeys(!locked));
}
function next(){
  if(S.act&&!S.act.done){const p=$("scene").querySelector(".pill");if(p)pulse(p,"nudge");
    const c=$("scene").querySelector(".choice");if(c)pulse(c,"nudge");
    say([S.act.p||S.act.q]);return}
  if(S.at<S.story.scenes.length-1){S.at++;showScene()}else finish();
}
function prev(){if(S.at>0){S.at--;showScene()}}
$("next").onclick=next;$("prev").onclick=prev;

/* ---------- activities ---------- */
function pill(p,extra){
  const d=document.createElement("div");d.className="pill";
  const main=S.lang==="en"?p[1]:p[0],sub=S.lang==="both"?p[1]:"";
  d.innerHTML=`👆 ${NM(main)}${extra||""}${sub?"<small>"+NM(sub)+"</small>":""}`;
  $("scene").appendChild(d);return d;
}
function startAct(){
  const a=S.act;
  if(a.type==="choice")return showChoice();
  a.pill=pill(a.p||a.q,a.type==="tap"?` <b class="cnt">0/${a.spots.length}</b>`:"");
  if(a.type==="loop")return startLoop();
  if(a.type==="slider")return startSlider();
  if(a.type==="match"){a.pill.remove();a.pill=null;return startMatch()}
  if(a.type==="sort"){a.pill.remove();a.pill=null;return startSort()}
  if(a.type==="tap"){
    a.spots.forEach((sp,i)=>{
      const it=document.createElement("div");it.className="item"+(a.flutter?" flutter":"");
      it.innerHTML=`<span class="in" style="animation-delay:${-i*.7}s">${Array.isArray(a.item)?a.item[i%a.item.length]:a.item}</span>`;
      it.style.left=sp[0]+"%";it.style.bottom=sp[1]+"%";it.style.fontSize=(a.size||4.5)+"cqw";it.style.zIndex=120;
      it.addEventListener("pointerdown",e=>{e.stopPropagation();itemTap(it,sp)});
      $("items").appendChild(it);
    });
  }
  if(a.type==="hop")glowNext();
  if(a.type==="tapmany"){a.i=0;ACT[a.k]&&ACT[a.k].el.classList.add("glow")}
}
function itemTap(it,sp){
  const a=S.act;if(!a||a.done||it.dataset.used)return;
  it.dataset.used=1;
  a.i++;sfxPop(a.i);countPop(sp[0],sp[1]+6,a.i);sparkle(sp[0],sp[1]+3,5);
  a.pill.querySelector(".cnt").textContent=a.i+"/"+a.spots.length;
  if(a.stay){                                   /* changes where it is: a seed sprouts, an egg hatches */
    it.querySelector(".in").textContent=a.stay;it.classList.add("planted");it.style.pointerEvents="none";
  }else if(a.away){                             /* runs off the side of the scene */
    it.style.transition="left 1s ease-in,opacity 1s";it.style.left=(sp[0]<50?-12:112)+"%";it.classList.add("fled");
  }else{                                        /* flies to an animal; a list of animals takes turns */
    const to=Array.isArray(a.to)?a.to[(a.i-1)%a.to.length]:a.to,t=pos(to);
    it.style.left=t.x+"%";it.style.bottom=(t.y+t.s*0.8)+"%";it.classList.add("got");
    setTimeout(()=>{
      const o=ACT[to];if(o){pulse(o.el,"poke");if(a.grow){o.data=Object.assign({},o.data,{s:o.data.s+a.grow});place(o.el,o.data)}}
    },650);
  }
  say([NUM[a.i-1]]);
  if(a.i>=a.spots.length)setTimeout(complete,900);
}
function glowNext(){const a=S.act;Object.values(ACT).forEach(o=>o.el.classList.remove("glow"));
  const k=a.stones[a.i];if(k&&ACT[k])ACT[k].el.classList.add("glow")}
function hopTap(k){
  const a=S.act;
  if(k!==a.stones[a.i]){a.wrongs++;sfxWrong();pulse(ACT[k].el,"nope");say([["Yang bersinar dulu, ya!","The shining one first!"]]);return}
  const p=pos(k);ACT[k].el.classList.remove("glow");
  moveActor(a.hopper,p.x,p.y+a.lift,.6,"jump");sfxPop(a.i);
  countPop(p.x,p.y+a.lift+10,a.i+1);say([NUM[a.i]]);
  a.i++;
  if(a.i>=a.stones.length){a.pill.classList.add("done");
    setTimeout(()=>{moveActor(a.hopper,a.end[0],a.end[1],.8,"jump");sparkle(a.end[0],a.end[1]+6,8)},750);
    setTimeout(complete,1600);}
  else glowNext();
}
function manyTap(){
  const a=S.act,o=ACT[a.k];a.i++;
  pulse(o.el,"nope");sfxPop(a.i);const p=pos(a.k);sparkle(p.x,p.y+p.s*.5,4);countPop(p.x,p.y+p.s+2,a.i);
  say([NUM[a.i-1]]);
  if(a.i>=a.n){
    o.el.classList.remove("glow");
    setTimeout(()=>{
      const nd=Object.assign({},o.data,a.end);o.data=nd;o.el.innerHTML=actorHTML(nd);styleActor(o.el,nd);place(o.el,nd);
      sparkle(p.x,p.y+4,12);sfxWin();
      (a.after||[]).forEach(m=>setTimeout(()=>{moveActor(m[0],m[1],m[2],1.2);const q=ACT[m[0]];if(q){q.data.anim=m[3];styleActor(q.el,q.data);if(m[4])patchActor(m[0],{e:m[4]})}},500));
      setTimeout(complete,1200);
    },300);
  }
}
function shuffle(x){for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function showChoice(){
  const a=S.act;
  const box=document.createElement("div");box.className="choice";
  const q=S.lang==="en"?a.q[1]:a.q[0];
  box.innerHTML=`<div class="q">❓ ${NM(q)}${S.lang==="both"?"<small>"+NM(a.q[1])+"</small>":""}</div><div class="opts"></div><div class="why"></div>`;
  $("scene").appendChild(box);
  a.order=shuffle(a.opts.slice());drawOpts();
}
function drawOpts(){
  const a=S.act,box=$("scene").querySelector(".choice .opts");if(!box)return;
  box.innerHTML="";
  a.order.forEach(op=>{
    const b=document.createElement("button");b.className="opt"+(op._bad?" wrong":"");
    const main=S.lang==="en"?op.t[1]:op.t[0];
    b.innerHTML=`<span class="e">${op.e}</span><b>${NM(main)}</b>${S.lang==="both"?"<span>"+NM(op.t[1])+"</span>":""}`;
    b.onclick=e=>{e.stopPropagation();pick(op,b)};
    box.appendChild(b);
  });
}
function pick(op,b){
  const a=S.act;if(a.done)return;
  if(op.ok){
    b.classList.add("right");sparkle(50,30,10);
    setTimeout(()=>{const c=$("scene").querySelector(".choice");if(c)c.remove()},900);
    complete();return;
  }
  a.wrongs++;op._bad=1;sfxWrong();
  const why=$("scene").querySelector(".choice .why");
  if(why)why.textContent=NM(S.lang==="en"?op.why[1]:op.why[0])+(S.lang==="both"?" · "+NM(op.why[1]):"");
  pulse(b,"wrong");
  say([op.why]);
  setTimeout(()=>{shuffle(a.order);drawOpts()},450);   /* reshuffle after every tap so position never helps */
}
function complete(){
  const a=S.act;if(!a||a.done)return;
  a.done=true;S.done[S.at]=1;S.wrongs+=a.wrongs;
  if(a.type==="match"||a.type==="sort")setTimeout(()=>{const p=$("scene").querySelector(".panel2");if(p)p.remove()},1400);
  if(a.pill){a.pill.classList.add("done");a.pill.innerHTML="✅ "+NM(S.lang==="en"?"Well done!":"Berhasil!")+(S.lang==="both"?"<small>Well done!</small>":"")}
  sfxWin();
  try{if(window.SUPER&&SUPER.score){const r=SUPER.score.award(SET,{level:S.story.level+1,wrongs:Math.min(2,a.wrongs)});
    if(SUPER.bar&&SUPER.bar.fly)SUPER.bar.fly(r.xp,r.streak)}}catch(e){}
  updateNext();
  say([PRAISE[Math.floor(Math.random()*PRAISE.length)]]);
}

/* ---------- environment overlays: rising sea, smog, heat, depth, a gauge ---------- */
function setEnv(o){
  if("sea" in o)$("sea").style.height=(o.sea||0)+"%";
  if("smog" in o)$("smog").style.opacity=o.smog||0;
  if("heat" in o)$("heat").style.opacity=o.heat||0;
  if("shade" in o)$("shade").style.opacity=o.shade||0;
  if("meter" in o){
    const m=o.meter,el=$("meter");
    if(!m){el.style.display="none";return}
    el.style.display="flex";
    if(m.e)el.querySelector("b").innerHTML=m.e;
    const v=Math.max(4,Math.min(100,m.v));
    const fill=el.querySelector("i");fill.style.height=v+"%";
    fill.style.background=v<40?"#5FE0A4":v<70?"#FFB247":"#FF6B5B";
  }
}
function patchActor(k,p){
  const o=ACT[k];if(!o)return;
  const nd=Object.assign({},o.data,p);
  if(nd.e!==o.data.e||nd.rot!==o.data.rot)o.el.innerHTML=actorHTML(nd);
  o.data=nd;styleActor(o.el,nd);place(o.el,nd);o.el.style.opacity=nd.hide?0:1;
}
const two=(p,sep)=>NM(S.lang==="en"?p[1]:p[0])+(S.lang==="both"?(sep||"<small>")+NM(p[1])+(sep?"":"</small>"):"");

/* ---------- LOOP: tap round a cycle diagram, a traveller follows the arrows ---------- */
function startLoop(){
  const a=S.act,N=a.nodes.length;
  const P=a.nodes.map((n,i)=>n.at||[50+36*Math.sin(2*Math.PI*i/N),46+28*Math.cos(2*Math.PI*i/N)]);
  const cx=P.reduce((s,p)=>s+p[0],0)/N,cy=P.reduce((s,p)=>s+p[1],0)/N;
  const box=document.createElement("div");box.className="loopbox";
  let paths="";
  for(let i=0;i<N;i++){
    const A=P[i],B=P[(i+1)%N],mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;
    const qx=mx+(mx-cx)*.35,qy=my+(my-cy)*.35;
    paths+=`<path d="M${A[0]} ${100-A[1]} Q${qx} ${100-qy} ${B[0]} ${100-B[1]}"/>`;
  }
  box.innerHTML=`<svg viewBox="0 0 100 100" preserveAspectRatio="none">${paths}</svg>`;
  a.btns=a.nodes.map((n,i)=>{
    const b=document.createElement("button");b.className="lnode";
    b.style.left=P[i][0]+"%";b.style.bottom=P[i][1]+"%";
    b.innerHTML=`<span class="e">${n.e}</span><b>${two(n.l)}</b>`;
    b.onpointerdown=e=>{e.stopPropagation();loopTap(i)};
    box.appendChild(b);return b;
  });
  const mv=document.createElement("div");mv.className="lmover";mv.innerHTML=a.mover||"⭐";
  mv.style.left=P[0][0]+"%";mv.style.bottom=P[0][1]+"%";box.appendChild(mv);
  a.P=P;a.mv=mv;a.i=1;a.btns[0].classList.add("lit");a.btns[1%N].classList.add("next");
  $("scene").appendChild(box);
}
function loopTap(j){
  const a=S.act,N=a.nodes.length;
  if(a.done){const n=a.nodes[j];say([n.l,n.t]);pulse(a.btns[j],"poke");return}
  if(j!==a.i%N){a.wrongs++;sfxWrong();pulse(a.btns[j],"nope");say([["Ikuti panahnya! Yang bersinar.","Follow the arrows! Tap the glowing one."]]);return}
  const n=a.nodes[j];
  a.btns[j].classList.remove("next");a.btns[j].classList.add("lit");
  a.mv.style.left=a.P[j][0]+"%";a.mv.style.bottom=a.P[j][1]+"%";
  sfxPop(a.i);sparkle(a.P[j][0],a.P[j][1],6);
  a.pill.innerHTML=`${n.e} ${two(n.t)}`;
  say([n.t]);
  a.i++;
  if(a.i>N){                                    /* back at the start: the cycle goes round for ever */
    let k=0;
    a.orbit=setInterval(()=>{k=(k+1)%N;a.mv.style.left=a.P[k][0]+"%";a.mv.style.bottom=a.P[k][1]+"%"},1300);
    setTimeout(()=>{a.pill.innerHTML="🔄 "+two(["Siklus ini berulang terus!","This cycle goes round and round for ever!"])},3500);
    setTimeout(complete,900);
  }else a.btns[a.i%N].classList.add("next");
}

/* ---------- SLIDER: drag to change the world and watch what happens ---------- */
function startSlider(){
  const a=S.act,n=a.states.length;
  const box=document.createElement("div");box.className="slider";
  box.innerHTML=`<div class="row"><span class="end">${a.ends[0]}</span><input type="range" min="0" max="${n-1}" step="1" value="${a.start||0}"><span class="end">${a.ends[1]}</span></div><div class="cap"></div>`;
  box.onpointerdown=e=>e.stopPropagation();
  $("scene").appendChild(box);
  const inp=box.querySelector("input");a.seen={};a.cur=-1;
  const go=(v,quiet)=>{
    if(v===a.cur)return;a.cur=v;
    const st=a.states[v];
    Object.entries(st.set||{}).forEach(([k,p])=>patchActor(k,p));
    setEnv(st);
    box.querySelector(".cap").innerHTML=st.t?two(st.t," · "):"";
    if(quiet)return;
    tone(330+v*90,.12,"sine",.12);a.seen[v]=1;
    clearTimeout(a.sayT);a.sayT=setTimeout(()=>say([st.t]),350);
    if(!a.done&&Object.keys(a.seen).length>=n)setTimeout(complete,1800);
  };
  inp.oninput=()=>go(+inp.value);
  go(a.start||0,true);a.seen[a.start||0]=1;
}

/* ---------- MATCH: pair things that belong together ---------- */
function panel(q){
  const box=document.createElement("div");box.className="panel2";
  box.innerHTML=`<div class="q">${q?"❓ "+two(q):""}</div><div class="body"></div><div class="why"></div>`;
  box.onpointerdown=e=>e.stopPropagation();
  $("scene").appendChild(box);return box;
}
function startMatch(){
  const a=S.act,box=panel(a.q),body=box.querySelector(".body");
  body.classList.add("cols");
  const L=document.createElement("div"),R=document.createElement("div");L.className=R.className="col";
  body.append(L,R);a.left=[];a.right=[];a.sel=null;a.got=0;
  const mk=(side,idx,it)=>{
    const b=document.createElement("button");b.className="mbtn";
    b.innerHTML=`<span class="e">${it.e}</span><b>${two(it.t)}</b>`;
    b.onclick=()=>matchTap(side,idx,b);return b;
  };
  a.pairs.forEach((p,i)=>{a.left.push(mk(0,i,p[0]));a.right.push(mk(1,i,p[1]))});
  shuffle(a.left.slice()).forEach(b=>L.appendChild(b));shuffle(a.right.slice()).forEach(b=>R.appendChild(b));
}
function matchTap(side,idx,b){
  const a=S.act;if(a.done||b.classList.contains("right"))return;
  const it=a.pairs[idx][side];say([it.t]);
  if(!a.sel||a.sel.side===side){
    if(a.sel)a.sel.b.classList.remove("sel");
    a.sel={side,idx,b};b.classList.add("sel");sfxBoing();return;
  }
  const s=a.sel;a.sel=null;s.b.classList.remove("sel");
  if(s.idx===idx){
    s.b.classList.add("right");b.classList.add("right");sfxPop(a.got);a.got++;
    const why=a.pairs[idx][2];const w=S.act&&$("scene").querySelector(".panel2 .why");
    if(w)w.innerHTML=why?two(why," · "):"";
    if(why)setTimeout(()=>say([why],{keep:true}),600);
    if(a.got>=a.pairs.length)setTimeout(complete,why?2500:700);
  }else{
    a.wrongs++;sfxWrong();pulse(s.b,"nope");pulse(b,"nope");
  }
}

/* ---------- SORT: put each thing in the right bin ---------- */
function startSort(){
  const a=S.act,box=panel(a.q),body=box.querySelector(".body");
  body.innerHTML=`<div class="card1"></div><div class="bins"></div>`;
  a.queue=shuffle(a.items.slice());a.k=0;
  a.binEls=a.bins.map((bn,i)=>{
    const b=document.createElement("button");b.className="bin";
    b.innerHTML=`<span class="e">${bn.e}</span><b>${two(bn.t)}</b><span class="got"></span>`;
    b.onclick=()=>sortTap(i,b);body.querySelector(".bins").appendChild(b);return b;
  });
  showSortItem();
}
function showSortItem(){
  const a=S.act,it=a.queue[a.k],c=$("scene").querySelector(".panel2 .card1");if(!c)return;
  c.innerHTML=`<span class="e">${it.e}</span><b>${two(it.t)}</b><small>${a.k+1}/${a.queue.length}</small>`;
  pulse(c,"popin");say([it.t],{keep:true});
}
function sortTap(i,b){
  const a=S.act;if(a.done||a.busy)return;
  const it=a.queue[a.k],w=$("scene").querySelector(".panel2 .why");
  if(it.b!==i){a.wrongs++;sfxWrong();pulse(b,"nope");if(w)w.innerHTML=it.why?two(it.why," · "):"";if(it.why)say([it.why]);return}
  a.busy=true;sfxPop(a.k);if(w)w.innerHTML="";
  b.querySelector(".got").innerHTML+=it.e;pulse(b,"poke");
  a.k++;
  setTimeout(()=>{a.busy=false;if(a.k>=a.queue.length)complete();else showSortItem()},650);
}

/* ---------- ending ---------- */
function finish(){
  const st=S.story,stars=S.wrongs===0?3:S.wrongs<=2?2:1;
  const best=LS.get("dongeng.stars",{});best[st.id]=Math.max(best[st.id]||0,stars);LS.set("dongeng.stars",best);
  const two=(p,cls)=>(S.lang!=="en"?`<p>🇮🇩 ${NM(p[0])}</p>`:"")+(S.lang!=="id"?`<p class="${S.lang==="both"?"en":""}">🇬🇧 ${NM(p[1])}</p>`:"");
  $("endBox").innerHTML=`<div class="big">${st.cover.join("")}</div>
   <h2>${S.lang==="en"?"The End!":"Tamat!"} ${S.lang==="both"?"· The End!":""}</h2>
   <div class="stars">${[0,1,2].map(i=>`<i>${i<stars?"⭐":"☆"}</i>`).join("")}</div>
   <div class="lesson"><b>${SETS[SET].lessonH}</b>${two(st.lesson)}</div>
   <div class="fact"><b>${SETS[SET].factH}</b>${two(st.fact)}</div>
   <div class="row"><button class="btn" id="again">🔁 Ulangi · Again</button><button class="btn go" id="more">📚 Pilih lagi · Pick another</button></div>`;
  $("end").classList.add("on");confetti();sfxWin();
  $("again").onclick=()=>{$("end").classList.remove("on");openStory(st)};
  $("more").onclick=()=>{$("end").classList.remove("on");toLibrary()};
  setTimeout(()=>say([st.lesson,st.fact]),900);
}

/* ---------- library ---------- */
function toLibrary(){
  stopAudio();showToken++;S.story=null;S.act=null;
  $("lib").classList.remove("off");$("play").classList.remove("on");$("toLib").hidden=true;$("dots").innerHTML="";
  drawShelf();updateNext();
}
function drawShelf(){
  const best=LS.get("dongeng.stars",{}),set=SETS[SET];
  document.title=set.name;$("brand").innerHTML=set.brand;$("libH").textContent=set.h1;$("libSub").textContent=set.sub;
  $("tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.s===SET));
  $("shelf").innerHTML="";
  set.list.forEach(st=>{
    const b=document.createElement("button");b.className="book";
    const n=best[st.id]||0;
    b.innerHTML=`<div class="art" style="background:linear-gradient(160deg,${st.tone[0]},${st.tone[1]})">${st.cover.map(e=>"<i>"+e+"</i>").join("")}</div>
     <div class="txt"><h3>${st.title[0]}</h3><div class="en">${st.title[1]}</div>
     <div class="meta"><span class="lvl">${st.scenes.length} halaman · pages · Level ${st.level}</span><span class="st">${n?"⭐".repeat(n)+"☆".repeat(3-n):"🆕"}</span></div></div>`;
    b.onclick=()=>{unlockAudio();openStory(st)};
    $("shelf").appendChild(b);
  });
}
$("toLib").onclick=toLibrary;
$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  SET=b.dataset.s;drawShelf();
  try{history.replaceState(null,"",location.pathname+(SET==="siklus"?"?set=siklus":""));
      localStorage.setItem("super.last",SET==="siklus"?"dongeng.html?set=siklus":"dongeng.html")}catch(e){}
});

/* ---------- toolbar ---------- */
function paintLang(){$("lang").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.l===S.lang))}
$("lang").querySelectorAll("button").forEach(b=>b.onclick=()=>{
  S.lang=b.dataset.l;LS.set("dongeng.lang",S.lang);paintLang();
  if(S.story){
    renderLines();
    const a=S.act;
    if(a&&!a.done){
      if(a.type==="choice"){const c=$("scene").querySelector(".choice");if(c)c.remove();showChoice()}
      else if(a.pill){const cnt=a.pill.querySelector(".cnt");const old=a.pill;a.pill=pill(a.p,cnt?` <b class="cnt">${cnt.textContent}</b>`:"");old.remove()}
    }
    say([scene().t],{mark:true});
  }
});
$("sound").onclick=()=>{S.sound=!S.sound;$("sound").textContent=S.sound?"🔊":"🔇";$("sound").setAttribute("aria-pressed",String(S.sound));if(!S.sound)stopAudio()};
function barKeys(open){
  if(!S.story)return[];
  return[{icon:"🔈",label:"Lagi · Again",fn:()=>say([scene().t],{mark:true})},
         {icon:"➡️",label:"Lanjut · Next",hot:!!open,fn:next}];
}
document.addEventListener("keydown",e=>{if(!S.story)return;if(e.key==="ArrowRight")next();if(e.key==="ArrowLeft")prev()});

if(window.SUPER&&SUPER.mountBack)SUPER.mountBack(SETS[SET].name);
if(window.SUPER&&SUPER.bar)SUPER.bar.mount([]);
paintLang();drawShelf();
</script>
</body>
</html>
